<!-- @dsCard group="Colors" viewport="700x190" name="Accent palette" subtitle="Eight accent families — base + light, used by Badge / Alert / charts" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style> body{margin:0;background:var(--bg-white-0);font-family:var(--font-sans);padding:24px} .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px} .chip{height:56px;border-radius:var(--r-10);border:1px solid rgba(0,0,0,.06);position:relative;overflow:hidden} .lt{position:absolute;left:0;right:0;bottom:0;height:18px} .n{margin-top:6px;font:500 11px/14px var(--font-sans);color:var(--text-sub-500);text-align:center;text-transform:capitalize} </style>
</head><body>
<div class="grid">
  <div><div class="chip" style="background:var(--orange-base)"><div class="lt" style="background:var(--orange-light)"></div></div><div class="n">orange</div></div>
  <div><div class="chip" style="background:var(--yellow-base)"><div class="lt" style="background:var(--yellow-light)"></div></div><div class="n">yellow</div></div>
  <div><div class="chip" style="background:var(--green-base)"><div class="lt" style="background:var(--green-light)"></div></div><div class="n">green</div></div>
  <div><div class="chip" style="background:var(--teal-base)"><div class="lt" style="background:var(--teal-light)"></div></div><div class="n">teal</div></div>
  <div><div class="chip" style="background:var(--blue-base)"><div class="lt" style="background:var(--blue-light)"></div></div><div class="n">blue</div></div>
  <div><div class="chip" style="background:var(--purple-base)"><div class="lt" style="background:var(--purple-light)"></div></div><div class="n">purple</div></div>
  <div><div class="chip" style="background:var(--pink-base)"><div class="lt" style="background:var(--pink-light)"></div></div><div class="n">pink</div></div>
  <div><div class="chip" style="background:var(--red-base)"><div class="lt" style="background:var(--red-light)"></div></div><div class="n">red</div></div>
</div>
</body></html>
