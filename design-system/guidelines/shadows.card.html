<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style> body{margin:0;background:var(--bg-weak-100);font-family:var(--font-sans);padding:32px 24px;display:flex;gap:24px;flex-wrap:wrap} .it{text-align:center} .b{width:88px;height:64px;background:var(--bg-white-0);border-radius:var(--r-12)} .n{margin-top:12px;font:500 12px/16px var(--font-sans);color:var(--text-sub-500)} </style>
</head><body>
<div class="it"><div class="b" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
<div class="it"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
<div class="it"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
<div class="it"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
<div class="it"><div class="b" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div></div>
<div class="it"><div class="b" style="box-shadow:var(--shadow-2xl)"></div><div class="n">2xl</div></div>
</body></html>
