<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Blue" subtitle="Brand primary ramp (also available as a purple theme via [data-mode=purple])" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style> body{margin:0;background:var(--bg-white-0);font-family:var(--font-sans);padding:24px} .row{display:flex;gap:12px} .sw{flex:1} .chip{height:72px;border-radius:var(--r-12);border:1px solid rgba(0,0,0,.06)} .n{margin-top:8px;font:500 12px/16px var(--font-sans);color:var(--text-main-900)} .v{font:400 11px/14px var(--font-sans);color:var(--text-soft-400)} </style>
</head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--primary-lighter)"></div><div class="n">lighter</div><div class="v">#EEF2FF</div></div>
  <div class="sw"><div class="chip" style="background:var(--primary-light)"></div><div class="n">light</div><div class="v">#C6D0FF</div></div>
  <div class="sw"><div class="chip" style="background:var(--primary-base)"></div><div class="n">base</div><div class="v">#4D42E9</div></div>
  <div class="sw"><div class="chip" style="background:var(--primary-dark)"></div><div class="n">dark</div><div class="v">#362DA6</div></div>
  <div class="sw"><div class="chip" style="background:var(--primary-darker)"></div><div class="n">darker</div><div class="v">#312D86</div></div>
</div>
</body></html>
