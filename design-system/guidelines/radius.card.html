<!-- @dsCard group="Spacing" viewport="700x160" name="Radius scale" subtitle="4 → 24px plus full — from Figma radius variables" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style> body{margin:0;background:var(--bg-white-0);font-family:var(--font-sans);padding:24px;display:flex;gap:16px;align-items:flex-end} .it{text-align:center} .b{width:64px;height:64px;background:var(--primary-lighter);border:1px solid var(--primary-light);border-bottom:none} .n{margin-top:8px;font:500 12px/16px var(--font-sans);color:var(--text-main-900)} .v{font:400 11px/14px var(--font-sans);color:var(--text-soft-400)} </style>
</head><body>
<div class="it"><div class="b" style="border-radius:var(--r-4) var(--r-4) 0 0"></div><div class="n">r-4</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-8) var(--r-8) 0 0"></div><div class="n">r-8</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-10) var(--r-10) 0 0"></div><div class="n">r-10</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-12) var(--r-12) 0 0"></div><div class="n">r-12</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-16) var(--r-16) 0 0"></div><div class="n">r-16</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-20) var(--r-20) 0 0"></div><div class="n">r-20</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-24) var(--r-24) 0 0"></div><div class="n">r-24</div></div>
<div class="it"><div class="b" style="border-radius:var(--r-full) var(--r-full) 0 0"></div><div class="n">r-full</div></div>
</body></html>
