<!-- @dsCard group="Colors" viewport="700x170" name="State colors" subtitle="Semantic state tokens — success, warning, error, info, feature, away, verified" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style> body{margin:0;background:var(--bg-white-0);font-family:var(--font-sans);padding:24px;display:flex;flex-wrap:wrap;gap:12px} .item{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--stroke-soft-200);border-radius:var(--r-10)} .dot{width:14px;height:14px;border-radius:50%} .n{font:500 13px/18px var(--font-sans);color:var(--text-main-900)} .t{font:400 11px/14px var(--font-sans);color:var(--text-soft-400)} </style>
</head><body>
<div class="item"><span class="dot" style="background:var(--state-success)"></span><span class="n">success</span></div>
<div class="item"><span class="dot" style="background:var(--state-warning)"></span><span class="n">warning</span></div>
<div class="item"><span class="dot" style="background:var(--state-error)"></span><span class="n">error</span></div>
<div class="item"><span class="dot" style="background:var(--state-information)"></span><span class="n">information</span></div>
<div class="item"><span class="dot" style="background:var(--state-feature)"></span><span class="n">feature</span></div>
<div class="item"><span class="dot" style="background:var(--state-away)"></span><span class="n">away</span></div>
<div class="item"><span class="dot" style="background:var(--state-verified)"></span><span class="n">verified</span></div>
<div class="item"><span class="dot" style="background:var(--state-neutral)"></span><span class="n">neutral</span></div>
</body></html>
