<!-- @dsCard group="Brand" viewport="700x220" name="Iconography — RemixIcon" subtitle="2500+ icons, line & fill weights. Set 20px at 14px text, 24px standalone." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<style>
  body{margin:0;background:var(--bg-white-0);font-family:var(--font-sans);padding:26px;color:var(--text-sub-500)}
  .lbl{font:500 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft-400);margin-bottom:12px}
  .grid{display:flex;gap:18px;flex-wrap:wrap;font-size:26px;color:var(--icon-strong-900)}
  .grid.soft{color:var(--icon-soft-400)}
  .pair{display:flex;gap:28px;align-items:flex-start;margin-top:20px}
</style>
</head><body>
  <div class="lbl">Line — default UI weight</div>
  <div class="grid">
    <i class="ri-heart-pulse-line"></i><i class="ri-stethoscope-line"></i><i class="ri-calendar-line"></i>
    <i class="ri-user-3-line"></i><i class="ri-capsule-line"></i><i class="ri-test-tube-line"></i>
    <i class="ri-hospital-line"></i><i class="ri-file-list-3-line"></i><i class="ri-chat-3-line"></i>
    <i class="ri-notification-3-line"></i><i class="ri-search-line"></i><i class="ri-settings-3-line"></i>
  </div>
  <div class="pair">
    <div>
      <div class="lbl">Fill — active / emphasis</div>
      <div class="grid"><i class="ri-heart-pulse-fill" style="color:var(--primary-base)"></i><i class="ri-calendar-check-fill" style="color:var(--green-base)"></i><i class="ri-error-warning-fill" style="color:var(--orange-base)"></i><i class="ri-verified-badge-fill" style="color:var(--teal-base)"></i></div>
    </div>
    <div>
      <div class="lbl">Muted</div>
      <div class="grid soft"><i class="ri-more-2-fill"></i><i class="ri-arrow-right-s-line"></i><i class="ri-information-line"></i><i class="ri-close-line"></i></div>
    </div>
  </div>
</body></html>
