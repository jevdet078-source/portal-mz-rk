<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Кабинет бизнеса → Мои процессы (список сквозных процессов).
  Источник: Figma e-Health (cMe8P7iJNaTBgG04okquEG):
    ЛС — 14202:259827 · МИ — 16638:219995
  Контент 1:1, заменена оболочка (шапка портала + BusinessNav).
  Геометрия: Section Header px32 py16, Button Group r8 (items px12 py8, иконка 20),
  Table Container r12 + shadow 0 4 12 .02, Header Cell py8 (№ 60 · услуга flex · прогресс 210 · дата 146),
  Row Cell py12, Progress Bar h6 r999 + подпись 12/16.
  Таб выбирается через #ls / #mi. Прогресс считается из состояния прототипа страницы процесса.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{
    --primary:#4D42E9;--primary-dark:#362DA6;--primary-lighter:#EEF2FF;
    --n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n400:#868C98;--n500:#525866;--n900:#0A0D14;
    --stroke:#E2E4E9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--n50);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="min-height:100vh;background:var(--n50);">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="app" org="ТОО «Астана Групп»" bin="БИН 180540024521" hint-size="100%,73px"></dc-import></div>

  <div style="display:flex;align-items:flex-start;">
    <div style="position:sticky;top:73px;height:calc(100vh - 73px);flex:0 0 auto;z-index:30;">
      <dc-import name="BusinessNav" style="height:100%;" active="processes" hint-size="272px,827px"></dc-import>
    </div>

    <main style="flex:1;min-width:0;padding:8px 0 64px;">
      <div style="display:flex;flex-direction:column;gap:28px;animation:mp-slidein .2s ease;">

        <div style="display:flex;flex-direction:column;gap:8px;">
          <!-- Section Header [1.0] -->
          <div style="padding:16px 32px;display:flex;flex-direction:column;gap:4px;">
            <div style="font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;color:var(--n900);">Мои процессы</div>
            <div style="font-size:14px;line-height:20px;letter-spacing:-.006em;color:var(--n500);">Отслеживайте ход всех ваших услуг — от подачи заявки до результата</div>
          </div>
          <!-- Button Group [1.0] -->
          <div style="padding-left:32px;">
            <div style="display:inline-flex;border:1px solid var(--primary);border-radius:8px;overflow:hidden;background:var(--n0);">
              <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
                <button onClick="{{ t.onClick }}" style="{{ t.style }}"><i class="{{ t.icon }}" style="font-size:20px;"></i>{{ t.label }}</button>
              </sc-for>
            </div>
          </div>
        </div>

        <!-- Table Container -->
        <div style="padding:0 32px;">
          <div style="background:var(--n0);border:1px solid var(--stroke);border-radius:12px;box-shadow:0 4px 12px rgba(10,13,20,.02);overflow:hidden;padding-bottom:8px;">
            <div style="display:flex;background:var(--n100);padding:6px 0;">
              <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4">
                <div style="{{ c.style }}">{{ c.label }}<i class="ri-arrow-up-down-line" style="font-size:16px;color:var(--n400);"></i></div>
              </sc-for>
            </div>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="1">
              <div style="display:flex;align-items:center;margin-top:4px;background:var(--n0);">
                <div style="width:60px;flex:0 0 auto;padding:12px 20px 12px 16px;font-size:14px;line-height:20px;color:var(--n500);">{{ r.n }}</div>
                <div style="flex:1;min-width:0;padding:12px 20px 12px 12px;">
                  <a href="{{ r.href }}" style="font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;color:var(--primary-dark);text-decoration:none;">{{ r.title }}</a>
                </div>
                <div style="width:210px;flex:0 0 auto;padding:12px;">
                  <div style="display:flex;align-items:center;gap:8px;width:172px;">
                    <div style="flex:1;height:6px;border-radius:999px;background:var(--n200);overflow:hidden;"><div style="{{ r.barStyle }}"></div></div>
                    <span style="font-size:12px;line-height:16px;color:var(--n500);">{{ r.progress }}</span>
                  </div>
                </div>
                <div style="width:146px;flex:0 0 auto;padding:12px 20px 12px 12px;font-size:14px;line-height:20px;color:var(--n500);">{{ r.date }}</div>
              </div>
            </sc-for>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab:'ls', phases:{ ls:'p1', mi:'p45' } };
  componentDidMount(){
    const read = () => {
      const tab = (location.hash || '').replace('#','') === 'mi' ? 'mi' : 'ls';
      const phases = { ls:'p1', mi:'p45' };
      try { ['ls','mi'].forEach(id => { const v = localStorage.getItem('mp-proc-' + id); if(v) phases[id] = v; }); } catch(e){}
      this.setState({ tab, phases });
    };
    read();
    this._onHash = read;
    window.addEventListener('hashchange', this._onHash);
  }
  componentWillUnmount(){ window.removeEventListener('hashchange', this._onHash); }
  renderVals(){
    const s = this.state;
    const tabs = [
      { id:'ls', label:'Лекарственные средства', icon:'ri-capsule-fill' },
      { id:'mi', label:'Медицинские изделия', icon:'ri-stethoscope-fill' },
    ].map((t, i) => {
      const on = s.tab === t.id;
      return { ...t, onClick: () => { location.hash = t.id; this.setState({ tab:t.id }); },
        style:`display:flex;align-items:center;gap:6px;padding:8px 12px;border:none;${i ? 'border-left:1px solid #E2E4E9;' : ''}font-family:inherit;font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;cursor:pointer;transition:.15s;${on ? 'background:#4D42E9;color:#fff;' : 'background:#fff;color:#4D42E9;'}` };
    });

    const cell = 'display:flex;align-items:center;gap:2px;padding:8px 12px;font-size:14px;line-height:20px;color:#525866;white-space:nowrap;';
    const cols = [
      { label:'№', style: cell + 'width:60px;flex:0 0 auto;padding-left:16px;' },
      { label:'Наименование услуги', style: cell + 'flex:1;min-width:0;' },
      { label:'Прогресс', style: cell + 'width:210px;flex:0 0 auto;' },
      { label:'Дата создания', style: cell + 'width:146px;flex:0 0 auto;' },
    ];

    // выполнено этапов по состоянию прототипа страницы процесса
    const done = { p1:0, p2:1, p3:2, p45:3 };
    const DB = {
      ls:{ total:5, title:'Экспертиза, регистрация, перерегистрация, внесение изменений в регистрационное досье лекарственного средства и регистрация цены, внесение изменения в цену производителя, а также формирования Казахстанского национального лекарственного формуляра' },
      mi:{ total:4, title:'Экспертиза, регистрация, перерегистрация, внесение изменений в регистрационное досье медицинского изделия и регистрация цены, внесение изменения в цену производителя' },
    };
    const d = DB[s.tab];
    const phase = s.phases[s.tab];
    const n = phase === 'done' ? d.total : Math.max(done[phase] || 0, 1);
    const rows = [{ n:1, title:d.title, href:'Процесс.dc.html#' + s.tab, date:'30.03.2026',
      progress:`${n}/${d.total}`, barStyle:`width:${Math.round(n / d.total * 100)}%;height:100%;border-radius:999px;background:#4D42E9;` }];

    return { tabs, cols, rows };
  }
}
</script>
</body>
</html>
