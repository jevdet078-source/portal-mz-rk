<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Меню АРМ экспертов услуги ЕД. Визуально — как меню кабинета бизнеса (BusinessNav): 272 / 80 px.

  Пропсы:
    arm       — nn | fk
    active    — nn: registry | notifications;  fk: active | done | approval | notifications
    collapsed — "1", чтобы стартовать свёрнутым (карточки)

  АРМ ННЦРЗ: «Прочие услуги» (реестр заявок ЕД, UC01.13.3.1) и «Уведомления» (UC01.13.3.2).
  АРМ ФК (UC01.13.4 §4): «Комиссии» → «Активные», «Завершены», у председательствующего ПФК / ЗПФК —
  ещё «Согласование»; «Уведомления». Счётчик у пункта — задачи текущего сотрудника / непрочитанные.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  .an-it{transition:background .15s,color .15s;}
  .an-it:hover{background:#F6F8FA !important;color:#0A0D14 !important;}
  .an-it[aria-current="page"]:hover{background:#EEF2FF !important;color:#4D42E9 !important;}
  .an-it:focus-visible,.an-t:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px #C6D0FF;}
</style>
</helmet>
<nav aria-label="{{ caption }}" style="{{ rootStyle }}">
  <div style="{{ topStyle }}">
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;min-width:0;font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:#868C98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ caption }}</div>
    </sc-if>
    <button class="an-t" onClick="{{ toggle }}" title="{{ toggleTitle }}" aria-label="{{ toggleTitle }}" style="width:36px;height:36px;border:none;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#525866;flex:0 0 auto;"><i class="ri-side-bar-line" style="font-size:20px;"></i></button>
  </div>
  <div style="{{ listStyle }}">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <sc-if value="{{ it.hasGroupLabel }}" hint-placeholder-val="{{ false }}">
        <div style="padding:12px 12px 6px;font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:#868C98;white-space:nowrap;">{{ it.group }}</div>
      </sc-if>
      <sc-if value="{{ it.hasGroupRule }}" hint-placeholder-val="{{ false }}">
        <div title="{{ it.group }}" style="width:24px;height:1px;background:#E2E4E9;margin:10px 0;"></div>
      </sc-if>
      <a class="an-it" href="{{ it.href }}" aria-current="{{ it.cur }}" title="{{ it.title }}" style="{{ it.style }}">
        <span style="position:relative;display:flex;flex:0 0 auto;">
          <i class="{{ it.icon }}" style="font-size:20px;"></i>
          <sc-if value="{{ it.showDot }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-2px;right:-3px;width:8px;height:8px;border-radius:50%;background:#4D42E9;border:2px solid #fff;"></span></sc-if>
        </span>
        <sc-if value="{{ it.showLabel }}" hint-placeholder-val="{{ true }}"><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ it.label }}</span></sc-if>
        <sc-if value="{{ it.showBadge }}" hint-placeholder-val="{{ false }}"><span style="{{ it.badgeStyle }}">{{ it.badge }}</span></sc-if>
      </a>
    </sc-for>
  </div>
  <div style="flex:1;"></div>
  <div style="{{ footStyle }}">
    <a class="an-it" href="Портал Минздрава - Главная.dc.html" onClick="{{ logout }}" title="Выйти" style="{{ logoutStyle }}">
      <i class="ri-logout-box-r-line" style="font-size:20px;flex:0 0 auto;"></i>
      <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span>Выйти</span></sc-if>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:272,&quot;height&quot;:827}}">
class Component extends DCLogic {
  state = { collapsed:null, v:0, hash:'' };
  componentDidMount(){
    this._re = () => this.setState({ v:this.state.v + 1 });
    ['mp-arm-ready','mp-arm-change','mp-ed-change'].forEach(n => window.addEventListener(n, this._re));
    this._hash = () => this.setState({ hash: location.hash });
    window.addEventListener('hashchange', this._hash);
    this._hash();
    this._t = setInterval(() => { if(!document.hidden) this._re(); }, 15000);
    this._t1 = setTimeout(this._re, 600); this._t2 = setTimeout(this._re, 2000);
  }
  componentWillUnmount(){
    ['mp-arm-ready','mp-arm-change','mp-ed-change'].forEach(n => window.removeEventListener(n, this._re));
    window.removeEventListener('hashchange', this._hash); clearInterval(this._t); clearTimeout(this._t1); clearTimeout(this._t2);
  }
  renderVals(){
    const s = this.state, p = this.props || {}, A = window.mpArm;
    const arm = p.arm === 'fk' ? 'fk' : 'nn';
    // на узком экране меню стартует свёрнутым, чтобы не съедать ширину рабочей области
    const narrow = typeof window !== 'undefined' && window.innerWidth < 1100;
    const collapsed = s.collapsed === null ? (p.collapsed === '1' || narrow) : s.collapsed;
    const expanded = !collapsed;
    const ready = !!(A && A.ready);
    const me = ready ? A.current(arm) : '';
    // активный пункт на странице реестра меняется по #hash без перезагрузки
    let active = p.active || (arm === 'fk' ? 'active' : 'registry');
    const h = (s.hash || '').replace('#', '');
    if(p.hashActive === '1' && h){ if(arm === 'nn' && (h === 'notifications' || h === 'registry')) active = h; if(arm === 'fk' && ['active','done','approval','notifications'].indexOf(h) !== -1) active = h; }
    const unread = ready ? A.unreadFor(me) : 0;
    let data;
    if(arm === 'nn'){
      const tasks = ready ? A.nnTasks(me).length : 0;
      data = [
        { id:'registry', label:'Прочие услуги', icon:'ri-apps-2-line', href:'АРМ ННЦРЗ.dc.html#registry', badge:tasks, badgeTitle:'Ваших задач: ' + tasks },
        { id:'notifications', label:'Уведомления', icon:'ri-notification-3-line', href:'АРМ ННЦРЗ.dc.html#notifications', badge:unread, badgeTitle:'Непрочитанных: ' + unread, accent:true },
      ];
    } else {
      const tasks = ready ? A.fkTasks(me) : [];
      const now = Date.now();
      const isChairSomewhere = ready && (A.roleKey(me) === 'fkchair' || A.roleKey(me) === 'fkdep') && A.fkList().some(c => c.chair === me);
      const actTasks = tasks.filter(c => A.FK_ACTIVE.indexOf(A.fkStatus(c, now)) !== -1).length;
      const apprTasks = tasks.filter(c => A.fkStatus(c, now) === 'approval').length;
      data = [
        { id:'active', label:'Активные', icon:'ri-team-line', href:'АРМ ФК.dc.html#active', badge:actTasks, badgeTitle:'Ваших задач: ' + actTasks, group:'Комиссии' },
        { id:'done', label:'Завершены', icon:'ri-checkbox-multiple-line', href:'АРМ ФК.dc.html#done', badge:0 },
      ];
      if(isChairSomewhere) data.push({ id:'approval', label:'Согласование', icon:'ri-quill-pen-line', href:'АРМ ФК.dc.html#approval', badge:apprTasks, badgeTitle:'На подпись: ' + apprTasks });
      data.push({ id:'notifications', label:'Уведомления', icon:'ri-notification-3-line', href:'АРМ ФК.dc.html#notifications', badge:unread, badgeTitle:'Непрочитанных: ' + unread, accent:true, group:'' });
    }
    const items = data.map(it => {
      const on = active === it.id;
      return { ...it, cur: on ? 'page' : 'false', title: it.badge ? it.label + ' · ' + it.badgeTitle : it.label,
        showLabel: expanded, showBadge: expanded && it.badge > 0, showDot: !expanded && it.badge > 0, badge: String(it.badge > 99 ? '99+' : it.badge),
        group: it.group || '', hasGroupLabel: expanded && !!it.group, hasGroupRule: !expanded && !!it.group,
        badgeStyle:`min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:12px;line-height:20px;font-weight:600;text-align:center;${it.accent ? 'background:#4D42E9;color:#fff;' : 'background:#C6D0FF;color:#312D86;'}`,
        style:`display:flex;align-items:center;gap:8px;border-radius:8px;text-decoration:none;font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;box-sizing:border-box;${expanded ? 'width:100%;height:40px;padding:8px 12px;' : 'width:36px;height:36px;padding:0;justify-content:center;'}${on ? 'background:#EEF2FF;color:#4D42E9;' : 'background:transparent;color:#525866;'}` };
    });
    return {
      expanded, items,
      caption: arm === 'fk' ? 'АРМ Формулярной комиссии' : 'АРМ ННЦРЗ',
      toggle: () => this.setState({ collapsed: !collapsed }),
      toggleTitle: expanded ? 'Свернуть меню' : 'Развернуть меню',
      logout: () => { try { localStorage.removeItem('mp-profile'); } catch(e){} },
      rootStyle:`width:${expanded ? 272 : 80}px;height:100%;min-height:100%;background:#fff;border-right:1px solid #E2E4E9;box-shadow:2px 4px 12px rgba(10,13,20,.02);display:flex;flex-direction:column;font-family:'Inter',sans-serif;transition:width .2s ease;box-sizing:border-box;overflow:hidden;`,
      topStyle: expanded ? 'display:flex;align-items:center;gap:8px;padding:16px 20px 0 32px;' : 'display:flex;justify-content:center;padding:16px 0 0;',
      listStyle:`display:flex;flex-direction:column;gap:4px;${expanded ? 'padding:12px 20px 16px;' : 'padding:12px 8px 16px;align-items:center;'}`,
      footStyle: expanded ? 'padding:16px 20px;border-top:1px solid #E2E4E9;' : 'padding:16px 8px;border-top:1px solid #E2E4E9;display:flex;justify-content:center;',
      logoutStyle:`display:flex;align-items:center;gap:8px;border-radius:8px;text-decoration:none;font-size:14px;line-height:20px;font-weight:500;color:#525866;box-sizing:border-box;${expanded ? 'height:40px;padding:8px 12px;' : 'width:36px;height:36px;justify-content:center;'}`,
    };
  }
}
</script>
</body>
</html>
