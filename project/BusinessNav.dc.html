<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Меню кабинета бизнеса («Единое окно» внутри портала).
  Источник: Figma e-Health (cMe8P7iJNaTBgG04okquEG), «Sidebar [Navigation] [1.0]»
  в кадрах 14202:259827 (развёрнуто, 272px) и 14202:257698 (свёрнуто, 80px).
  Логотип «Единое окно МЗ РК» из шапки сайдбара убран — бренд теперь в Header портала.

  Постановка «Обновление меню кабинета бизнеса и раздела „Мои заявки“» (29.10.2026), п. 1:
  Главная · Услуги · Мои заявки · Договоры · Платежи.
  Замечания аналитика 29–30.10.2026: перечень услуг в меню не выводим (длинные названия, прокрутка);
  «Услуги» — раскрывающийся раздел с двумя подразделами «Фармацевтика» и «Лицензирование и аккредитация».
  Подраздел открывает Услуги.dc.html?cat=<pharma|lic> — справа только услуги этого подраздела.
  На самой странице «Услуги» подразделы переключаются без перезагрузки: адрес меняется (pushState),
  странице уходит событие window 'mp-biz-svc-cat' (detail — pharma | lic).
  Раскрыт ли раздел — localStorage['mp-biz-nav-services']; на страницах услуг (каталог, паспорта, мастера)
  раскрыт всегда, подсвечен подраздел. В свёрнутом меню «Услуги» разворачивают его с открытым разделом.
  Экран уже 1200px: меню по умолчанию свёрнуто, развёрнутое ложится поверх страницы (фон затемняется).

  Пропсы:
    active    — home | services | requests | contracts | payments | users | orgs | calendar | notifications
                (старые значения: composite / other → services, processes → requests)
    collapsed — "1", чтобы стартовать свёрнутым (как на страницах мастеров и карточек)

  Роль в организации — localStorage['mp-biz-role'] = applicant | admin,
  смена рассылается событием window 'mp-biz-role-change' (переключатель в шапке).
  Администратор — надстройка над заявителем: к его разделам добавляется группа
  «Администрирование» (пользователи, организации, рабочий календарь). Заявитель этой группы не видит,
  а при прямом заходе на её страницу получает экран о недоступности раздела.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{--primary:#4D42E9;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;--primary-darker:#312D86;--n0:#fff;--n100:#F6F8FA;--n400:#868C98;--n500:#525866;--n900:#0A0D14;--stroke:#E2E4E9;}
  @keyframes bn-fade{from{opacity:0}to{opacity:1}}
  @keyframes bn-slide{from{transform:translateX(-12px);opacity:.6}to{transform:none;opacity:1}}
  .bn-list{scrollbar-width:thin;scrollbar-color:#E2E4E9 transparent;}
  .bn-it{display:flex;align-items:center;gap:8px;border:none;border-radius:8px;background:transparent;color:var(--n500);font-family:inherit;font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;text-decoration:none;text-align:left;cursor:pointer;box-sizing:border-box;transition:background .15s,color .15s;}
  .bn-it:hover{background:var(--n100);color:var(--n900);}
  .bn-it[data-on="true"],.bn-it[data-on="true"]:hover{background:var(--primary-lighter);color:var(--primary);}
  .bn-it:focus-visible,.bn-tg:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  /* родитель свёрнутого раздела, внутри которого открыта страница */
  .bn-it[data-in="true"],.bn-it[data-in="true"]:hover{color:var(--primary);}
  .bn-chev{font-size:18px;color:var(--n400);flex:0 0 auto;transition:transform .18s ease,color .15s;}
  .bn-it:hover .bn-chev{color:var(--n500);}
  .bn-it[aria-expanded="false"] .bn-chev{transform:rotate(-90deg);}
  .bn-subs{display:flex;flex-direction:column;gap:2px;}
  /* подраздел: текст — по линии подписи пунктов, длинное название переносится */
  .bn-sub{width:100%;min-height:36px;padding:8px 12px 8px 40px;white-space:normal;}
  .bn-tg{transition:background .15s,color .15s;}
  .bn-tg:hover{background:var(--n100);color:var(--n900);}
  @media (prefers-reduced-motion:reduce){ .bn-panel{animation:none !important;} }
</style>
</helmet>
<nav aria-label="Меню кабинета бизнеса" style="{{ rootStyle }}">
  <div class="bn-panel" style="{{ panelStyle }}">
    <div style="{{ topStyle }}">
      <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
        <div style="flex:1;min-width:0;font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ caption }}</div>
      </sc-if>
      <button class="bn-tg" type="button" onClick="{{ toggle }}" title="{{ toggleTitle }}" aria-label="{{ toggleTitle }}" aria-expanded="{{ expanded }}" style="width:36px;height:36px;border:none;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--n500);flex:0 0 auto;"><i class="ri-side-bar-line" style="font-size:20px;"></i></button>
    </div>

    <div class="bn-list" style="{{ listStyle }}">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
        <sc-if value="{{ it.hasGroupLabel }}" hint-placeholder-val="{{ false }}">
          <div style="padding:16px 12px 6px;font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ it.group }}</div>
        </sc-if>
        <sc-if value="{{ it.hasGroupRule }}" hint-placeholder-val="{{ false }}">
          <div title="{{ it.group }}" style="width:24px;height:1px;background:var(--stroke);margin:10px 0;"></div>
        </sc-if>
        <sc-if value="{{ it.isLink }}" hint-placeholder-val="{{ true }}">
          <a class="bn-it" href="{{ it.href }}" data-on="{{ it.on }}" aria-current="{{ it.cur }}" title="{{ it.railTitle }}" style="{{ it.style }}">
            <i class="{{ it.icon }}" style="font-size:20px;flex:0 0 auto;"></i>
            <sc-if value="{{ it.showLabel }}" hint-placeholder-val="{{ true }}"><span style="flex:1;min-width:0;white-space:nowrap;">{{ it.label }}</span></sc-if>
          </a>
        </sc-if>
        <!-- «Услуги» — раскрывающийся раздел с двумя подразделами -->
        <sc-if value="{{ it.isGroup }}" hint-placeholder-val="{{ false }}">
          <button class="bn-it" type="button" onClick="{{ it.onToggle }}" aria-expanded="{{ it.open }}" aria-controls="bn-subs" data-on="{{ it.on }}" data-in="{{ it.inside }}" title="{{ it.railTitle }}" style="{{ it.style }}">
            <i class="{{ it.icon }}" style="font-size:20px;flex:0 0 auto;"></i>
            <sc-if value="{{ it.showLabel }}" hint-placeholder-val="{{ true }}">
              <span style="flex:1;min-width:0;white-space:nowrap;">{{ it.label }}</span>
              <i class="ri-arrow-down-s-line bn-chev" aria-hidden="true"></i>
            </sc-if>
          </button>
          <sc-if value="{{ it.showSubs }}" hint-placeholder-val="{{ true }}">
            <div id="bn-subs" class="bn-subs" role="group" aria-label="{{ it.label }}">
              <sc-for list="{{ it.subs }}" as="sb" hint-placeholder-count="2">
                <a class="bn-it bn-sub" href="{{ sb.href }}" onClick="{{ sb.onClick }}" data-on="{{ sb.on }}" aria-current="{{ sb.cur }}">{{ sb.label }}</a>
              </sc-for>
            </div>
          </sc-if>
        </sc-if>
      </sc-for>
    </div>

    <div style="{{ footStyle }}">
      <a class="bn-it" href="Портал Минздрава - Главная.dc.html" onClick="{{ logout }}" title="{{ railTitleLogout }}" style="{{ l1Style }}">
        <i class="ri-logout-box-r-line" style="font-size:20px;flex:0 0 auto;"></i>
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span>Выйти</span></sc-if>
      </a>
    </div>
  </div>

  <!-- узкий экран: развёрнутое меню поверх страницы -->
  <sc-if value="{{ overlayOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ collapse }}" aria-hidden="true" style="position:fixed;left:0;right:0;bottom:0;top:73px;z-index:1;background:rgba(10,13,20,.16);animation:bn-fade .15s ease;"></div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:272,&quot;height&quot;:827}}">
const NARROW = 1200;
// Старые значения active со страниц мастеров, паспортов и прежних реестров
const ALIAS = { composite:'services', other:'services', processes:'requests' };
const narrowNow = () => { try { return window.innerWidth < NARROW; } catch(e){ return false; } };
const OPEN_KEY = 'mp-biz-nav-services';
const SVC_PAGE = 'Услуги.dc.html';
// подразделы «Услуг» — замечание аналитика 30.10.2026
const SUBS = [ { id:'pharma', label:'Фармацевтика' }, { id:'lic', label:'Лицензирование и аккредитация' } ];
const onSvcPage = () => { try { return decodeURIComponent(location.pathname).endsWith('/' + SVC_PAGE); } catch(e){ return false; } };
const urlCat = () => { try { return new URLSearchParams(location.search).get('cat') === 'lic' ? 'lic' : 'pharma'; } catch(e){ return 'pharma'; } };

class Component extends DCLogic {
  constructor(props){
    super(props);
    const p = props || {};
    let open = false;
    try { open = localStorage.getItem(OPEN_KEY) === '1'; } catch(e){}
    // на страницах услуг (каталог, паспорта, мастера) раздел раскрыт всегда
    if((ALIAS[p.active] || p.active) === 'services') open = true;
    // паспорта и мастера композитной услуги — это «Фармацевтика»
    this.state = { role:'applicant', collapsed:null, narrow: narrowNow(), open, cat: onSvcPage() ? urlCat() : 'pharma' };
  }
  setOpen(open){
    this.setState({ open });
    try { localStorage.setItem(OPEN_KEY, open ? '1' : '0'); } catch(e){}
  }
  // подраздел на самой странице «Услуги» — без перезагрузки: адрес меняется, странице уходит событие
  pickSub(e, id){
    if(!onSvcPage()) return;
    if(e && e.preventDefault) e.preventDefault();
    if(this.state.cat !== id){
      try { history.pushState(null, '', location.pathname + '?cat=' + id); } catch(err){}
      this.setState({ cat:id });
      window.dispatchEvent(new CustomEvent('mp-biz-svc-cat', { detail:id }));
    }
    if(this.state.narrow) this.setState({ collapsed:true });
  }

  componentDidMount(){
    try { const r = localStorage.getItem('mp-biz-role'); if(r) this.setState({ role:r }); } catch(e){}
    this._onRole = (e) => { if(e && e.detail) this.setState({ role:e.detail }); };
    window.addEventListener('mp-biz-role-change', this._onRole);
    this._onResize = () => { const n = narrowNow(); if(n !== this.state.narrow) this.setState({ narrow:n, collapsed:null }); };
    window.addEventListener('resize', this._onResize);
    this._onEsc = (e) => { if(e.key === 'Escape' && !e.defaultPrevented && !document.body.hasAttribute('data-mp-modal') && this.state.narrow && this.isExpanded()) this.setState({ collapsed:true }); };
    window.addEventListener('keydown', this._onEsc);
    // «Назад» / «Вперёд» браузера на странице «Услуги»
    this._onPop = () => { if(onSvcPage()) this.setState({ cat: urlCat() }); };
    window.addEventListener('popstate', this._onPop);
  }
  componentWillUnmount(){
    window.removeEventListener('mp-biz-role-change', this._onRole);
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('keydown', this._onEsc);
    window.removeEventListener('popstate', this._onPop);
  }
  isExpanded(){
    const s = this.state, p = this.props || {};
    // узкий экран — по умолчанию свёрнуто; иначе — как задала страница
    const def = s.narrow ? true : p.collapsed === '1';
    return !(s.collapsed === null ? def : s.collapsed);
  }

  renderVals(){
    const s = this.state, p = this.props || {};
    const expanded = this.isExpanded();
    const active = ALIAS[p.active] || p.active;
    const overlay = s.narrow && expanded;

    // Постановка 29.10.2026, п. 1 — порядок пунктов
    const applicant = [
      { id:'home', label:'Главная', icon:'ri-home-4-line', href:'Кабинет бизнеса.dc.html' },
      { id:'services', label:'Услуги', icon:'ri-apps-2-line', subs:SUBS },
      { id:'requests', label:'Мои заявки', icon:'ri-file-list-3-line', href:'Мои заявки.dc.html' },
      { id:'contracts', label:'Договоры', icon:'ri-file-text-line', href:'Договора.dc.html' },
      { id:'payments', label:'Платежи', icon:'ri-bank-card-line', href:'Платежи.dc.html' },
    ];
    // Роль администратора — надстройка, а не отдельный кабинет: тот же сотрудник ведёт
    // справочники организации и подаёт заявки. Поэтому разделы заявителя остаются на месте,
    // а «Администрирование» добавляется отдельной группой — и ни одна страница кабинета
    // не оказывается открытой при меню, в котором её нет.
    const admin = [
      { id:'users', label:'Пользователи', icon:'ri-user-settings-line', href:'Пользователи.dc.html', group:'Администрирование' },
      { id:'orgs', label:'Организации', icon:'ri-building-2-line', href:'Организации.dc.html' },
      { id:'calendar', label:'Рабочий календарь', icon:'ri-calendar-schedule-line', href:'Рабочий календарь.dc.html' },
    ];
    const l1Style = expanded ? 'width:100%;height:40px;padding:8px 12px;flex:0 0 auto;' : 'width:36px;height:36px;padding:0;justify-content:center;flex:0 0 auto;';
    const items = applicant.concat(s.role === 'admin' ? admin : []).map(it => {
      const on = active === it.id;
      const base = { ...it, cur: on ? 'page' : 'false',
        showLabel: expanded, group: it.group || '',
        hasGroupLabel: expanded && !!it.group, hasGroupRule: !expanded && !!it.group,
        railTitle: expanded ? '' : it.label, style: l1Style, isLink: !it.subs, isGroup: !!it.subs };
      if(!it.subs) return { ...base, on };
      // «Услуги»: в развёрнутом меню — раздел с подразделами (подсвечен подраздел, а не раздел),
      // в свёрнутом — иконка, которая разворачивает меню сразу с открытым разделом
      const open = expanded && s.open;
      return { ...base, open, on: !expanded && on, inside: expanded && on && !s.open, showSubs: open,
        onToggle: () => {
          if(!expanded){ this.setState({ collapsed:false }); if(!s.open) this.setOpen(true); return; }
          this.setOpen(!s.open);
        },
        subs: it.subs.map(sb => {
          const son = on && s.cat === sb.id;
          return { label:sb.label, href: SVC_PAGE + '?cat=' + sb.id, on: son, cur: son ? 'page' : 'false', onClick: (e) => this.pickSub(e, sb.id) };
        }) };
    });

    const W = expanded ? 272 : 80;
    const panel = `width:${W}px;height:100%;background:#fff;border-right:1px solid #E2E4E9;box-shadow:${overlay ? '8px 0 24px -8px rgba(10,13,20,.16)' : '2px 4px 12px rgba(10,13,20,.02)'};display:flex;flex-direction:column;font-family:'Inter',sans-serif;box-sizing:border-box;overflow:hidden;transition:width .2s ease;`;

    return {
      expanded, items, l1Style,
      caption: 'Кабинет бизнеса',
      railTitleLogout: expanded ? '' : 'Выйти',
      toggle: () => this.setState({ collapsed: expanded }),
      collapse: () => this.setState({ collapsed:true }),
      overlayOpen: overlay,
      toggleTitle: expanded ? 'Свернуть меню' : 'Развернуть меню',
      logout: () => { try { localStorage.removeItem('mp-profile'); localStorage.removeItem('mp-biz-role'); } catch(e){} },
      // на узком экране место в раскладке — всегда 80px, развёрнутая панель ложится поверх
      rootStyle: `position:relative;width:${s.narrow ? 80 : W}px;height:100%;min-height:100%;flex:0 0 auto;transition:width .2s ease;`,
      panelStyle: overlay ? panel + 'position:absolute;left:0;top:0;z-index:2;animation:bn-slide .18s ease;' : panel + 'position:relative;',
      topStyle: expanded ? 'display:flex;align-items:center;gap:8px;padding:16px 20px 0 32px;flex:0 0 auto;' : 'display:flex;justify-content:center;padding:16px 0 0;flex:0 0 auto;',
      listStyle: `flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;${expanded ? 'padding:12px 20px 16px;' : 'padding:12px 8px 16px;align-items:center;'}`,
      footStyle: expanded ? 'padding:16px 20px;border-top:1px solid #E2E4E9;flex:0 0 auto;' : 'padding:16px 8px;border-top:1px solid #E2E4E9;display:flex;justify-content:center;flex:0 0 auto;',
    };
  }
}
</script>
</body>
</html>
