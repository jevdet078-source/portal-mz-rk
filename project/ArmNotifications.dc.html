<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Раздел «Уведомления» АРМ экспертов (UC01.13.3.2 / UC01.14.3.2 — АРМ ННЦРЗ, UC01.13.4.4 / UC01.14.4.4 — АРМ ФК).
  Наименование услуги — по заявке: «Включение ЛС / МИ в перечень ЕД» или «… АЛО»; у ФК — по услуге комиссии.
  Пропс arm — nn | fk. Подключается в реестр АРМ по #notifications.

  По постановке (табл. 1): №, ID заявки (у ФК — № комиссии), наименование услуги, статус, дата действия,
  текст; непрочитанные — жирным; клик по уведомлению или ID — карточка и отметка «Прочитано»
  (дата прочтения хранится, пользователю не показывается); «Закрыть» — обратно в реестр (Alt 3).
  Получатель — текущий сотрудник, поэтому столбец «ФИО пользователя» вынесен в подзаголовок.
  Цвет события из табл. 2 (синий, зелёный, красный, жёлтый) — полоса слева у подложки текста.
  Дата — в формате портала «дд.мм.гггг, чч:мм» (в постановке «ГГ-ММ-ДД, HH-MM»).
  Текст уведомления — второй строкой записи на всю ширину таблицы, целиком (19.11.2026, по вопросу
  аналитика к «Центру уведомлений» бизнеса: тот же приём в обоих реестрах). Поиск — по тексту и номеру.
-->
<x-dc>
<helmet>
<style>
  /* запись: строка сведений + текст в подложке (полоса слева — цвет события, табл. 2); записи разделены линией и воздухом */
  .nt-row{padding:12px 0;border-top:1px solid #E2E4E9;transition:background .12s;cursor:pointer;}
  .nt-row:hover{background:#FBFCFD;}
  .nt-row:hover .nt-id{color:#4D42E9;text-decoration:underline;text-underline-offset:3px;}
  .nt-msg-t{max-width:1220px;}
  @media (min-width:1600px){ .nt-msg-t{text-wrap:balance;} }
  .nt-msg{margin:8px 20px 0 88px;padding:8px 14px 8px 12px;border-radius:10px;font-size:14px;line-height:20px;text-wrap:pretty;transition:background .15s;}
  .nt-row:focus-visible,.nt-b:focus-visible,.nt-pg:focus-visible,.nt-id:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #C6D0FF;}
  .nt-b{transition:background .15s,border-color .15s,color .15s;}
  .nt-b:hover{background:#FBFCFD;border-color:#CDD0D5;color:#0A0D14;}
  .nt-id{color:#362DA6;font-weight:500;text-decoration:none;border-radius:4px;}
  .nt-id:hover{color:#4D42E9;text-decoration:underline;text-underline-offset:3px;}
  .nt-pg{min-width:32px;height:32px;padding:0 8px;border:1px solid #E2E4E9;border-radius:8px;background:#fff;color:#525866;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .nt-pg:hover{background:#F6F8FA;color:#0A0D14;}
  .nt-pg:disabled{color:#CDD0D5;cursor:not-allowed;background:#fff;}
  .nt-pg[aria-current="page"]{background:#F6F8FA;color:#0A0D14;border-color:#CDD0D5;}
  .nt-q{width:320px;height:40px;border:1px solid #E2E4E9;border-radius:10px;padding:0 36px 0 40px;font-family:inherit;font-size:14px;line-height:20px;color:#0A0D14;background:#fff;box-shadow:0 1px 2px rgba(10,13,20,.03);outline:none;transition:border-color .15s,box-shadow .15s;}
  .nt-q::placeholder{color:#868C98;}
  .nt-q::-webkit-search-cancel-button{display:none;}
  .nt-q:hover{border-color:#CDD0D5;}
  .nt-q:focus{border-color:#4D42E9;box-shadow:0 0 0 2px #fff,0 0 0 4px #C6D0FF;}
  .nt-x{width:28px;height:28px;border:none;border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#868C98;}
  .nt-x:hover{color:#31353F;background:#F6F8FA;}
  .nt-x:focus-visible{outline:none;box-shadow:0 0 0 2px #C6D0FF;}
  @media (max-width:720px){ .nt-qw{flex:1 1 100%;min-width:0;} .nt-q{width:100%;} }
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:20px;font-family:'Inter',sans-serif;color:#0A0D14;">
  <div style="display:flex;align-items:flex-start;gap:12px;">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
      <h1 style="margin:0;font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;">Уведомления</h1>
      <div style="font-size:14px;line-height:20px;color:#525866;">{{ who }}</div>
    </div>
    <a class="nt-b" href="{{ closeHref }}" style="height:40px;padding:0 14px;border:1px solid #E2E4E9;border-radius:10px;background:#fff;color:#31353F;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-shadow:0 1px 2px rgba(10,13,20,.03);"><i class="ri-close-line" style="font-size:18px;"></i>Закрыть</a>
  </div>
  <!-- вкладки и поиск — над таблицей, чтобы шапка раздела не сжималась на ноутбуке -->
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:-4px;">
    <div role="tablist" aria-label="Фильтр уведомлений" style="display:flex;background:#F6F8FA;border:1px solid #E2E4E9;border-radius:10px;padding:3px;gap:2px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}<sc-if value="{{ t.hasN }}" hint-placeholder-val="{{ false }}"><span style="{{ t.nStyle }}">{{ t.n }}</span></sc-if></button>
      </sc-for>
    </div>
    <!-- поиск по тексту уведомления и номеру: найти старое уведомление -->
    <div class="nt-qw" role="search" style="position:relative;">
      <i class="ri-search-2-line" style="position:absolute;left:12px;top:10px;font-size:20px;color:#868C98;pointer-events:none;"></i>
      <input class="nt-q tnum" type="search" value="{{ q }}" onChange="{{ onQ }}" onKeyDown="{{ onQKey }}" placeholder="{{ qPh }}" aria-label="{{ qPh }}" autoComplete="off" spellCheck="false" enterKeyHint="search" />
      <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">
        <button type="button" class="nt-x" onClick="{{ clearQ }}" aria-label="Очистить поиск" title="Очистить" style="position:absolute;right:6px;top:6px;"><i class="ri-close-circle-fill" style="font-size:18px;"></i></button>
      </sc-if>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #E2E4E9;border-radius:12px;box-shadow:0 4px 12px rgba(10,13,20,.02);overflow:hidden;">
    <div style="overflow-x:auto;">
      <div role="table" aria-label="Уведомления" style="min-width:760px;">
        <div role="row" style="display:flex;background:#F6F8FA;">
          <sc-for list="{{ cols }}" as="c" hint-placeholder-count="5"><div role="columnheader" style="{{ c.style }}">{{ c.label }}</div></sc-for>
        </div>
        <!-- запись: сведения строкой по столбцам, под ней — текст уведомления целиком, на всю ширину -->
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div role="row" tabIndex="0" class="nt-row" onClick="{{ r.open }}" onKeyDown="{{ r.key }}" aria-label="{{ r.aria }}">
            <div style="display:flex;align-items:center;min-height:24px;">
              <div role="cell" style="width:88px;flex:0 0 auto;padding:0 12px 0 20px;display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#525866;" class="tnum"><span style="{{ r.dot }}"></span>{{ r.n }}</div>
              <div role="cell" style="width:128px;flex:0 0 auto;padding:0 12px;font-size:14px;line-height:20px;"><a class="nt-id tnum" href="{{ r.href }}" onClick="{{ r.openLink }}"><sc-for list="{{ r.refParts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></a></div>
              <div role="cell" style="flex:1;min-width:0;padding:0 12px;font-size:13px;line-height:20px;color:#525866;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="{{ r.svc }}">{{ r.svc }}</div>
              <div role="cell" style="width:312px;flex:0 0 auto;padding:0 12px;display:flex;align-items:center;"><span style="{{ r.badge.style }}"><span style="{{ r.badge.dot }}"></span>{{ r.badge.label }}</span></div>
              <div role="cell" style="width:160px;flex:0 0 auto;padding:0 20px 0 12px;font-size:13px;line-height:20px;color:#525866;white-space:nowrap;" class="tnum">{{ r.at }}</div>
            </div>
            <div role="cell" aria-label="Текст уведомления" class="nt-msg" style="{{ r.msgStyle }}"><div class="nt-msg-t"><sc-for list="{{ r.parts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></div></div>
          </div>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-top:1px solid #E2E4E9;">
            <div style="width:56px;height:56px;border-radius:50%;background:#F6F8FA;display:flex;align-items:center;justify-content:center;"><i class="ri-notification-off-line" style="font-size:24px;color:#868C98;"></i></div>
            <div style="font-size:15px;line-height:22px;font-weight:500;">{{ emptyTitle }}</div>
            <sc-if value="{{ notFound }}" hint-placeholder-val="{{ false }}">
              <button class="nt-b" onClick="{{ clearQ }}" style="margin-top:4px;height:36px;padding:0 14px;border:1px solid #E2E4E9;border-radius:10px;background:#fff;color:#31353F;font-family:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 1px 2px rgba(10,13,20,.03);"><i class="ri-close-line" style="font-size:18px;"></i>Сбросить поиск</button>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ hasPager }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid #E2E4E9;">
        <span style="font-size:13px;line-height:20px;color:#525866;" class="tnum">{{ range }}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="nt-pg" onClick="{{ prev }}" disabled="{{ noPrev }}" aria-label="Предыдущая страница"><i class="ri-arrow-left-s-line" style="font-size:18px;"></i></button>
          <sc-for list="{{ pages }}" as="p" hint-placeholder-count="3"><button class="nt-pg" onClick="{{ p.go }}" aria-current="{{ p.cur }}" aria-label="{{ p.aria }}">{{ p.n }}</button></sc-for>
          <button class="nt-pg" onClick="{{ next }}" disabled="{{ noNext }}" aria-label="Следующая страница"><i class="ri-arrow-right-s-line" style="font-size:18px;"></i></button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:600}}">
class Component extends DCLogic {
  state = { tab:'all', page:1, v:0, q:'' };
  componentDidMount(){
    this._re = () => this.setState({ v:this.state.v + 1 });
    ['mp-arm-ready','mp-arm-change'].forEach(n => window.addEventListener(n, this._re));
  }
  componentWillUnmount(){ ['mp-arm-ready','mp-arm-change'].forEach(n => window.removeEventListener(n, this._re)); }
  renderVals(){
    const s = this.state, A = window.mpArm, ED = window.mpEd;
    const arm = this.props.arm === 'fk' ? 'fk' : 'nn';
    const ready = !!(A && ED && A.ready);
    const me = ready ? A.current(arm) : '';
    const all = ready ? A.notifsFor(me) : [];
    const unread = all.filter(x => !x.read).length;
    // поиск: по тексту уведомления и номеру заявки / комиссии, без учёта регистра; найденное подсвечивается
    const q = (s.q || '').trim().toLowerCase();
    const inTab = s.tab === 'unread' ? all.filter(x => !x.read) : all;
    const list = q ? inTab.filter(x => String(x.text || '').toLowerCase().indexOf(q) !== -1 || String(x.label || '').toLowerCase().indexOf(q) !== -1) : inTab;
    const HL = 'background:#FBDFB1;border-radius:2px;box-shadow:0 0 0 1px #FBDFB1;';
    const parts = (str) => {
      str = String(str || '');
      if(!q) return [{ t:str, style:'' }];
      const low = str.toLowerCase(), out = [];
      let i = 0;
      for(;;){
        const j = low.indexOf(q, i);
        if(j === -1){ if(i < str.length) out.push({ t:str.slice(i), style:'' }); break; }
        if(j > i) out.push({ t:str.slice(i, j), style:'' });
        out.push({ t:str.slice(j, j + q.length), style:HL });
        i = j + q.length;
      }
      return out;
    };
    const clearQ = () => this.setState({ q:'', page:1 });
    const per = 10, pages = Math.max(1, Math.ceil(list.length / per)), page = Math.min(s.page, pages);
    const TONE = { blue:'#4D42E9', green:'#38C793', red:'#DF1C41', yellow:'#F17B2C' };
    const badge = (x) => {
      const tone = x.kind === 'fk' ? ({ 'Открытая':'teal', 'Голосование':'blue', 'Принятие решения':'orange', 'На согласовании':'purple', 'Состоялась':'green', 'Не состоялась':'gray' }[x.status] || 'gray') : ({ 'Решение принято':'green' }[x.status] || (A.NN_FILTER.indexOf(x.status) !== -1 ? A.nnTone({ nn:{ status:x.status } }) : 'gray'));
      return A.pill(x.status || '—', tone, { size:'sm' });
    };
    const rows = list.slice((page - 1) * per, page * per).map(x => {
      const href = x.kind === 'fk' ? 'Комиссия ФК.dc.html?id=' + encodeURIComponent(x.ref) + '&from=notifications' : 'Карточка заявки ННЦРЗ.dc.html?n=' + x.ref;
      const go = () => { A.readNotif(x.id); location.href = href; };
      const app = x.kind === 'fk' ? null : ED.get(x.ref);
      return { n:String(x.n), ref:x.label, href, svc: x.kind === 'fk' ? 'Формулярная комиссия · ' + A.fkSvc(A.fkGet(x.ref)).short : 'Включение ЛС / МИ в перечень ' + ED.svcOf(app).listShort,
        badge: badge(x), at: ED.fmtD(x.at) + ', ' + ED.fmtT(x.at), text:x.text, parts: parts(x.text), refParts: parts(x.label), aria:(x.read ? '' : 'Непрочитанное. ') + x.text,
        open: go, key: (e) => { if(e.key === 'Enter'){ e.preventDefault(); go(); } },
        openLink: (e) => { if(e){ e.preventDefault(); e.stopPropagation(); } go(); },
        dot:`width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:${x.read ? 'transparent' : '#4D42E9'};`,
        // подложка текста: непрочитанное — сиреневая, прочитанное — серая; полоса слева — цвет события (табл. 2); непрочитанное — жирным
        msgStyle:`background:${x.read ? '#FBFCFD' : '#EEF2FF'};box-shadow:inset 3px 0 0 ${TONE[x.tone] || '#4D42E9'}${x.read ? ',inset 0 0 0 1px #E2E4E9' : ''};font-weight:${x.read ? 400 : 600};color:${x.read ? '#31353F' : '#0A0D14'};` };
    });
    const hc = 'display:flex;align-items:center;padding:8px 12px;font-size:13px;line-height:20px;font-weight:500;color:#525866;white-space:nowrap;';
    const tabStyle = (on) => `height:32px;padding:0 10px 0 12px;border:none;border-radius:8px;font-family:inherit;font-size:13px;line-height:20px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s;${on ? 'background:#fff;color:#4D42E9;box-shadow:0 0 0 1px #E2E4E9,0 2px 4px rgba(10,13,20,.08);' : 'background:transparent;color:#525866;'}`;
    return {
      who: ready ? 'Получатель: ' + A.fullName(me) + ' · ' + A.roleLabel(me) : '',
      tabs: [ ['all', 'Все', all.length], ['unread', 'Непрочитанные', unread] ].map(([id, label, n]) => ({ label, on: s.tab === id, n:String(n), hasN: n > 0,
        nStyle:`min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:11px;line-height:18px;font-weight:600;text-align:center;${s.tab === id ? 'background:#4D42E9;color:#fff;' : 'background:#E2E4E9;color:#525866;'}`,
        pick: () => this.setState({ tab:id, page:1 }), style: tabStyle(s.tab === id) })),
      closeHref: arm === 'fk' ? 'АРМ ФК.dc.html#active' : 'АРМ ННЦРЗ.dc.html#registry',
      // текст уведомления — второй строкой записи на всю ширину (в узком столбце он резался на 4–5 строк)
      cols: [ ['№', 88, 20], ['ID заявки', 128], ['Наименование услуги', 0], ['Статус', 312], ['Дата действия', 160, 0, 20] ].map(([label, w, pl, pr]) => ({ label: arm === 'fk' && label === 'ID заявки' ? '№ комиссии' : label, style: hc + (w ? `width:${w}px;flex:0 0 auto;` : 'flex:1;min-width:0;') + (pl ? `padding-left:${pl}px;` : '') + (pr ? `padding-right:${pr}px;` : '') })),
      rows, empty: ready && rows.length === 0, notFound: ready && !!q && rows.length === 0,
      emptyTitle: q ? 'По запросу «' + s.q.trim() + '» уведомлений не найдено' : s.tab === 'unread' ? 'Все уведомления прочитаны' : 'Уведомлений пока нет',
      q: s.q, hasQ: !!s.q, clearQ,
      qPh: arm === 'fk' ? 'Поиск по тексту или № комиссии' : 'Поиск по тексту или ID заявки',
      onQ: (e) => this.setState({ q: e.target.value, page:1 }),
      onQKey: (e) => { if(e.key === 'Escape' && s.q){ e.preventDefault(); clearQ(); } },
      hasPager: list.length > per, range: ((page - 1) * per + 1) + '–' + Math.min(page * per, list.length) + ' из ' + list.length,
      pages: Array.from({ length:pages }, (_, i) => ({ n:String(i + 1), cur: i + 1 === page ? 'page' : 'false', aria:'Страница ' + (i + 1), go: () => this.setState({ page:i + 1 }) })),
      noPrev: page <= 1, noNext: page >= pages,
      prev: () => this.setState({ page:Math.max(1, page - 1) }), next: () => this.setState({ page:Math.min(pages, page + 1) }),
    };
  }
}
</script>
</body>
</html>
