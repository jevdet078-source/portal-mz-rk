<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Меню личного кабинета гражданина: карточка «кто вошёл» (фото, ФИО, ИИН) + разделы + «Выйти».
  Подключается в «Личный кабинет» и «Личная медицинская карта» в левой колонке:
    <aside class="cn-host"><dc-import name="CitizenNav" active="lmk" hint-size="300px,460px"></dc-import></aside>
  Обёртка cn-host — sticky на десктопе; на ≤1024px карточка сжимается в строку, разделы — горизонтальной лентой.

  Пропсы:
    active — overview | lmk | epz-view | epz-access | notif

  Разделы: Обзор, Личная медицинская карта, Электронный паспорт здоровья (ЭПЗ) — группа из двух
  подразделов («Просмотр ЭПЗ», «Управление доступами к ЭПЗ»), Уведомления.
  Группа раскрыта, когда открыт её подраздел; иначе раскрывается по клику (без перехода).
  На ≤1024px группа в ленте не нужна — подразделы идут отдельными пунктами.
  «Выйти» сбрасывает mp-profile и mp-iin.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{--primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;--n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n900:#0A0D14;--green:#38C793;--green-l:#EFFAF6;--green-d:#176448;--red:#DF1C41;--stroke:#E2E4E9;}
  .cn{display:flex;flex-direction:column;gap:16px;font-family:'Inter',sans-serif;color:var(--n900);}
  .cn-card{background:var(--n0);border:1px solid var(--stroke);border-radius:20px;padding:24px;text-align:center;box-shadow:0 1px 2px rgba(10,13,20,.03);}
  .cn-ava{width:96px;height:96px;border-radius:50%;overflow:hidden;margin:0 auto 14px;border:3px solid var(--primary-lighter);background:var(--n100);flex:0 0 auto;}
  .cn-name{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em;}
  .cn-iin{font-size:13px;line-height:18px;color:var(--n400);margin-top:2px;font-variant-numeric:tabular-nums;}
  .cn-who{min-width:0;}
  .cn-nav{position:relative;background:var(--n0);border:1px solid var(--stroke);border-radius:20px;padding:8px;box-shadow:0 1px 2px rgba(10,13,20,.03);display:flex;flex-direction:column;gap:2px;}
  .cn-it{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;font-size:14px;line-height:20px;font-weight:500;color:var(--n600);text-decoration:none;transition:background .12s,color .12s;box-sizing:border-box;}
  .cn-it:hover{background:var(--n100);}
  .cn-it.on,.cn-it.on:hover{background:var(--primary);color:#fff;font-weight:600;}
  .cn-lbl{flex:1;min-width:0;text-align:left;white-space:nowrap;}
  .cn-grp{border:none;background:none;font-family:inherit;cursor:pointer;}
  .cn-grp .cn-lbl{white-space:normal;}
  .cn-grp.in{color:var(--primary);font-weight:600;}
  .cn-grp.in:hover{background:var(--primary-lighter);}
  .cn-chev{font-size:18px;flex:0 0 auto;color:var(--n400);transition:transform .18s ease;}
  .cn-grp.in .cn-chev{color:var(--primary);}
  .cn-grp[aria-expanded="true"] .cn-chev{transform:rotate(180deg);}
  .cn-sub{display:flex;flex-direction:column;gap:2px;margin:0 0 2px 24px;padding-left:12px;border-left:1px solid var(--stroke);}
  .cn-sub .cn-it{padding:10px 12px;}
  .cn-sub .cn-lbl{white-space:normal;}
  .cn-flat{display:none;}
  .cn-badge{font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;}
  .cn-it.on .cn-badge{background:rgba(255,255,255,.25);}
  .cn-out{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:1px solid var(--stroke);border-radius:12px;background:var(--n0);color:var(--n500);font-size:14px;font-weight:500;text-decoration:none;transition:background .12s,border-color .12s;}
  .cn-out:hover{background:var(--n100);border-color:var(--n300);}
  .cn-it:focus-visible,.cn-out:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}

  /* ≤1024px: колонка страницы складывается — карточка в строку, разделы лентой */
  @media (max-width:1024px){
    .cn{gap:12px;}
    .cn-card{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;border-radius:16px;}
    .cn-ava{width:48px;height:48px;margin:0;border-width:2px;}
    .cn-name{font-size:16px;line-height:22px;}
    .cn-nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;border-radius:14px;padding:6px;}
    .cn-nav::-webkit-scrollbar{display:none;}
    .cn-it{width:auto;flex:0 0 auto;padding:9px 12px;gap:8px;font-size:13.5px;}
    .cn-it i{font-size:18px !important;}
    .cn-out{display:none;}
    .cn-grp,.cn-sub{display:none !important;}
    .cn-flat{display:flex;}
  }
</style>
</helmet>
<div class="cn">
  <div class="cn-card">
    <div class="cn-ava">
      <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="lk-avatar" shape="circle" placeholder="Фото" hint-size="96px,96px"></x-import>
    </div>
    <div class="cn-who">
      <div class="cn-name">Аружан Сейтжанова</div>
      <div class="cn-iin">ИИН 020116501540</div>
    </div>
  </div>
  <nav ref="{{ navRef }}" class="cn-nav" aria-label="Разделы личного кабинета">
    <sc-for list="{{ items }}" as="n" hint-placeholder-count="3">
      <sc-if value="{{ n.isLink }}" hint-placeholder-val="{{ true }}">
        <a href="{{ n.href }}" class="{{ n.cls }}" aria-current="{{ n.current }}">
          <i class="{{ n.icon }}" style="font-size:20px;flex:0 0 auto;"></i><span class="cn-lbl">{{ n.label }}</span>
          <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="cn-badge" aria-label="{{ n.badgeLabel }}">{{ n.badge }}</span></sc-if>
        </a>
      </sc-if>
      <sc-if value="{{ n.isGroup }}" hint-placeholder-val="{{ false }}">
        <button type="button" class="{{ n.cls }}" aria-expanded="{{ n.expanded }}" aria-controls="cn-sub-epz" onClick="{{ n.onToggle }}">
          <i class="{{ n.icon }}" style="font-size:20px;flex:0 0 auto;"></i><span class="cn-lbl">{{ n.label }}</span><i class="ri-arrow-down-s-line cn-chev" aria-hidden="true"></i>
        </button>
        <sc-if value="{{ n.expanded }}" hint-placeholder-val="{{ false }}">
          <div class="cn-sub" id="cn-sub-epz">
            <sc-for list="{{ n.children }}" as="c" hint-placeholder-count="2">
              <a href="{{ c.href }}" class="{{ c.cls }}" aria-current="{{ c.current }}"><span class="cn-lbl">{{ c.label }}</span></a>
            </sc-for>
          </div>
        </sc-if>
        <sc-for list="{{ n.children }}" as="c" hint-placeholder-count="2">
          <a href="{{ c.href }}" class="{{ c.flatCls }}" aria-current="{{ c.current }}"><i class="{{ c.icon }}" style="font-size:20px;flex:0 0 auto;"></i><span class="cn-lbl">{{ c.label }}</span></a>
        </sc-for>
      </sc-if>
    </sc-for>
  </nav>
  <a href="Портал Минздрава - Главная.dc.html" onClick="{{ onLogout }}" class="cn-out"><i class="ri-logout-box-r-line" style="font-size:18px;"></i>Выйти</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:460},&quot;active&quot;:&quot;overview&quot;}">
const LK = 'Личный кабинет.dc.html';
// Иконки — только контурные (-line): заливные на индиго-фоне активного пункта читаются как сплошной белый блок
const CN_ITEMS = [
  { id:'overview', label:'Обзор', icon:'ri-dashboard-line', href:LK + '#overview' },
  { id:'lmk', label:'Личная медицинская карта', icon:'ri-booklet-line', href:'Личная медицинская карта.dc.html' },
  { id:'epz', label:'Электронный паспорт здоровья (ЭПЗ)', icon:'ri-heart-pulse-line', children:[
    { id:'epz-view', label:'Просмотр ЭПЗ', icon:'ri-file-list-3-line', href:'Просмотр ЭПЗ.dc.html' },
    { id:'epz-access', label:'Управление доступами к ЭПЗ', icon:'ri-shield-user-line', href:'Управление доступами к ЭПЗ.dc.html' },
  ] },
  { id:'notif', label:'Уведомления', icon:'ri-notification-3-line', href:LK + '#notif', badge:'3', badgeLabel:'3 непрочитанных' },
];

class Component extends DCLogic {
  navRef = React.createRef();
  state = { open:null };
  componentDidMount(){ this.reveal(); }
  componentDidUpdate(prev){ if(!prev || prev.active !== (this.props || {}).active) this.reveal(); }
  // ≤1024px разделы — горизонтальная лента: активный пункт прокручиваем в видимую область
  reveal(){
    setTimeout(() => {
      const nav = this.navRef.current;
      if(!nav || nav.scrollWidth <= nav.clientWidth) return;
      const on = [...nav.querySelectorAll('.cn-it.on')].find(x => x.offsetWidth);
      if(on) nav.scrollLeft = Math.max(0, on.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2);
    }, 0);
  }
  renderVals(){
    const p = this.props || {};
    const active = p.active || 'overview';
    const items = CN_ITEMS.map(n => {
      if(n.children){
        const inside = n.children.some(c => c.id === active);
        const expanded = this.state.open == null ? inside : this.state.open;
        return { ...n, isGroup:true, isLink:false, expanded,
          cls: 'cn-it cn-grp' + (inside ? ' in' : ''),
          onToggle: () => this.setState({ open:!expanded }),
          children: n.children.map(c => { const on = c.id === active; return { ...c,
            cls: on ? 'cn-it on' : 'cn-it', flatCls: 'cn-it cn-flat' + (on ? ' on' : ''),
            current: on ? 'page' : undefined }; }),
        };
      }
      const on = n.id === active;
      return { ...n, isLink:true, isGroup:false,
        cls: on ? 'cn-it on' : 'cn-it',
        current: on ? 'page' : undefined,
        hasBadge: !!n.badge, badge: n.badge || '', badgeLabel: n.badgeLabel || '',
      };
    });
    return {
      items, navRef: this.navRef,
      onLogout: () => { try { localStorage.removeItem('mp-profile'); localStorage.removeItem('mp-iin'); } catch(e){} },
    };
  }
}
</script>
</body>
</html>
