<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{
    --primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;
    --n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n700:#20232D;--n900:#0A0D14;
    --green:#38C793;--green-l:#EFFAF6;--green-d:#176448;--teal:#35B9E9;--teal-l:#EBFAFF;--teal-d:#164564;
    --orange:#F17B2C;--orange-l:#FEF3EB;--orange-d:#6E330C;--yellow:#F2AE40;--yellow-l:#FEF7EC;--yellow-d:#693D11;
    --red:#DF1C41;--red-l:#FDEDF0;--red-d:#710E21;--purple:#6E3FF3;--purple-l:#EEEBFF;--pink:#E255F2;--pink-l:#FDEBFF;
    --stroke:#E2E4E9;--bg:#F6F8FA;
    --sh-xs:0 1px 2px rgba(10,13,20,.03);--sh-sm:0 2px 4px rgba(10,13,20,.06);--sh-md:0 8px 16px rgba(10,13,20,.06);--sh-lg:0 16px 32px -12px rgba(10,13,20,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--bg);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mp-scroll::-webkit-scrollbar{width:0;height:0;}
  image-slot{display:block!important;width:100%!important;height:100%!important;}
  /* Кабинет гражданина — на всю ширину окна, поля 32 / 24 / 16 px (как у шапки) */
  .lk-wrap{padding:28px 32px 80px;}
  @media (max-width:1536px){ .lk-wrap{padding:24px 24px 80px;} }
  .lk-grid{display:grid;grid-template-columns:clamp(272px,18vw,300px) minmax(0,1fr);gap:24px;align-items:start;}
  @media (max-width:1536px){ .lk-grid{gap:20px;} }
  .cn-host{position:sticky;top:90px;}
  @media (max-width:640px){ .lk-wrap{padding:16px 16px 80px !important;} }
  @media (max-width:1024px){
    .lk-wrap{padding:20px 24px 80px;}
    .lk-grid{grid-template-columns:minmax(0,1fr);gap:20px;}
    .cn-host{position:static;}
  }
</style>
</helmet>

<div style="min-height:100vh;">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="wide" hint-size="100%,70px"></dc-import></div>

  <div class="lk-wrap">
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n400);margin-bottom:24px;">
      <a href="Портал Минздрава - Главная.dc.html" style="color:var(--n400);text-decoration:none;">Главная</a>
      <i class="ri-arrow-right-s-line"></i><span style="color:var(--n700);font-weight:500;">Личный кабинет</span>
    </div>

    <div class="lk-grid">

      <!-- LEFT: profile + nav (общий компонент — тот же, что в «Медицинской книжке») -->
      <aside class="cn-host">
        <dc-import name="CitizenNav" active="overview" hint-size="300px,620px"></dc-import>
      </aside>

      <!-- «Главная» кабинета (замечания аналитика 25.11): сводка ЭПЗ — синхронизация с ЕГИС ЗРК, показатели,
           аллергия, прикрепление и плитки «Разделы ЭПЗ» (общий EpzView, home="1"); раздел открывается на «Просмотре ЭПЗ» -->
      <main style="min-width:0;animation:mp-slidein .2s ease;">
        <dc-import name="EpzView" patient="seitzhanova" mode="citizen" home="1" top="90" hint-size="100%,760px"></dc-import>
      </main>
    </div>
  </div>

  <dc-import name="Assistant" hint-size="1px,1px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// «Главная» личного кабинета гражданина = сводка ЭПЗ (раньше — «Обзор» с рекомендациями и записью на скрининг; убран по замечаниям 25.11).
// Уведомления — отдельная страница (постановка 24.11.2026, вход — колокольчиком в шапке); старая ссылка #notif ведёт туда
if((location.hash || '') === '#notif') location.replace('Уведомления гражданина.dc.html');

class Component extends DCLogic {
  renderVals(){ return {}; }
}
</script>
<template id="__bundler_thumbnail" data-bg-color="#4D42E9"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#4D42E9"/><g transform="translate(480 280)"><rect width="240" height="240" rx="48" fill="#fff"/><path d="M50 120 h28 l18 -44 24 88 18 -44 h32" fill="none" stroke="#4D42E9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g></svg></template>
</body>
</html>
