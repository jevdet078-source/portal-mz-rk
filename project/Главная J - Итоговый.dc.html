<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Главная · вариант J «Итоговый» (09.11.2026).
  Приведена к тому, что команда собрала на тестовом стенде portal.isapp из вариантов A–I, с исправлением ошибок UX/UI стенда:
    • первый экран: «Цифровой помощник» + карусель услуг — на чистом светлом фоне (на стенде текст лежал поверх фото людей);
    • новый ряд «Здоровье на каждом этапе жизни» (6 направлений → страница раздела) + опросник «Персональный маршрут здоровья»;
    • «Жизненный путь здоровья» — календарь прививок и скринингов по этапам (контент стенда, подписи не обрезаются);
    • «Разделы портала» — разделы выбранной роли со ссылками (на стенде дублировали переключатель ролей из шапки);
    • новости и частые вопросы — как на стенде.
  Замечания руководства 10.11.2026:
    • первый экран слева — врачи с картинки стенда (без метки «Цифровой помощник» и частых вопросов): заголовок над людьми,
      поле ввода под ними — текст на людей не ложится. Шесть вариантов в панели «Варианты дизайна» (localStorage 'mp-hero-j'):
      1 — фото между заголовком и полем; 2 — поле сразу под заголовком; 3 — фото в карточке; 4 — цельный фон слева;
      5 — фон на всю ширину, баннер-стекло; 6 — как на стенде: врачи вверху, заголовок и поле под ними;
    • «Здоровье на каждом этапе жизни» — фото направлений вместо объёмных иллюстраций (HomeArt.photo).
  Для ролей «Бизнесу» и «Медперсоналу» вместо блоков о здоровье — услуги роли плитками (как в варианте H).
  Общие блоки: HomeData, HomeArt, PortalHeader, HomeAssist (look="open"), HomeBanners, HealthRoute, LifePath, HomeNews, HomeFaq,
  PortalFooter, AiPanel, ThemeKit, Splash.
-->
<x-dc>
<helmet>
<style>
  body{ margin:0; background:#fff; }
  .hm-root{ opacity:0; }
  html.mp-ready .hm-root{ opacity:1; transition:opacity .45s ease; }
  .vj-top{ position:sticky; top:0; z-index:40; }

  /* ——— ПЕРВЫЙ ЭКРАН ——— */
  /* clip, а не hidden: фокус на поле не «прокручивает» первый экран (декоративные круги выходят за его край) */
  .vj-hero{ position:relative; overflow:hidden; overflow:clip; isolation:isolate;
    background:linear-gradient(180deg, color-mix(in srgb, var(--b50) 92%, #fff) 0%, color-mix(in srgb, var(--b50) 45%, #fff) 62%, #fff 100%); }
  .vj-hero::before, .vj-hero::after{ content:''; position:absolute; z-index:-1; border-radius:50%; pointer-events:none; filter:blur(10px); }
  .vj-hero::before{ width:min(60vw, 900px); aspect-ratio:1; left:-18vw; top:-30%; background:radial-gradient(closest-side, color-mix(in srgb, var(--b200) 55%, transparent), transparent); }
  .vj-hero::after{ width:min(46vw, 720px); aspect-ratio:1; left:22%; bottom:-48%; background:radial-gradient(closest-side, color-mix(in srgb, var(--b100) 80%, transparent), transparent); }
  html[data-fill="flat"] .vj-hero{ background:color-mix(in srgb, var(--b50) 60%, #fff); }
  html[data-fill="flat"] .vj-hero::before, html[data-fill="flat"] .vj-hero::after{ display:none; }
  .vj-grid{ display:grid; grid-template-columns:minmax(380px,5fr) minmax(0,7fr); gap:clamp(20px,2.4vw,56px);
    height:clamp(520px, calc(100svh - 72px - 140px), 720px); padding-block:clamp(20px,2vw,40px) clamp(28px,2.6vw,48px); }
  .vj-grid > *{ min-width:0; min-height:0; }

  /* ——— ЦЕЛЬНЫЙ ФОН (варианты 4–6): картинка стенда двумя слоями из одного исходника, без рамки и краёв ———
     .vj-bd-doc — левая часть (врачи): масштаб и место считает place() — люди точно в окне .as-slot колонки,
       между заголовком и полем; края слоя растворяются в общем фоне;
     .vj-bd-city — правая часть (Астана): прижата к правому краю, на всю высоту, под баннером (5, 6).
     Пока поверх фона результаты поиска или диалог, врачи плавно скрываются (is-busy) — текст не ложится на людей. */
  .vj-bd{ position:absolute; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
  /* низ первого экрана плавно переходит в белый фон страницы — без ровной границы */
  .vj-bd::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:clamp(64px,11vh,128px); background:linear-gradient(180deg, rgba(255,255,255,0), #fff); }
  .vj-hero.has-bd{ background:linear-gradient(180deg, color-mix(in srgb, var(--b200) 58%, var(--b50)) 0%, color-mix(in srgb, var(--b100) 72%, #fff) 50%, color-mix(in srgb, var(--b50) 75%, #fff) 84%, #fff 100%); }
  .vj-hero.has-bd::before, .vj-hero.has-bd::after{ display:none; }
  .vj-bd img{ position:absolute; display:block; max-width:none; user-select:none; -webkit-user-drag:none; }
  .vj-bd-doc{ opacity:0; transition:opacity .5s ease;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 7%, #000 89%, transparent 100%), linear-gradient(180deg, transparent 0, #000 9%, #000 74%, transparent 100%);
            mask-image:linear-gradient(90deg, transparent 0, #000 7%, #000 89%, transparent 100%), linear-gradient(180deg, transparent 0, #000 9%, #000 74%, transparent 100%);
    -webkit-mask-composite:source-in; mask-composite:intersect; }
  .vj-bd-doc.is-on{ opacity:1; }
  .vj-hero.is-busy .vj-bd-doc{ opacity:0; }
  .vj-bd-city{ top:0; right:0; height:100%; width:auto;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 42%), linear-gradient(180deg, #000 0, #000 66%, transparent 100%);
            mask-image:linear-gradient(90deg, transparent 0, #000 42%), linear-gradient(180deg, #000 0, #000 66%, transparent 100%);
    -webkit-mask-composite:source-in; mask-composite:intersect; }
  /* 5 — баннер-стекло: фон продолжается под карточками; 6 — светлая полупрозрачная плашка, как на стенде */
  /* анимация появления с fill:both делает колонку «корнем» для backdrop-filter — стекло не видело фон; после появления снимаем её */
  .vj-hero.has-bd .vj-ban.hm-in{ animation-fill-mode:backwards; }
  .vj-hero.bd-full .hb-light .hb-slide{ background:linear-gradient(125deg, color-mix(in srgb, var(--bg1) 80%, transparent) 0%, color-mix(in srgb, var(--bg2) 66%, transparent) 100%);
    -webkit-backdrop-filter:blur(22px) saturate(1.2); backdrop-filter:blur(22px) saturate(1.2); box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 34px 64px -44px rgba(11,58,80,.5); }
  .vj-hero.bd-portal .hb-light .hb-slide{ background:linear-gradient(125deg, rgba(255,255,255,.84) 0%, color-mix(in srgb, var(--bg1) 70%, transparent) 100%);
    -webkit-backdrop-filter:blur(24px) saturate(1.15); backdrop-filter:blur(24px) saturate(1.15); box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), 0 30px 60px -42px rgba(11,58,80,.45); }
  @media (max-width:960px){ .vj-bd .vj-bd-city{ display:none; } }

  /* левая колонка: заголовок, фото врачей, поле (HomeAssist look="photo"); --hero-bar — высота вкладок-таймеров под баннером справа */
  .vj-grid{ --hero-bar:54px; }
  .vj-ai{ padding:0; }

  /* ——— ЗДОРОВЬЕ: направления + маршрут ——— */
  .vj-health{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.24fr); gap:clamp(14px,1.3vw,28px); height:clamp(520px, 37vw, 600px); }
  .vj-health > *{ min-width:0; min-height:0; }
  .vj-st{ position:relative; overflow:hidden; isolation:isolate; display:flex; flex-direction:column; padding:clamp(22px,2vw,34px); border-radius:28px;
    background:linear-gradient(150deg, color-mix(in srgb, #EEEBFF 85%, #fff) 0%, color-mix(in srgb, var(--b50) 70%, #fff) 100%); box-shadow:inset 0 0 0 1px color-mix(in srgb, #CAC2FF 45%, transparent); }
  .vj-st::after{ content:''; position:absolute; z-index:-1; right:-18%; top:-26%; width:70%; aspect-ratio:1; border-radius:50%; background:radial-gradient(closest-side, rgba(255,255,255,.9), transparent); pointer-events:none; }
  .vj-st h2{ margin:0; font-size:clamp(24px,1vw + 14px,34px); line-height:1.15; font-weight:600; letter-spacing:-.026em; text-wrap:balance; color:var(--n900); }
  .vj-st h2 a{ color:inherit; text-decoration:none; }
  .vj-st h2 a:hover{ color:var(--b800); }
  .vj-st > p{ margin:10px 0 0; max-width:44ch; font-size:clamp(14.5px,.2vw + 12.5px,16px); line-height:1.55; color:var(--n500); }
  .vj-dirs{ list-style:none; margin:clamp(18px,1.6vw,26px) 0 0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); grid-auto-rows:minmax(64px,1fr); gap:10px; flex:1 1 auto; min-height:0; }
  .vj-dir{ display:flex; align-items:center; gap:12px; height:100%; min-height:68px; padding:8px 14px 8px 8px; border-radius:18px; background:rgba(255,255,255,.82); color:var(--n900); text-decoration:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 8px 18px -16px rgba(43,22,100,.45); transition:background .18s, box-shadow .18s, transform .18s; }
  .vj-dir:hover{ background:#fff; box-shadow:0 0 0 1px color-mix(in srgb, #CAC2FF 70%, transparent), 0 14px 26px -18px rgba(43,22,100,.5); transform:translateY(-1px); }
  .vj-dir:focus-visible{ outline:2px solid var(--b500); outline-offset:2px; }
  /* фото направления (вместо объёмной иллюстрации): во всю высоту плитки, фокус на лицах — mpArt.photo(id).pos */
  .vj-dir .ph{ position:relative; align-self:stretch; width:clamp(72px,6.2vw,112px); flex:0 0 auto; border-radius:12px; overflow:hidden; background:linear-gradient(140deg, var(--bg1), var(--bg2)); }
  .vj-dir .ph img{ position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .vj-dir:hover .ph img{ transform:scale(1.06); }
  .vj-dir b{ flex:1; min-width:0; font-size:clamp(14px,.15vw + 12px,15.5px); line-height:1.3; font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
  .vj-dir > i{ font-size:18px; color:var(--n300); transition:color .18s, transform .18s; }
  .vj-dir:hover > i{ color:var(--b600); transform:translateX(2px); }
  .vj-st-foot{ margin-top:clamp(16px,1.4vw,22px); display:flex; }
  .vj-btn{ display:inline-flex; align-items:center; gap:8px; height:48px; padding:0 20px; border-radius:14px; background:var(--b600); color:#fff; font-size:15.5px; font-weight:600; text-decoration:none; transition:background .15s; }
  .vj-btn i{ font-size:19px; transition:transform .15s; }
  .vj-btn:hover{ background:var(--b700); } .vj-btn:hover i{ transform:translateX(3px); }
  .vj-btn:focus-visible{ outline:2px solid var(--b500); outline-offset:3px; }

  /* ——— УСЛУГИ (бизнес, медперсонал): бенто-плитки, как в H ——— */
  .vj-bento{ display:grid; gap:clamp(12px,1vw,18px); grid-template-columns:repeat(5, minmax(0,1fr)); grid-auto-rows:clamp(240px, 17vw, 320px); }
  .vj-tile{ position:relative; overflow:hidden; isolation:isolate; display:flex; flex-direction:column; align-items:flex-start; padding:clamp(18px,1.4vw,26px); border-radius:24px;
    background:var(--n100); color:var(--n900); text-decoration:none; transition:box-shadow .3s ease; }
  .vj-tile::before{ content:''; position:absolute; inset:0; z-index:-1; background:linear-gradient(140deg, var(--bg1), var(--bg2)); opacity:0; transition:opacity .35s ease; }
  .vj-tile:hover::before, .vj-tile:focus-visible::before{ opacity:1; }
  .vj-tile b{ position:relative; z-index:2; font-size:clamp(16px,.35vw + 12px,19px); line-height:1.3; font-weight:600; letter-spacing:-.014em; text-wrap:balance; }
  .vj-tile .go{ position:relative; z-index:2; margin-top:auto; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; color:var(--n700); font-size:18px; transition:background .2s, color .2s; }
  .vj-tile:hover .go{ background:var(--a5); color:#fff; }
  .vj-tile .art{ position:absolute; z-index:1; right:-6%; bottom:-6%; width:min(86%, 280px); aspect-ratio:240/200; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .vj-tile:hover .art{ transform:translate(-4px,-8px) scale(1.05); }
  .vj-all{ position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(18px,1.4vw,26px); border-radius:24px; background:var(--b600); color:#fff; text-decoration:none; transition:background .2s; }
  .vj-all:hover{ background:var(--b700); }
  .vj-all b{ font-size:clamp(18px,.4vw + 13px,22px); line-height:1.25; font-weight:600; letter-spacing:-.016em; }
  .vj-all em{ font-style:normal; display:block; margin-top:8px; font-size:15px; color:rgba(255,255,255,.78); }
  .vj-all .go{ width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.16); font-size:22px; }

  /* ——— РАЗДЕЛЫ ПОРТАЛА ——— */
  .vj-secs{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:clamp(12px,1vw,18px); }
  .vj-secs.n3{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  .vj-sec{ display:flex; flex-direction:column; gap:16px; padding:clamp(20px,1.6vw,28px); border-radius:24px; background:#fff; border:1px solid var(--n200); transition:border-color .2s, box-shadow .2s; }
  .vj-sec:hover{ border-color:var(--b200); box-shadow:0 24px 44px -34px rgba(10,13,20,.35); }
  .vj-sec-hd{ display:flex; align-items:center; gap:14px; color:var(--n900); text-decoration:none; }
  .vj-sec-hd b{ flex:1; min-width:0; font-size:18px; font-weight:600; letter-spacing:-.014em; line-height:1.3; }
  .vj-sec-hd > i{ font-size:20px; color:var(--n300); transition:transform .2s, color .2s; }
  .vj-sec-hd:hover b{ color:var(--b700); } .vj-sec-hd:hover > i{ color:var(--b600); transform:translateX(3px); }
  .vj-sec.red .hm-ico{ background:var(--red-l); color:var(--red); }
  .vj-links{ display:flex; flex-wrap:wrap; gap:8px; }
  .vj-links a{ display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:7px 14px; border-radius:999px; background:var(--n100); color:var(--n700); font-size:14px; line-height:1.3; font-weight:500; text-decoration:none; transition:background .15s, color .15s; }
  .vj-links a:hover{ background:var(--b50); color:var(--b800); }
  .vj-links a .hm-ext{ font-size:14px; }

  @media (min-width:1900px){ .vj-health{ height:640px; } }
  /* на ноутбуках стрелка в плитке направления отнимает место у названия — плитка и так кликабельна целиком */
  @media (max-width:1599px){ .vj-dir > i{ display:none; } .vj-dir{ padding-right:12px; } }
  @media (max-width:1280px){ .vj-secs{ grid-template-columns:repeat(2, minmax(0,1fr)); } .vj-secs.n3{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width:1100px){
    .vj-health{ grid-template-columns:minmax(0,1fr); height:auto; }
    .vj-route{ height:600px; }
    .vj-dirs{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    .vj-bento{ grid-template-columns:repeat(3, minmax(0,1fr)); grid-auto-rows:220px; }
    .vj-secs.n3{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  @media (max-width:960px){
    .vj-grid{ grid-template-columns:minmax(0,1fr); height:auto; }
    /* на планшете и телефоне первым — приветствие с поиском (h1 и главное действие), карусель — следом */
    .vj-ban{ height:clamp(440px, 62vw, 540px); }
    .vj-ai{ min-height:0; }
  }
  @media (max-width:760px){
    .vj-ban{ height:auto; }
    .vj-ai{ min-height:0; }
    .vj-dirs{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .vj-route{ height:auto; }
    .vj-bento{ grid-template-columns:repeat(2, minmax(0,1fr)); grid-auto-rows:190px; }
    .vj-tile .art{ width:72%; right:-10%; bottom:-10%; }
    .vj-secs, .vj-secs.n3{ grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width:480px){
    .vj-st{ border-radius:24px; padding:20px 16px; }
    .vj-dirs{ grid-template-columns:minmax(0,1fr); }
    .vj-dir{ min-height:60px; }
    .vj-btn{ width:100%; justify-content:center; }
  }
</style>
</helmet>

<div class="hm-root">
  <dc-import name="HomeData" hint-size="0px,0px"></dc-import>
  <dc-import name="HomeArt" gallery="0" hint-size="0px,0px"></dc-import>
  <div class="vj-top"><dc-import name="PortalHeader" look="light" reports="1" hint-size="100%,72px"></dc-import></div>

  <main ref="{{ mainRef }}">
    <!-- ПЕРВЫЙ ЭКРАН -->
    <section class="{{ heroCls }}" ref="{{ heroRef }}">
      <sc-if value="{{ hasBd }}" hint-placeholder-val="{{ false }}">
        <div class="vj-bd" aria-hidden="true">
          <sc-if value="{{ hasCity }}" hint-placeholder-val="{{ false }}"><img class="vj-bd-city" src="assets/home/hero-bg-city.jpg" alt="" draggable="false"></sc-if>
          <img class="vj-bd-doc" ref="{{ bdRef }}" src="assets/home/hero-bg-doctors.jpg" alt="" draggable="false">
        </div>
      </sc-if>
      <div class="hm-wrap vj-grid">
        <div class="vj-ai hm-in d1"><dc-import name="HomeAssist" look="photo" layout="{{ heroLayout }}" photo="{{ heroPhoto }}" hint-size="100%,100%"></dc-import></div>
        <div class="vj-ban hm-in d2"><dc-import name="HomeBanners" look="light" hint-size="100%,100%"></dc-import></div>
      </div>
    </section>

    <!-- ЗДОРОВЬЕ: направления + персональный маршрут (граждане) -->
    <sc-if value="{{ isCitizen }}" hint-placeholder-val="{{ true }}">
      <section class="hm-sec" style="padding-top:clamp(8px,1vw,16px);">
        <div class="hm-wrap vj-health">
          <article class="vj-st" aria-labelledby="vj-st-title">
            <h2 id="vj-st-title"><a href="{{ stagesHref }}">Здоровье на каждом этапе жизни</a></h2>
            <p>Понятные инструкции и рекомендации для важных событий жизни</p>
            <ul class="vj-dirs">
              <sc-for list="{{ dirs }}" as="d" hint-placeholder-count="6">
                <li><a class="vj-dir" href="{{ d.href }}" data-tip="{{ d.tip }}"><span class="ph" style="{{ d.vars }}" aria-hidden="true"><img src="{{ d.thumb }}" style="{{ d.pos }}" alt="" loading="lazy" decoding="async"></span><b>{{ d.short }}</b><i class="ri-arrow-right-line" aria-hidden="true"></i></a></li>
              </sc-for>
            </ul>
            <div class="vj-st-foot"><a class="vj-btn" href="{{ stagesHref }}">Все направления<i class="ri-arrow-right-line"></i></a></div>
          </article>
          <div class="vj-route"><dc-import name="HealthRoute" hint-size="100%,100%"></dc-import></div>
        </div>
      </section>

      <!-- ЖИЗНЕННЫЙ ПУТЬ ЗДОРОВЬЯ -->
      <section class="hm-sec" style="padding-top:0;">
        <div class="hm-wrap"><dc-import name="LifePath" hint-size="100%,760px"></dc-import></div>
      </section>
    </sc-if>

    <!-- УСЛУГИ РОЛИ (бизнес, медперсонал) -->
    <sc-if value="{{ notCitizen }}" hint-placeholder-val="{{ false }}">
      <section class="hm-sec">
        <div class="hm-wrap">
          <div class="hm-sec-head"><div><h2 class="hm-h2">{{ svcTitle }}</h2></div></div>
          <div class="vj-bento">
            <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
              <a class="vj-tile" href="{{ t.href }}" target="{{ t.target }}" rel="noopener" style="{{ t.vars }}" data-tip="{{ t.tip }}">
                <b>{{ t.short }}</b><span class="go" aria-hidden="true"><i class="{{ t.arrow }}"></i></span><span class="art" data-art="{{ t.art }}"></span>
              </a>
            </sc-for>
            <a class="vj-all" href="{{ all.href }}"><div><b>{{ all.label }}</b><sc-if value="{{ hasCount }}" hint-placeholder-val="{{ true }}"><em>{{ all.count }}</em></sc-if></div><span class="go"><i class="ri-arrow-right-line"></i></span></a>
          </div>
        </div>
      </section>
    </sc-if>

    <!-- РАЗДЕЛЫ ПОРТАЛА -->
    <section class="hm-sec" style="padding-top:0;">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const lsRole = () => { try { const r = localStorage.getItem('mp-role'); return ['citizens','business','medical'].includes(r) ? r : 'citizens'; } catch(e){ return 'citizens'; } };
const ext = (href) => /^https?:/.test(href || '');
// варианты первого экрана (панель «Варианты дизайна»): 1–3 — фото в колонке, 4–6 — цельный фон из картинки стенда
const HERO_LAYOUT = { bottom:'bottom', top:'top', card:'card', left:'bg', full:'bg', portal:'portal' };
const BD = ['left', 'full', 'portal'];
const lsHero = () => { try { const h = localStorage.getItem('mp-hero-j'); return HERO_LAYOUT[h] ? h : 'bottom'; } catch(e){ return 'bottom'; } };
// рамка людей на картинке стенда: слой врачей — левые 1040 px исходника 1821×864, слева к ним дорисовано небо
// (полоса 0–250 px зеркально ×3 = 750 px, стыки совпадают) — фон без края и на мониторах 27″. По рамке вписываем врачей в окно колонки
const PEOPLE = { cx:750 + 545, top:98, w:560, h:430, layerW:1790, layerH:864, padT:20, padB:6 };
const STAGES = 'Здоровье на каждом этапе жизни.dc.html';
// 6 направлений раздела: короткое имя для плитки, полное — в подсказке (совпадает с LifeStagesData)
const DIRS = [
  { id:'newborn', short:'Новорождённый', full:'Здоровье новорождённого', aud:'0–28 дней', art:'babybottle', tone:'teal' },
  { id:'growth', short:'Рост и развитие ребёнка', full:'Рост и развитие ребёнка', aud:'1 месяц – 17 лет', art:'blocks', tone:'yellow' },
  { id:'reproductive', short:'Репродуктивное здоровье', full:'Репродуктивное здоровье и планирование семьи', aud:'Подростки и взрослые', art:'hearts', tone:'pink' },
  { id:'pregnancy', short:'Беременность и роды', full:'Беременность, роды и послеродовой период', aud:'Беременность и после родов', art:'stroller', tone:'purple' },
  { id:'chronic', short:'Хронические заболевания', full:'Хронические заболевания и ПУЗ', aud:'Пациенты с хроническими заболеваниями', art:'tonometer', tone:'brand' },
  { id:'longevity', short:'Здоровое долголетие', full:'Здоровое долголетие', aud:'Взрослые и пожилые люди', art:'plant', tone:'green' },
];
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.mainRef = React.createRef(); this.heroRef = React.createRef(); this.bdRef = React.createRef();
    this.state = { role: lsRole(), tick:0, hero: lsHero(), busy:false };
  }
  componentDidMount(){
    this._ready = () => this.setState({ tick:Date.now(), role: window.mpHome ? window.mpHome.getRole() : this.state.role });
    window.addEventListener('mp-home-ready', this._ready);
    window.addEventListener('mp-art-ready', this._ready);
    this._role = (e) => { if(e && e.detail) this.setState({ role:e.detail }); };
    window.addEventListener('mp-role-change', this._role);
    // вариант первого экрана — из панели «Варианты дизайна» (ThemeKit heroes="1")
    this._hero = (e) => this.setState({ hero: e && e.detail ? e.detail : lsHero() });
    window.addEventListener('mp-hero-change', this._hero);
    // результаты поиска / диалог поверх фона — врачи приглушаются; вернулись к пустому полю — снова вписываем
    this._as = (e) => { const busy = !!(e && e.detail && e.detail !== 'is-idle'); if(busy !== this.state.busy) this.setState({ busy }); };
    window.addEventListener('mp-assist-state', this._as);
    this._place = () => { cancelAnimationFrame(this._raf); this._raf = requestAnimationFrame(() => this.place()); };
    window.addEventListener('resize', this._place);
    if('ResizeObserver' in window){ this._ro = new ResizeObserver(this._place); if(this.heroRef.current) this._ro.observe(this.heroRef.current); }
    // компоненты и шрифты догружаются — первые секунды уточняем место слоя
    this._pt = setInterval(this._place, 500); this._pt2 = setTimeout(() => clearInterval(this._pt), 6000);
    this._fb =setTimeout(() => document.documentElement.classList.add('mp-ready'), 3500);
    // ссылка «…#route» ведёт прямо к опроснику (блок появляется после загрузки, поэтому прокручиваем сами)
    if(location.hash === '#route') this._rt = setTimeout(() => { const r = document.getElementById('route'); if(r) r.scrollIntoView({ block:'center' }); }, 1200);
    this.paint();
  }
  componentDidUpdate(){ this.paint(); if(this._place) this._place(); }
  componentWillUnmount(){ window.removeEventListener('mp-home-ready', this._ready); window.removeEventListener('mp-art-ready', this._ready); window.removeEventListener('mp-role-change', this._role); window.removeEventListener('mp-hero-change', this._hero);
    window.removeEventListener('mp-assist-state', this._as); window.removeEventListener('resize', this._place); if(this._ro) this._ro.disconnect();
    clearInterval(this._pt); clearTimeout(this._pt2); cancelAnimationFrame(this._raf); clearTimeout(this._fb); }
  // слой врачей: масштаб — чтобы люди целиком вошли в окно .as-slot (не крупнее 1.2 — без «мыла»), по центру окна
  place(){
    const hero = this.heroRef.current, img = this.bdRef.current; if(!hero || !img) return;
    const slot = hero.querySelector('.as-slot'); if(!slot) return;
    const hr = hero.getBoundingClientRect(), r = slot.getBoundingClientRect(); if(r.width < 40 || r.height < 40) return;
    const P = PEOPLE, th = r.height - P.padT - P.padB, k = Math.min(r.width / P.w, th / P.h, 1.2);
    const left = r.left - hr.left + r.width / 2 - P.cx * k, top = r.top - hr.top + P.padT + (th - P.h * k) / 2 - P.top * k;
    Object.assign(img.style, { left: left + 'px', top: top + 'px', width: P.layerW * k + 'px', height: P.layerH * k + 'px' });
    img.classList.add('is-on');
  }
  paint(){ if(window.mpArt) window.mpArt.paint(this.mainRef.current); }
  renderVals(){
    const H = window.mpHome, A = window.mpArt, role = this.state.role, cit = role === 'citizens';
    const base = { mainRef:this.mainRef, isCitizen:cit, notCitizen:!cit, stagesHref:STAGES, heroRef:this.heroRef, bdRef:this.bdRef,
      heroLayout: HERO_LAYOUT[this.state.hero], heroPhoto: BD.includes(this.state.hero) ? '' : 'assets/home/hero-doctors.jpg',
      hasBd: BD.includes(this.state.hero), hasCity: this.state.hero === 'full' || this.state.hero === 'portal',
      heroCls: 'vj-hero' + (BD.includes(this.state.hero) ? ' has-bd bd-' + this.state.hero : '') + (this.state.busy ? ' is-busy' : ''),
      dirs: DIRS.map(d => { const p = A && A.photo(d.id);
        return { ...d, href: STAGES + '#' + d.id, tip: d.full + ' · ' + d.aud, vars: A ? A.tone(d.tone) : '', thumb: p ? p.thumb : '', pos: p ? p.style : '' }; }) };
    if(!H || !A) return { ...base, secsCls:'vj-secs', svcTitle:'', all:{ href:'#', label:'', count:'' }, hasCount:false, tiles:[], secs:[] };
    const link = (l) => ({ ...l, ext: ext(l.href), target: ext(l.href) ? '_blank' : '_self', tip: H.whereTip(l.href) });
    const secs = [ ...H.SECTIONS[role], { id:'lib', icon:'ri-book-open-line', label:'Справочники', desc:'', href:H.P.drugs, links:H.LIBRARY } ];
    return {
      ...base,
      svcTitle: H.hasGov(role) ? 'Государственные услуги' : 'Сервисы для медработников',
      all: A.allTile(role), hasCount: H.hasGov(role),
      tiles: A.tiles(role).slice(0, 4).map(t => ({ ...t, cls:'vj-tile', arrow: t.ext ? 'ri-external-link-line' : 'ri-arrow-right-line' })),
      secs: secs.map(x => ({ ...x, cls: 'vj-sec' + (x.tone === 'red' ? ' red' : ''), links: x.links.map(link) })),
      secsCls: 'vj-secs' + (secs.length === 3 ? ' n3' : ''),
    };
  }
}
</script>
