<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Кабинет бизнеса → Центр уведомлений (часть заявителя, демо).
  Источник: Figma e-Health (cMe8P7iJNaTBgG04okquEG), секция «Раздел уведомлений» 6203:227749:
    Центр уведомлений — 6203:227750 · Технический сбой — 6203:228011
    Выпадающий список из колокольчика — 6406:104361 (реализован в Header.dc.html)
  Содержимое таблицы перенесено как в Figma. Прочитанность хранится в localStorage
  ['mp-notif-read'] (JSON-массив номеров), шапка слушает событие 'mp-notif-change'.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{
    --primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;
    --n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n900:#0A0D14;
    --green:#38C793;--green-dark:#2D9F75;--green-light:#CBF5E5;--red:#DF1C41;--red-l:#FDEDF0;
    --stroke:#E2E4E9;--sh-xs:0 1px 2px rgba(10,13,20,.03);--sh-lg:0 16px 32px -12px rgba(10,13,20,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--n50);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes mp-fade{from{opacity:0}to{opacity:1}}
</style>
</helmet>

<div style="min-height:100vh;background:var(--n50);">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="app" org="ТОО «Астана Групп»" bin="БИН 180540024521" hint-size="100%,73px"></dc-import></div>

  <div style="display:flex;align-items:flex-start;">
    <div style="position:sticky;top:73px;height:calc(100vh - 73px);flex:0 0 auto;z-index:30;">
      <dc-import name="BusinessNav" style="height:100%;" active="notifications" hint-size="272px,827px"></dc-import>
    </div>

    <main style="flex:1;min-width:0;padding:24px 32px 72px;">
      <div style="display:flex;flex-direction:column;gap:20px;">

        <!-- Заголовок раздела -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
            <div style="font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;">Центр уведомлений</div>
            <div style="font-size:14px;line-height:20px;color:var(--n500);">Раздел отображает успешно завершённые и отклонённые уведомления.</div>
          </div>
          <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ readAll }}" style="height:40px;padding:10px 14px;border:1px solid var(--stroke);border-radius:10px;background:#fff;color:var(--n600);font-family:inherit;font-size:14px;line-height:20px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--sh-xs);">
              <i class="ri-check-double-line" style="font-size:18px;color:var(--n400);"></i>Отметить все прочитанными
            </button>
          </sc-if>
        </div>

        <!-- Вкладки -->
        <div style="display:flex;gap:20px;border-bottom:1px solid var(--stroke);">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}<span style="{{ t.badgeStyle }}">{{ t.count }}</span><span style="{{ t.underline }}"></span></button>
          </sc-for>
        </div>

        <!-- Таблица -->
        <div style="background:#fff;border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-xs);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0;">
          <div style="overflow-x:auto;">
            <div style="min-width:920px;">
              <div style="display:flex;background:var(--n100);border-radius:8px;">
                <sc-for list="{{ cols }}" as="c" hint-placeholder-count="6">
                  <div style="{{ c.style }}">{{ c.label }}<i class="{{ c.icon }}" style="{{ c.iconStyle }}"></i></div>
                </sc-for>
              </div>

              <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
                <div>
                  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
                    <a href="{{ r.href }}" onClick="{{ r.onOpen }}" style="{{ r.rowStyle }}">
                      <div style="{{ r.numStyle }}">
                        <sc-if value="{{ r.unread }}" hint-placeholder-val="{{ true }}"><span title="Непрочитанное" style="width:6px;height:6px;border-radius:50%;background:var(--primary);flex:0 0 auto;"></span></sc-if>
                        <span style="{{ r.numTextStyle }}">{{ r.n }}</span>
                      </div>
                      <div style="width:110px;flex:0 0 auto;padding:12px 10px;font-size:14px;line-height:20px;font-weight:500;color:var(--primary);">{{ r.appId }}</div>
                      <div style="{{ r.nameStyle }}">{{ r.name }}</div>
                      <div style="width:190px;flex:0 0 auto;padding:12px 10px;font-size:14px;line-height:20px;color:var(--n900);">{{ r.date }}</div>
                      <div style="width:150px;flex:0 0 auto;padding:12px 10px;"><span style="{{ r.statusStyle }}">{{ r.status }}</span></div>
                      <div style="width:160px;flex:0 0 auto;padding:12px 10px;font-size:14px;line-height:20px;color:var(--n900);">{{ r.expert }}</div>
                    </a>
                  </sc-for>
                </div>
              </sc-if>

              <!-- Пусто / технический сбой -->
              <sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 16px;animation:mp-fade .2s ease;">
                  <div style="width:96px;height:96px;border-radius:50%;background:var(--n100);display:flex;align-items:center;justify-content:center;">
                    <i class="{{ emptyIcon }}" style="font-size:40px;color:var(--n300);"></i>
                  </div>
                  <div style="text-align:center;font-size:14px;line-height:20px;color:var(--n500);max-width:320px;">{{ emptyText }}</div>
                  <sc-if value="{{ isFail }}" hint-placeholder-val="{{ false }}">
                    <a href="Кабинет бизнеса.dc.html" style="height:36px;padding:0 14px;border:1px solid var(--stroke);border-radius:10px;background:#fff;color:var(--n600);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px;text-decoration:none;box-shadow:var(--sh-xs);"><i class="ri-arrow-left-s-line" style="font-size:18px;"></i>Вернуться назад</a>
                  </sc-if>
                </div>
              </sc-if>
            </div>
          </div>

          <!-- Пагинация -->
          <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
              <div style="font-size:14px;line-height:20px;color:var(--n500);">Страница 1 из 9</div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="width:32px;height:32px;border:1px solid var(--stroke);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--n400);"><i class="ri-arrow-left-s-line" style="font-size:18px;"></i></span>
                <sc-for list="{{ pages }}" as="p" hint-placeholder-count="7"><span style="{{ p.style }}">{{ p.label }}</span></sc-for>
                <span style="width:32px;height:32px;border:1px solid var(--stroke);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--n400);"><i class="ri-arrow-right-s-line" style="font-size:18px;"></i></span>
              </div>
              <div style="display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border:1px solid var(--stroke);border-radius:8px;font-size:14px;line-height:20px;color:var(--n500);">6 строк<i class="ri-arrow-down-s-line" style="font-size:18px;color:var(--n400);"></i></div>
            </div>
          </sc-if>
        </div>
      </div>
    </main>
  </div>

  <!-- Тост -->
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:89px;right:24px;z-index:80;width:320px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);animation:mp-slidein .2s ease;">
      <i class="ri-check-double-line" style="font-size:20px;color:var(--green-dark);flex:0 0 auto;"></i>
      <div style="font-size:14px;line-height:20px;font-weight:500;">{{ toast }}</div>
    </div>
  </sc-if>

  <!-- Панель прототипа -->
  <div style="position:fixed;right:20px;bottom:20px;z-index:50;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);">Прототип · состояние</span>
    <div style="display:flex;background:var(--n100);border-radius:8px;padding:2px;gap:2px;">
      <sc-for list="{{ demo }}" as="d" hint-placeholder-count="2"><button onClick="{{ d.onClick }}" style="{{ d.style }}">{{ d.label }}</button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { tab:'all', read:['97','96','95','94'], fail:false, toast:'' };
  }
  componentDidMount(){
    let read = null;
    try { const v = localStorage.getItem('mp-notif-read'); if(v) read = JSON.parse(v); } catch(e){}
    if(Array.isArray(read)) this.setState({ read });
    window.scrollTo(0, 0);
  }
  componentWillUnmount(){ clearTimeout(this._t); }

  save(read){
    this.setState({ read });
    try { localStorage.setItem('mp-notif-read', JSON.stringify(read)); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-notif-change', { detail:read })); } catch(e){}
  }
  toast(text){
    clearTimeout(this._t);
    this.setState({ toast:text });
    this._t = setTimeout(() => this.setState({ toast:'' }), 3000);
  }

  // содержимое таблицы — как в Figma (6203:227750)
  data(){
    const PRICE = 'Регистрация цены производителя лекарственного средства';
    const CHANGE = 'Внесение изменений в зарегистрированную цену производителя лекарственного средства';
    return [
      { n:'99', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:true,  expert:'Иванов А.А.' },
      { n:'98', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:false, expert:'Иванов А.А.' },
      { n:'97', appId:'01234567', name:CHANGE, date:'01.01.2025, 10:00', ok:true,  expert:'Иванов А.А.' },
      { n:'96', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:false, expert:'Иванов А.А.' },
      { n:'95', appId:'01234567', name:CHANGE, date:'01.01.2025, 10:00', ok:true,  expert:'Иванов А.А.' },
      { n:'94', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:false, expert:'Иванов А.А.' },
    ];
  }

  renderVals(){
    const s = this.state;
    const all = this.data();
    const isRead = (n) => s.read.indexOf(n) !== -1;
    const unreadCount = all.filter(r => !isRead(r.n)).length;

    const tabData = [ ['all','Все', all.length], ['read','Прочитанные', all.length - unreadCount], ['unread','Непрочитанные', unreadCount] ];
    const tabs = tabData.map(([id, label, count]) => { const on = s.tab === id; return { label, count,
      onClick: () => this.setState({ tab:id }),
      style:`position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 2px 10px;border:none;background:none;font-family:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;color:${on ? '#0A0D14' : '#525866'};`,
      badgeStyle:`display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;background:${on ? '#EEF2FF' : '#F6F8FA'};color:${on ? '#362DA6' : '#868C98'};`,
      underline:`position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:${on ? '#4D42E9' : 'transparent'};` }; });

    const hc = 'display:flex;align-items:center;gap:4px;padding:10px;font-size:12px;line-height:16px;color:#525866;min-height:48px;';
    const cols = [
      { label:'№', sort:true, style: hc + 'width:86px;flex:0 0 auto;' },
      { label:'ID заявки', sort:true, style: hc + 'width:110px;flex:0 0 auto;' },
      { label:'Наименование услуги', sort:true, style: hc + 'flex:1;min-width:0;' },
      { label:'Дата вынесения решения, и время', sort:true, style: hc + 'width:190px;flex:0 0 auto;' },
      { label:'Статус', sort:true, style: hc + 'width:150px;flex:0 0 auto;' },
      { label:'ФИО Эксперта', sort:true, style: hc + 'width:160px;flex:0 0 auto;' },
    ].map(c => ({ ...c, icon: c.sort ? 'ri-expand-up-down-line' : '', iconStyle:'font-size:14px;color:#868C98;flex:0 0 auto;' }));

    const list = all.filter(r => s.tab === 'all' || (s.tab === 'read' ? isRead(r.n) : !isRead(r.n)));
    // открытие уведомления отмечает его прочитанным и ведёт к заявке
    const open = (n) => () => { if(!isRead(n)) this.save(s.read.concat([n])); };
    const rows = list.map((r, i) => {
      const unread = !isRead(r.n);
      return { ...r,
        unread,
        status:'Завершена',
        href:'Услуги.dc.html#ls',
        onOpen: open(r.n),
        rowStyle:`display:flex;align-items:center;min-height:56px;border-bottom:1px solid #E2E4E9;text-decoration:none;color:inherit;background:${unread ? '#FBFCFD' : i % 2 ? '#fff' : '#FBFCFD'};`,
        numStyle:'width:86px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:12px 10px;',
        numTextStyle:`font-size:14px;line-height:20px;color:#0A0D14;font-weight:${unread ? '600' : '400'};`,
        nameStyle:`flex:1;min-width:0;padding:12px 10px;font-size:14px;line-height:20px;color:#0A0D14;font-weight:${unread ? '500' : '400'};`,
        statusStyle:`display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;${r.ok ? 'background:#CBF5E5;color:#176448;' : 'background:#FDEDF0;color:#710E21;'}`,
      };
    });

    const pages = ['1','2','3','4','5','...','9'].map((label, i) => ({ label,
      style:`min-width:32px;height:32px;padding:6px;border:1px solid #E2E4E9;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;font-weight:500;box-sizing:border-box;${i === 0 ? 'background:#F6F8FA;color:#0A0D14;' : 'background:#fff;color:#525866;'}` }));

    const seg = (on) => `height:28px;padding:0 10px;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;${on ? 'background:#fff;color:#4D42E9;box-shadow:0 1px 2px rgba(10,13,20,.08);' : 'background:transparent;color:#525866;'}`;
    const hasRows = !s.fail && rows.length > 0;

    return {
      tabs, cols, rows, pages,
      hasRows, showEmpty: !hasRows,
      isFail: s.fail,
      emptyIcon: s.fail ? 'ri-wifi-off-line' : 'ri-notification-off-line',
      emptyText: s.fail ? 'Система недоступна, обратитесь в службу поддержки.'
                        : (s.tab === 'unread' ? 'Все уведомления прочитаны.' : 'Прочитанных уведомлений пока нет.'),
      hasUnread: unreadCount > 0 && !s.fail,
      readAll: () => { this.save(all.map(r => r.n)); this.toast('Все уведомления отмечены прочитанными'); },
      hasToast: !!s.toast, toast: s.toast,
      demo: [ ['data','Уведомления'], ['fail','Технический сбой'] ].map(([id, label]) => ({ label,
        style: seg(s.fail === (id === 'fail')), onClick: () => this.setState({ fail: id === 'fail' }) })),
    };
  }
}
</script>
</body>
</html>
