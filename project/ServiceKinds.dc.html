<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Окно «Выберите вид услуги» композитной государственной услуги «Единого окна».
  Общее для портала («Государственные услуги» для бизнеса) и кабинета бизнеса («Услуги»):
  одно поведение для неавторизованных и авторизованных пользователей.

    • сверху тип продукции — segmented control «Лекарственные средства» / «Медицинские изделия»;
    • под ним виды услуги этого типа — ЛС: заключение, регистрация, цена, КНФ, АЛО, ЕД;
      МИ: заключение, регистрация, цена, АЛО, ЕД (постановка и замечание 28.10.2026);
    • смена типа сбрасывает выбранный вид; «Далее» активна только после выбора;
    • «Далее» сначала открывает ПАСПОРТ услуги (замечание 29.10.2026): с ним заявитель знакомится
      и уже из паспорта подаёт заявку. Паспорта есть у регистрации цены (ЛС / МИ), ЕД и АЛО;
      у КНФ паспорта пока нет — открывается заявление; у заключения и регистрации нет ни паспорта,
      ни формы — «Далее» недоступна, причина — в подсказке у вида услуги;
    • «Отмена», крестик, Esc и клик по затемнению закрывают окно; при новом открытии выбор сброшен;
      фокус не уходит из окна и возвращается на кнопку, которая его открыла.

  Открытие: window.dispatchEvent(new CustomEvent('mp-svc-kinds-open', { detail:{ seg, kind, back } }))
    seg / kind — необязательный предвыбор (переход по ?svc= с портала), back — куда вернёт «Вход» без входа.
  Пропсы:
    cabinet — "1": окно в кабинете бизнеса, пользователь уже вошёл — «Далее» ведёт сразу в паспорт.
              Без него (портал) без профиля «Бизнес» сначала «Вход» с возвратом в выбранный паспорт.
  Пока окно открыто, у <body> атрибут data-mp-modal="1" — страница не перехватывает горячие клавиши.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{--primary:#4D42E9;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;--n50:#FBFCFD;--n100:#F6F8FA;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n900:#0A0D14;--stroke:#E2E4E9;}
  @keyframes skd-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes skd-fade{from{opacity:0}to{opacity:1}}
  @keyframes skd-pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes skd-up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

  .skd-ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Inter',sans-serif;color:var(--n900);}
  .skd-ov *{box-sizing:border-box;}
  .skd-ov-bg{position:absolute;inset:0;background:rgba(10,13,20,.24);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:skd-fade .15s ease;}
  .skd-dlg{position:relative;width:100%;max-width:600px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#fff;border-radius:20px;box-shadow:0 24px 48px -12px rgba(14,18,27,.24);animation:skd-pop .18s ease;overflow:hidden;}
  .skd-dlg:focus{outline:none;}
  .skd-dlg form{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;margin:0;}
  .skd-h{display:flex;align-items:center;gap:12px;padding:18px 16px 16px 24px;border-bottom:1px solid var(--stroke);flex:0 0 auto;}
  .skd-t{flex:1;min-width:0;margin:0;font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em;}
  .skd-x{width:36px;height:36px;border:none;border-radius:10px;background:transparent;color:var(--n500);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .12s,color .12s;}
  .skd-x:hover{background:var(--n100);color:var(--n900);}
  /* тип продукции — segmented control (AlignUI: подложка neutral-100, активный сегмент белый с тенью) */
  .skd-seg-wrap{padding:20px 24px 4px;flex:0 0 auto;}
  .skd-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--n100);}
  .skd-seg-b{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;height:40px;padding:0 12px;border:none;border-radius:9px;background:transparent;color:var(--n500);font-family:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s;}
  .skd-seg-b i{font-size:18px;color:var(--n400);transition:color .15s;}
  .skd-seg-b span{overflow:hidden;text-overflow:ellipsis;}
  .skd-seg-b:hover{color:var(--n900);}
  .skd-seg-b:hover i{color:var(--n500);}
  .skd-seg-b[aria-selected="true"]{background:#fff;color:var(--n900);box-shadow:0 1px 2px rgba(10,13,20,.06),0 2px 6px -2px rgba(10,13,20,.08);}
  .skd-seg-b[aria-selected="true"] i{color:var(--primary);}
  .skd-seg-b:focus-visible{outline:none;box-shadow:0 0 0 2px var(--primary-light);}
  .skd-seg-b[aria-selected="true"]:focus-visible{box-shadow:0 1px 2px rgba(10,13,20,.06),0 0 0 2px var(--primary-light);}
  /* перечень видов: тени у краёв, когда список прокручивается */
  .skd-b{flex:1 1 auto;overflow-y:auto;padding:16px 24px 20px;overscroll-behavior:contain;background:linear-gradient(#fff 30%,rgba(255,255,255,0)) top/100% 40px no-repeat local,linear-gradient(rgba(255,255,255,0),#fff 70%) bottom/100% 40px no-repeat local,radial-gradient(farthest-side at 50% 0,rgba(10,13,20,.10),rgba(10,13,20,0)) top/100% 12px no-repeat scroll,radial-gradient(farthest-side at 50% 100%,rgba(10,13,20,.10),rgba(10,13,20,0)) bottom/100% 12px no-repeat scroll;background-color:#fff;}
  .skd-fs{margin:0;padding:0;border:none;min-width:0;}
  .skd-panels{display:grid;}
  .skd-panel{grid-area:1/1;min-width:0;}
  .skd-panel[data-active="true"]{animation:skd-in .16s ease;}
  .skd-panel[data-active="false"]{visibility:hidden;pointer-events:none;}
  /* невысокий экран ноутбука: окно во всю доступную высоту, скрытая панель места не занимает */
  @media (min-width:720px) and (max-height:920px){
    .skd-dlg{height:calc(100vh - 48px);}
    .skd-panel[data-active="false"]{display:none;}
  }
  .skd-opts{display:flex;flex-direction:column;gap:8px;}
  .skd-opt{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--stroke);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s;}
  .skd-opt:hover{border-color:var(--n300);background:var(--n50);}
  .skd-opt[data-on="true"],.skd-opt[data-on="true"]:hover{border-color:var(--primary);background:var(--primary-lighter);box-shadow:0 0 0 1px var(--primary) inset;}
  .skd-opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none;}
  .skd-opt:has(input:focus-visible){box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .skd-opt[data-on="true"]:has(input:focus-visible){box-shadow:0 0 0 1px var(--primary) inset,0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .skd-dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;background:#fff;border:1.5px solid var(--n300);transition:border .12s;}
  .skd-opt:hover .skd-dot{border-color:var(--n400);}
  .skd-opt[data-on="true"] .skd-dot{border:6px solid var(--primary);}
  .skd-opt-t{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:var(--n900);overflow-wrap:anywhere;}
  /* короткое имя услуги: полные наименования АЛО и ЕД совпадают в начале */
  .skd-tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;margin-right:8px;border-radius:6px;background:#EBFAFF;color:#164564;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.02em;vertical-align:top;}
  .skd-opt[data-on="true"] .skd-tag{background:#fff;}
  /* вид без паспорта и формы в прототипе — значок ⓘ с подсказкой */
  .skd-soon{flex:0 0 auto;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--n400);font-size:18px;cursor:help;}
  .skd-f{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--stroke);flex:0 0 auto;}
  .skd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;font-family:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s,box-shadow .12s;}
  .skd-sec{border:1px solid var(--stroke);background:#fff;color:var(--n600);box-shadow:0 1px 2px rgba(82,88,102,.06);}
  .skd-sec:hover{background:var(--n100);border-color:var(--n300);color:var(--n900);}
  .skd-pri{min-width:120px;padding:0 12px 0 18px;border:none;background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(77,66,233,.12);}
  .skd-pri:hover:not([disabled]){background:var(--primary-darker);}
  .skd-pri[disabled]{background:var(--n100);color:var(--n300);box-shadow:none;cursor:not-allowed;}
  .skd-x:focus-visible,.skd-btn:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .skd-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  /* мониторы 24–27″ */
  @media (min-width:1600px){ .skd-dlg{max-width:680px;} .skd-opt-t{font-size:15px;line-height:22px;} }
  /* узкий экран — нижний лист на всю ширину */
  @media (max-width:719px){
    .skd-ov{align-items:flex-end;padding:0;}
    .skd-dlg{max-width:none;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);border-radius:20px 20px 0 0;animation:skd-up .2s ease;}
    .skd-h{padding:16px 12px 14px 20px;}
    .skd-b{padding:16px 20px 20px;}
    .skd-seg-wrap{padding:16px 20px 4px;}
    .skd-seg-b{height:auto;min-height:48px;padding:6px 8px;font-size:13.5px;line-height:18px;white-space:normal;text-align:center;}
    .skd-seg-b span{overflow:visible;}
    .skd-seg-b i{display:none;}
    .skd-panel[data-active="false"]{display:none;}
    .skd-opt{padding:14px;}
    .skd-f{display:grid;grid-template-columns:1fr 1fr;padding:12px 20px calc(16px + env(safe-area-inset-bottom));}
    .skd-pri{min-width:0;}
  }
  @media (prefers-reduced-motion:reduce){ .skd-dlg,.skd-ov-bg,.skd-panel[data-active="true"]{animation:none;} }
</style>
</helmet>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
  <div class="skd-ov">
    <div class="skd-ov-bg" onClick="{{ close }}"></div>
    <div class="skd-dlg" ref="{{ dlgRef }}" role="dialog" aria-modal="true" aria-labelledby="skd-t" tabIndex="-1" onKeyDown="{{ onKey }}">
      <form onSubmit="{{ goNext }}" novalidate>
        <div class="skd-h">
          <h2 id="skd-t" class="skd-t">Выберите вид услуги</h2>
          <button type="button" class="skd-x" onClick="{{ close }}" aria-label="Закрыть"><i class="ri-close-line" style="font-size:22px;"></i></button>
        </div>
        <!-- тип продукции: от него зависит перечень видов услуги ниже -->
        <div class="skd-seg-wrap">
          <div class="skd-seg" role="tablist" aria-label="Тип продукции" onKeyDown="{{ onSegKey }}">
            <sc-for list="{{ segs }}" as="sg" hint-placeholder-count="2">
              <button type="button" class="skd-seg-b" role="tab" id="{{ sg.tabId }}" aria-selected="{{ sg.selected }}" aria-controls="{{ sg.panelId }}" tabIndex="{{ sg.tabIndex }}" onClick="{{ sg.onPick }}"><i class="{{ sg.icon }}" aria-hidden="true"></i><span>{{ sg.label }}</span></button>
            </sc-for>
          </div>
        </div>
        <div class="skd-b">
          <!-- обе панели в одной ячейке сетки: высота окна не прыгает при переключении -->
          <div class="skd-panels">
            <sc-for list="{{ segs }}" as="sg" hint-placeholder-count="2">
              <div class="skd-panel" role="tabpanel" id="{{ sg.panelId }}" aria-labelledby="{{ sg.tabId }}" data-active="{{ sg.selected }}" aria-hidden="{{ sg.hidden }}">
                <fieldset class="skd-fs">
                  <legend class="skd-sr">{{ sg.legend }}</legend>
                  <div class="skd-opts">
                    <sc-for list="{{ sg.kinds }}" as="k" hint-placeholder-count="6">
                      <label class="skd-opt" data-on="{{ k.on }}">
                        <input type="radio" name="{{ sg.radioName }}" value="{{ k.id }}" checked="{{ k.checked }}" onChange="{{ k.onPick }}" aria-describedby="{{ k.descId }}">
                        <span class="skd-dot" aria-hidden="true"></span>
                        <span class="skd-opt-t"><sc-if value="{{ k.hasTag }}" hint-placeholder-val="{{ false }}"><span class="skd-tag" title="{{ k.tagHint }}">{{ k.tag }}</span></sc-if>{{ k.label }}</span>
                        <sc-if value="{{ k.soon }}" hint-placeholder-val="{{ false }}"><span class="skd-soon" id="{{ k.descId }}" title="Паспорт и форма заявки этой услуги ещё не добавлены в прототип" aria-label="Паспорт и форма заявки этой услуги ещё не добавлены в прототип"><i class="ri-information-line"></i></span></sc-if>
                      </label>
                    </sc-for>
                  </div>
                </fieldset>
              </div>
            </sc-for>
          </div>
        </div>
        <div class="skd-f">
          <button type="button" class="skd-btn skd-sec" onClick="{{ close }}">Отмена</button>
          <button type="submit" class="skd-btn skd-pri" disabled="{{ nextDisabled }}" title="{{ nextTitle }}">Далее<i class="ri-arrow-right-s-line" style="font-size:20px;"></i></button>
        </div>
      </form>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:860}}">
// Профессиональные экспертизы АЛО (UC01.14) и ЕД (UC01.13) — и для ЛС, и для МИ.
// Наименования АЛО и ЕД — EdData.dc.html (SERVICE_ALO, SERVICE), один в один.
const ALO = { id:'alo', tag:'АЛО', tagHint:'Амбулаторное лекарственное обеспечение',
  label:'Проведение профессиональной экспертизы на лекарственные средства или медицинские изделия для включения в перечень лекарственных средств и медицинских изделий для бесплатного и (или) льготного амбулаторного обеспечения отдельных категорий граждан Республики Казахстан с определенными заболеваниями (состояниями)' };
const ED = { id:'ed', tag:'ЕД', tagHint:'Единый дистрибьютор',
  label:'Проведение профессиональной экспертизы на лекарственные средства или медицинские изделия для включения в перечень лекарственных средств и медицинских изделий, закупаемых у единого дистрибьютора' };
const SEGS = [
  { id:'ls', label:'Лекарственные средства', icon:'ri-capsule-line', kinds:[
    { id:'safety', label:'Выдача заключения о безопасности, качестве и эффективности лекарственных средств' },
    { id:'reg',    label:'Государственная регистрация, перерегистрация лекарственного средства, внесение изменений в регистрационное досье лекарственного средства' },
    { id:'price',  label:'Регистрация цены или внесение изменений в зарегистрированную цену производителя лекарственного средства' },
    { id:'knf',    label:'Проведение профессиональной экспертизы для включения в Казахстанский национальный лекарственный формуляр' },
    ALO, ED,
  ] },
  { id:'mi', label:'Медицинские изделия', icon:'ri-stethoscope-line', kinds:[
    { id:'safety', label:'Выдача заключения о безопасности, качестве и эффективности медицинских изделий' },
    { id:'reg',    label:'Государственная регистрация, перерегистрация медицинского изделия, внесение изменений в регистрационное досье медицинского изделия' },
    { id:'price',  label:'Регистрация цены или внесение изменений в зарегистрированную цену производителя медицинского изделия' },
    ALO, ED,
  ] },
];
// «Далее» → паспорт услуги (с него подаётся заявка). null — в прототипе ещё нет ни паспорта, ни формы
const kindHref = (seg, id) => ({
  price: 'Паспорт регистрации цены.dc.html#' + seg,
  alo:   'Паспорт услуги АЛО.dc.html?cat=' + seg,
  ed:    'Паспорт услуги ЕД.dc.html?cat=' + seg,
  knf:   'Заявление КНФ.dc.html',      // паспорта КНФ пока нет
}[id] || null);
const signedBiz = () => { try { return localStorage.getItem('mp-profile') === 'business'; } catch(e){ return false; } };

class Component extends DCLogic {
  dlgRef = React.createRef();
  state = { open:false, seg:'ls', kind:null };

  componentDidMount(){
    this._onOpen = (e) => this.openDlg((e && e.detail) || {});
    window.addEventListener('mp-svc-kinds-open', this._onOpen);
  }
  componentWillUnmount(){ window.removeEventListener('mp-svc-kinds-open', this._onOpen); this.unlock(); }

  openDlg(d){
    this._opener = d.opener || document.activeElement;
    this._back = d.back || '';
    const seg = SEGS.some(x => x.id === d.seg) ? d.seg : 'ls';
    const kind = (SEGS.find(x => x.id === seg).kinds.some(k => k.id === d.kind)) ? d.kind : null;
    // при каждом открытии выбор сброшен (или предвыбран по адресу)
    this.setState({ open:true, seg, kind });
    this.lock();
    setTimeout(() => {
      const el = this.dlgRef.current; if(!el) return;
      const r = kind && el.querySelector('.skd-panel[data-active="true"] input:checked');
      (r || el.querySelector('[role="tab"][aria-selected="true"]') || el).focus({ preventScroll:true });
    }, 30);
  }
  close(){
    if(!this.state.open) return;
    this.setState({ open:false, seg:'ls', kind:null });
    this.unlock();
    const o = this._opener; this._opener = null;
    setTimeout(() => { if(o && o.focus && document.contains(o)) o.focus({ preventScroll:true }); }, 0);
  }
  lock(){
    if(this._css) return;
    const sb = window.innerWidth - document.documentElement.clientWidth;
    this._css = [document.body.style.overflow, document.body.style.paddingRight];
    document.body.style.overflow = 'hidden';
    if(sb > 0) document.body.style.paddingRight = sb + 'px';
    document.body.setAttribute('data-mp-modal', '1');
  }
  unlock(){
    if(!this._css) return;
    [document.body.style.overflow, document.body.style.paddingRight] = this._css; this._css = null;
    document.body.removeAttribute('data-mp-modal');
  }
  // смена типа продукции: перечень другой — выбранный вид сбрасываем, список — к началу
  pickSeg(id){
    if(this.state.seg === id) return;
    this.setState({ seg:id, kind:null });
    const b = this.dlgRef.current && this.dlgRef.current.querySelector('.skd-b');
    if(b) b.scrollTop = 0;
  }
  // сегменты — одна остановка табуляции; ←/→, Home/End переключают тип (как вкладки WAI-ARIA)
  onSegKey(e){
    if(!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const i = SEGS.findIndex(x => x.id === this.state.seg);
    const n = e.key === 'Home' ? 0 : e.key === 'End' ? SEGS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + SEGS.length) % SEGS.length;
    this.pickSeg(SEGS[n].id);
    setTimeout(() => { const t = document.getElementById('skd-seg-' + SEGS[n].id); if(t) t.focus(); }, 0);
  }
  goNext(e){
    if(e && e.preventDefault) e.preventDefault();
    const target = this.state.kind && kindHref(this.state.seg, this.state.kind);
    if(!target) return;
    // кабинет — пользователь уже вошёл; портал без профиля «Бизнес» — вход с возвратом в паспорт
    if((this.props || {}).cabinet === '1' || signedBiz()){ this.unlock(); location.href = target; return; }
    location.href = 'Вход.dc.html?profile=business&return=' + encodeURIComponent(target) + (this._back ? '&back=' + encodeURIComponent(this._back) : '');
  }
  onKey(e){
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); this.close(); return; }
    if(e.key !== 'Tab') return;
    // фокус не выходит из окна: у группы радиокнопок одна остановка — выбранная, без выбора первая
    const d = this.dlgRef.current; if(!d) return;
    const radios = [...d.querySelectorAll('.skd-panel[data-active="true"] input[type="radio"]')];
    const stop = radios.find(r => r.checked) || radios[0];
    const f = [...d.querySelectorAll('button:not([disabled]), input[type="radio"]')]
      .filter(el => el.type === 'radio' ? el === stop : el.tabIndex >= 0);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && (document.activeElement === first || document.activeElement === d)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  renderVals(){
    const s = this.state;
    const target = s.kind && kindHref(s.seg, s.kind);
    return {
      open: s.open, dlgRef: this.dlgRef,
      close: () => this.close(),
      onKey: (e) => this.onKey(e),
      onSegKey: (e) => this.onSegKey(e),
      goNext: (e) => this.goNext(e),
      nextDisabled: !target,
      nextTitle: s.kind && !target ? 'Паспорт и форма заявки этой услуги ещё не добавлены в прототип' : '',
      segs: SEGS.map(g => {
        const sel = s.seg === g.id;
        return { label:g.label, icon:g.icon, tabId:'skd-seg-' + g.id, panelId:'skd-pan-' + g.id, radioName:'skd-kind-' + g.id,
          selected: sel ? 'true' : 'false', hidden: sel ? 'false' : 'true', tabIndex: sel ? 0 : -1,
          legend: 'Вид услуги: ' + g.label.toLowerCase(),
          onPick: () => this.pickSeg(g.id),
          kinds: g.kinds.map(k => {
            const on = sel && s.kind === k.id;
            return { id:k.id, label:k.label, hasTag: !!k.tag, tag: k.tag || '', tagHint: k.tagHint || '',
              soon: !kindHref(g.id, k.id), descId:'skd-d-' + g.id + '-' + k.id,
              on: on ? 'true' : 'false', checked: on, onPick: () => this.setState({ kind:k.id }) };
          }) };
      }),
    };
  }
}
</script>
