<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<!--
  Данные раздела «Моя семья» (ЛК гражданина) — невидимый компонент, подключается в страницы раздела:
    <dc-import name="FamilyData" hint-size="0px,0px"></dc-import>
  Регистрирует window.mpFamily и рассылает событие window `mp-family-ready`, изменения — `mp-family-change`.

  Постановка «Объединение детей в разделе „Моя семья“»: родные и опекаемые дети — единый список,
  тип родства или опеки в интерфейсе не показывается. Поле kind (kin — ГБД ФЛ, ward — РБДС МП РК) остаётся
  только для сервисов (AttachData), на экраны не выводится.
  В прототипе вместо сервисов — available(): все дети, доступные авторизованному гражданину (ИИН 020116501540).
  Добавленные дети — localStorage `mp-family`: [{ iin, at }] в порядке добавления.
  Ответ сервиса — sessionStorage `mp-family-scn`: ok | none | fail (панель «Прототип» на «Моей семье»).
-->
<x-dc><div></div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:10,&quot;height&quot;:10}}">
const KEY = 'mp-family', SCN = 'mp-family-scn';

// kind: kin — родные (ГБД ФЛ), ward — подопечные (РБДС МП РК). care: opeka | popech
const PEOPLE = [
  { iin:'180512501208', last:'Сейтжанов', first:'Алихан', middle:'Даниярович', dob:'2018-05-12', sex:'m', kind:'kin',
    blood:'A (II) Rh+', mo:'Городская поликлиника №4 г. Астаны', area:'№12', doctor:'Ахметова Гульнара Кайратовна' },
  { iin:'210904602300', last:'Сейтжанова', first:'Мадина', middle:'Данияровна', dob:'2021-09-04', sex:'f', kind:'kin',
    blood:'', mo:'Городская поликлиника №4 г. Астаны', area:'№12', doctor:'Ахметова Гульнара Кайратовна' },
  { iin:'190715504109', last:'Куанышев', first:'Арман', middle:'Бауржанович', dob:'2019-07-15', sex:'m', kind:'ward', care:'opeka',
    doc:'Распоряжение акимата г. Астаны №412 от 14.03.2022',
    blood:'B (III) Rh+', mo:'Городская поликлиника №7 г. Астаны', area:'№5', doctor:'Жумабаева Асель Маратовна' },
  { iin:'211028601402', last:'Куанышева', first:'Дарина', middle:'Бауржановна', dob:'2021-10-28', sex:'f', kind:'ward', care:'opeka',
    doc:'Распоряжение акимата г. Астаны №412 от 14.03.2022',
    blood:'', mo:'Городская поликлиника №7 г. Астаны', area:'№5', doctor:'Жумабаева Асель Маратовна' },
  { iin:'110622503100', last:'Сейткалиев', first:'Мирас', middle:'Ерланович', dob:'2011-06-22', sex:'m', kind:'ward', care:'popech',
    doc:'',
    blood:'O (I) Rh−', mo:'Городская поликлиника №2 г. Астаны', area:'№21', doctor:'Нуржанов Ерлан Болатович' },
];
const BY = {}; PEOPLE.forEach(p => { BY[p.iin] = p; });

const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2]; };
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const F = {
  PEOPLE,
  person: iin => BY[iin] || null,
  fio: p => [p.last, p.first, p.middle].filter(Boolean).join(' '),
  initials: p => ((p.last || '')[0] || '') + ((p.first || '')[0] || ''),
  date: s => { const d = parse(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); },
  age: s => {
    const b = parse(s), t = today();
    let y = t.getFullYear() - b.getFullYear();
    if(t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) y--;
    if(y >= 1) return y + ' ' + plural(y, ['год', 'года', 'лет']);
    let m = (t.getFullYear() - b.getFullYear()) * 12 + t.getMonth() - b.getMonth(); if(t.getDate() < b.getDate()) m--;
    m = Math.max(0, m); return m + ' ' + plural(m, ['месяц', 'месяца', 'месяцев']);
  },
  sexLabel: p => p.sex === 'f' ? 'Женский' : 'Мужской',
  // Добавленные дети
  list: () => {
    try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); if(Array.isArray(v)) return v.filter(x => x && BY[x.iin]); } catch(e){}
    return [];
  },
  has: iin => F.list().some(x => x.iin === iin),
  save: list => {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-family-change')); } catch(e){}
  },
  add: iins => {
    const cur = F.list(), at = Date.now();
    iins.forEach(iin => { if(BY[iin] && !cur.some(x => x.iin === iin)) cur.push({ iin, at }); });
    F.save(cur);
  },
  // Единый список: от старшего к младшему, без деления на родных и опекаемых
  children: () => F.list().map(x => ({ ...BY[x.iin], at:x.at })).sort((a, b) => a.dob.localeCompare(b.dob)),
  demo: () => F.save(PEOPLE.filter(p => p.iin !== '110622503100').map((p, i) => ({ iin:p.iin, at:i }))),
  clear: () => F.save([]),

  // Сервис: дети, доступные для добавления (в прототипе — с задержкой ответа)
  scn: () => { try { return sessionStorage.getItem(SCN) || 'ok'; } catch(e){ return 'ok'; } },
  setScn: v => { try { sessionStorage.setItem(SCN, v); } catch(e){} },
  available: () => new Promise((res, rej) => setTimeout(() => {
    const s = F.scn();
    if(s === 'fail') return rej('fail');
    res(s === 'none' ? [] : PEOPLE.slice().sort((a, b) => a.dob.localeCompare(b.dob)));
  }, 900)),
};

class Component extends DCLogic {
  constructor(props){ super(props); window.mpFamily = F; }
  componentDidMount(){
    window.mpFamily = F;
    try { window.dispatchEvent(new CustomEvent('mp-family-ready')); } catch(e){}
  }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
