<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Кабинет бизнеса — главная «Единого окна» внутри портала.
  Источник: Figma e-Health (cMe8P7iJNaTBgG04okquEG), секция «Главная страница системы» 5787:107798.
    таб «Видео-инструкции» — 5787:107947
  Оболочка — шапка портала + меню BusinessNav.
  Блок онбординга («Три шага до подачи заявок» / «Онбординг завершен») и панель прототипа
  для переключения его шагов удалены по замечанию аналитика от 14.10.2026: все разделы кабинета
  доступны сразу, композитная услуга с портала открывается в «Услугах» без промежуточных шагов.
  Геометрия: Section Header px32 py16 (18/24 medium), карточки r16 p16 gap16, файл-карточки r12 p16/16/16/14.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{
    --primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;
    --n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n900:#0A0D14;
    --red:#DF1C41;
    --stroke:#E2E4E9;
    --sh-xs:0 1px 2px rgba(10,13,20,.03);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--n50);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="min-height:100vh;background:var(--n50);">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="app" org="ТОО «Астана Групп»" bin="БИН 180540024521" hint-size="100%,73px"></dc-import></div>

  <div style="display:flex;align-items:flex-start;">
    <div style="position:sticky;top:73px;height:calc(100vh - 73px);flex:0 0 auto;z-index:30;">
      <dc-import name="BusinessNav" style="height:100%;" active="home" hint-size="272px,827px"></dc-import>
    </div>

    <main style="flex:1;min-width:0;padding:8px 0 64px;">
      <div style="display:flex;flex-direction:column;gap:8px;animation:mp-slidein .2s ease;">

        <!-- Section Header [1.0] -->
        <div style="padding:16px 32px;">
          <div style="font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;color:var(--n900);">Здравствуйте, Аружан.</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:24px;">

          <!-- Незавершённая подача: вернуть к услуге, которую начали оформлять с портала -->
          <sc-if value="{{ hasPending }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 32px;">
              <div role="status" style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--primary-lighter);border:1px solid var(--primary-light);animation:mp-slidein .2s ease;">
                <div style="width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><i class="ri-flag-2-line" style="font-size:20px;color:var(--primary);"></i></div>
                <div style="flex:1;min-width:0;">
                  <div style="font-size:15px;line-height:22px;font-weight:500;color:var(--primary-darker);">Подача заявки не завершена</div>
                  <div style="font-size:13.5px;line-height:20px;color:var(--n500);">Продолжите с того места, где остановились: «{{ pendingName }}».</div>
                </div>
                <button onClick="{{ continuePending }}" style="height:40px;padding:10px 12px 10px 16px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-family:inherit;font-size:14px;line-height:20px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(77,66,233,.08);">Продолжить подачу<i class="ri-arrow-right-line" style="font-size:18px;"></i></button>
                <button onClick="{{ dismissPending }}" aria-label="Скрыть" style="width:32px;height:32px;border:none;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><i class="ri-close-line" style="font-size:20px;color:var(--n500);"></i></button>
              </div>
            </div>
          </sc-if>

          <!-- Помощь -->
          <div style="padding:0 32px;">
            <div style="background:var(--n0);border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-xs);padding:16px;display:flex;flex-direction:column;gap:16px;">
              <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start;">
                <div style="font-size:16px;line-height:24px;font-weight:500;letter-spacing:-.011em;color:var(--n900);">Помощь</div>
                <div style="font-size:14px;line-height:20px;letter-spacing:-.006em;color:var(--n500);">Полезные материалы и инструкции для работы с системой</div>
                <div style="display:flex;gap:24px;border-bottom:1px solid var(--stroke);">
                  <sc-for list="{{ helpTabs }}" as="t" hint-placeholder-count="2">
                    <button onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</button>
                  </sc-for>
                </div>
              </div>

              <sc-if value="{{ isDocs }}" hint-placeholder-val="{{ true }}">
                <div style="display:flex;gap:16px;">
                  <sc-for list="{{ docs }}" as="d" hint-placeholder-count="3">
                    <div style="flex:1;min-width:0;background:var(--n0);border:1px solid var(--stroke);border-radius:12px;padding:16px 16px 16px 14px;display:flex;gap:12px;align-items:flex-start;">
                      <div style="position:relative;width:40px;height:40px;flex:0 0 auto;">
                        <img src="assets/file-page.svg" alt="" style="display:block;width:40px;height:40px;" />
                        <span style="position:absolute;left:0;bottom:6px;padding:2px 3px;border-radius:4px;background:var(--red);color:#fff;font-size:11px;line-height:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;">PDF</span>
                      </div>
                      <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
                        <div style="font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;color:var(--n900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ d.name }}</div>
                        <a href="#" onClick="{{ d.onClick }}" style="display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:20px;font-weight:500;color:var(--primary);text-decoration:none;"><i class="ri-download-line" style="font-size:20px;"></i>Скачать</a>
                      </div>
                    </div>
                  </sc-for>
                </div>
              </sc-if>

              <sc-if value="{{ isVideos }}" hint-placeholder-val="{{ false }}">
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px;">
                  <sc-for list="{{ videos }}" as="v" hint-placeholder-count="4">
                    <a href="#" onClick="{{ v.onClick }}" style="display:flex;flex-direction:column;gap:8px;text-decoration:none;">
                      <div style="aspect-ratio:16/9;border-radius:12px;background:var(--primary-lighter);display:flex;align-items:center;justify-content:center;"><i class="ri-play-circle-fill" style="font-size:48px;color:var(--red);"></i></div>
                      <div style="font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;color:var(--n900);">{{ v.title }}</div>
                    </a>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { helpTab:'docs', pending:null };
  componentDidMount(){
    // Онбординга больше нет — кабинет всегда в рабочем состоянии (сбрасываем шаг, сохранённый прототипом раньше)
    try { if(localStorage.getItem('mp-biz-step') !== 'done'){ localStorage.setItem('mp-biz-step', 'done'); window.dispatchEvent(new CustomEvent('mp-biz-step-change', { detail:'done' })); } } catch(e){}
    // услуга, которую начали оформлять с паспорта услуги портала
    try { const p = localStorage.getItem('mp-pending-service'); if(p) this.setState({ pending:p }); } catch(e){}
  }
  renderVals(){
    const s = this.state;
    const noop = (e) => { if(e && e.preventDefault) e.preventDefault(); };
    const PEND = { 'price-ls':['Регистрация цены на лекарственные средства','ls'], 'price-mi':['Регистрация цены на медицинские изделия','mi'] }[s.pending];

    const helpTabs = [ { id:'docs', label:'Скачать документы' }, { id:'videos', label:'Видео-инструкции' } ].map(t => {
      const on = s.helpTab === t.id;
      return { ...t, onClick: () => this.setState({ helpTab:t.id }),
        style:`padding:14px 0;margin-bottom:-1px;border:none;background:none;font-family:inherit;font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.006em;cursor:pointer;color:${on ? '#0A0D14' : '#525866'};box-shadow:${on ? 'inset 0 -2px 0 #4D42E9' : 'none'};` };
    });
    const docs = [1,2,3].map(() => ({ name:'Руководство пользователя.pdf', onClick:noop }));
    const videos = [1,2,3,4].map(() => ({ title:'Инструкция по работе с системой', onClick:noop }));

    return {
      hasPending: !!PEND,
      pendingName: PEND ? PEND[0] : '',
      continuePending: () => {
        try { localStorage.removeItem('mp-pending-service'); } catch(e){}
        location.href = 'Заявка на регистрацию цены.dc.html#' + PEND[1];
      },
      dismissPending: () => { try { localStorage.removeItem('mp-pending-service'); } catch(e){} this.setState({ pending:null }); },
      helpTabs, docs, videos,
      isDocs: s.helpTab === 'docs', isVideos: s.helpTab === 'videos',
    };
  }
}
</script>
</body>
</html>
