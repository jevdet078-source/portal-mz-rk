<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Кабинет бизнеса → Платежи.
  Источник: Figma e-Health (cMe8P7iJNaTBgG04okquEG), секция «Платежи / iFrame» 18376:123105:
    заявки на платеж — 755:35870 · создание (выбор формы) — 755:36525 · заполнение — 755:36860
  Раздел — внешняя система «Экспертиза» НЦЭЛС во iframe. Как и в Figma, показана растровыми снимками
  (assets/iframe-payments-*.png) с кликабельными зонами; оболочка — портальная.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{--primary:#4D42E9;--n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n400:#868C98;--n500:#525866;--n900:#0A0D14;--stroke:#E2E4E9;--sh-lg:0 16px 32px -12px rgba(10,13,20,.12);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--n50);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes mp-pulse{0%,100%{box-shadow:0 0 0 0 rgba(77,66,233,.28)}50%{box-shadow:0 0 0 6px rgba(77,66,233,0)}}
</style>
</helmet>

<div style="min-height:100vh;background:var(--n50);">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="app" org="ТОО «Астана Групп»" bin="БИН 180540024521" hint-size="100%,73px"></dc-import></div>

  <div style="display:flex;align-items:flex-start;">
    <div style="position:sticky;top:73px;height:calc(100vh - 73px);flex:0 0 auto;z-index:30;">
      <dc-import name="BusinessNav" style="height:100%;" active="payments" hint-size="272px,827px"></dc-import>
    </div>

    <main style="flex:1;min-width:0;padding:24px 32px 72px;">
      <div style="display:flex;flex-direction:column;gap:20px;animation:mp-slidein .2s ease;">
        <div style="font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;">Платежи</div>
        <!-- снимок задан фоном: <img src="{{ }}"> браузер запрашивает до подстановки шаблона (404) -->
        <div role="img" aria-label="{{ frame.alt }}" data-frame="{{ frame.src }}" style="{{ frame.box }}">
          <sc-for list="{{ frame.spots }}" as="sp" hint-placeholder-count="1">
            <button onClick="{{ sp.onClick }}" title="{{ sp.title }}" style="{{ sp.style }}"></button>
          </sc-for>
        </div>
      </div>
    </main>
  </div>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" style="position:fixed;top:89px;right:24px;z-index:80;width:384px;display:flex;gap:10px;align-items:flex-start;padding:14px;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);animation:mp-slidein .2s ease;">
      <i class="ri-checkbox-circle-fill" style="font-size:20px;color:#38C793;flex:0 0 auto;"></i>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;line-height:20px;font-weight:500;">{{ toastTitle }}</div>
        <div style="font-size:12.5px;line-height:18px;color:var(--n500);margin-top:2px;">{{ toastText }}</div>
        <a href="{{ toastHref }}" onClick="{{ onToastAction }}" style="display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;">{{ toastAction }}<i class="ri-arrow-right-line" style="font-size:15px;"></i></a>
      </div>
      <button onClick="{{ closeToast }}" aria-label="Закрыть" style="border:none;background:none;padding:2px;border-radius:6px;cursor:pointer;display:flex;flex:0 0 auto;"><i class="ri-close-line" style="font-size:18px;color:var(--n400);"></i></button>
    </div>
  </sc-if>

  <div style="position:fixed;right:20px;bottom:20px;z-index:50;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);">Прототип · iframe</span>
    <div style="display:flex;background:var(--n100);border-radius:8px;padding:2px;gap:2px;">
      <sc-for list="{{ demo }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="{{ o.style }}">{{ o.label }}</button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { step:0, toast:null };
  componentWillUnmount(){ clearTimeout(this._t); }
  toast(t){ clearTimeout(this._t); this.setState({ toast:t }); this._t = setTimeout(() => this.setState({ toast:null }), 9000); }
  // создание заявки на платеж завершает шаг 2 онбординга
  createPayment(){
    this.setState({ step:2 });
    let opened = false, pending = null;
    try {
      if(localStorage.getItem('mp-biz-step') === '2'){ localStorage.setItem('mp-biz-step', '3'); opened = true; }
      pending = localStorage.getItem('mp-pending-service');
    } catch(e){}
    if(!opened) return;
    try { window.dispatchEvent(new CustomEvent('mp-biz-step-change', { detail:'3' })); } catch(e){}
    const svc = { 'price-ls':['Регистрация цены на лекарственные средства','ls'], 'price-mi':['Регистрация цены на медицинские изделия','mi'] }[pending];
    this.toast({
      title:'Заявка на платеж создана',
      text: svc ? `Подготовка организации завершена. Можно продолжить: «${svc[0]}».` : 'Подготовка организации завершена — подача заявок доступна в разделе «Услуги».',
      action: svc ? 'Продолжить подачу' : 'Перейти к услугам',
      href: svc ? 'Заявка на регистрацию цены.dc.html#' + svc[1] : 'Услуги.dc.html',
    });
  }
  renderVals(){
    const s = this.state;
    const spot = (l, t, w, h, title, onClick) => ({ title, onClick,
      style:`position:absolute;left:${l}%;top:${t}%;width:${w}%;height:${h}%;padding:0;border:2px dashed rgba(77,66,233,.65);border-radius:8px;background:rgba(77,66,233,.08);cursor:pointer;animation:mp-pulse 2s ease-in-out infinite;` });
    const frame = (src, w, h, alt, spots) => ({ src, alt, spots,
      box:`position:relative;width:100%;aspect-ratio:${w} / ${h};border-radius:16px;overflow:hidden;background:#fff url('${src}') center / 100% 100% no-repeat;` });
    const frames = [
      frame('assets/iframe-payments-list.png', 1118, 622, 'Экспертиза НЦЭЛС — заявки на платеж', [ spot(63.5, 16.3, 18.4, 5.2, 'Создать заявку на платеж', () => this.setState({ step:1 })) ]),
      frame('assets/iframe-payments-create.png', 1118, 688, 'Экспертиза НЦЭЛС — выбор формы заявки на платеж', [ spot(28.2, 27.4, 53.6, 6.7, 'По проведению экспертизы ЛС', () => this.createPayment()) ]),
      frame('assets/iframe-payments-form.png', 1118, 686, 'Экспертиза НЦЭЛС — заполнение заявки на платеж', [ spot(2.8, 16.4, 14.7, 5.2, 'Вернуться в список', () => this.setState({ step:0 })) ]),
    ];
    const demo = ['Список','Создание','Заполнение'].map((label, i) => ({ label, onClick: () => this.setState({ step:i }),
      style:`height:28px;padding:0 10px;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;${s.step === i ? 'background:#fff;color:#4D42E9;box-shadow:0 1px 2px rgba(10,13,20,.08);' : 'background:transparent;color:#525866;'}` }));
    const t = s.toast || { title:'', text:'', action:'', href:'#' };
    return { frame: frames[s.step], demo,
      hasToast: !!s.toast, toastTitle: t.title, toastText: t.text, toastAction: t.action, toastHref: t.href,
      onToastAction: () => { try { localStorage.setItem('mp-biz-step', 'done'); localStorage.removeItem('mp-pending-service'); } catch(e){} },
      closeToast: () => this.setState({ toast:null }),
    };
  }
}
</script>
</body>
</html>
