<!--
  Услуга ЕД («Включение ЛС / МИ в перечень Единого дистрибьютора») — «бэкенд» прототипа.
  Невизуальный компонент: подключается в страницы ЕД через <dc-import name="EdData">,
  кладёт API в window.mpEd и рассылает событие 'mp-ed-ready'. Компоненты грузятся асинхронно,
  поэтому страницы показывают скелет, пока не придёт 'mp-ed-ready'.

  Источник: постановки UC01.13 (Confluence, выгрузка 04.10.2026) и BPMN 1.1–1.5 от 02.10.2026.

  Хранилище:
    localStorage['mp-ed-db']      { v, seq, apps:[…] } — заявки заявителя (черновики и поданные)
    localStorage['mp-ed-notifs']  [{ id, n, num, ok, at, read }] — push-уведомления ЕД (UC01.13.2.2)
    sessionStorage['mp-ed-session'] — несохранённая сессия мастера
    sessionStorage['mp-ed-fail']  '1' — сценарий «Техсбой» (панель «Прототип»)
  События window: 'mp-ed-change' — данные заявок изменились; 'mp-ed-notif-change' — уведомления.

  Сквозные правила (UC01.13 §4, UC01.13.2 §4):
    • этап и статус — разные поля; внутренние статусы ННЦРЗ заявителю не показываем (app.nn — только
      для панели «Прототип»);
    • новый шаг степпера всегда добавляется в конец, дата шага «Соответствие пункту 7» = подпись ЭЦП
      при подаче и больше не меняется;
    • таймеры считаются в рабочих днях РК (выходные и госпраздники — как в «Рабочем календаре»);
    • нумерация сквозная, 7 знаков с ведущими нулями, присваивается при создании (UC01.13.1.9);
      документы: SD-<тип>-<№ заявки>-<порядковый №>.

  Ветка «Замечания» (первичная экспертиза) описана только в UC01.13 §2.1 — отдельной постановки
  UC01.13.2.3.3 нет. Сделана как предложение: публичный статус «Направлены замечания», 10 рабочих
  дней на ответ (UC01.13 §2.2). В фильтр реестра этот статус не добавлен — ждёт согласования.
-->

  const EXT = {

  const pad = (n) => String(n).padStart(2, '0');

  const fmtDT = (ts) => ts == null ? '' : fmtD(ts) + ' ' + fmtT(ts);

    const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(s || '').trim());
    if(!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    if(d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;

    const t = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;

  const wdWord = (n) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'рабочий день' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'рабочих дня' : 'рабочих дней'; };
  const money = (n) => Math.round(n).toLocaleString('ru-RU') + ' ₸';
  const fileSize = (b) => b == null ? '' : b < 1024 ? b + ' Б' : b < 1048576 ? Math.round(b / 1024) + ' КБ' : (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' МБ';
  const ext = (name) => { const m = /\.([^.]+)$/.exec(name || ''); return m ? m[1].toLowerCase() : ''; };
  const checkFile = (f, kind) => {
    const list = EXT[kind === 'poa' || kind === 'dossier' ? 'doc' : kind];

    if(list.indexOf(e) === -1) return 'Недопустимый формат файла. Разрешены: ' + list.map(x => x.toUpperCase()).join(', ');

    if(f.size > lim * 1048576) return 'Файл больше ' + (lim >= 1024 ? lim / 1024 + ' ГБ' : lim + ' МБ');

  // ───────────────────────── хранилище ─────────────────────────
  const emit = () => { try { window.dispatchEvent(new CustomEvent('mp-ed-change')); } catch(e){} };
  const emitN = () => { try { window.dispatchEvent(new CustomEvent('mp-ed-notif-change')); } catch(e){} };
  let cache = null;
  const read = () => {
    if(cache) return cache;
    try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if(v && v.v === V && Array.isArray(v.apps)) { cache = v; return v; } } catch(e){}

    write(cache, true);
    return cache;
  };
  const write = (db, silent) => {
    cache = db;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){}
    if(!silent) emit();
  };
  const invalidate = () => { cache = null; };
  const readN = () => { try { const v = JSON.parse(localStorage.getItem(NKEY) || 'null'); if(Array.isArray(v)) return v; } catch(e){} return []; };
  const writeN = (list) => { try { localStorage.setItem(NKEY, JSON.stringify(list)); } catch(e){} emitN(); };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const list = () => read().apps.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0));
  const get = (num) => { const a = read().apps.find(x => x.num === num); return a ? clone(a) : null; };
  const put = (app, keepTime) => {
    const db = read();
    if(!keepTime) app.updated = Date.now();
    const i = db.apps.findIndex(x => x.num === app.num);
    if(i === -1) db.apps.push(app); else db.apps[i] = app;
    write(db);
    return app;
  };
  const remove = (num) => { const db = read(); db.apps = db.apps.filter(x => x.num !== num); write(db); };
  const nextNum = () => { const db = read(); db.seq = (db.seq || 0) + 1; write(db, true); return String(db.seq).padStart(7, '0'); };

  // ───────────────────────── форма заявки ─────────────────────────
  let rid = 0;
  const newReg = () => ({ id:'r' + Date.now().toString(36) + (rid++), num:'', country:'', regDate:'', expDate:'', perpetual:false, dose:null, conc:null });
  const blankForm = () => ({
    cat:'ls',
    a:{ position:'', phone:PROFILE.phone, fax:'', poaNum:'', poaIssued:'', poaValid:'', poaText:'', poaFiles:[] },
    s:{ ls:{}, mi:{} },
    regs:[ newReg() ],
    d:{},
  });
  const newApp = () => {
    const now = Date.now();
    return { num: nextNum(), status:'Черновик', created:now, updated:now, sentAt:null, form: blankForm(), steps:[], docSeq:0, saved:false };
  };

  // ───────────────────────── валидация мастера ─────────────────────────
  const PHONE_RE = /^\+[\d\s\-()]+$/;
  const phoneOk = (v) => { if(!PHONE_RE.test(v)) return false; const n = v.replace(/\D/g, '').length; return n >= 7 && n <= 15; };
  const filled = (v) => v != null && String(v).trim() !== '';
  const inDict = (dict, v) => DICT[dict].indexOf(String(v || '').trim()) !== -1;

  // step: 0 — Данные услуги, 1 — Сведения о заявителе, 2 — Заявление, 3 — Досье.
  // Возвращает список ошибок по порядку полей: [{ key, label, msg }]
  const validate = (form, step) => {
    const E = [];
    const err = (key, label, msg) => E.push({ key, label, msg });
    const t0 = today0();
    if(step === 0){
      if(form.cat !== 'ls' && form.cat !== 'mi') err('cat', 'Категория', 'Выберите категорию');
    }
    if(step === 1){
      const a = form.a;
      if(!filled(a.position)) err('a.position', 'Должность', 'Обязательное поле');
      if(filled(a.phone) && !phoneOk(a.phone.trim())) err('a.phone', 'Телефон', 'Пример: +7 701 123 45 67');
      if(filled(a.fax) && !phoneOk(a.fax.trim())) err('a.fax', 'Факс', 'Пример: +7 701 123 45 67');
      const started = filled(a.poaNum) || filled(a.poaIssued) || filled(a.poaValid) || filled(a.poaText) || a.poaFiles.length > 0;
      if(started){
        if(!filled(a.poaNum)) err('a.poaNum', '№ доверенности', 'Если заполнен блок доверенности — номер обязателен');
        if(!filled(a.poaIssued)) err('a.poaIssued', 'Дата выдачи', 'Обязательное поле');
        else { const d = parseD(a.poaIssued); if(!d) err('a.poaIssued', 'Дата выдачи', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() >= t0) err('a.poaIssued', 'Дата выдачи', 'Дата должна быть меньше текущей'); }
        if(!filled(a.poaValid)) err('a.poaValid', 'Срок действия', 'Обязательное поле');
        else { const d = parseD(a.poaValid); if(!d) err('a.poaValid', 'Срок действия', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() <= t0) err('a.poaValid', 'Срок действия', 'Дата должна быть больше текущей'); }
        if(!filled(a.poaText) && !a.poaFiles.length) err('a.poaDoc', 'Доверенность', 'Укажите текст доверенности или загрузите файл');
      }
    }
    if(step === 2){
      const cat = form.cat, s = form.s[cat] || {};
      SCHEMA[cat].forEach(sec => {
        if(sec.regs){
          form.regs.forEach((r, i) => {
            const L = 'Рег. номер ' + (i + 1) + ': ';
            if(!filled(r.num)) err('r.' + r.id + '.num', L + 'Регистрационный номер', 'Обязательное поле');
            if(!filled(r.country)) err('r.' + r.id + '.country', L + 'Производитель / Страна', 'Выберите значение из списка');
            else if(!inDict('country', r.country)) err('r.' + r.id + '.country', L + 'Производитель / Страна', 'Выберите значение из списка');
            if(!filled(r.regDate)) err('r.' + r.id + '.regDate', L + 'Дата регистрации', 'Обязательное поле');
            else { const d = parseD(r.regDate); if(!d) err('r.' + r.id + '.regDate', L + 'Дата регистрации', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() >= t0) err('r.' + r.id + '.regDate', L + 'Дата регистрации', 'Дата должна быть меньше текущей'); }
            if(!r.perpetual){
              if(!filled(r.expDate)) err('r.' + r.id + '.expDate', L + 'Дата истечения', 'Должно быть заполнено или «Дата истечения», или «Бессрочно»');
              else { const d = parseD(r.expDate); if(!d) err('r.' + r.id + '.expDate', L + 'Дата истечения', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() <= t0) err('r.' + r.id + '.expDate', L + 'Дата истечения', 'Дата должна быть больше текущей'); }
            }
            if(cat === 'ls'){
              if(r.dose != null && !filled(r.dose)) err('r.' + r.id + '.dose', L + 'Дозировка', 'Обязательное поле');
              if(r.conc){
                if(!filled(r.conc.val)) err('r.' + r.id + '.conc', L + 'Концентрация', 'Обязательное поле');
                if(!filled(r.conc.qty)) err('r.' + r.id + '.qty', L + 'Количество во вторичной упаковке', 'Обязательное поле');
              }
            }
          });
          return;
        }
        sec.fields.forEach(f => {
          const v = s[f.k];
          if(!filled(v)) err('s.' + f.k, f.label, f.type === 'combo' && !f.free ? 'Выберите значение из списка' : 'Обязательное поле');
          else if(f.type === 'combo' && !f.free && !inDict(f.dict, v)) err('s.' + f.k, f.label, 'Выберите значение из списка');
        });
      });
    }
    if(step === 3){
      dossier(form.cat).forEach(d => {
        if(!d.req) return;
        const v = form.d[d.k] || {};
        if(!filled(v.text) && !v.file) err('d.' + d.k, 'Раздел ' + d.n, 'Укажите текст или загрузите файл');
      });
    }
    return E;
  };
  const stepDone = (form, step) => validate(form, step).length === 0;

  // ───────────────────────── документы ─────────────────────────
  const docId = (app, type) => { app.docSeq = (app.docSeq || 0) + 1; return 'SD-' + type + '-' + app.num + '-' + pad(app.docSeq); };
  const nnDoc = (app, type, title, kb) => { const id = docId(app, type); return { title, id, name:id + '.pdf', size:kb * 1024 }; };
  const invoice = (app, pct) => ({ title:'Счёт на оплату ' + pct + '%', id:'', name:'Счёт на оплату ' + pct + '% № ' + app.num + '.pdf', size:(pct === 20 ? 96 : 98) * 1024, amount: PRICE * pct / 100 });

  // ───────────────────────── шаги и таймеры ─────────────────────────
  let sid = 0;
  const step = (o) => ({ id:'s' + (++sid) + Date.now().toString(36), at:null, timer:null, docs:[], ...o });
  const timer = (owner, wd, start, deadline) => ({ owner, wd, start, deadline: deadline != null ? deadline : addWD(start, wd), frozen:null, stopped:null });
  const last = (app) => app.steps[app.steps.length - 1];
  const lastOf = (app, kind) => { for(let i = app.steps.length - 1; i >= 0; i--) if(app.steps[i].kind === kind) return app.steps[i]; return null; };
  const remainOf = (t, now) => t.frozen != null ? t.frozen : (t.stopped != null ? Math.max(0, t.deadline - t.stopped) : t.deadline - now);
  const stopT = (st, at) => { if(st && st.timer && st.timer.stopped == null && st.timer.frozen == null) st.timer.stopped = at; };
  const freezeT = (st, at) => { if(st && st.timer){ st.timer.frozen = Math.max(0, st.timer.deadline - at); st.timer.stopped = at; } };

  // Активный таймер заявки: последний шаг с идущим или замороженным таймером
  const activeTimer = (app, now) => {
    now = now || Date.now();
    if(!app || !app.steps.length) return null;
    const final = ['Решение принято','Рассмотрение заблокировано','Отказано','Завершено','Формулярная комиссия'];
    if(final.indexOf(app.status) !== -1) return null;
    const s = last(app);
    let t = s.timer, src = s;
    // заявка у ННЦРЗ после несогласия заявителя — остаток таймера акта заморожен
    if(!t && s.kind === 'wait' && s.frozenFrom){ const f = app.steps.find(x => x.id === s.frozenFrom); if(f && f.timer) { t = f.timer; src = f; } }
    if(!t) return null;
    const remaining = remainOf(t, now);
    return { step:src, owner:t.owner, wd:t.wd, deadline:t.deadline, remaining, frozen: t.frozen != null, overdue: remaining <= 0 && t.frozen == null, text: fmtRemain(remaining) };
  };

  // Макроэтап для шкалы в карточке: 0 нулевая · 1 первичная · 2 профессиональная · 3 ФК
  const stage = (app) => {
    let st = 0;
    app.steps.forEach(s => {
      if(s.kind === 'pay80' || s.kind === 'avr' || (s.kind === 'wait' && (s.phase === 'prof' || s.phase === 'dispute2'))) st = Math.max(st, 2);
      else if(s.kind === 'wait' || s.kind === 'refuse' || s.kind === 'remarks') st = Math.max(st, 1);
      if(s.kind === 'fk') st = 3;
    });
    // оплата 80% — переход между первичной и профессиональной: этап «первичная» завершён
    const l = last(app);
    if(l && l.kind === 'pay80') st = 1;
    if(l && l.kind === 'wait' && l.phase === 'prof' && l.st === 'Подтверждение оплаты 80%') st = 1;
    return st;
  };

  // ───────────────────────── уведомления ─────────────────────────
  const notify = (app, ok, at) => {
    const n = readN();
    const max = n.reduce((m, x) => Math.max(m, +x.n || 0), 99);
    n.unshift({ id:'ed-' + app.num + '-' + at, n:String(max + 1), num:app.num, ok, at, read:false });
    writeN(n);
  };
  const markRead = (num) => { const n = readN(); let ch = false; n.forEach(x => { if(x.num === num && !x.read){ x.read = true; ch = true; } }); if(ch) writeN(n); };

  // ───────────────────────── машина состояний ─────────────────────────
  // Действия заявителя и решения ННЦРЗ / ФК. Каждое — чистая мутация app на момент at.
  const finish = (app, at, variant, extra) => { app.steps.push(step({ kind:'done', title:'Экспертиза завершена', st:'Завершено', at, variant, ...(extra || {}) })); };
  const block = (app, at, cause) => {
    app.status = 'Рассмотрение заблокировано';
    app.nn = { stage: app.nn ? app.nn.stage : '', status:'Рассмотрение заблокировано' };
    app.steps.push(step({ kind:'blocked', title:'Рассмотрение заблокировано', st:'Рассмотрение заблокировано', at, cause }));
  };
  const toPay80 = (app, at) => {
    app.steps.push(step({ kind:'pay80', title:'Платежное поручение 80%', st:'Ожидает оплаты 80%', issued:at, timer: timer('applicant', 5, at), docs:[ invoice(app, 80) ] }));
    app.status = 'Ожидает оплаты 80%';
    app.nn = { stage:'Первичная экспертиза', status:'Ожидает оплаты 80%' };
  };
  const toFk = (app, at, note) => {
    app.steps.push(step({ kind:'fk', title:'Формулярная комиссия', st:'Формулярная комиссия', at, sessions:[], note: note || '' }));
    app.status = 'Формулярная комиссия';
    app.nn = { stage:'Рассмотрение формулярной комиссией', status:'Формулярная комиссия' };
  };

  const ACT = {
    // ── заявитель ──
    submit(app, at, p){
      app.status = 'В работе'; app.sentAt = at; app.signer = p && p.signer || null;
      app.steps = [ step({ kind:'p7', title:'Соответствие пункту 7', st:'В работе', at }) ];
      app.nn = { stage:'Нулевая экспертиза', status:'Новая' };
    },
    pay20(app, at, p){
      const s = lastOf(app, 'pay20'); s.st = 'Завершено'; s.at = at; s.file = p.file; stopT(s, at);
      app.steps.push(step({ kind:'wait', phase:'primary', title:'Ожидание проверки', st:'Подтверждение оплаты 20%', at }));
      app.status = 'Подтверждение оплаты 20%'; app.nn = { stage:'Нулевая экспертиза', status:'Подтверждение оплаты 20%' };
    },
    pay80(app, at, p){
      const s = lastOf(app, 'pay80'); s.st = 'Завершено'; s.at = at; s.file = p.file; stopT(s, at);
      app.steps.push(step({ kind:'wait', phase:'prof', title:'Ожидание проверки', st:'Подтверждение оплаты 80%', at }));
      app.status = 'Подтверждение оплаты 80%'; app.nn = { stage:'Первичная экспертиза', status:'Подтверждение оплаты 80%' };
    },
    remarksReply(app, at, p){
      const s = lastOf(app, 'remarks'); s.st = 'Завершено'; s.at = at; s.reply = { text:p.text || '', files:p.files || [] }; stopT(s, at);
      const prev = app.steps.find(x => x.id === s.resumeFrom);
      const left = prev && prev.timer && prev.timer.frozen != null ? prev.timer.frozen : null;
      app.steps.push(step({ kind:'wait', phase:'primary', title:'Ожидание проверки', st:'В работе', at, timer: timer('nncrz', 5, at, left != null ? at + left : null) }));
      app.status = 'В работе'; app.nn = { stage:'Первичная экспертиза', status:'В работе' };
    },
    // Акт по отказу в рассмотрении (первичная) и АВР проф. экспертизы: круг 1 — решение + файл, круг 2 — только файл
    actReply(app, at, p){
      const s = last(app);
      s.st = 'Завершено'; s.at = at; s.reply = { agree: s.round === 1 ? !!p.agree : null, file:p.file };
      const isProf = s.kind === 'avr';
      if(s.round === 2 || p.agree){
        stopT(s, at);
        if(isProf){ toFk(app, at); }
        else { app.status = 'Отказано'; app.nn = { stage:'Первичная экспертиза', status:'Отказано' }; finish(app, at, 'refused'); notify(app, false, at); }
        return;
      }
      // не согласен — остаток таймера замораживается, заявка возвращается эксперту
      freezeT(s, at);
      app.steps.push(step({ kind:'wait', phase: isProf ? 'dispute2' : 'dispute1', title:'Ожидание проверки', st:'Отказ от решения', at, frozenFrom:s.id }));
      app.status = 'Отказ от решения'; app.nn = { stage: isProf ? 'Профессиональная экспертиза' : 'Первичная экспертиза', status:'Отказ от решения' };
    },

    // ── ННЦРЗ ──
    p7Yes(app, at){
      const s = lastOf(app, 'p7'); s.st = 'Завершено';
      app.status = 'Завершено'; app.result = 'p7'; app.nn = { stage:'Нулевая экспертиза', status:'Завершено' };
      finish(app, at, 'p7'); notify(app, true, at);
    },
    p7No(app, at){
      const s = lastOf(app, 'p7'); s.st = 'Завершено';
      app.steps.push(step({ kind:'pay20', title:'Платежное поручение 20%', st:'Ожидает оплаты 20%', issued:at, timer: timer('applicant', 5, at), docs:[ invoice(app, 20) ] }));
      app.status = 'Ожидает оплаты 20%'; app.nn = { stage:'Нулевая экспертиза', status:'Ожидает оплаты 20%' };
    },
    confirm20(app, at){
      const s = last(app); s.st = 'В работе'; s.timer = timer('nncrz', 5, at);
      app.status = 'В работе'; app.nn = { stage:'Первичная экспертиза', status:'В работе' };
    },
    remarks(app, at){
      const s = last(app); s.st = 'Завершено'; freezeT(s, at);
      const doc = nnDoc(app, 12, 'Сводный запрос (замечания)', 184);
      app.steps.push(step({ kind:'remarks', title:'Замечания ННЦРЗ', st:'Направлены замечания', issued:at, resumeFrom:s.id, timer: timer('applicant', 10, at), docs:[doc],
        items:[
          'Раздел досье 3: приведите перечень зарегистрированных аналогов с указанием лекарственной формы и дозировки по состоянию на дату подачи заявления.',
          'Раздел досье 5: приложите полный текст фармакоэкономического исследования, на которое дана ссылка, с переводом на русский язык.',
        ] }));
      app.status = 'Направлены замечания'; app.nn = { stage:'Первичная экспертиза', status:'Направлены замечания' };
    },
    recommend(app, at){ const s = last(app); s.st = 'Завершено'; stopT(s, at); toPay80(app, at); },
    refuse(app, at){
      const s = last(app); s.st = 'Завершено'; stopT(s, at);
      app.steps.push(step({ kind:'refuse', round:1, title:'Отказ в рассмотрении', st:'Направлен акт', issued:at, timer: timer('applicant', 10, at),
        docs:[ nnDoc(app, 17, 'Заключение первичной экспертизы (мотивированный отказ)', 356), nnDoc(app, 18, 'Акт выполненных работ', 142) ] }));
      app.status = 'Направлен акт'; app.nn = { stage:'Первичная экспертиза', status:'Направлен акт' };
    },
    confirm80(app, at){
      const s = last(app); s.st = 'В работе'; s.timer = timer('nncrz', 35, at);
      app.status = 'В работе'; app.nn = { stage:'Профессиональная экспертиза', status:'В работе' };
    },
    profDone(app, at){
      const s = last(app); s.st = 'Завершено'; stopT(s, at);
      app.steps.push(step({ kind:'avr', round:1, title:'АВР проф. экспертизы', st:'Направлен акт', issued:at, timer: timer('applicant', 10, at),
        docs:[ nnDoc(app, 14, 'Заключение профессиональной экспертизы', 1240), { title:'Сопроводительное письмо', id:'', name:'Сопроводительное письмо № ' + app.num + '.pdf', size:88 * 1024 }, nnDoc(app, 18, 'Акт выполненных работ', 142) ] }));
      app.status = 'Направлен акт'; app.nn = { stage:'Профессиональная экспертиза', status:'Направлен акт' };
    },
    disputeAccept(app, at){
      const s = last(app); s.st = 'Завершено';
      if(s.phase === 'dispute1'){ toPay80(app, at); return; }
      toFk(app, at, 'ННЦРЗ принял ваш мотивированный отказ и изменил заключение профессиональной экспертизы.');
      const fk = last(app); fk.docs = [ nnDoc(app, 14, 'Заключение профессиональной экспертизы (изменённое)', 1260) ];
    },
    disputeReject(app, at){
      const s = last(app); s.st = 'Завершено';
      const src = app.steps.find(x => x.id === s.frozenFrom);
      const left = src && src.timer ? src.timer.frozen : 0;
      const t = timer('applicant', src && src.timer ? src.timer.wd : 10, at, at + (left || 0));
      if(s.phase === 'dispute1'){
        app.steps.push(step({ kind:'refuse', round:2, title:'Отказ в рассмотрении', st:'Направлен акт', issued:at, timer:t,
          docs:[ nnDoc(app, 17, 'Заключение первичной экспертизы (повторное)', 362), nnDoc(app, 18, 'Акт выполненных работ', 142) ] }));
        app.nn = { stage:'Первичная экспертиза', status:'Направлен акт' };
      } else {
        app.steps.push(step({ kind:'avr', round:2, title:'АВР проф. экспертизы', st:'Направлен акт', issued:at, timer:t,
          docs:[ nnDoc(app, 14, 'Заключение профессиональной экспертизы (новое)', 1275), nnDoc(app, 18, 'Акт выполненных работ', 142) ] }));
        app.nn = { stage:'Профессиональная экспертиза', status:'Направлен акт' };
      }
      app.status = 'Направлен акт';
    },
    fkFailed(app, at){ const s = lastOf(app, 'fk'); s.sessions = (s.sessions || []).concat([{ at, held:false }]); },
    fkDecide(app, at, p){
      const s = lastOf(app, 'fk'); s.st = 'Решение принято'; s.sessions = (s.sessions || []).concat([{ at, held:true }]);
      app.status = 'Решение принято'; app.include = !!p.include;
      app.nn = { stage:'Рассмотрение формулярной комиссией', status:'Решение принято' };
      finish(app, at, 'fk', { docs:[ { title:'Протокол Формулярной комиссии (обезличенный)', id:'', name:'protocol_№' + app.num + '_2.pdf', size:214 * 1024 } ] });
      notify(app, !!p.include, at);
    },
    fkInclude(app, at){ ACT.fkDecide(app, at, { include:true }); },
    fkExclude(app, at){ ACT.fkDecide(app, at, { include:false }); },

    // ── система: истёк срок на стороне заявителя ──
    timeout(app, at){
      const s = last(app);
      if(!s || !s.timer || s.timer.owner !== 'applicant') return;
      s.st = 'Срок истёк'; s.timer.stopped = s.timer.deadline; s.expired = true;
      if(s.kind === 'pay20'){ app.status = 'Завершено'; app.result = 'unpaid'; app.nn = { stage:'Нулевая экспертиза', status:'Завершено' }; finish(app, at, 'unpaid20'); return; }

    mk('0000110', 'ls', 'Джардинс', 4300, [ sub(4300), ['p7No', 4250], ['pay20', 4230, F('ПП_20.pdf', 150)], ['confirm20', 4200], ['recommend', 4100], ['pay80', 4080, F('ПП_80.pdf', 160)], ['confirm80', 4000], ['profDone', 2400], ['actReply', 2350, { agree:true, file:{ name:'АВР подписанный.pdf', size:188 * 1024 } }], ['fkInclude', 2] ]);

    mk('0000102', 'mi', 'Accu-Chek Performa', 2400, [ sub(2400), ['p7No', 2350], ['pay20', 2330, F('ПП_20.pdf', 150)], ['confirm20', 2300], ['recommend', 2200], ['timeout', 1900] ]);
    mk('0000101', 'ls', 'Метформин-Тева', 3000, [ sub(3000), ['p7Yes', 2950] ]);
    mk('0000099', 'mi', 'Vasofix Safety', 3600, [ sub(3600), ['p7No', 3550], ['timeout', 3400] ]);

    // уведомления по итоговым решениям демо-заявок (UC01.13.2.2): свежее — непрочитанное
    try {
      const n = [
        { id:'ed-0000110', n:'103', num:'0000110', ok:true,  at:H(2),    read:false },

  }
  const reset = () => { cache = null; try { localStorage.removeItem(KEY); sessionStorage.removeItem(SKEY); } catch(e){} const db = seed(); write(db); emitN(); };

  // ───────────────────────── сессия мастера и «Техсбой» ─────────────────────────
  const session = {
    get(){ try { return JSON.parse(sessionStorage.getItem(SKEY) || 'null'); } catch(e){ return null; } },

    clear(){ try { sessionStorage.removeItem(SKEY); } catch(e){} },

  const fail = () => { try { return sessionStorage.getItem(FKEY) === '1'; } catch(e){ return false; } };
  const setFail = (on) => { try { if(on) sessionStorage.setItem(FKEY, '1'); else sessionStorage.removeItem(FKEY); } catch(e){} emit(); };
  const FAIL_MSG = 'Система недоступна, обратитесь в техническую поддержку';

  // Публичная сводка заявки для реестра и шапки карточки
  const summary = (app) => {

class Component extends DCLogic {
  constructor(props){
    super(props);
    window.mpEd = ED;
  }
  componentDidMount(){
    window.mpEd = ED;
    try { ED.tick(); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-ed-ready')); } catch(e){}
    this._t = setInterval(() => { try { ED.tick(); } catch(e){} }, 1000);
    // другая вкладка изменила данные — сбрасываем кэш и оповещаем страницу
    this._st = (e) => {
      if(e.key === ED.KEY){ ED.invalidate(); ED.emit(); }
      if(e.key === ED.NKEY){ try { window.dispatchEvent(new CustomEvent('mp-ed-notif-change')); } catch(x){} }
    };
    window.addEventListener('storage', this._st);
  }
  componentWillUnmount(){ clearInterval(this._t); window.removeEventListener('storage', this._st); }
  renderVals(){ return {}; }
}
</script>
