<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<!--
  Личный кабинет гражданина → Профиль.
  Постановка «Подготовить дизайн профиля гражданина» (18.11.2026, docs/tz/2026-11-18-profil-grazhdanina.md):
    • страница открывается пунктом «Перейти в профиль» меню ФИО в шапке (Header, кабинет гражданина)
      и по ФИО в карточке меню кабинета (CitizenNav);
    • полное ФИО — без сокращений, длинное переносится на несколько строк;
    • номер телефона и адрес регистрации (прописки) — только просмотр (замок с подсказкой);
    • электронная почта — просмотр, добавление («Не указана» → «Добавить») и изменение — прямо в строке:
      поле, «Отмена» / «Сохранить», Enter / Esc, сообщение о некорректном формате, тост об успехе;
    • фото профиля — просмотр, загрузка и замена; без фото — инициалы. Окно «Изменение фото профиля» общее
      с меню кабинета (CitizenNav): событие window `mp-avatar-edit`, хранение `mp-avatar`, событие `mp-avatar-change`.
  Хранение почты — localStorage `mp-citizen-email` (нет ключа — демо-адрес, пустая строка — «Не указана»).
  Панель «Прототип»: ФИО обычное / длинное (sessionStorage `mp-citizen-fio`, событие `mp-citizen-change`),
  почта указана / не указана, фото — сброс, сохранение фото — успешно / ошибка (`mp-avatar-scn`).
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{
    --primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;
    --n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n700:#20232D;--n900:#0A0D14;
    --green:#38C793;--green-l:#EFFAF6;--green-d:#176448;
    --red:#DF1C41;--red-l:#FDEDF0;--red-d:#710E21;
    --stroke:#E2E4E9;--bg:#F6F8FA;
    --sh-xs:0 1px 2px rgba(10,13,20,.03);--sh-lg:0 16px 32px -12px rgba(10,13,20,.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--bg);-webkit-font-smoothing:antialiased;}
  @keyframes mp-fade{from{opacity:0}to{opacity:1}}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes mp-spin{to{transform:rotate(360deg)}}

  /* Раскладка кабинета гражданина — как на соседних страницах */
  .pf-wrap{padding:28px 32px 80px;}
  @media (max-width:1536px){ .pf-wrap{padding:24px 24px 80px;} }
  .pf-crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--n400);margin-bottom:24px;}
  .pf-crumbs a{color:var(--n400);text-decoration:none;border-radius:4px;}
  .pf-crumbs a:hover{color:var(--primary);}
  .lk-grid{display:grid;grid-template-columns:clamp(272px,18vw,300px) minmax(0,1fr);gap:24px;align-items:start;}
  @media (max-width:1536px){ .lk-grid{gap:20px;} }
  .cn-host{position:sticky;top:90px;}
  .pf-main{min-width:0;display:flex;flex-direction:column;gap:16px;animation:mp-fade .2s ease;}
  .pf-title{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em;margin:0;}

  .pf-card{background:var(--n0);border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-xs);overflow:hidden;}

  /* Кто вошёл: фото + полное ФИО */
  .pf-hero{display:flex;align-items:center;gap:24px;padding:24px;}
  .pf-ava{position:relative;width:112px;height:112px;flex:0 0 auto;padding:0;border:none;border-radius:50%;background:none;cursor:pointer;font-family:inherit;}
  .pf-ava-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--primary-lighter);box-shadow:0 0 0 4px var(--primary-lighter);display:flex;align-items:center;justify-content:center;transition:box-shadow .15s;}
  .pf-ini{font-size:38px;line-height:1;font-weight:600;letter-spacing:-.01em;color:var(--primary);}
  /* Наведение на фото — затемнение и значок камеры; отдельной кнопки-значка нет: действие одно — кнопка под ФИО */
  .pf-ava-ov{position:absolute;inset:0;border-radius:50%;background:rgba(10,13,20,0);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .pf-ava-ov i{opacity:0;transition:opacity .15s;}
  .pf-ava:hover .pf-ava-in{box-shadow:0 0 0 4px var(--primary-light);}
  .pf-ava:hover .pf-ava-ov,.pf-ava:focus-visible .pf-ava-ov{background:rgba(10,13,20,.38);}
  .pf-ava:hover .pf-ava-ov i,.pf-ava:focus-visible .pf-ava-ov i{opacity:1;}
  .pf-ava:focus-visible{outline:none;}
  .pf-ava:focus-visible .pf-ava-in{box-shadow:0 0 0 2px #fff,0 0 0 6px var(--primary-light);}
  .pf-who{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
  .pf-fio{margin:0;max-width:34ch;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em;}
  /* Перенос — между фамилией, именем и отчеством, а не на дефисе двойного имени; внутри части — только если она шире строки */
  .pf-fio span{display:inline-block;max-width:100%;overflow-wrap:anywhere;}
  .pf-who .pf-btn{margin-top:12px;}

  /* Строки: поле → значение → действие. Колонка значения ограничена, чтобы действие стояло рядом
     со значением и на широком мониторе, а не у дальнего края карточки */
  .pf-row{display:grid;grid-template-columns:minmax(200px,240px) minmax(0,600px) auto;justify-content:start;align-items:center;gap:8px 24px;min-height:68px;padding:12px 24px;border-top:1px solid var(--stroke);transition:background .12s;}
  .pf-row.mail:hover{background:var(--n50);}   /* ховер — только у строки, которую можно изменить */
  .pf-row.edit{align-items:start;background:#FAFAFF;padding-top:16px;padding-bottom:16px;}
  .pf-row.edit .pf-lbl{min-height:40px;}
  .pf-lbl{display:flex;align-items:center;gap:10px;font-size:14px;line-height:20px;font-weight:500;color:var(--n500);}
  .pf-lbl i{font-size:18px;color:var(--n400);flex:0 0 auto;}
  .pf-val{min-width:0;font-size:15px;line-height:22px;font-weight:500;color:var(--n900);overflow-wrap:anywhere;}
  .pf-val.empty{color:var(--n500);font-weight:400;}
  .pf-act{display:flex;align-items:center;justify-content:flex-end;gap:8px;}
  .pf-lock{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--n400);font-size:18px;cursor:help;transition:background .12s,color .12s;}
  .pf-lock:hover{background:var(--n100);color:var(--n600);}

  /* Поле почты */
  .pf-field{display:flex;flex-direction:column;gap:6px;max-width:440px;}
  .pf-input{width:100%;height:40px;padding:0 12px;border:1px solid var(--n300);border-radius:10px;background:var(--n0);font-family:inherit;font-size:15px;color:var(--n900);outline:none;transition:border-color .12s,box-shadow .12s;}
  .pf-input::placeholder{color:var(--n400);}
  .pf-input:hover{border-color:var(--n400);}
  .pf-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-lighter);}
  .pf-input[aria-invalid="true"]{border-color:var(--red);}
  .pf-input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px var(--red-l);}
  .pf-input:disabled{background:var(--n50);color:var(--n500);}
  .pf-err{display:flex;align-items:flex-start;gap:6px;font-size:13px;line-height:18px;color:var(--red);animation:mp-fade .15s ease;}
  .pf-err i{font-size:16px;line-height:18px;flex:0 0 auto;}

  .pf-btn{height:36px;padding:0 14px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s,color .12s,box-shadow .12s;}
  .pf-btn i{font-size:17px;}
  .pf-btn.sec{border:1px solid var(--stroke);background:var(--n0);color:var(--n600);box-shadow:0 1px 2px rgba(82,88,102,.06);}
  .pf-btn.sec:hover:not(:disabled){background:var(--n100);border-color:var(--n300);color:var(--n900);}
  .pf-btn.sec i{color:var(--n400);}
  .pf-btn.pri{height:40px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:600;}
  .pf-btn.pri:hover:not(:disabled){background:var(--primary-dark);border-color:var(--primary-dark);}
  .pf-btn.pri[data-busy="true"]{cursor:progress;opacity:.85;}
  .pf-row.edit .pf-btn.sec{height:40px;}
  .pf-btn:disabled{cursor:not-allowed;}
  .pf-spin{display:inline-block;animation:mp-spin .8s linear infinite;}
  .pf-btn:focus-visible,.pf-lock:focus-visible,.pf-crumbs a:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}

  .pf-toast{position:fixed;right:28px;bottom:96px;z-index:80;display:flex;align-items:center;gap:10px;max-width:380px;padding:12px 16px 12px 14px;background:var(--n0);border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);font-size:14px;line-height:20px;font-weight:500;animation:mp-slidein .2s ease;}
  .pf-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  .hm-tip{position:fixed;z-index:300;max-width:300px;padding:8px 11px;border-radius:10px;background:var(--n900);color:#fff;font:500 13px/1.45 'Inter',system-ui,sans-serif;letter-spacing:-.003em;box-shadow:0 12px 28px -10px rgba(10,13,20,.45);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .14s ease,transform .14s ease;}
  .hm-tip.on{opacity:1;transform:none;}

  /* Панель «Прототип» (как на «Услугах») */
  .pf-pp{position:fixed;left:20px;bottom:20px;z-index:50;width:220px;background:#fff;border:1px solid var(--stroke);border-radius:14px;box-shadow:0 16px 32px -12px rgba(10,13,20,.12);overflow:hidden;font-family:'Inter',sans-serif;}
  .pf-pp.open{width:260px;}
  .pp-head{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border:none;background:var(--n50);font-family:inherit;cursor:pointer;text-align:left;}
  .pp-head:hover{background:var(--n100);}
  .pp-cap{margin:10px 0 2px;font-size:11px;line-height:14px;font-weight:600;color:var(--n400);}
  .pp-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .pp-btn{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--stroke);background:#fff;font-family:inherit;font-size:12px;line-height:16px;font-weight:500;color:var(--n600);cursor:pointer;text-align:left;display:flex;align-items:center;gap:7px;transition:background .15s,border-color .15s;}
  .pp-btn:hover:not(:disabled){background:var(--n50);border-color:var(--n300);}
  .pp-btn[aria-checked="true"]{background:var(--primary-lighter);border-color:var(--primary-light);color:var(--primary-darker);}
  .pp-btn:disabled{opacity:.5;cursor:default;}
  .pp-head:focus-visible,.pp-btn:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}

  /* Мониторы: строки свободнее */
  @media (min-width:1800px){
    .pf-hero{padding:28px 32px;}
    .pf-row{padding-left:32px;padding-right:32px;}
  }
  @media (max-width:1024px){
    .pf-wrap{padding:20px 24px 80px;}
    .lk-grid{grid-template-columns:minmax(0,1fr);gap:20px;}
    .cn-host{position:static;}
  }
  @media (max-width:720px){
    .pf-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lbl act" "val val";gap:4px 12px;padding:14px 16px;}
    .pf-row .pf-lbl{grid-area:lbl;}
    .pf-row .pf-val,.pf-row .pf-field{grid-area:val;}
    .pf-row .pf-act{grid-area:act;}
    .pf-row.edit{grid-template-areas:"lbl lbl" "val val" "act act";}
    .pf-row.edit .pf-lbl{min-height:0;}
    .pf-row.edit .pf-act{justify-content:stretch;margin-top:8px;}
    .pf-row.edit .pf-act .pf-btn{flex:1;}
    .pf-field{max-width:none;}
  }
  @media (max-width:640px){
    .pf-wrap{padding:16px 16px 80px;}
    .pf-crumbs{margin-bottom:16px;}
    .pf-title{font-size:20px;line-height:28px;}
    .pf-hero{gap:16px;padding:20px 16px;}
    .pf-ava{width:80px;height:80px;}
    .pf-ini{font-size:28px;}
    .pf-fio{font-size:20px;line-height:26px;}
    .pf-wrap{padding-bottom:120px;}   /* последняя строка не прячется под кнопкой AI-помощника */
    .pf-toast{left:16px;right:16px;bottom:80px;max-width:none;}
    .pf-pp{left:16px;bottom:16px;}
  }
  @media (prefers-reduced-motion:reduce){ .pf-toast,.pf-err,.pf-main{animation:none;} }
</style>
</helmet>

<div style="min-height:100vh;">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="wide" hint-size="100%,70px"></dc-import></div>

  <div class="pf-wrap">
    <nav class="pf-crumbs" aria-label="Навигационная цепочка">
      <a href="Портал Минздрава - Главная.dc.html">Главная</a><i class="ri-arrow-right-s-line" aria-hidden="true"></i>
      <a href="Личный кабинет.dc.html">Личный кабинет</a><i class="ri-arrow-right-s-line" aria-hidden="true"></i>
      <span aria-current="page" style="color:var(--n700);font-weight:500;">Профиль</span>
    </nav>

    <div class="lk-grid">
      <aside class="cn-host">
        <dc-import name="CitizenNav" active="profile" hint-size="300px,460px"></dc-import>
      </aside>

      <main class="pf-main">
        <h1 class="pf-title">Профиль</h1>

        <section class="pf-card" aria-label="Данные профиля">
          <!-- Фото и полное ФИО -->
          <div class="pf-hero">
            <button type="button" class="pf-ava" onClick="{{ editPhoto }}" aria-haspopup="dialog" aria-label="{{ photoAct }}" data-tip="{{ photoAct }}">
              <span class="pf-ava-in">
                <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ photoBg }}"></span></sc-if>
                <sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}"><span class="pf-ini" aria-hidden="true">{{ initials }}</span></sc-if>
                <span class="pf-ava-ov" aria-hidden="true"><i class="ri-camera-line"></i></span>
              </span>
            </button>
            <div class="pf-who">
              <h2 class="pf-fio"><span>{{ fioLast }}</span> <span>{{ fioFirst }}</span> <span>{{ fioMiddle }}</span></h2>
              <button type="button" class="pf-btn sec" onClick="{{ editPhoto }}" aria-haspopup="dialog"><i class="{{ photoIcon }}" aria-hidden="true"></i>{{ photoAct }}</button>
            </div>
          </div>

          <!-- Номер телефона — только просмотр -->
          <div class="pf-row">
            <div class="pf-lbl"><i class="ri-phone-line" aria-hidden="true"></i>Номер телефона</div>
            <div class="pf-val" style="font-variant-numeric:tabular-nums;">+7 701 123 45 67</div>
            <div class="pf-act"><span class="pf-lock" tabIndex="0" role="img" aria-label="{{ lockTip }}" data-tip="{{ lockTip }}"><i class="ri-lock-line" aria-hidden="true"></i></span></div>
          </div>

          <!-- Электронная почта — просмотр, добавление, изменение -->
          <div class="{{ mailRowCls }}">
            <div class="pf-lbl"><i class="ri-mail-line" aria-hidden="true"></i><label for="pf-mail" id="pf-mail-lbl">Электронная почта</label></div>
            <sc-if value="{{ mailView }}" hint-placeholder-val="{{ true }}">
              <div class="{{ mailValCls }}">{{ mailText }}</div>
              <div class="pf-act">
                <button type="button" class="pf-btn sec" ref="{{ mailBtnRef }}" onClick="{{ startEdit }}" aria-label="{{ mailBtnAria }}"><i class="{{ mailBtnIcon }}" aria-hidden="true"></i>{{ mailBtn }}</button>
              </div>
            </sc-if>
            <sc-if value="{{ mailEdit }}" hint-placeholder-val="{{ false }}">
              <div class="pf-field">
                <input id="pf-mail" ref="{{ inputRef }}" class="pf-input" type="email" inputMode="email" autoComplete="email" spellCheck="false" maxLength="254"
                       placeholder="name@mail.kz" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onMailKey }}"
                       aria-invalid="{{ mailInvalid }}" aria-describedby="{{ errId }}" disabled="{{ saving }}">
                <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
                  <div class="pf-err" id="pf-mail-err" role="alert"><i class="ri-error-warning-fill" aria-hidden="true"></i>{{ errText }}</div>
                </sc-if>
              </div>
              <div class="pf-act">
                <button type="button" class="pf-btn sec" onClick="{{ cancelEdit }}" disabled="{{ saving }}">Отмена</button>
                <button type="button" class="pf-btn pri" onClick="{{ saveMail }}" disabled="{{ saving }}" data-busy="{{ saving }}">
                  <sc-if value="{{ saving }}" hint-placeholder-val="{{ false }}"><i class="ri-loader-4-line pf-spin" aria-hidden="true"></i></sc-if>{{ saveLbl }}
                </button>
              </div>
            </sc-if>
          </div>

          <!-- Адрес регистрации — только просмотр -->
          <div class="pf-row">
            <div class="pf-lbl"><i class="ri-map-pin-line" aria-hidden="true"></i>Адрес регистрации</div>
            <div class="pf-val">г. Астана, район Есиль, ул. Сыганак, д. 18, кв. 42</div>
            <div class="pf-act"><span class="pf-lock" tabIndex="0" role="img" aria-label="{{ lockTip }}" data-tip="{{ lockTip }}"><i class="ri-lock-line" aria-hidden="true"></i></span></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div class="pf-toast" role="status"><i class="ri-checkbox-circle-fill" style="font-size:22px;color:var(--green);flex:0 0 auto;" aria-hidden="true"></i>{{ toast }}</div>
  </sc-if>
  <span class="pf-sr" aria-live="polite">{{ live }}</span>

  <!-- Панель прототипа -->
  <div class="{{ ppCls }}" role="region" aria-label="Панель прототипа">
    <button type="button" class="pp-head" onClick="{{ ppToggle }}" aria-expanded="{{ ppOpen }}">
      <i class="ri-flask-line" style="font-size:16px;color:var(--n400);" aria-hidden="true"></i>
      <span style="flex:1;font-size:11px;line-height:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--n500);">Прототип</span>
      <i class="{{ ppChev }}" style="font-size:18px;color:var(--n400);" aria-hidden="true"></i>
    </button>
    <sc-if value="{{ ppOpen }}" hint-placeholder-val="{{ false }}">
      <div style="padding:4px 12px 12px;border-top:1px solid var(--stroke);">
        <sc-for list="{{ ppGroups }}" as="g" hint-placeholder-count="3">
          <div class="pp-cap">{{ g.label }}</div>
          <div class="pp-row" role="radiogroup" aria-label="{{ g.label }}">
            <sc-for list="{{ g.opts }}" as="x" hint-placeholder-count="2">
              <button type="button" class="pp-btn" role="radio" aria-checked="{{ x.on }}" onClick="{{ x.onClick }}">{{ x.label }}</button>
            </sc-for>
          </div>
        </sc-for>
        <div class="pp-cap">Фото профиля</div>
        <button type="button" class="pp-btn" onClick="{{ ppNoPhoto }}" disabled="{{ ppNoPhotoOff }}" style="width:100%;"><i class="ri-user-3-line" style="font-size:15px;" aria-hidden="true"></i>Сбросить: фото не загружено</button>
      </div>
    </sc-if>
  </div>

  <dc-import name="Assistant" hint-size="1px,1px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
// Авторизованный гражданин (демо) — то же в Header и CitizenNav.
// Длинное ФИО — проверка переноса: sessionStorage mp-citizen-fio = long, событие mp-citizen-change
const ME_FIO = {
  base: { last:'Сейтжанова', first:'Аружан', middle:'Маратовна' },
  long: { last:'Нурмухамбетова-Сейтжанова', first:'Аружан-Айгерим', middle:'Мухамедкаримовна' },
};
const FIO_KEY = 'mp-citizen-fio', FIO_EVT = 'mp-citizen-change';
const readFioKind = () => { try { return sessionStorage.getItem(FIO_KEY) === 'long' ? 'long' : 'base'; } catch(e){ return 'base'; } };

const AVA_KEY = 'mp-avatar', AVA_EVT = 'mp-avatar-change', AVA_SCN = 'mp-avatar-scn';
const readPhoto = () => { try { return localStorage.getItem(AVA_KEY) || ''; } catch(e){ return ''; } };

// Почта: нет ключа — демо-адрес; пустая строка — «Не указана»
const MAIL_KEY = 'mp-citizen-email', MAIL_DEMO = 'a.seitzhanova@mail.kz';
const readMail = () => { try { const v = localStorage.getItem(MAIL_KEY); return v == null ? MAIL_DEMO : v; } catch(e){ return MAIL_DEMO; } };
const writeMail = (v) => { try { localStorage.setItem(MAIL_KEY, v); } catch(e){} };
const MAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
const ERR = { empty:'Введите электронную почту', format:'Неверный формат электронной почты. Пример: name@mail.kz' };
const checkMail = (v) => !v ? 'empty' : (!MAIL_RE.test(v) || v.length > 254 ? 'format' : '');

// Подсказки data-tip — как на соседних страницах кабинета
const installTips = () => {
  if(window.__hmTips) return; window.__hmTips = true;
  let el = null, cur = null, timer = null;
  const hide = () => { clearTimeout(timer); cur = null; if(el) el.classList.remove('on'); };
  const show = (tg) => {
    const txt = tg.getAttribute('data-tip'); if(!txt || cur !== tg || !document.body.contains(tg)) return;
    if(!el){ el = document.createElement('div'); el.className = 'hm-tip'; el.setAttribute('role', 'tooltip'); document.body.appendChild(el); }
    el.textContent = txt; el.classList.remove('on'); el.style.left = '0px'; el.style.top = '0px';
    const r = tg.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
    el.style.top = (r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8) + 'px';
    requestAnimationFrame(() => el && el.classList.add('on'));
  };
  const pick = (e) => (e.target && e.target.closest) ? e.target.closest('[data-tip]') : null;
  document.addEventListener('mouseover', (e) => { const tg = pick(e); if(tg === cur) return; hide(); if(tg && tg.getAttribute('data-tip')){ cur = tg; timer = setTimeout(() => show(tg), 380); } });
  document.addEventListener('focusin', (e) => { const tg = pick(e); hide(); if(tg && tg.matches(':focus-visible')){ cur = tg; show(tg); } });
  document.addEventListener('focusout', hide);
  document.addEventListener('mousedown', hide);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') hide(); });
  window.addEventListener('scroll', hide, { passive:true, capture:true });
};

class Component extends DCLogic {
  inputRef = React.createRef();
  mailBtnRef = React.createRef();
  state = { fioKind:readFioKind(), photo:readPhoto(), mail:readMail(), editing:false, draft:'', err:'', tried:false, saving:false,
            toast:'', live:'', ppOpen:false, scn:(() => { try { return sessionStorage.getItem(AVA_SCN) || 'ok'; } catch(e){ return 'ok'; } })() };

  componentDidMount(){
    try { installTips(); } catch(e){}
    this._onPhoto = () => this.setState({ photo: readPhoto() });
    window.addEventListener(AVA_EVT, this._onPhoto);
    this._onStorage = (e) => { if(e.key === AVA_KEY) this._onPhoto(); if(e.key === MAIL_KEY && !this.state.editing) this.setState({ mail: readMail() }); };
    window.addEventListener('storage', this._onStorage);
    // Уход со страницы с несохранённой почтой — предупреждение браузера
    this._unload = (e) => { const s = this.state; if(s.editing && s.draft.trim() !== s.mail){ e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', this._unload);
  }
  componentWillUnmount(){
    window.removeEventListener(AVA_EVT, this._onPhoto);
    window.removeEventListener('storage', this._onStorage);
    window.removeEventListener('beforeunload', this._unload);
    clearTimeout(this._toastT); clearTimeout(this._saveT);
  }

  showToast(t){
    clearTimeout(this._toastT);
    this.setState({ toast:t, live:t });
    this._toastT = setTimeout(() => this.setState({ toast:'' }), 3500);
  }
  focusLater(ref){ setTimeout(() => { if(ref.current) ref.current.focus(); }, 0); }

  // ---------- Почта ----------
  startEdit(){
    this.setState({ editing:true, draft:this.state.mail, err:'', tried:false, saving:false, toast:'' }, () => {
      setTimeout(() => { const el = this.inputRef.current; if(el){ el.focus(); el.select(); } }, 0);
    });
  }
  cancelEdit(){
    clearTimeout(this._saveT);
    this.setState({ editing:false, draft:'', err:'', tried:false, saving:false });
    this.focusLater(this.mailBtnRef);
  }
  saveMail(){
    const s = this.state;
    if(s.saving) return;
    const v = s.draft.trim();
    const err = checkMail(v);
    if(err){
      this.setState({ err, tried:true });   // сообщение с role="alert" диктор читает сам
      this.focusLater(this.inputRef);
      return;
    }
    if(v === s.mail){ this.cancelEdit(); return; }   // ничего не изменилось — просто закрываем
    const added = !s.mail;
    this.setState({ saving:true, err:'' });
    this._saveT = setTimeout(() => {
      writeMail(v);
      this.setState({ mail:v, editing:false, draft:'', saving:false, tried:false });
      this.showToast(added ? 'Электронная почта добавлена' : 'Электронная почта изменена');
      this.focusLater(this.mailBtnRef);
    }, 700);
  }

  // ---------- Прототип ----------
  setFio(kind){
    try { if(kind === 'long') sessionStorage.setItem(FIO_KEY, 'long'); else sessionStorage.removeItem(FIO_KEY); } catch(e){}
    try { window.dispatchEvent(new CustomEvent(FIO_EVT)); } catch(e){}
    this.setState({ fioKind:kind });
  }
  setMailDemo(has){
    clearTimeout(this._saveT);
    const v = has ? MAIL_DEMO : '';
    writeMail(v);
    this.setState({ mail:v, editing:false, draft:'', err:'', tried:false, saving:false });
  }
  setScn(id){ try { sessionStorage.setItem(AVA_SCN, id); } catch(e){} this.setState({ scn:id }); }

  renderVals(){
    const s = this.state;
    const me = ME_FIO[s.fioKind];
    const hasMail = !!s.mail;
    const errShown = s.err ? ERR[s.err] : '';
    const opt = (label, on, onClick) => ({ label, on:String(on), onClick });

    return {
      fioLast: me.last, fioFirst: me.first, fioMiddle: me.middle,
      initials: (me.last[0] + me.first[0]).toUpperCase(),
      // фото фоном и стилем-объектом: <img src="{{ }}"> браузер запрашивает до подстановки (404),
      // а строку стилей рантайм делит по «;», которая есть в data:-URL
      photoBg: s.photo ? { position:'absolute', inset:0, background:`#EEF2FF url("${s.photo}") center/cover no-repeat` } : {},
      hasPhoto: !!s.photo, noPhoto: !s.photo,
      photoAct: s.photo ? 'Изменить фото' : 'Загрузить фото',
      photoIcon: s.photo ? 'ri-image-edit-line' : 'ri-upload-2-line',
      editPhoto: () => { try { window.dispatchEvent(new CustomEvent('mp-avatar-edit')); } catch(e){} },

      lockTip: 'Только просмотр: данные получены из государственных информационных систем',

      mailRowCls: 'pf-row mail' + (s.editing ? ' edit' : ''),
      mailView: !s.editing, mailEdit: s.editing,
      mailText: hasMail ? s.mail : 'Не указана',
      mailValCls: 'pf-val' + (hasMail ? '' : ' empty'),
      mailBtn: hasMail ? 'Изменить' : 'Добавить',
      mailBtnIcon: hasMail ? 'ri-pencil-line' : 'ri-add-line',
      mailBtnAria: hasMail ? 'Изменить электронную почту' : 'Добавить электронную почту',
      mailBtnRef: this.mailBtnRef, inputRef: this.inputRef,
      startEdit: () => this.startEdit(),
      cancelEdit: () => this.cancelEdit(),
      saveMail: () => this.saveMail(),
      draft: s.draft,
      // после первой попытки сохранить проверяем по ходу ввода — ошибка исчезает, как только адрес исправлен
      onDraft: (e) => { const v = e.target.value; this.setState({ draft:v, err: s.tried ? checkMail(v.trim()) : '' }); },
      onMailKey: (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); this.saveMail(); }
        else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); this.cancelEdit(); }
      },
      hasErr: !!errShown, errText: errShown, mailInvalid: String(!!errShown),
      errId: errShown ? 'pf-mail-err' : undefined,
      saving: s.saving, saveLbl: s.saving ? 'Сохранение…' : 'Сохранить',

      hasToast: !!s.toast, toast: s.toast, live: s.live,

      ppOpen: s.ppOpen, ppCls: s.ppOpen ? 'pf-pp open' : 'pf-pp',
      ppChev: s.ppOpen ? 'ri-arrow-down-s-line' : 'ri-arrow-up-s-line',
      ppToggle: () => this.setState({ ppOpen: !s.ppOpen }),
      ppGroups: [
        { label:'ФИО', opts:[ opt('Обычное', s.fioKind === 'base', () => this.setFio('base')), opt('Длинное', s.fioKind === 'long', () => this.setFio('long')) ] },
        { label:'Электронная почта', opts:[ opt('Указана', hasMail, () => this.setMailDemo(true)), opt('Не указана', !hasMail, () => this.setMailDemo(false)) ] },
        { label:'Сохранение фото', opts:[ opt('Успешно', s.scn !== 'fail', () => this.setScn('ok')), opt('Ошибка', s.scn === 'fail', () => this.setScn('fail')) ] },
      ],
      ppNoPhoto: () => { try { localStorage.removeItem(AVA_KEY); window.dispatchEvent(new CustomEvent(AVA_EVT)); } catch(e){} },
      ppNoPhotoOff: !s.photo,
    };
  }
}
</script>
</body>
</html>
