<body>
<!--
  Государственные услуги — отдельная страница портала с каталогом госуслуг МЗ РК
  (постановки «Добавление раздела „Государственные услуги“ на главную страницу портала»,
  «Доработка раздела „Государственные услуги“», замечания аналитика от 13–14.10.2026,
  постановка «Государственные услуги для бизнеса» от 28.10.2026).

  Набор категорий зависит от типа пользователя (роль в шапке, localStorage `mp-role`):
    «Гражданам»    — только «Медицинская помощь»;
    «Бизнесу»      — блок «Услуги»: «Все услуги», «Фармацевтика», «Лицензирование и аккредитация»;
    «Медперсоналу» — раздела нет: адрес с этой ролью и переключение на неё в шапке уводят на главную.

  Постановка для бизнеса (28.10.2026):
    п. 1–2  справа — название выбранной категории, поиск и перечень; поиск — по наименованию
            в пределах выбранной категории («Все услуги» — по всему каталогу); пусто — «Услуги не найдены»;
    п. 3    композитная услуга «Единого окна» открывает окно «Выберите вид услуги» (группа
            «Лекарственные средства» — четыре вида; группа «Лекарственные средства и медицинские изделия» —
            профессиональные экспертизы АЛО и ЕД; один вариант из шести, «Далее» активна только после выбора);
    п. 4    «Далее» передаёт вид услуги в кабинет бизнеса: Услуги.dc.html?svc=<safety|reg|price|knf>,
            кабинет сам открывает сценарий оформления; АЛО и ЕД — сразу паспорт услуги
            (Паспорт услуги АЛО / ЕД.dc.html). Без профиля «Бизнес» — через «Вход» с возвратом.
            В блоке «Услуги» слева счётчиков нет (замечание 28.10.2026) — число услуг только у заголовка перечня.
            «Отмена» и крестик закрывают окно, категория и запрос остаются; при новом открытии выбор сброшен.
            Внешние услуги (eGov.kz, «Е-лицензирование») — в новой вкладке; в перечне справа у них
            адрес сайта со стрелкой ↗, у услуги кабинета — фирменный чип «Кабинет бизнеса».

  Адрес:  Государственные услуги.dc.html?for=<citizens|business>&cat=<all|med|pharma|lic>&q=<запрос>
          все параметры необязательны; без `for` берётся роль из шапки. Категория и запрос пишутся
          в адрес — «Назад» из кабинета возвращает ту же выборку.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
  :root{--primary:#4D42E9;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;--n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n700:#20232D;--n900:#0A0D14;--stroke:#E2E4E9;--bg:#F6F8FA;--sh-xs:0 1px 2px rgba(10,13,20,.03);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--bg);-webkit-font-smoothing:antialiased;}
  @keyframes gs-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes gs-fade{from{opacity:0}to{opacity:1}}
  @keyframes gs-pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes gs-up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

  .gs-page{--hdr:73px;}
  .gs-wrap{max-width:1240px;margin:0 auto;padding:20px 40px 72px;}
  .gs-top{display:flex;align-items:center;gap:12px;margin-bottom:20px;min-height:36px;}
  .gs-back{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border:1px solid var(--stroke);border-radius:10px;background:#fff;color:var(--n600);font-size:14px;font-weight:500;text-decoration:none;flex:0 0 auto;transition:background .12s,border-color .12s,color .12s;}
  .gs-back:hover{background:var(--n100);border-color:var(--n300);color:var(--n900);}
  .gs-crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;margin:0;padding:0;list-style:none;font-size:13px;line-height:20px;color:var(--n400);}
  .gs-crumbs li{display:inline-flex;align-items:center;gap:6px;}
  .gs-crumbs a{color:var(--n400);text-decoration:none;border-radius:4px;transition:color .12s;}
  .gs-crumbs a:hover{color:var(--primary);text-decoration:underline;text-underline-offset:3px;}

  .gs-hero{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:24px;}
  .gs-title{display:flex;align-items:center;gap:14px;}
  .gs-hero-ico{width:48px;height:48px;border-radius:14px;background:var(--primary-lighter);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .gs-h1{margin:0;font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.02em;}
  .gs-lead{margin:10px 0 0;font-size:15px;line-height:22px;color:var(--n500);max-width:800px;}
  .gs-aud{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;margin-bottom:12px;border-radius:999px;background:#fff;border:1px solid var(--primary-light);color:var(--primary);font-size:12px;line-height:16px;font-weight:600;}

  .gs-grid{display:grid;grid-template-columns:372px minmax(0,1fr);gap:24px;align-items:start;}
  .gs-card{background:#fff;border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-xs);}

  /* Блок «Услуги» — категории */
  .gs-aside{position:sticky;top:calc(var(--hdr) + 20px);}
  .gs-nav{padding:12px;}
  .gs-eyebrow{margin:0;padding:4px 8px 8px;font-size:11.5px;line-height:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);}
  .gs-cats{display:flex;flex-direction:column;gap:2px;}
  .gs-cat{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border:none;border-radius:12px;background:transparent;font-family:inherit;text-align:left;cursor:pointer;transition:background .12s,color .12s;}
  .gs-cat:hover{background:var(--n100);}
  .gs-cat[aria-current="true"],.gs-cat[aria-current="true"]:hover{background:var(--primary-lighter);}
  .gs-cat-sep{height:1px;margin:6px 10px;background:var(--stroke);}

  /* Перечень */
  .gs-main{min-width:0;container-type:inline-size;}
  .gs-head{position:sticky;top:var(--hdr);z-index:5;padding:20px 24px 16px;background:#fff;border-radius:16px 16px 0 0;transition:box-shadow .15s;}
  .gs-head[data-stuck="true"]{border-radius:0;box-shadow:0 1px 0 var(--stroke),0 8px 16px -12px rgba(10,13,20,.14);}
  .gs-h2{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em;}
  .gs-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 8px;border-radius:999px;background:var(--n100);color:var(--n500);font-size:12px;line-height:1;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .gs-search{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 14px;border:1px solid var(--stroke);border-radius:12px;background:#fff;transition:border-color .12s,box-shadow .12s;}
  .gs-search:hover{border-color:var(--n300);}
  .gs-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-lighter);}
  .gs-search input{flex:1;min-width:0;height:100%;border:none;outline:none;background:none;font-family:inherit;font-size:14px;color:var(--n900);}
  .gs-search input::placeholder{color:var(--n400);}
  .gs-search input::-webkit-search-cancel-button{display:none;}
  .gs-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;margin-right:6px;border:1px solid var(--stroke);border-radius:6px;background:var(--n50);color:var(--n400);font-size:12px;font-weight:600;flex:0 0 auto;}
  .gs-search:focus-within .gs-kbd{display:none;}
  .gs-list{padding:0 12px 16px;animation:gs-in .16s ease;}
  .gs-group-head{display:flex;align-items:center;gap:8px;padding:14px 12px 6px;}
  .gs-group + .gs-group{margin-top:6px;border-top:1px solid var(--n100);}

  /* Строка услуги: № · наименование · куда ведёт */
  .gs-row{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"num name side";align-items:start;column-gap:12px;row-gap:6px;padding:12px;border:none;border-radius:12px;background:transparent;font-family:inherit;text-align:left;text-decoration:none;color:var(--n900);cursor:pointer;transition:background .12s;}
  .gs-row:hover{background:var(--n100);}
  .gs-num{grid-area:num;font-size:13px;line-height:20px;font-weight:500;color:var(--n400);font-variant-numeric:tabular-nums;text-align:right;}
  .gs-name{grid-area:name;font-size:14px;line-height:20px;font-weight:500;overflow-wrap:anywhere;hyphens:auto;transition:color .12s;}
  .gs-row:hover .gs-name{color:var(--primary-darker);}
  .gs-side{grid-area:side;display:inline-flex;align-items:center;gap:4px;height:20px;white-space:nowrap;}
  /* внешняя услуга — нейтральный адрес сайта и ↗ */
  .gs-site{color:var(--n400);font-size:13px;line-height:20px;font-weight:500;transition:color .12s;}
  .gs-site i{font-size:16px;line-height:20px;transition:transform .12s;}
  .gs-row:hover .gs-site{color:var(--primary);}
  .gs-row:hover .gs-site i{transform:translate(1px,-1px);}
  /* услуга кабинета бизнеса — фирменный чип */
  .gs-chip{height:24px;margin-top:-2px;padding:0 6px 0 8px;border-radius:999px;background:var(--primary-lighter);color:var(--primary-darker);font-size:12px;line-height:16px;font-weight:600;transition:background .12s,color .12s;}
  .gs-chip i{font-size:14px;}
  .gs-chip .gs-go{font-size:16px;color:var(--primary);transition:transform .12s;}
  .gs-row:hover .gs-chip{background:var(--primary);color:#fff;}
  .gs-row:hover .gs-chip .gs-go{color:#fff;transform:translateX(2px);}
  /* узкая колонка перечня (планшет, телефон) — «куда ведёт» под наименованием */
  @container (max-width:600px){
    .gs-row{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"num name" ". side";padding:12px 10px;column-gap:10px;}
    .gs-side{justify-self:start;}
    .gs-chip{margin-top:0;}
  }

  .gs-btn{transition:background .12s,color .12s;}
  .gs-btn:hover{background:var(--n100) !important;color:var(--n600) !important;}
  .gs-link{transition:background .12s,border-color .12s;}
  .gs-link:hover{background:var(--primary-lighter) !important;border-color:var(--primary-light) !important;}
  .gs-cat:focus-visible,.gs-row:focus-visible,.gs-btn:focus-visible,.gs-link:focus-visible,.gs-back:focus-visible,.gs-crumbs a:focus-visible,.gs-x:focus-visible,.gs-b:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .gs-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* Окно «Выберите вид услуги» */
  .gs-ov{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gs-ov-bg{position:absolute;inset:0;background:rgba(10,13,20,.24);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:gs-fade .15s ease;}
  .gs-dlg{position:relative;width:100%;max-width:600px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#fff;border-radius:20px;box-shadow:0 24px 48px -12px rgba(14,18,27,.24);animation:gs-pop .18s ease;overflow:hidden;}
  .gs-dlg:focus{outline:none;}
  .gs-dlg form{display:flex;flex-direction:column;min-height:0;margin:0;}
  .gs-dlg-h{display:flex;align-items:center;gap:12px;padding:18px 16px 16px 24px;border-bottom:1px solid var(--stroke);flex:0 0 auto;}
  .gs-dlg-t{flex:1;min-width:0;margin:0;font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em;}
  .gs-x{width:36px;height:36px;border:none;border-radius:10px;background:transparent;color:var(--n500);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .12s,color .12s;}
  .gs-x:hover{background:var(--n100);color:var(--n900);}
  .gs-dlg-b{overflow-y:auto;padding:20px 24px 24px;overscroll-behavior:contain;}
  /* при прокрутке списка видов — тени у шапки и подвала окна (видно, что вариантов больше, чем помещается) */
  .gs-dlg-b{background:linear-gradient(#fff 30%,rgba(255,255,255,0)) top/100% 40px no-repeat local,linear-gradient(rgba(255,255,255,0),#fff 70%) bottom/100% 40px no-repeat local,radial-gradient(farthest-side at 50% 0,rgba(10,13,20,.10),rgba(10,13,20,0)) top/100% 12px no-repeat scroll,radial-gradient(farthest-side at 50% 100%,rgba(10,13,20,.10),rgba(10,13,20,0)) bottom/100% 12px no-repeat scroll;background-color:#fff;}
  .gs-fs{margin:0;padding:0;border:none;min-width:0;}
  .gs-fs + .gs-fs{margin-top:24px;}
  .gs-grp{display:flex;align-items:center;gap:10px;padding:0;margin:0 0 12px;font-size:14px;line-height:20px;font-weight:600;color:var(--n900);}
  .gs-grp-ico{width:32px;height:32px;border-radius:9px;background:#EFFAF6;color:#176448;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .gs-opts{display:flex;flex-direction:column;gap:8px;}
  .gs-opt{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--stroke);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s,box-shadow .12s;}
  .gs-opt:hover{border-color:var(--n300);background:var(--n50);}
  .gs-opt[data-on="true"],.gs-opt[data-on="true"]:hover{border-color:var(--primary);background:var(--primary-lighter);box-shadow:0 0 0 1px var(--primary) inset;}
  .gs-opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none;}
  .gs-opt:has(input:focus-visible){box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .gs-opt[data-on="true"]:has(input:focus-visible){box-shadow:0 0 0 1px var(--primary) inset,0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .gs-dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;background:#fff;border:1.5px solid var(--n300);transition:border .12s;}
  .gs-opt:hover .gs-dot{border-color:var(--n400);}
  .gs-opt[data-on="true"] .gs-dot{border:6px solid var(--primary);}
  .gs-opt-t{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:var(--n900);overflow-wrap:anywhere;}
  /* короткое имя услуги: полные наименования АЛО и ЕД совпадают в начале */
  .gs-tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;margin-right:8px;border-radius:6px;background:#EBFAFF;color:#164564;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.02em;vertical-align:top;}
  .gs-opt[data-on="true"] .gs-tag{background:#fff;}
  .gs-dlg-f{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--stroke);flex:0 0 auto;}
  .gs-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;font-family:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s,box-shadow .12s;}
  .gs-b-sec{border:1px solid var(--stroke);background:#fff;color:var(--n600);box-shadow:0 1px 2px rgba(82,88,102,.06);}
  .gs-b-sec:hover{background:var(--n100);border-color:var(--n300);color:var(--n900);}
  .gs-b-pri{min-width:120px;padding:0 12px 0 18px;border:none;background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(77,66,233,.12);}
  .gs-b-pri:hover:not([disabled]){background:var(--primary-darker);}
  .gs-b-pri[disabled]{background:var(--n100);color:var(--n300);box-shadow:none;cursor:not-allowed;}

  /* Большие мониторы 24–27″ — шире колонка и крупнее строки */
  @media (min-width:1600px){
    .gs-wrap{max-width:1440px;}
    .gs-grid{grid-template-columns:384px minmax(0,1fr);gap:32px;}
    .gs-name,.gs-cat-label{font-size:15px !important;line-height:22px;}
    .gs-num{line-height:22px;}
    .gs-side{height:22px;}
    .gs-dlg{max-width:680px;}
  }
  /* Планшет */
  @media (max-width:1023px){
    .gs-wrap{padding:16px 24px 64px;}
    .gs-grid{grid-template-columns:248px minmax(0,1fr);gap:16px;}
    .gs-nav{padding:8px;}
    .gs-cat{gap:10px;}
    .gs-head{padding:16px 20px 14px;}
    .gs-list{padding:0 8px 12px;}
    .gs-h1{font-size:26px;line-height:34px;}
  }
  /* Мобильный: категории — чипы над перечнем (их не больше трёх — переносим, а не прячем за прокрутку) */
  @media (max-width:719px){
    .gs-wrap{padding:12px 16px 48px;}
    .gs-top{margin-bottom:16px;}
    .gs-crumbs{display:none;}
    .gs-hero{margin-bottom:16px;}
    .gs-title{gap:12px;}
    .gs-aud{margin-bottom:10px;}
    .gs-lead{margin-top:8px;}
    .gs-hero-ico{width:40px;height:40px;border-radius:11px;}
    .gs-hero-ico i{font-size:22px !important;}
    .gs-h1{font-size:22px;line-height:30px;}
    .gs-lead{font-size:14px;line-height:20px;}
    .gs-grid{grid-template-columns:minmax(0,1fr);gap:12px;}
    .gs-aside{position:static;}
    .gs-nav{padding:0;background:none;border:none;box-shadow:none;}
    .gs-nav[data-single="true"]{display:none;}
    .gs-eyebrow{padding:0 2px 8px;}
    .gs-cat-sep{display:none;}
    .gs-cats{flex-direction:row;flex-wrap:wrap;gap:8px;}
    .gs-cat{width:auto;flex:0 0 auto;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--stroke);border-radius:999px;background:#fff;}
    .gs-cat[aria-current="true"],.gs-cat[aria-current="true"]:hover{border-color:var(--primary-light);}
    .gs-cat-ico{display:none !important;}
    .gs-cat-label{white-space:nowrap;font-size:13.5px !important;}
    .gs-card{border-radius:14px;}
    .gs-head{padding:14px 14px 12px;border-radius:14px 14px 0 0;}
    .gs-h2{font-size:16px;line-height:24px;margin-bottom:12px;}
    .gs-list{padding:0 6px 10px;}
    .gs-search input{font-size:16px;}
    .gs-kbd{display:none;}
    /* окно — нижний лист на всю ширину */
    .gs-ov{align-items:flex-end;padding:0;}
    .gs-dlg{max-width:none;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);border-radius:20px 20px 0 0;animation:gs-up .2s ease;}
    .gs-dlg-h{padding:16px 12px 14px 20px;}
    .gs-dlg-b{padding:16px 20px 20px;}
    .gs-opt{padding:14px;}
    .gs-dlg-f{display:grid;grid-template-columns:1fr 1fr;padding:12px 20px calc(16px + env(safe-area-inset-bottom));}
    .gs-b-pri{min-width:0;}
  }
  @media (hover:none){ .gs-kbd{display:none;} }
  @media (prefers-reduced-motion:reduce){
    .gs-list,.gs-dlg,.gs-ov-bg{animation:none;}
    html{scroll-behavior:auto !important;}
  }
</style>
</helmet>
<div class="gs-page" ref="{{ pageRef }}" style="min-height:100vh;display:flex;flex-direction:column;">
  <div ref="{{ hdrRef }}" style="position:sticky;top:0;z-index:40;"><dc-import name="Header" hint-size="100%,73px"></dc-import></div>

  <main style="flex:1;">
    <div class="gs-wrap">

function norm(s){ return String(s).toLowerCase().replace(/ё/g, 'е'); }
function tokensOf(q){ return norm(q).trim().split(/\s+/).filter(Boolean); }
function matchAll(it, tokens){ return tokens.every(tk => it.norm.includes(tk)); }

// Разбивает наименование на части с подсветкой всех вхождений слов запроса
function highlight(name, tokens){
  if(!tokens.length) return [{ t:name, style:'' }];
  const low = norm(name), mark = new Array(name.length).fill(false);
  tokens.forEach(tk => { let i = low.indexOf(tk); while(i !== -1){ for(let k = i; k < i + tk.length; k++) mark[k] = true; i = low.indexOf(tk, i + tk.length); } });
  const parts = []; let cur = '', on = mark[0];
  for(let i = 0; i < name.length; i++){
    if(mark[i] !== on){ parts.push({ t:cur, on }); cur = ''; on = mark[i]; }
    cur += name[i];
  }
  parts.push({ t:cur, on });
  return parts.filter(p => p.t).map(p => ({ t:p.t, style: p.on ? 'background:#EEF2FF;color:#312D86;border-radius:3px;box-shadow:0 0 0 1px #EEF2FF;' : '' }));
}

function plural(n){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return 'услуга';
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'услуги';
  return 'услуг';
}

    let role = 'citizens', cat = '', q = '', fromUrl = false, medical = false;
    try {
      const p = new URLSearchParams(location.search);
      const f = p.get('for');
      if(AUD[f]){ role = f; fromUrl = true; }
      else { const r = localStorage.getItem('mp-role'); if(AUD[r]) role = r; medical = isMedical(f) || (!f && isMedical(r)); }
      cat = p.get('cat') || '';
      q = p.get('q') || '';
    } catch(e){}
    // У «Медперсоналу» раздела нет: старые ссылки и закладки ведут на главную раздела
    if(medical) try { location.replace(HOME); } catch(e){}
    this._syncRole = fromUrl;
    this.state = { role, cat, q, live:'', dlg:false, kind:null };
  }

  componentDidMount(){
    // Шапка должна показывать ту же роль, что пришла в адресе
    if(this._syncRole){
      let cur = null; try { cur = localStorage.getItem('mp-role'); } catch(e){}
      if(cur !== this.state.role) setTimeout(() => this.broadcastRole(this.state.role), 0);
    }
    // Переключение на «Медперсоналу» в шапке — раздела у этой роли нет, возвращаемся на главную
    this._onRole = (e) => {
      const r = e && e.detail;
      if(isMedical(r)){ try { location.replace(HOME); } catch(err){} return; }
      if(AUD[r] && r !== this.state.role) this.applyRole(r);
    };
    window.addEventListener('mp-role-change', this._onRole);

    // «/» — к поиску (как на большинстве сервисов), если фокус не в поле ввода и окно закрыто
    this._onKey = (e) => {
      if(e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || this.state.dlg) return;
      const t = e.target, tag = t && t.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      e.preventDefault(); this.focusSearch(true);
    };
    window.addEventListener('keydown', this._onKey);

    // Высота шапки → отступ для «липких» блоков
    this._measure = () => {
      const h = this.hdrRef.current, p = this.pageRef.current;
      if(h && p) p.style.setProperty('--hdr', Math.round(h.getBoundingClientRect().height) + 'px');
    };
    this._measure();
    window.addEventListener('resize', this._measure);
    if(window.ResizeObserver && this.hdrRef.current){ this._ro = new ResizeObserver(this._measure); this._ro.observe(this.hdrRef.current); }

    // Тень у поиска, когда он «прилип» под шапкой
    // (атрибут ставим напрямую: без перерисовки компонента на каждый кадр прокрутки)
    this._onScroll = () => {
      this._measure();
      const head = document.querySelector('.gs-head'), sent = head && head.previousElementSibling;
      if(!sent) return;
      const stuck = sent.getBoundingClientRect().top < this.hdrH() - 1 ? 'true' : 'false';
      if(head.getAttribute('data-stuck') !== stuck) head.setAttribute('data-stuck', stuck);
    };
    window.addEventListener('scroll', this._onScroll, { passive:true });
    this._onScroll();

    this.syncUrl();
  }
  componentWillUnmount(){
    window.removeEventListener('mp-role-change', this._onRole);
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('resize', this._measure);
    window.removeEventListener('scroll', this._onScroll);
    if(this._ro) this._ro.disconnect();
    this.unlockScroll();
  }
  // Рантайм dc не передаёт prevState — сравниваем с последним записанным в адрес
  componentDidUpdate(){ this.syncUrl(); }

  // Доступные роли категории и активная категория (скрытую выбрать нельзя)
  allowed(role){ return AUD[role || this.state.role].cats.map(catById); }
  activeCat(){ const a = this.allowed(); return a.find(c => c.id === this.state.cat) || a[0]; }
  // Услуги категории; «Все услуги» — весь каталог раздела
  itemsOf(c){ return c.id === 'all' ? this.allowed().filter(x => x.id !== 'all').flatMap(x => x.items) : c.items; }

  // Адрес страницы отражает раздел, категорию и запрос — ссылкой можно поделиться,
  // а «Назад» из кабинета возвращает ту же выборку
  syncUrl(){
    const key = this.state.role + ':' + this.activeCat().id + ':' + this.state.q.trim();
    if(key === this._urlKey) return;
    this._urlKey = key;
    try {
      const p = new URLSearchParams(location.search);
      p.set('for', this.state.role); p.set('cat', this.activeCat().id);
      if(this.state.q.trim()) p.set('q', this.state.q.trim()); else p.delete('q');
      history.replaceState(history.state, '', location.pathname + '?' + p.toString());
    } catch(e){}
  }
  broadcastRole(r){
    try { localStorage.setItem('mp-role', r); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-role-change', { detail:r })); } catch(e){}
  }
  applyRole(r){
    const keep = AUD[r].cats.includes(this.state.cat) ? this.state.cat : '';
    this.setState({ role:r, cat:keep, dlg:false, live:`Показаны государственные услуги раздела «${AUD[r].label}»` });
    this.unlockScroll();
  }

  hdrH(){ const h = this.hdrRef.current; return h ? h.getBoundingClientRect().height : 0; }
  // Подтягивает начало перечня под шапку, если пользователь успел прокрутить ниже
  revealList(){
    const sec = this.sentinelRef.current || document.querySelector('.gs-sentinel'); if(!sec) return;
    const top = sec.getBoundingClientRect().top - this.hdrH();
    if(top < 0) window.scrollTo({ top: window.scrollY + top - 8, behavior:'auto' });
  }
  focusSearch(select){
    const i = this.inputRef.current; if(!i) return;
    const r = i.getBoundingClientRect();
    i.focus({ preventScroll: r.top > this.hdrH() && r.bottom < window.innerHeight });
    if(select && i.value) i.select();
  }
  rows(){ const l = this.listRef.current; return l ? [...l.querySelectorAll('.gs-row')] : []; }
  pickCat(c){
    if(this.activeCat().id === c.id) return;
    const n = this.hits(c).length;
    this.setState({ cat:c.id, live:`${c.label}: ${n} ${plural(n)}` });
    this.revealList();
  }
  hits(c){ const tk = tokensOf(this.state.q); return tk.length ? this.itemsOf(c).filter(it => matchAll(it, tk)) : this.itemsOf(c); }

  // ───────── окно «Выберите вид услуги» ─────────
  openDlg(e){
    this._opener = (e && e.currentTarget) || document.activeElement;
    // При каждом открытии выбор сброшен (постановка, п. 4)
    this.setState({ dlg:true, kind:null });
    this.lockScroll();
    setTimeout(() => {
      const d = this.dlgRef.current; if(!d) return;
      const first = d.querySelector('input[type="radio"]');
      (first || d).focus({ preventScroll:true });
    }, 30);
  }
  closeDlg(){
    if(!this.state.dlg) return;
    this.setState({ dlg:false, kind:null });
    this.unlockScroll();
    const o = this._opener; this._opener = null;
    setTimeout(() => { if(o && document.contains(o)) o.focus({ preventScroll:true }); }, 0);
  }
  goNext(e){
    if(e && e.preventDefault) e.preventDefault();
    const k = this.state.kind; if(!k) return;
    const target = kindHref(k);
    // Без профиля «Бизнес» — вход с возвратом прямо в выбранный сценарий; «Вернуться» без входа — сюда же
    if(signedBiz()){ location.href = target; return; }
    const back = PAGE + '?for=business&cat=' + this.activeCat().id;
    location.href = 'Вход.dc.html?profile=business&return=' + encodeURIComponent(target) + '&back=' + encodeURIComponent(back);
  }
  onDlgKey(e){
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); this.closeDlg(); return; }
    if(e.key !== 'Tab') return;
    // Фокус не выходит из окна
    const d = this.dlgRef.current; if(!d) return;
    // У группы радиокнопок одна остановка табуляции — выбранная, а без выбора первая
    const radios = [...d.querySelectorAll('input[type="radio"]')];
    const stop = radios.find(r => r.checked) || radios[0];
    const f = [...d.querySelectorAll('button:not([disabled]), input[type="radio"]')].filter(el => el.type !== 'radio' || el === stop);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && (document.activeElement === first || document.activeElement === d)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  lockScroll(){
    if(this._bodyCss) return;
    const sb = window.innerWidth - document.documentElement.clientWidth;
    this._bodyCss = [document.body.style.overflow, document.body.style.paddingRight];
    document.body.style.overflow = 'hidden';
    if(sb > 0) document.body.style.paddingRight = sb + 'px';
  }
  unlockScroll(){
    if(!this._bodyCss) return;
    [document.body.style.overflow, document.body.style.paddingRight] = this._bodyCss; this._bodyCss = null;
  }

  // Категории: стрелки ↑/↓ (←/→ на телефоне) переключают категорию, Home/End — крайние
  onCatsKey(e){
    const keys = ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Home', 'End'];
    if(!keys.includes(e.key)) return;
    const btns = [...(this.catsRef.current ? this.catsRef.current.querySelectorAll('button.gs-cat') : [])];
    if(!btns.length) return;
    e.preventDefault();
    let i = btns.indexOf(document.activeElement);
    if(e.key === 'Home') i = 0;
    else if(e.key === 'End') i = btns.length - 1;
    else i = (i + (e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length;
    btns[i].focus(); btns[i].click();
  }
  // Из поиска ↓ — к первой услуге; Esc очищает запрос
  onInputKey(e){
    if(e.key === 'Escape' && this.state.q){ e.preventDefault(); this.setState({ q:'' }); return; }
    if(e.key === 'ArrowDown'){ const r = this.rows(); if(r.length){ e.preventDefault(); r[0].focus(); } }
  }
  // По перечню — стрелками; ↑ с первой строки возвращает в поиск
  onListKey(e){
    if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const r = this.rows(), i = r.indexOf(document.activeElement);
    if(i === -1) return;
    e.preventDefault();
    if(e.key === 'ArrowDown' && i < r.length - 1) r[i + 1].focus();
    else if(e.key === 'ArrowUp') (i > 0 ? r[i - 1] : this.inputRef.current).focus();
  }

  goBack(e){
    // Пришли с портала — возвращаемся туда же (с прокруткой и состоянием), иначе — на главную
    let same = false;
    try { same = !!document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1; } catch(err){}
    if(same){ e.preventDefault(); history.back(); }
  }

  renderVals(){
    const s = this.state;
    const aud = AUD[s.role];
    const allowed = this.allowed();
    const cur = this.activeCat();
    const tokens = tokensOf(s.q);
    const searching = tokens.length > 0;
    const hasAllCat = allowed.some(c => c.id === 'all');

    // Блок «Услуги» — без счётчиков: число услуг выбранной категории есть у заголовка перечня справа
    const cats = allowed.map((c, i) => {
      const active = cur.id === c.id;
      return {
        label:c.label, icon:c.icon,
        current: active ? 'true' : 'false',
        sepAfter: c.id === 'all' && i < allowed.length - 1,
        onClick: () => this.pickCat(c),
        style: `color:${active ? '#312D86' : '#31353F'};`,
        iconWrap: `width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:${active && c.id === 'all' ? '#fff' : c.tone[0]};color:${c.id === 'all' && active ? '#4D42E9' : c.tone[1]};`,
        labelStyle: `flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:${active ? 600 : 500};`,
      };
    });

    const biz = signedBiz();
    let num = 0;
    const toItems = (items) => items.map(it => {
      num += 1;
      const parts = highlight(it.name, tokens);
      if(it.portal){
        const where = biz ? 'Откроется в кабинете бизнеса' : 'Откроется в кабинете бизнеса после входа под профилем «Бизнес»';
        return { num, parts, isPortal:true, isExt:false, href:'', site:'',
          onOpen: (e) => this.openDlg(e), hint: where, aria: `${it.name}. Выбор вида услуги, ${where.toLowerCase()}` };
      }
      return { num, parts, isPortal:false, isExt:true, href: it.href, site: it.site,
        onOpen: null, hint: `Откроется на ${it.site} в новой вкладке`,
        aria: `${it.name} — откроется на ${it.site} в новой вкладке` };
    });

    // «Все услуги» — каталог по группам; категория — её перечень. Поиск — в пределах выбранного
    const src = cur.id === 'all' ? allowed.filter(c => c.id !== 'all') : [cur];
    const parts = src.map(c => ({ c, items: searching ? c.items.filter(it => matchAll(it, tokens)) : c.items })).filter(x => x.items.length);
    const groups = parts.map(({ c, items }) => ({
      showHead: cur.id === 'all' && parts.length > 1,
      label: c.label, icon: c.icon, count: items.length, aria: c.label,
      iconStyle: `font-size:16px;color:${c.tone[1]};`,
      items: toItems(items),
    }));
    const total = parts.reduce((n, x) => n + x.items.length, 0);
    // Пусто в категории — подсказываем, что в «Все услуги» совпадения есть
    const allHits = searching && !total && hasAllCat && cur.id !== 'all' ? this.hits(ALL).length : 0;

    return {
      pageRef: this.pageRef, hdrRef: this.hdrRef, headRef: this.headRef, sentinelRef: this.sentinelRef,
      inputRef: this.inputRef, listRef: this.listRef, catsRef: this.catsRef, dlgRef: this.dlgRef,
      audLabel: aud.label, audFor: aud.for, audIcon: aud.icon, lead: aud.lead,
      backHref: HOME, goBack: (e) => this.goBack(e),
      cats, single: allowed.length === 1 ? 'true' : 'false',
      onCatsKey: (e) => this.onCatsKey(e),
      listTitle: cur.label,
      listCount: total,
      listCountLabel: searching ? `Найдено: ${total} ${plural(total)}` : `${total} ${plural(total)}`,
      groups,
      searchAria: `Поиск по наименованию услуги в категории «${cur.label}»`,
      q: s.q, hasQ: !!s.q, showKbd: !s.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      onInputKey: (e) => this.onInputKey(e),
      onListKey: (e) => this.onListKey(e),
      clearQ: () => { this.setState({ q:'' }); this.focusSearch(false); },
      empty: searching && total === 0,
      hasAll: allHits > 0, allHits,
      toAll: () => { this.setState({ cat:'all', live:`Все услуги: найдено ${allHits} ${plural(allHits)}` }); this.revealList(); },
      liveText: searching ? (total ? `Найдено: ${total} ${plural(total)}` : 'Услуги не найдены') : s.live,

      dlg: s.dlg,
      closeDlg: () => this.closeDlg(),
      onDlgKey: (e) => this.onDlgKey(e),
      goNext: (e) => this.goNext(e),
      nextDisabled: !s.kind,
      kindGroups: KIND_GROUPS.map(g => ({ label:g.label, icon:g.icon,
        icoStyle: `background:${g.tone[0]};color:${g.tone[1]};`,
        kinds: g.kinds.map(k => ({ id:k.id, label:k.label, hasTag: !!k.tag, tag: k.tag || '', tagHint: k.tagHint || '',
          on: s.kind === k.id ? 'true' : 'false', checked: s.kind === k.id,
          onPick: () => this.setState({ kind:k.id }) })) })),
    };
  }
}
</script>
</body>
</html>
