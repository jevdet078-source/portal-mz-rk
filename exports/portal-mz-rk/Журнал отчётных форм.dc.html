<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  «Журнал отчётных форм» первого руководителя медорганизации.
  На текущем этапе — заглушка: название раздела и сообщение «Раздел находится в разработке»
  (функционал журнала, фильтрация и работа со статусами — отдельная ПЗ, там же согласование ЭЦП).
  Слева — меню раздела (OrgReportsNav), доступ — как у «Администрирования отчётности».
-->
<x-dc>
<helmet>
<style>
  body{ margin:0; background:#fff; }
  .rf{ display:flex; flex-direction:column; min-height:100vh; font-family:'Inter',system-ui,sans-serif; color:var(--n900); -webkit-font-smoothing:antialiased; }
  .rf, .rf *, .rf *::before, .rf *::after{ box-sizing:border-box; }
  .rf :focus-visible{ outline:2px solid var(--b500); outline-offset:2px; }
  .rf-top{ position:sticky; top:0; z-index:40; }
  .rf-main{ flex:1 0 auto; background:linear-gradient(180deg, color-mix(in srgb, var(--b50) 75%, #fff) 0, #fff 340px); padding-bottom:clamp(32px,3.4vw,64px); }
  html[data-fill="flat"] .rf-main{ background:#fff; }

  .rf-crow{ display:flex; align-items:center; gap:16px; min-height:36px; padding-top:clamp(12px,1vw,18px); }
  .rf-crumbs{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none; font-size:13.5px; line-height:20px; color:var(--n500); }
  .rf-crumbs li{ display:inline-flex; align-items:center; gap:6px; }
  .rf-crumbs a{ display:inline-flex; align-items:center; gap:6px; color:var(--n500); text-decoration:none; border-radius:6px; transition:color .15s; }
  .rf-crumbs a:hover{ color:var(--b700); }
  .rf-crumbs a i{ font-size:16px; }
  .rf-crumbs > li > i{ font-size:16px; color:var(--n300); }
  .rf-crumbs [aria-current]{ color:var(--n900); font-weight:500; }

  /* левое меню + рабочая область */
  .rf-lay{ display:grid; grid-template-columns:clamp(264px,17vw,300px) minmax(0,1fr); gap:clamp(20px,1.6vw,28px); align-items:start; margin-top:clamp(14px,1.2vw,22px); }
  .rf-side{ position:sticky; top:88px; }
  .rf-h1{ margin:0 0 clamp(14px,1.1vw,20px); font-size:clamp(24px,.8vw + 14px,32px); line-height:1.2; font-weight:600; letter-spacing:-.026em; }

  .rf-stub{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; min-height:clamp(320px,48vh,560px); padding:40px 24px; border:1px solid var(--n200); border-radius:20px; background:#fff; box-shadow:var(--hm-sh1); }
  .rf-stub-ic{ width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center; background:var(--b50); color:var(--b600); font-size:30px; box-shadow:inset 0 0 0 1px var(--b100); }
  .rf-stub p{ margin:0; font-size:17px; line-height:1.4; font-weight:600; letter-spacing:-.012em; color:var(--n900); }

  @media (max-width:1024px){
    .rf-lay{ grid-template-columns:minmax(0,1fr); gap:20px; }
    .rf-side{ position:static; }
  }
  @media (max-width:640px){
    .rf-stub{ min-height:280px; }
    .rf-stub p{ font-size:16px; }
  }
</style>
</helmet>

<div class="rf">
  <dc-import name="HomeData" hint-size="0px,0px"></dc-import>
  <dc-import name="OrgRepData" hint-size="0px,0px"></dc-import>
  <div class="rf-top"><dc-import name="PortalHeader" look="light" section="reports" hint-size="100%,72px"></dc-import></div>

  <main class="rf-main">
    <div class="hm-wrap">
      <div class="rf-crow">
        <nav aria-label="Хлебные крошки">
          <ol class="rf-crumbs">
            <li><a href="{{ homeHref }}"><i class="ri-home-5-line" aria-hidden="true"></i>Главная</a><i class="ri-arrow-right-s-line" aria-hidden="true"></i></li>
            <li><span aria-current="page">Отчётные формы</span></li>
          </ol>
        </nav>
      </div>

      <div class="rf-lay">
        <aside class="rf-side"><dc-import name="OrgReportsNav" active="journal" hint-size="300px,280px"></dc-import></aside>
        <div>
          <h1 class="rf-h1" id="rf-h1">Журнал отчётных форм</h1>
          <section class="rf-stub" aria-labelledby="rf-h1">
            <span class="rf-stub-ic" aria-hidden="true"><i class="ri-tools-line"></i></span>
            <p role="status">Раздел находится в разработке</p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <dc-import name="PortalFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const lsGet = (k) => { try { return localStorage.getItem(k); } catch(e){ return null; } };

class Component extends DCLogic {
  constructor(props){
    super(props);
    // раздел первого руководителя: без входа — авторизация с возвратом, остальным — общий раздел «Отчётные формы»
    if(!lsGet('mp-profile')){ try { location.replace('Вход.dc.html?return=' + encodeURIComponent('Журнал отчётных форм.dc.html')); } catch(e){} }
    else if(!lsGet('mp-org-head')){ try { location.replace('Отчётные формы.dc.html'); } catch(e){} }
  }
  renderVals(){
    return { homeHref: lsGet('mp-home-page') || 'Главная H - Витрина.dc.html' };
  }
}
</script>
</body>
</html>
