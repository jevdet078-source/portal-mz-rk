<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{
    --n0:#FFFFFF;--n100:#F6F8FA;--n200:#E2E4E9;--n400:#868C98;--n500:#525866;--n900:#0A0D14;
    --stroke:#E2E4E9;
    --red:#DF1C41;--red-l:#F8C9D2;--red-ll:#FDEDF0;--red-d:#710E21;
    --orange:#F17B2C;--orange-l:#FFDAC2;--orange-ll:#FEF3EB;--orange-d:#6E330C;
    --green:#38C793;--green-l:#CBF5E5;--green-ll:#EFFAF6;--green-d:#176448;
    --blue:#4D42E9;--blue-l:#C6D0FF;--blue-ll:#EEF2FF;--blue-d:#312D86;
    --purple:#6E3FF3;--purple-l:#CAC2FF;--purple-ll:#EEEBFF;--purple-d:#2B1664;
    --sh-toast:0 16px 32px -12px rgba(14,18,27,.10);
  }
  @keyframes mp-toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="{{ root }}">
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
    <div style="{{ g.wrap }}">

      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--n400);margin-bottom:14px;font-family:'Inter',sans-serif;">{{ g.title }}</div>
      </sc-if>

      <div style="{{ g.grid }}">
        <sc-for list="{{ g.items }}" as="a" hint-placeholder-count="4">
          <div style="{{ a.box }}">

            <sc-if value="{{ a.hasIcon }}" hint-placeholder-val="{{ true }}">
              <i class="{{ a.icon }}" style="{{ a.iconStyle }}"></i>
            </sc-if>

            <div style="{{ a.content }}">
              <div style="{{ a.textWrap }}">
                <div style="{{ a.titleStyle }}">{{ a.title }}</div>
                <sc-if value="{{ a.hasDesc }}" hint-placeholder-val="{{ true }}">
                  <div style="{{ a.descStyle }}">{{ a.desc }}</div>
                </sc-if>
              </div>

              <sc-if value="{{ a.blockActions }}" hint-placeholder-val="{{ true }}">
                <div style="display:flex;align-items:flex-start;gap:8px;width:100%;">
                  <button onClick="{{ a.onLink }}" style="{{ a.linkStyle }}">{{ a.link }}</button>
                  <sc-if value="{{ a.hasLink2 }}" hint-placeholder-val="{{ true }}">
                    <span style="{{ a.dividerStyle }}">∙</span>
                    <button onClick="{{ a.onLink2 }}" style="{{ a.link2Style }}">{{ a.link2 }}</button>
                  </sc-if>
                </div>
              </sc-if>
            </div>

            <sc-if value="{{ a.inlineActions }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ a.onLink }}" style="{{ a.linkStyle }}">{{ a.link }}<i class="ri-arrow-right-s-line" style="{{ a.arrowStyle }}"></i></button>
            </sc-if>

            <sc-if value="{{ a.dismissible }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ a.onDismiss }}" style="{{ a.dismissStyle }}"><i class="ri-close-line" style="{{ a.dismissIconStyle }}"></i></button>
            </sc-if>

          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}">
/*
  Alert / Notification / Toast — перенесено из AlignUI Design System v1.0 (EO)
  Figma: файл 6ohVPNSxbI71uG1xQzm8DT, страница 1927:49480,
         компонент «Alert & Notification & Toast [1.0]» — 3833:42072

  В AlignUI это ОДИН компонент на три роли (см. guidelines файла):
    • Alert        — между полями формы, висит пока пользователь не среагирует
    • Notification — временно в углу экрана
    • Toast        — компактный, копится стопкой, закрывается сам

  Оси свойств: status × appearance × size = 5 × 4 × 3 = 60 вариантов.

  Использование как компонента:
    <dc-import name="Toast" status="success" appearance="lighter" size="lg"
               title="Заявка отправлена" text="Номер 2024-ЛС-00417."
               link="Открыть заявку" dismissible="1"></dc-import>

  Без пропсов рендерится витрина всех вариантов — открыть через tools/serve.mjs.
*/
class Component extends DCLogic {

  // ——— палитра статусов: базовый / light / lighter / darker + иконка RemixIcon ———
  static PALETTE = {
    error:       { base:'--red',    icon:'ri-error-warning-fill' },
    warning:     { base:'--orange', icon:'ri-alert-fill' },
    success:     { base:'--green',  icon:'ri-checkbox-circle-fill' },
    information: { base:'--blue',   icon:'ri-information-fill' },
    feature:     { base:'--purple', icon:'ri-magic-fill' },
  };

  // ——— геометрия размеров, снята из Figma ———
  static SIZES = {
    lg: { radius:12, pad:'14px 14px 16px', gap:12, block:true,  desc:true  },
    sm: { radius:8,  pad:'8px 10px',       gap:8,  block:false, desc:false },
    xs: { radius:8,  pad:'6px 10px',       gap:8,  block:false, desc:false },
  };

  /** Цвета под связку статус+стиль. */
  palette(status, appearance){
    const p = Component.PALETTE[status] || Component.PALETTE.information;
    const c = `var(${p.base})`, light = `var(${p.base}-l)`,
          lighter = `var(${p.base}-ll)`, darker = `var(${p.base}-d)`;

    if(appearance === 'filled')
      return { bg:c, border:'none', shadow:'none', icon:'#fff',
               title:'#fff', desc:'#fff', descOpacity:.88, link:'#fff', divider:'#fff' };

    if(appearance === 'light')
      return { bg:light, border:'none', shadow:'none', icon:darker,
               title:darker, desc:darker, descOpacity:.88, link:darker, divider:darker };

    if(appearance === 'stroke')
      return { bg:'var(--n0)', border:'1px solid var(--stroke)', shadow:'var(--sh-toast)', icon:c,
               title:'var(--n900)', desc:'var(--n500)', descOpacity:1, link:'var(--n900)', divider:'var(--n900)' };

    // lighter — по умолчанию
    return { bg:lighter, border:'none', shadow:'none', icon:c,
             title:'var(--n900)', desc:'var(--n500)', descOpacity:1, link:'var(--n900)', divider:'var(--n900)' };
  }

  /** Полный дескриптор одного уведомления для разметки. */
  build(o){
    const status = o.status || 'information';
    const appearance = o.appearance || 'lighter';
    const sz = Component.SIZES[o.size] || Component.SIZES.lg;
    const c = this.palette(status, appearance);
    const p = Component.PALETTE[status] || Component.PALETTE.information;

    const width = o.width || '390px';
    const type = 'font-family:\'Inter\',sans-serif;font-size:14px;line-height:20px;letter-spacing:-.006em;';
    const link = (underline) => `${type}font-weight:500;color:${c.link};background:none;border:none;padding:0;`
      + `cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;`
      + (underline ? 'text-decoration:underline;text-underline-offset:3px;' : 'text-decoration:none;');

    return {
      key: `${status}-${appearance}-${o.size || 'lg'}`,
      box: `display:flex;align-items:flex-start;gap:${sz.gap}px;width:${width};max-width:100%;`
         + `padding:${sz.pad};border-radius:${sz.radius}px;background:${c.bg};border:${c.border};`
         + `box-shadow:${c.shadow};overflow:hidden;box-sizing:border-box;`,

      hasIcon: o.icon !== false,
      icon: o.iconName || p.icon,
      iconStyle: `font-size:20px;line-height:20px;color:${c.icon};flex:0 0 auto;`,

      content: sz.block
        ? 'display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:1 1 0;min-width:0;'
        : 'flex:1 1 0;min-width:0;',
      textWrap: sz.block
        ? 'display:flex;flex-direction:column;gap:4px;width:100%;'
        : 'display:block;',

      title: o.title || '',
      titleStyle: `${type}font-weight:${sz.block ? 500 : 400};color:${c.title};overflow-wrap:anywhere;`,

      hasDesc: !!(sz.desc && o.text),
      desc: o.text || '',
      descStyle: `${type}font-weight:400;color:${c.desc};opacity:${c.descOpacity};overflow-wrap:anywhere;`,

      blockActions:  !!(sz.block && o.link),
      inlineActions: !!(!sz.block && o.link),
      link: o.link || '',
      linkStyle: link(sz.block),
      arrowStyle: `font-size:20px;line-height:20px;color:${c.link};`,

      hasLink2: !!(sz.block && o.link2),
      link2: o.link2 || '',
      link2Style: link(false),
      dividerStyle: `${type}font-weight:400;color:${c.divider};opacity:.48;width:4px;text-align:center;flex:0 0 auto;`,

      dismissible: o.dismissible !== false,
      onDismiss: o.onDismiss || (()=>{}),
      onLink: o.onLink || (()=>{}),
      onLink2: o.onLink2 || (()=>{}),
      dismissStyle: 'background:none;border:none;padding:0;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;',
      dismissIconStyle: `font-size:20px;line-height:20px;color:${c.icon};opacity:.72;`,
    };
  }

  /** Витрина всех вариантов — когда компонент открыт как страница. */
  showcase(){
    const statuses = ['error','warning','success','information','feature'];
    const appearances = ['filled','light','lighter','stroke'];
    const RU = {
      error:       { title:'Заявка отклонена',        text:'Указана причина отказа. Документы можно подать повторно.' },
      warning:     { title:'Требуется доработка',     text:'Эксперт оставил замечания по пакету документов.' },
      success:     { title:'Заявка отправлена',       text:'Номер 2024-ЛС-00417. Срок рассмотрения — 10 рабочих дней.' },
      information: { title:'Услуга оказывается онлайн',text:'Авторизация на портале Минздрава не требуется.' },
      feature:     { title:'Новый сервис',            text:'Регистрация цены на медицинские изделия — теперь онлайн.' },
    };

    const groups = [];

    // По одному большому уведомлению на каждый стиль — все пять статусов
    for(const appearance of appearances){
      groups.push({
        hasTitle: true,
        title: `Large · ${appearance}`,
        wrap: 'margin-bottom:34px;',
        grid: 'display:flex;flex-wrap:wrap;gap:16px;',
        items: statuses.map(status => this.build({
          status, appearance, size:'lg', ...RU[status],
          link:'Открыть', link2:'Подробнее',
        })),
      });
    }

    // Компактные размеры
    for(const size of ['sm','xs']){
      groups.push({
        hasTitle: true,
        title: size === 'sm' ? 'Small (36) — все статусы' : 'X-Small (32) — все статусы',
        wrap: 'margin-bottom:34px;',
        grid: 'display:flex;flex-wrap:wrap;gap:12px;',
        items: statuses.map(status => this.build({
          status, appearance:'filled', size,
          title: RU[status].title, link:'Открыть',
        })),
      });
    }

    return groups;
  }

  renderVals(){
    const pr = this.props || {};
    const isShowcase = !pr.title && !pr.text;

    if(isShowcase){
      return {
        root: 'background:var(--n100);padding:40px;min-height:100vh;font-family:\'Inter\',sans-serif;',
        groups: this.showcase(),
      };
    }

    return {
      root: 'font-family:\'Inter\',sans-serif;',
      groups: [{
        hasTitle: false, title: '', wrap: '', grid: 'display:flex;',
        items: [ this.build({
          status: pr.status,
          appearance: pr.appearance,
          size: pr.size,
          title: pr.title,
          text: pr.text,
          link: pr.link,
          link2: pr.link2,
          iconName: pr.iconName,
          icon: pr.icon !== '0',
          dismissible: pr.dismissible !== '0',
          width: pr.width,
          onDismiss: pr.onDismiss,
          onLink: pr.onLink,
          onLink2: pr.onLink2,
        }) ],
      }],
    };
  }
}
</script>
</body>
</html>
