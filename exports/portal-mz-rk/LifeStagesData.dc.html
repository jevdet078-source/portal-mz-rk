<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:10,&quot;height&quot;:10}}">
const SECTIONS = [{"id":"newborn","title":"Здоровье новорождённого","aud":"0–28 дней","art":"babybottle","tone":"teal","desc":"Первые дни, патронаж, кормление, уход и безопасный сон","subs":[{"id":"pervye-dni-posle-rozhdeniya","title":"Первые дни после рождения","meta":"","icon":"ri-sun-line","html":"<p class=\"lead\">Первые дни после рождения — важный период адаптации ребёнка к жизни вне организма матери. В это время организм новорождённого приспосабливается к самостоятельному дыханию, питанию, поддержанию температуры тела и новым условиям окружающей среды.</p><p class=\"lead\">После рождения медицинские работники оценивают состояние ребёнка, проводят необходимые осмотры и обеспечивают наблюдение за его адаптацией.</p><p class=\"lbl\">Что важно знать родителям:</p><ul><li>Обеспечьте контакт ребёнка с матерью «кожа к коже» при отсутствии медицинских противопоказаний.</li><li>Начинайте грудное вскармливание как можно раньше, желательно в первый час после рождения.</li><li>Следите за температурой тела ребёнка и не допускайте его переохлаждения или перегревания.</li><li>Обращайте внимание на активность ребёнка, дыхание и способность сосать грудь.</li><li>Соблюдайте рекомендации медицинского персонала родильного дома.</li><li>Перед выпиской уточните рекомендации по уходу за ребёнком и дальнейшему медицинскому наблюдению.</li></ul><p>После выписки из родильного дома важно обеспечить связь с организацией ПМСП по месту прикрепления ребёнка для проведения патронажного наблюдения.</p>","toc":[]},{"id":"patronazh-novorozhdennogo","title":"Патронаж новорождённого","meta":"","icon":"ri-home-heart-line","html":"<p class=\"lead\">Патронаж новорождённого — это система медицинского наблюдения за ребёнком на дому, направленная на оценку состояния его здоровья, выявление возможных рисков и консультирование родителей по вопросам ухода и развития.</p><p class=\"lead\">В Казахстане патронаж беременных женщин, родильниц и детей до пяти лет проводится по универсальной прогрессивной модели патронажных посещений.</p><h2 id=\"h1\">Когда проводится патронаж</h2><p class=\"lbl\">Согласно универсальной схеме патронажа:</p><ul><li>В первые 3 дня после выписки из родильного дома проводится посещение новорождённого участковым врачом и патронажной медицинской сестрой.</li><li>Последующие посещения проводятся в сроки, предусмотренные утверждённой схемой патронажного наблюдения, с учётом возраста ребёнка и выявленных рисков.</li><li>При выявлении медицинских или социальных факторов риска может быть организовано дополнительное сопровождение семьи.</li></ul><p class=\"lbl\">Что оценивает медицинский работник во время посещения:</p><ul><li>Общее состояние и самочувствие новорождённого.</li><li>Дыхание, активность и способность ребёнка к кормлению.</li><li>Физическое развитие и динамику массы тела.</li><li>Состояние кожи и пупочной области.</li><li>Условия проживания и безопасность домашней среды.</li><li>Эмоциональное состояние матери и потребности семьи.</li><li>Наличие медицинских и психосоциальных факторов риска.</li></ul><p class=\"lbl\">Чему обучают родителей:</p><ul><li>Правильному грудному вскармливанию.</li><li>Основным правилам ухода за ребёнком.</li><li>Безопасному купанию и гигиене.</li><li>Организации безопасного сна.</li><li>Поддержанию температурного режима.</li><li>Распознаванию опасных признаков заболеваний.</li><li>Созданию благоприятной среды для развития ребёнка.</li></ul><p>При выявлении умеренных или высоких рисков медицинские работники совместно с семьёй формируют индивидуальный план сопровождения и при необходимости привлекают других специалистов.</p>","toc":[{"id":"h1","label":"Когда проводится патронаж"}]},{"id":"grudnoe-vskarmlivanie","title":"Грудное вскармливание","meta":"","icon":"ri-hand-heart-line","html":"<p class=\"lead\">Грудное молоко является оптимальным питанием для новорождённого. Оно содержит необходимые питательные вещества и защитные компоненты, которые способствуют росту, развитию и формированию иммунной системы ребёнка.</p><p class=\"lead\">Рекомендуется исключительно грудное вскармливание с рождения до достижения ребёнком 6 месяцев. После введения прикорма грудное вскармливание рекомендуется продолжать до 2 лет и дольше при желании матери и ребёнка.</p><p class=\"lbl\">Основные рекомендации:</p><h2 id=\"h2\">Раннее начало кормления</h2><ul><li>По возможности приложите ребёнка к груди в течение первого часа после рождения.</li><li>Обеспечьте контакт «кожа к коже».</li><li>Позвольте ребёнку самостоятельно проявлять интерес к груди.</li></ul><h2 id=\"h3\">Правильное прикладывание</h2><ul><li>Ребёнок должен быть обращён всем телом к матери.</li><li>Рот ребёнка должен быть широко открыт.</li><li>Подбородок касается груди.</li><li>Во время кормления не должно возникать выраженной боли у матери.</li><li>Должны быть заметны ритмичные сосательные движения и слышно глотание.</li></ul><h2 id=\"h4\">Частота кормления</h2><ul><li>Кормите ребёнка по требованию, ориентируясь на его признаки голода.</li><li>Не ограничивайте количество кормлений без медицинских показаний.</li><li>В первые недели жизни ребёнок может требовать грудь часто, в том числе в ночное время.</li></ul><p class=\"lbl\">Как понять, что ребёнок получает достаточно молока:</p><ul><li>Ребёнок активно сосёт грудь.</li><li>Во время кормления слышно глотание.</li><li>После кормления ребёнок выглядит удовлетворённым.</li><li>Постепенно увеличивается количество мочеиспусканий.</li><li>Наблюдается соответствующая возрасту прибавка массы тела.</li></ul><h2 id=\"h5\">Если возникают трудности</h2><p>При болезненности сосков, затруднённом прикладывании, ощущении недостатка молока, недостаточной прибавке массы тела или отказе ребёнка от груди необходимо обратиться к медицинскому работнику.</p>","toc":[{"id":"h2","label":"Раннее начало кормления"},{"id":"h3","label":"Правильное прикладывание"},{"id":"h4","label":"Частота кормления"},{"id":"h5","label":"Если возникают трудности"}]},{"id":"gigiena-i-uhod","title":"Гигиена и уход","meta":"","icon":"ri-drop-line","html":"<p class=\"lead\">Правильный ежедневный уход за новорождённым помогает поддерживать чистоту кожи, предупреждать раздражения и создавать комфортные условия для развития ребёнка.</p><p class=\"lead\">Кожа новорождённого чувствительна к внешним воздействиям, поэтому гигиенические процедуры необходимо проводить бережно, используя средства, предназначенные для детей раннего возраста.</p><p class=\"lbl\">Основные правила ухода:</p><h2 id=\"h6\">Уход за кожей</h2><ul><li>Ежедневно осматривайте кожу ребёнка.</li><li>Осторожно очищайте кожные складки и участки, подверженные загрязнению.</li><li>Используйте мягкие средства для ухода за кожей новорождённых.</li><li>При появлении выраженного покраснения, сыпи или раздражения обратитесь к медицинскому работнику.</li></ul><h2 id=\"h7\">Уход за пупочной ранкой</h2><ul><li>Поддерживайте область пупочной ранки в чистоте и сухости.</li><li>Избегайте трения и травмирования пупочной области.</li><li>Не наносите лекарственные и антисептические средства без рекомендации медицинского специалиста.</li><li>При появлении покраснения вокруг пупка, отёка, гнойных выделений или неприятного запаха обратитесь к врачу.</li></ul><h2 id=\"h8\">Купание</h2><ul><li>Купайте ребёнка в безопасных и комфортных условиях.</li><li>Перед купанием подготовьте необходимые принадлежности.</li><li>Проверяйте температуру воды.</li><li>Никогда не оставляйте ребёнка одного в воде даже на короткое время.</li><li>После купания аккуратно промокните кожу мягким полотенцем.</li></ul><h2 id=\"h9\">Смена подгузников</h2><ul><li>Меняйте подгузник по мере загрязнения и увлажнения.</li><li>Очищайте кожу бережно, не допуская раздражения.</li><li>При необходимости используйте защитные средства, предназначенные для младенцев.</li></ul><h2 id=\"h10\">Температурный режим</h2><ul><li>Поддерживайте комфортную температуру воздуха в помещении.</li><li>Не укутывайте ребёнка чрезмерно.</li><li>Ориентируйтесь на состояние ребёнка, а не только на температуру его рук и ног.</li></ul>","toc":[{"id":"h6","label":"Уход за кожей"},{"id":"h7","label":"Уход за пупочной ранкой"},{"id":"h8","label":"Купание"},{"id":"h9","label":"Смена подгузников"},{"id":"h10","label":"Температурный режим"}]},{"id":"bezopasnyy-son","title":"Безопасный сон","meta":"","icon":"ri-moon-clear-line","html":"<p class=\"lead\">Безопасный сон помогает снизить риск возникновения опасных ситуаций во время отдыха ребёнка, в том числе синдрома внезапной детской смерти.</p><p class=\"lead\">Новорождённый должен спать в безопасном, специально подготовленном месте, где исключены предметы и условия, способные затруднить дыхание.</p><h2 id=\"h11\">Как правильно организовать сон ребёнка</h2><ol><li>Укладывайте ребёнка спать на спину.</li><li>Используйте отдельную детскую кроватку с ровным, достаточно твёрдым матрасом.</li><li>Размещайте кроватку в комнате родителей, особенно в первые месяцы жизни.</li><li>Не кладите в кроватку подушки, мягкие игрушки, объёмные одеяла и другие посторонние предметы.</li><li>Не накрывайте голову ребёнка во время сна.</li><li>Поддерживайте комфортную температуру в помещении и не допускайте перегрева.</li><li>Исключите воздействие табачного дыма на ребёнка.</li></ol><h2 id=\"h12\">Чего следует избегать</h2><ul><li>Сна ребёнка на животе или боку без специальных медицинских показаний.</li><li>Совместного сна ребёнка со взрослыми в одной кровати.</li><li>Использования мягких матрасов и дополнительных мягких поверхностей.</li><li>Оставления ребёнка без присмотра на диване, кресле и других небезопасных поверхностях.</li></ul>","toc":[{"id":"h11","label":"Как правильно организовать сон ребёнка"},{"id":"h12","label":"Чего следует избегать"}]},{"id":"fizicheskoe-i-nervno-psihicheskoe-razvitie","title":"Физическое и нервно-психическое развитие","meta":"","icon":"ri-brain-line","html":"<p class=\"lead\">В течение первых 28 дней жизни ребёнок постепенно адаптируется к окружающей среде. В этот период продолжается развитие органов чувств, формируются реакции на внешние раздражители и совершенствуются двигательные реакции.</p><p class=\"lead\">Родителям важно наблюдать за поведением ребёнка и регулярно посещать медицинские осмотры для оценки его роста и развития.</p><h2 id=\"h13\">Физическое развитие</h2><p class=\"lbl\">В первые недели жизни медицинские работники оценивают:</p><ul><li>Массу тела и её динамику.</li><li>Длину тела.</li><li>Окружность головы.</li><li>Общее физическое состояние.</li><li>Активность и двигательные реакции ребёнка.</li></ul><p>В первые дни после рождения возможна физиологическая потеря массы тела. Врач оценивает её величину и последующее восстановление массы с учётом состояния ребёнка и характера вскармливания.</p><h2 id=\"h14\">Нервно-психическое развитие</h2><p class=\"lbl\">Родители могут обращать внимание на следующие реакции:</p><ul><li>Зрение: ребёнок может кратковременно фиксировать взгляд на лице человека или ярком объекте, находящемся на близком расстоянии.</li><li>Слух: реагирует на громкие звуки, может вздрагивать или изменять поведение при звуковых раздражителях.</li><li>Осязание: реагирует на прикосновения, тепло и телесный контакт.</li><li>Движения: совершает спонтанные движения руками и ногами, проявляет врождённые двигательные рефлексы.</li><li>Эмоциональные реакции: постепенно формируются реакции на голос, прикосновения и взаимодействие с близкими людьми.</li></ul><p class=\"lbl\">Как родители могут поддерживать развитие ребёнка:</p><ul><li>Чаще разговаривайте с ребёнком спокойным голосом.</li><li>Поддерживайте контакт «глаза в глаза» на комфортном для ребёнка расстоянии.</li><li>Обеспечивайте бережный телесный контакт.</li><li>Создавайте спокойную и безопасную обстановку.</li><li>Реагируйте на сигналы ребёнка, его потребности и эмоциональные реакции.</li></ul><h2 id=\"h15\">Когда стоит обратиться к специалисту</h2><p>Если ребёнок не реагирует на звуки, необычно мало двигается, плохо сосёт грудь, демонстрирует выраженную вялость или у родителей возникают сомнения относительно его развития, необходимо обратиться к педиатру.</p>","toc":[{"id":"h13","label":"Физическое развитие"},{"id":"h14","label":"Нервно-психическое развитие"},{"id":"h15","label":"Когда стоит обратиться к специалисту"}]},{"id":"kogda-neobhodimo-obratitsya-k-vrachu","title":"Когда необходимо обратиться к врачу","meta":"","icon":"ri-alarm-warning-line","html":"<p class=\"lead\">Состояние новорождённого может изменяться достаточно быстро. Некоторые симптомы требуют незамедлительного обращения за медицинской помощью.</p><p class=\"lbl\">Не откладывайте обращение к врачу, если у ребёнка появились следующие признаки:</p><h2 id=\"h16\">Нарушение дыхания</h2><ul><li>Затруднённое или учащённое дыхание.</li><li>Втяжение грудной клетки при вдохе.</li><li>Посинение губ, языка или кожи.</li><li>Необычные звуки при дыхании.</li></ul><h2 id=\"h17\">Нарушение питания</h2><ul><li>Ребёнок отказывается от груди или не может сосать.</li><li>Значительно ослабло сосание.</li><li>Ребёнок не просыпается для кормления или быстро теряет силы во время него.</li></ul><h2 id=\"h18\">Изменение общего состояния</h2><ul><li>Выраженная вялость или необычная сонливость.</li><li>Ребёнок практически не реагирует на окружающих.</li><li>Судороги или необычные повторяющиеся движения.</li></ul><h2 id=\"h19\">Изменение температуры</h2><ul><li>Повышение температуры тела.</li><li>Необычно низкая температура тела.</li><li>Холодная кожа в сочетании с вялостью или ухудшением общего состояния.</li></ul><h2 id=\"h20\">Признаки обезвоживания</h2><ul><li>Значительное уменьшение количества мочеиспусканий.</li><li>Сухость во рту.</li><li>Выраженная вялость.</li><li>Запавший родничок в сочетании с другими признаками обезвоживания.</li></ul><h2 id=\"h21\">Желтуха</h2><ul><li>Пожелтение кожи или белков глаз.</li><li>Усиление желтушной окраски кожи.</li><li>Появление желтухи в сочетании с отказом от кормления или выраженной вялостью.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>При затруднённом дыхании, посинении кожи, судорогах, нарушении сознания или резком ухудшении состояния ребёнка необходимо немедленно вызвать скорую медицинскую помощь. Не занимайтесь самолечением и не ожидайте появления дополнительных симптомов.</p><a class=\"sos\" href=\"tel:103\"><i class=\"ri-phone-fill\" aria-hidden=\"true\"></i>Скорая помощь — 103</a></div></div>","toc":[{"id":"h16","label":"Нарушение дыхания"},{"id":"h17","label":"Нарушение питания"},{"id":"h18","label":"Изменение общего состояния"},{"id":"h19","label":"Изменение температуры"},{"id":"h20","label":"Признаки обезвоживания"},{"id":"h21","label":"Желтуха"}]}]},{"id":"growth","title":"Рост и развитие ребёнка","aud":"1 месяц – 17 лет","art":"blocks","tone":"yellow","desc":"Развитие, питание, сон, зрение и профилактические осмотры","subs":[{"id":"fizicheskoe-razvitie","title":"Физическое развитие","meta":"","icon":"ri-ruler-line","html":"<p class=\"lead\">Физическое развитие ребёнка — это процесс роста организма, формирования двигательных навыков, укрепления мышц и костной системы. На каждом возрастном этапе ребёнок приобретает новые физические возможности и навыки.</p><p class=\"lead\">Регулярное наблюдение за физическим развитием помогает оценивать состояние здоровья ребёнка и своевременно выявлять возможные отклонения.</p><p class=\"lbl\">Основные показатели физического развития:</p><ul><li>Рост (длина тела) — изменение длины тела ребёнка по мере взросления.</li><li>Масса тела — показатель, позволяющий оценивать динамику набора веса.</li><li>Окружность головы — показатель, используемый для оценки физического развития детей раннего возраста.</li><li>Индекс массы тела (ИМТ) — соотношение массы тела и роста, применяемое для оценки физического развития с учётом возраста.</li><li>Двигательные навыки — развитие способности удерживать голову, переворачиваться, сидеть, ползать, ходить, бегать и выполнять более сложные движения.</li><li>Формирование опорно-двигательного аппарата — развитие мышц, костей, суставов, стоп и осанки.</li></ul><p class=\"lbl\">Как меняется физическое развитие с возрастом:</p><div class=\"tbl\"><table><thead><tr><th>Возраст</th><th>Основные особенности</th></tr></thead><tbody><tr><td>1–12 месяцев</td><td>Удержание головы, перевороты, сидение, ползание, попытки вставать и первые шаги.</td></tr><tr><td>1–3 года</td><td>Развитие ходьбы, бега, координации движений и мелкой моторики.</td></tr><tr><td>3–6 лет</td><td>Совершенствование двигательных навыков, равновесия, ловкости и координации.</td></tr><tr><td>6–10 лет</td><td>Развитие силы, выносливости, координации, формирование осанки.</td></tr><tr><td>11–14 лет</td><td>Изменения роста и массы тела, развитие мышечной и костной систем в период полового созревания.</td></tr><tr><td>15–17 лет</td><td>Продолжение физического созревания, формирование индивидуальных особенностей телосложения и физической выносливости.</td></tr></tbody></table></div><p class=\"lbl\">Рекомендации родителям:</p><ul><li>Обеспечивайте ребёнку регулярную физическую активность с учётом возраста.</li><li>Следите за полноценным питанием и достаточным сном.</li><li>Создавайте условия для подвижных игр и прогулок.</li><li>Обращайте внимание на осанку, походку и симметричность движений.</li><li>Проходите профилактические медицинские осмотры в установленные сроки.</li></ul><h2 id=\"h22\">Когда стоит обратиться к врачу</h2><p>Если ребёнок заметно отстаёт в освоении двигательных навыков, испытывает трудности при ходьбе, имеет выраженную асимметрию движений или наблюдается необычная динамика роста и массы тела, рекомендуется обратиться к педиатру.</p>","toc":[{"id":"h22","label":"Когда стоит обратиться к врачу"}]},{"id":"nervno-psihicheskoe-razvitie","title":"Нервно-психическое развитие","meta":"","icon":"ri-brain-line","html":"<p class=\"lead\">Нервно-психическое развитие ребёнка включает формирование движений, восприятия, внимания, памяти, мышления, эмоциональных реакций и способности взаимодействовать с окружающим миром.</p><p class=\"lead\">Развитие происходит постепенно и индивидуально. Важно учитывать возраст ребёнка, его особенности и динамику приобретения новых навыков.</p><h2 id=\"h23\">Основные направления развития</h2><ul><li>Зрительное восприятие: способность фиксировать взгляд, следить за движущимися предметами, различать формы, цвета и детали окружающей среды.</li><li>Слуховое восприятие: реакция на звуки, узнавание голосов, понимание обращённой речи.</li><li>Двигательное развитие: координация движений, контроль положения тела, развитие крупной и мелкой моторики.</li><li>Эмоциональное развитие: выражение эмоций, формирование привязанности, способность реагировать на эмоциональное состояние окружающих.</li><li>Познавательное развитие: интерес к окружающим предметам, исследование пространства, формирование памяти, внимания и мышления.</li><li>Социальное взаимодействие: развитие способности общаться, играть, устанавливать контакт и взаимодействовать с другими людьми.</li></ul><h2 id=\"h24\">Как родители могут поддерживать развитие ребёнка</h2><ul><li>Разговаривайте с ребёнком, называйте предметы и объясняйте происходящее вокруг.</li><li>Играйте в игры, соответствующие возрасту.</li><li>Читайте книги и рассматривайте иллюстрации вместе.</li><li>Поощряйте самостоятельное исследование безопасного пространства.</li><li>Предоставляйте возможность общаться со сверстниками.</li><li>Ограничивайте чрезмерное использование электронных устройств, особенно в раннем возрасте.</li></ul><p>Важно: не сравнивайте развитие ребёнка с другими детьми. Оценивайте прежде всего его индивидуальную динамику. При возникновении сомнений обратитесь к педиатру для оценки развития.</p>","toc":[{"id":"h23","label":"Основные направления развития"},{"id":"h24","label":"Как родители могут поддерживать развитие ребёнка"}]},{"id":"rechevoe-razvitie","title":"Речевое развитие","meta":"","icon":"ri-chat-smile-2-line","html":"<p class=\"lead\">Речевое развитие — важная часть общего развития ребёнка. Оно начинается с первых звуковых реакций и постепенно переходит к пониманию речи, произношению слов, формированию предложений и полноценному общению.</p><p class=\"lead\">Развитие речи зависит от индивидуальных особенностей ребёнка, состояния слуха, окружающей среды и регулярного общения с близкими.</p><p class=\"lbl\">Основные этапы речевого развития:</p><div class=\"tbl\"><table><thead><tr><th>Возраст</th><th>Особенности речевого развития</th></tr></thead><tbody><tr><td>1–3 месяца</td><td>Появление голосовых реакций, отдельных звуков, гуления.</td></tr><tr><td>4–6 месяцев</td><td>Развитие гуления, появление лепета, реакция на голос и интонацию.</td></tr><tr><td>7–12 месяцев</td><td>Повторение слогов, лепет, реакция на собственное имя, понимание простых обращений.</td></tr><tr><td>1–2 года</td><td>Появление первых осмысленных слов, увеличение словарного запаса, понимание простых инструкций.</td></tr><tr><td>2–3 года</td><td>Формирование коротких фраз, активное расширение словарного запаса, развитие диалогового общения.</td></tr><tr><td>3–5 лет</td><td>Формирование связной речи, построение предложений, пересказ простых событий, развитие речевого взаимодействия.</td></tr><tr><td>6–10 лет</td><td>Развитие грамотной устной речи, словарного запаса, навыков чтения и пересказа.</td></tr><tr><td>11–17 лет</td><td>Совершенствование устной и письменной речи, аргументации, понимания сложных текстов и выражения собственных мыслей.</td></tr></tbody></table></div><p class=\"lbl\">Как помочь ребёнку развивать речь:</p><ul><li>Чаще разговаривайте с ребёнком.</li><li>Читайте книги и обсуждайте прочитанное.</li><li>Задавайте вопросы и давайте возможность отвечать самостоятельно.</li><li>Повторяйте новые слова в повседневных ситуациях.</li><li>Поощряйте общение и совместные игры.</li><li>Не заменяйте живое общение просмотром мультфильмов и видеороликов.</li></ul><h2 id=\"h25\">Когда стоит обратиться к специалисту</h2><p class=\"lbl\">Обратитесь к педиатру, если ребёнок:</p><ul><li>Не реагирует на голос и звуки.</li><li>Не проявляет интереса к общению.</li><li>Не использует доступные возрасту звуковые и речевые реакции.</li><li>Перестаёт использовать слова или навыки общения, которые ранее были сформированы.</li><li>Испытывает выраженные трудности с пониманием обращённой речи.</li></ul><p>При необходимости врач направит ребёнка к сурдологу, логопеду, неврологу или другому профильному специалисту.</p>","toc":[{"id":"h25","label":"Когда стоит обратиться к специалисту"}]},{"id":"socialnoe-i-emocionalnoe-razvitie","title":"Социальное и эмоциональное развитие","meta":"","icon":"ri-emotion-happy-line","html":"<p class=\"lead\">Социальное и эмоциональное развитие помогает ребёнку понимать свои чувства, выражать эмоции, устанавливать отношения с окружающими и постепенно приобретать самостоятельность.</p><p class=\"lead\">На каждом возрастном этапе формируются новые навыки общения, взаимодействия с родителями, сверстниками, воспитателями и учителями.</p><p class=\"lbl\">Основные этапы социального и эмоционального развития:</p><h2 id=\"h26\">От 1 до 3 лет</h2><ul><li>Формирование эмоциональной привязанности к близким.</li><li>Реакция на присутствие и отсутствие родителей.</li><li>Выражение основных эмоций.</li><li>Развитие самостоятельности.</li><li>Начало взаимодействия с другими детьми.</li></ul><h2 id=\"h27\">От 3 до 6 лет</h2><ul><li>Развитие навыков совместной игры.</li><li>Формирование способности делиться и взаимодействовать.</li><li>Понимание простых правил поведения.</li><li>Развитие самостоятельности в повседневных действиях.</li><li>Подготовка к посещению детского сада и адаптация в коллективе.</li></ul><h2 id=\"h28\">От 6 до 10 лет</h2><ul><li>Формирование дружеских отношений.</li><li>Адаптация к школьной среде.</li><li>Развитие ответственности и самостоятельности.</li><li>Понимание социальных правил.</li><li>Развитие способности выражать свои чувства и учитывать эмоции других людей.</li></ul><h2 id=\"h29\">От 11 до 17 лет</h2><ul><li>Формирование личной идентичности.</li><li>Развитие самостоятельности и ответственности.</li><li>Изменения эмоционального состояния в период полового созревания.</li><li>Развитие навыков общения и построения отношений.</li><li>Формирование самооценки и личных границ.</li></ul><p class=\"lbl\">Как родители могут поддерживать эмоциональное развитие:</p><ul><li>Уделяйте ребёнку внимание и время.</li><li>Разговаривайте о чувствах и переживаниях.</li><li>Поддерживайте интересы и увлечения ребёнка.</li><li>Учите выражать эмоции безопасным способом.</li><li>Не сравнивайте ребёнка с другими детьми.</li><li>Создавайте атмосферу доверия, уважения и безопасности.</li><li>Поддерживайте ребёнка в период адаптации к детскому саду или школе.</li></ul><h2 id=\"h30\">Когда стоит обратиться к специалисту</h2><p class=\"lbl\">Рекомендуется обратиться к педиатру или детскому психологу, если наблюдаются:</p><ul><li>Длительная социальная изоляция.</li><li>Выраженные трудности в общении.</li><li>Частые и интенсивные эмоциональные нарушения.</li><li>Резкое изменение поведения.</li><li>Потеря ранее приобретённых социальных навыков.</li><li>Продолжительные трудности адаптации к детскому саду или школе.</li></ul><p>При необходимости педиатр может направить ребёнка к профильным специалистам.</p>","toc":[{"id":"h26","label":"От 1 до 3 лет"},{"id":"h27","label":"От 3 до 6 лет"},{"id":"h28","label":"От 6 до 10 лет"},{"id":"h29","label":"От 11 до 17 лет"},{"id":"h30","label":"Когда стоит обратиться к специалисту"}]},{"id":"pitanie-rebenka","title":"Питание ребёнка","meta":"","icon":"ri-restaurant-2-line","html":"<p class=\"lead\">Правильное питание играет важную роль в росте, развитии, формировании иммунной системы и поддержании здоровья ребёнка. Потребности в питательных веществах меняются в зависимости от возраста, уровня физической активности и индивидуальных особенностей организма.</p><p class=\"lead\">Рацион ребёнка должен быть разнообразным, сбалансированным и соответствовать его возрасту.</p><h2 id=\"h31\">Питание по возрастным периодам</h2><h2 id=\"h32\">От 1 до 6 месяцев — грудное вскармливание</h2><ul><li>Рекомендуется исключительно грудное вскармливание в первые 6 месяцев жизни.</li><li>Грудное молоко обеспечивает ребёнка необходимыми питательными веществами.</li><li>Кормление рекомендуется проводить по требованию ребёнка.</li><li>При невозможности грудного вскармливания вопрос выбора адаптированной молочной смеси необходимо обсудить с медицинским специалистом.</li></ul><h2 id=\"h33\">От 6 до 12 месяцев — введение прикорма</h2><ul><li>Прикорм рекомендуется начинать примерно с 6 месяцев, когда ребёнок готов к приёму дополнительной пищи.</li><li>Новые продукты вводятся постепенно, с учётом возраста и индивидуальной переносимости.</li><li>В рацион включаются овощи, фрукты, каши, мясо и другие продукты, соответствующие возрасту.</li><li>Важно постепенно формировать разнообразный рацион с достаточным содержанием железа и других необходимых питательных веществ.</li><li>Грудное вскармливание рекомендуется продолжать.</li></ul><h2 id=\"h34\">От 1 до 3 лет — формирование пищевых привычек</h2><ul><li>Постепенное расширение рациона.</li><li>Включение овощей, фруктов, молочных продуктов, мяса, рыбы, круп и других продуктов.</li><li>Формирование регулярного режима питания.</li><li>Ограничение продуктов с высоким содержанием сахара, соли и насыщенных жиров.</li><li>Приучение ребёнка к самостоятельному приёму пищи.</li></ul><h2 id=\"h35\">От 3 до 6 лет — питание дошкольника</h2><ul><li>Разнообразный рацион с учётом потребностей растущего организма.</li><li>Регулярные приёмы пищи.</li><li>Достаточное потребление овощей и фруктов.</li><li>Соблюдение питьевого режима.</li><li>Формирование здоровых пищевых привычек.</li></ul><h2 id=\"h36\">От 6 до 17 лет — питание школьника и подростка</h2><ul><li>Полноценное питание с учётом роста и физической активности.</li><li>Регулярный завтрак и сбалансированный рацион в течение дня.</li><li>Достаточное количество белков, жиров, углеводов, витаминов и минералов.</li><li>Ограничение сладких газированных напитков и продуктов с избытком соли и сахара.</li><li>Формирование самостоятельного и ответственного отношения к питанию.</li></ul><p class=\"lbl\">Рекомендации родителям:</p><ul><li>Предлагайте ребёнку разнообразные продукты.</li><li>Соблюдайте режим питания.</li><li>Учитывайте пищевую переносимость и возможные аллергические реакции.</li><li>Не заставляйте ребёнка есть через силу.</li><li>Не используйте сладости в качестве основного поощрения.</li><li>При наличии хронических заболеваний или особенностей питания согласовывайте рацион с врачом.</li></ul><h2 id=\"h37\">Когда необходимо обратиться к врачу</h2><p>Если ребёнок плохо набирает массу тела, отказывается от большинства продуктов, испытывает трудности при глотании, имеет выраженные нарушения аппетита или признаки пищевой аллергии, рекомендуется обратиться к педиатру.</p>","toc":[{"id":"h31","label":"Питание по возрастным периодам"},{"id":"h32","label":"От 1 до 6 месяцев — грудное вскармливание"},{"id":"h33","label":"От 6 до 12 месяцев — введение прикорма"},{"id":"h34","label":"От 1 до 3 лет — формирование пищевых привычек"},{"id":"h35","label":"От 3 до 6 лет — питание дошкольника"},{"id":"h36","label":"От 6 до 17 лет — питание школьника и подростка"},{"id":"h37","label":"Когда необходимо обратиться к врачу"}]},{"id":"son-i-rezhim-dnya","title":"Сон и режим дня","meta":"","icon":"ri-moon-clear-line","html":"<p class=\"lead\">Полноценный сон необходим для физического роста, восстановления организма, формирования памяти, внимания и эмоциональной устойчивости ребёнка.</p><p class=\"lead\">Продолжительность сна и режим дня меняются по мере взросления. Важно формировать регулярный распорядок, обеспечивающий достаточное время для сна, отдыха, учёбы и физической активности.</p><p class=\"lbl\">Рекомендуемая продолжительность сна в зависимости от возраста:</p><div class=\"tbl\"><table><thead><tr><th>Возраст</th><th>Рекомендуемая продолжительность сна за сутки</th></tr></thead><tbody><tr><td>1–3 года</td><td>11–14 часов, включая дневной сон</td></tr><tr><td>3–5 лет</td><td>10–13 часов, включая дневной сон</td></tr><tr><td>6–12 лет</td><td>9–12 часов</td></tr><tr><td>13–17 лет</td><td>8–10 часов</td></tr></tbody></table></div><p>Для детей младше одного года режим сна формируется индивидуально и зависит от возраста, особенностей развития и потребностей ребёнка.</p><p class=\"lbl\">Как сформировать здоровый режим дня:</p><ul><li>Укладывайте ребёнка спать и пробуждайте примерно в одно и то же время.</li><li>Создавайте спокойную обстановку перед сном.</li><li>Ограничивайте использование телефонов, планшетов и телевизора перед сном.</li><li>Обеспечивайте проветривание помещения и комфортную температуру.</li><li>Чередуйте умственную и физическую активность.</li><li>Предусматривайте время для прогулок и отдыха.</li><li>Учитывайте возрастную потребность ребёнка в дневном сне.</li></ul><h2 id=\"h38\">Особенности режима в разные возрастные периоды</h2><ul><li>Младенцы: чередование сна, кормления и периодов бодрствования.</li><li>Дошкольники: регулярный ночной сон, при необходимости дневной отдых.</li><li>Школьники: соблюдение режима учёбы, отдыха, прогулок и сна.</li><li>Подростки: достаточная продолжительность ночного сна и ограничение позднего использования электронных устройств.</li></ul><h2 id=\"h39\">Когда стоит обратиться к врачу</h2><p>Если ребёнок регулярно испытывает трудности с засыпанием, часто просыпается ночью, сильно храпит, имеет остановки дыхания во сне или постоянно испытывает дневную сонливость, рекомендуется обратиться к педиатру.</p>","toc":[{"id":"h38","label":"Особенности режима в разные возрастные периоды"},{"id":"h39","label":"Когда стоит обратиться к врачу"}]},{"id":"zdorove-polosti-rta","title":"Здоровье полости рта","meta":"","icon":"ri-tooth-line","html":"<p class=\"lead\">Здоровье полости рта является важной составляющей общего здоровья ребёнка. Правильный уход за зубами с раннего возраста помогает предупредить развитие кариеса, воспалительных заболеваний дёсен и других стоматологических проблем.</p><p class=\"lead\">Уход за полостью рта необходимо начинать с появления первого молочного зуба.</p><h2 id=\"h40\">Уход за молочными зубами</h2><ul><li>Начинайте чистить зубы с момента прорезывания первого зуба.</li><li>Используйте детскую зубную щётку с мягкой щетиной.</li><li>Применяйте зубную пасту с фтором в количестве, соответствующем возрасту ребёнка.</li><li>Помогайте ребёнку чистить зубы до формирования достаточных навыков самостоятельной гигиены.</li><li>Не допускайте засыпания ребёнка с бутылочкой сладкого напитка или молочной смеси во рту.</li><li>Ограничивайте частое употребление сладостей и сладких напитков.</li></ul><h2 id=\"h41\">Уход за постоянными зубами</h2><ul><li>Продолжайте ежедневную чистку зубов утром и вечером.</li><li>Используйте зубную пасту, подходящую по возрасту.</li><li>Обращайте внимание на состояние дёсен и зубной эмали.</li><li>Обучайте ребёнка правильной технике чистки зубов.</li><li>При необходимости используйте дополнительные средства гигиены по рекомендации стоматолога.</li></ul><h2 id=\"h42\">Профилактика кариеса</h2><ul><li>Соблюдайте ежедневную гигиену полости рта.</li><li>Ограничивайте частое употребление сахара.</li><li>Регулярно посещайте стоматолога.</li><li>Следуйте рекомендациям специалиста по профилактике кариеса.</li><li>При наличии показаний проводите профессиональные профилактические процедуры.</li></ul><h2 id=\"h43\">Когда необходимо посетить стоматолога</h2><p class=\"lbl\">Обратитесь к детскому стоматологу при появлении:</p><ul><li>Пятен или потемнений на поверхности зубов.</li><li>Боли или повышенной чувствительности зубов.</li><li>Кровоточивости или отёчности дёсен.</li><li>Неприятного запаха изо рта, который сохраняется несмотря на гигиену.</li><li>Нарушений прикуса или положения зубов.</li><li>Травм зубов и мягких тканей полости рта.</li></ul><h2 id=\"h44\">Профилактические осмотры полости рта</h2><p>В соответствии с действующими правилами профилактических медицинских осмотров предусмотрено направление детей на осмотр полости рта в установленные возрастные периоды: 2 года, 2 года 6 месяцев, 3–17 лет ежегодно. При осмотре оцениваются состояние зубов, прикуса, дёсен и гигиены полости рта.</p>","toc":[{"id":"h40","label":"Уход за молочными зубами"},{"id":"h41","label":"Уход за постоянными зубами"},{"id":"h42","label":"Профилактика кариеса"},{"id":"h43","label":"Когда необходимо посетить стоматолога"},{"id":"h44","label":"Профилактические осмотры полости рта"}]},{"id":"zrenie-sluh-i-osanka","title":"Зрение, слух и осанка","meta":"","icon":"ri-eye-line","html":"<p class=\"lead\">Зрение, слух и правильное формирование опорно-двигательного аппарата имеют большое значение для полноценного развития ребёнка, его обучения, физической активности и общения с окружающими.</p><p class=\"lead\">Регулярное наблюдение за состоянием зрения, слуха и осанки помогает своевременно выявлять нарушения и обращаться за медицинской помощью.</p><h2 id=\"h45\">Зрение</h2><p>Зрение играет важную роль в познании окружающего мира и обучении ребёнка.</p><p class=\"lbl\">Рекомендации родителям:</p><ul><li>Следите за тем, как ребёнок реагирует на предметы, свет и движущиеся объекты.</li><li>Обеспечьте достаточное освещение при чтении и выполнении домашних заданий.</li><li>Организуйте комфортное расстояние от глаз до книги, тетради и экрана.</li><li>Делайте перерывы во время продолжительной зрительной нагрузки.</li><li>Ограничивайте непрерывное использование гаджетов.</li><li>Следите за тем, чтобы ребёнок не щурился, не наклонял голову при рассматривании предметов и не жаловался на головную боль или ухудшение зрения.</li></ul><h2 id=\"h46\">Слух</h2><p>Слух необходим для развития речи, общения и восприятия информации.</p><p class=\"lbl\">Рекомендации родителям:</p><ul><li>Обращайте внимание на реакцию ребёнка на звуки и обращённую речь.</li><li>Не допускайте длительного воздействия громких звуков.</li><li>Используйте наушники с ограничением громкости и контролируйте продолжительность их использования.</li><li>При частых жалобах на боль в ушах, шум или снижение слуха обращайтесь к врачу.</li><li>Не используйте ватные палочки и другие предметы для глубокого очищения слухового прохода.</li></ul><h2 id=\"h47\">Осанка и опорно-двигательный аппарат</h2><p>Правильная организация двигательной активности и рабочего пространства помогает поддерживать здоровье позвоночника и формировать правильные двигательные привычки.</p><p class=\"lbl\">Рекомендации родителям:</p><ul><li>Организуйте рабочее место ребёнка с учётом его роста.</li><li>Подбирайте стол и стул подходящей высоты.</li><li>Обеспечьте правильное положение спины во время занятий.</li><li>Чередуйте сидячую деятельность с движением.</li><li>Поощряйте прогулки и физическую активность.</li><li>Следите за положением стоп, походкой и симметричностью движений.</li></ul><h2 id=\"h48\">Когда необходимо обратиться к врачу</h2><p class=\"lbl\">Рекомендуется обратиться к специалисту, если ребёнок:</p><ul><li>Жалуется на ухудшение зрения, двоение или боль в глазах.</li><li>Часто щурится или подносит предметы близко к лицу.</li><li>Не реагирует на звуки или часто переспрашивает.</li><li>Жалуется на боль в ушах или снижение слуха.</li><li>Имеет заметную асимметрию плеч, лопаток или таза.</li><li>Испытывает боль в спине или конечностях.</li><li>Имеет заметные изменения походки или положения стоп.</li></ul><p>При необходимости педиатр направит ребёнка к офтальмологу, оториноларингологу, ортопеду или другому профильному специалисту.</p>","toc":[{"id":"h45","label":"Зрение"},{"id":"h46","label":"Слух"},{"id":"h47","label":"Осанка и опорно-двигательный аппарат"},{"id":"h48","label":"Когда необходимо обратиться к врачу"}]},{"id":"profilakticheskie-medicinskie-osmotry-detey","title":"Профилактические медицинские осмотры детей","meta":"","icon":"ri-stethoscope-line","html":"<p class=\"lead\">Профилактические медицинские осмотры позволяют регулярно оценивать состояние здоровья ребёнка, контролировать его физическое и психофизическое развитие, выявлять возможные заболевания и своевременно направлять к профильным специалистам.</p><p class=\"lead\">В Республике Казахстан профилактические медицинские осмотры детей проводятся в организациях первичной медико-санитарной помощи, в том числе с выездом медицинских работников в организации образования.</p><h2 id=\"h49\">Кто проходит профилактические осмотры</h2><p>Профилактические медицинские осмотры охватывают детей дошкольного и школьного возраста, а также обучающихся в организациях технического и профессионального, послесреднего и высшего образования в пределах целевых групп, определённых действующими правилами.</p><h2 id=\"h50\">Как проходит профилактический медицинский осмотр</h2><h2 id=\"h51\">1. Подготовительный этап</h2><ul><li>Формирование списков детей, подлежащих осмотру.</li><li>Информирование родителей или законных представителей.</li><li>Получение добровольного информированного согласия на медицинское вмешательство в предусмотренном законодательством порядке.</li></ul><h2 id=\"h52\">2. Доврачебный этап</h2><p class=\"lbl\">Проводится средним медицинским работником и включает:</p><ul><li>Измерение роста и массы тела.</li><li>Измерение окружности головы у детей до 5 лет.</li><li>Оценку индекса массы тела.</li><li>Оценку физического развития детей.</li><li>Измерение артериального давления с 6 лет.</li><li>Пульсоксиметрию.</li><li>Другие исследования в установленные возрастные периоды.</li></ul><h2 id=\"h53\">3. Квалифицированный этап</h2><p class=\"lbl\">Проводится педиатром или врачом общей практики и включает:</p><ul><li>Общую оценку состояния здоровья.</li><li>Осмотр кожных покровов и слизистых оболочек.</li><li>Оценку работы сердечно-сосудистой и дыхательной систем.</li><li>Оценку нервной и эндокринной систем.</li><li>Оценку физического, психофизического и полового развития.</li><li>Оценку слуха и ЛОР-органов.</li></ul><h2 id=\"h54\">4. Специализированный этап</h2><p>В зависимости от возраста и требований правил предусматривает участие профильных специалистов и медицинских работников, в том числе:</p><ul><li>Офтальмолога или медицинской сестры офтальмологического кабинета.</li><li>Стоматолога или зубного врача.</li><li>Хирурга и медицинской сестры хирургического кабинета.</li><li>Других специалистов при наличии медицинских показаний.</li></ul><h2 id=\"h55\">5. Заключительный этап</h2><ul><li>Анализ результатов осмотра.</li><li>Определение группы здоровья ребёнка.</li><li>Формирование медицинского заключения.</li><li>Предоставление рекомендаций родителям.</li><li>Направление на дополнительные обследования или динамическое наблюдение при необходимости.</li></ul><h2 id=\"h56\">Какие группы здоровья определяются по итогам осмотра</h2><div class=\"tbl\"><table><thead><tr><th>Группа</th><th>Характеристика</th></tr></thead><tbody><tr><td>I группа</td><td>Здоровые дети.</td></tr><tr><td>II группа</td><td>Дети с функциональными отклонениями, факторами риска или сниженной сопротивляемостью организма.</td></tr><tr><td>III группа</td><td>Дети с хроническими заболеваниями в состоянии компенсации.</td></tr><tr><td>IV группа</td><td>Дети с хроническими заболеваниями в состоянии субкомпенсации.</td></tr><tr><td>V группа</td><td>Дети с хроническими заболеваниями в состоянии декомпенсации.</td></tr></tbody></table></div><h2 id=\"h57\">Что получают родители по итогам осмотра</h2><ul><li>Заключение о состоянии здоровья ребёнка.</li><li>Информацию об определённой группе здоровья.</li><li>Рекомендации по режиму дня, питанию и физической активности.</li><li>Рекомендации по дальнейшему наблюдению.</li><li>Направления на дополнительные обследования и консультации при необходимости.</li></ul><p>Важно: профилактический медицинский осмотр не заменяет обращение к врачу при появлении жалоб или симптомов заболевания. Если ребёнка что-либо беспокоит, не нужно ждать очередного планового осмотра.</p>","toc":[{"id":"h49","label":"Кто проходит профилактические осмотры"},{"id":"h50","label":"Как проходит профилактический медицинский осмотр"},{"id":"h51","label":"1. Подготовительный этап"},{"id":"h52","label":"2. Доврачебный этап"},{"id":"h53","label":"3. Квалифицированный этап"},{"id":"h54","label":"4. Специализированный этап"},{"id":"h55","label":"5. Заключительный этап"},{"id":"h56","label":"Какие группы здоровья определяются по итогам осмотра"},{"id":"h57","label":"Что получают родители по итогам осмотра"}]},{"id":"kogda-obratitsya-k-vrachu","title":"Когда обратиться к врачу","meta":"","icon":"ri-alarm-warning-line","html":"<p class=\"lead\">Каждый ребёнок развивается индивидуально. Однако некоторые изменения в поведении, физическом состоянии и приобретении навыков могут указывать на необходимость дополнительной медицинской оценки.</p><p class=\"lead\">Родителям важно обращать внимание не только на отдельные симптомы, но и на изменения, которые сохраняются длительное время или сопровождаются ухудшением общего состояния.</p><h2 id=\"h58\">Физическое развитие</h2><p class=\"lbl\">Обратитесь к педиатру, если:</p><ul><li>Ребёнок заметно отстаёт в освоении двигательных навыков.</li><li>Наблюдается необычно медленный или чрезмерно быстрый набор массы тела.</li><li>Появились трудности при ходьбе или движении.</li><li>Наблюдается выраженная асимметрия движений.</li><li>Ребёнок часто жалуется на боли в конечностях или спине.</li></ul><h2 id=\"h59\">Речевое развитие</h2><p class=\"lbl\">Обратитесь к специалисту, если:</p><ul><li>Ребёнок не реагирует на обращённую речь.</li><li>Не появляются ожидаемые для возраста речевые реакции.</li><li>Ребёнку трудно понимать простые обращения.</li><li>Речь не развивается или заметно отличается от ранее приобретённых навыков.</li><li>Ребёнок утрачивает слова или другие ранее сформированные речевые навыки.</li></ul><h2 id=\"h60\">Нервно-психическое развитие и поведение</h2><p class=\"lbl\">Обратите внимание, если:</p><ul><li>Ребёнок редко устанавливает зрительный контакт и практически не взаимодействует с окружающими.</li><li>Наблюдаются выраженные трудности общения.</li><li>Ребёнок не проявляет интереса к окружающей среде.</li><li>Появились резкие и продолжительные изменения поведения.</li><li>Наблюдается потеря ранее приобретённых навыков.</li><li>Возникают выраженные трудности с вниманием, обучением или повседневной деятельностью.</li></ul><h2 id=\"h61\">Зрение и слух</h2><p class=\"lbl\">Обратитесь к врачу, если:</p><ul><li>Ребёнок жалуется на ухудшение зрения.</li><li>Часто щурится или наклоняет голову при рассматривании предметов.</li><li>Не реагирует на звуки или обращённую речь.</li><li>Часто переспрашивает или увеличивает громкость телевизора.</li><li>Появились жалобы на боль в глазах или ушах.</li></ul><h2 id=\"h62\">Питание и общее состояние</h2><p class=\"lbl\">Обратитесь к педиатру, если:</p><ul><li>Ребёнок регулярно отказывается от еды.</li><li>Наблюдается существенное изменение аппетита.</li><li>Появились трудности при глотании.</li><li>Ребёнок часто жалуется на боли в животе.</li><li>Наблюдается выраженная слабость или постоянная утомляемость.</li></ul><h2 id=\"h63\">Когда нужна срочная медицинская помощь</h2><p>При затруднённом дыхании, судорогах, потере сознания, сильном кровотечении, тяжёлой травме или резком ухудшении состояния ребёнка необходимо немедленно вызвать скорую медицинскую помощь по номеру 103.</p><h2 id=\"h64\">Что делать при выявлении отклонений</h2><ol><li>Обратитесь к педиатру или врачу общей практики по месту прикрепления.</li><li>Расскажите специалисту о замеченных изменениях и времени их появления.</li><li>Пройдите рекомендованные обследования.</li><li>При необходимости получите консультацию профильного специалиста.</li><li>Соблюдайте индивидуальные рекомендации врача.</li></ol>","toc":[{"id":"h58","label":"Физическое развитие"},{"id":"h59","label":"Речевое развитие"},{"id":"h60","label":"Нервно-психическое развитие и поведение"},{"id":"h61","label":"Зрение и слух"},{"id":"h62","label":"Питание и общее состояние"},{"id":"h63","label":"Когда нужна срочная медицинская помощь"},{"id":"h64","label":"Что делать при выявлении отклонений"}]}]},{"id":"reproductive","title":"Репродуктивное здоровье и планирование семьи","aud":"Подростки и взрослые","art":"hearts","tone":"pink","desc":"Здоровье женщин и мужчин, планирование семьи, контрацепция","subs":[{"id":"reproduktivnoe-zdorove-zhenschin","title":"Репродуктивное здоровье женщин","meta":"","icon":"ri-women-line","html":"<p class=\"lead\">Репродуктивное здоровье женщины — важная составляющая общего состояния здоровья, которая включает физическое, психологическое и социальное благополучие в вопросах репродуктивной функции.</p><p class=\"lead\">Забота о репродуктивном здоровье начинается с подросткового возраста и продолжается на протяжении всей жизни. Регулярное внимание к своему состоянию, соблюдение правил личной гигиены и своевременное обращение к специалисту помогают предупреждать заболевания и сохранять здоровье.</p><h2 id=\"h65\">Менструальный цикл</h2><p>Менструальный цикл — естественный физиологический процесс, связанный с изменениями в организме женщины и подготовкой репродуктивной системы к возможной беременности.</p><p class=\"lbl\">Важно:</p><ul><li>Следить за регулярностью менструального цикла.</li><li>Обращать внимание на продолжительность менструации и характер выделений.</li><li>Отмечать выраженные боли и изменения самочувствия.</li><li>При значительных изменениях цикла обращаться к акушеру-гинекологу.</li><li>Не принимать гормональные препараты самостоятельно.</li></ul><h2 id=\"h66\">Профилактика гинекологических заболеваний</h2><ul><li>Соблюдайте правила интимной гигиены.</li><li>Избегайте самолечения и бесконтрольного применения лекарственных средств.</li><li>Обращайтесь к врачу при появлении необычных выделений, боли или нарушений менструального цикла.</li><li>Обсуждайте с медицинским специалистом необходимость профилактических осмотров и обследований.</li><li>Соблюдайте рекомендации врача при выявлении заболеваний репродуктивной системы.</li></ul><h2 id=\"h67\">Забота о репродуктивном здоровье в разные периоды жизни</h2><ul><li>Подростковый возраст: понимание физиологических изменений, менструального цикла и правил личной гигиены.</li><li>Репродуктивный возраст: профилактика гинекологических заболеваний, планирование семьи и подготовка к беременности.</li><li>Период беременности и после родов: медицинское наблюдение, восстановление и консультирование по вопросам репродуктивного здоровья.</li><li>Период менопаузального перехода и менопаузы: внимание к изменениям гормонального фона, самочувствию и профилактике возрастных заболеваний.</li></ul><h2 id=\"h68\">Когда необходимо обратиться к акушеру-гинекологу</h2><ul><li>При выраженных или длительных нарушениях менструального цикла.</li><li>При сильной боли внизу живота.</li><li>При необычных выделениях или неприятном запахе.</li><li>При кровотечении вне менструации.</li><li>При боли или дискомфорте во время половой жизни.</li><li>При появлении симптомов, вызывающих беспокойство.</li></ul>","toc":[{"id":"h65","label":"Менструальный цикл"},{"id":"h66","label":"Профилактика гинекологических заболеваний"},{"id":"h67","label":"Забота о репродуктивном здоровье в разные периоды жизни"},{"id":"h68","label":"Когда необходимо обратиться к акушеру-гинекологу"}]},{"id":"reproduktivnoe-zdorove-muzhchin","title":"Репродуктивное здоровье мужчин","meta":"","icon":"ri-men-line","html":"<p class=\"lead\">Мужское репродуктивное здоровье — это состояние здоровья органов и систем, обеспечивающих половую и репродуктивную функции мужчины.</p><p class=\"lead\">Сохранение репродуктивного здоровья предполагает внимательное отношение к своему организму, профилактику урологических и андрологических заболеваний, здоровый образ жизни и своевременное обращение к специалисту.</p><p class=\"lbl\">Что важно знать о мужском репродуктивном здоровье:</p><ul><li>Состояние мужской репродуктивной системы и её возрастные особенности.</li><li>Значение полового созревания и гормональных изменений.</li><li>Факторы, влияющие на репродуктивную функцию.</li><li>Влияние курения, употребления алкоголя и психоактивных веществ на здоровье.</li><li>Профилактика инфекций, передаваемых половым путём.</li><li>Важность своевременного обращения к урологу или андрологу.</li></ul><h2 id=\"h69\">Профилактика заболеваний</h2><ul><li>Соблюдайте правила личной и интимной гигиены.</li><li>Ведите здоровый образ жизни.</li><li>Поддерживайте регулярную физическую активность.</li><li>Избегайте самолечения и бесконтрольного применения гормональных препаратов.</li><li>Используйте средства барьерной контрацепции для снижения риска ИППП.</li><li>При появлении жалоб обращайтесь к врачу.</li></ul><h2 id=\"h70\">Когда необходимо обратиться к специалисту</h2><ul><li>При боли или дискомфорте в области наружных половых органов.</li><li>При нарушениях мочеиспускания.</li><li>При появлении выделений из мочеиспускательного канала.</li><li>При обнаружении уплотнений или припухлости в области мошонки.</li><li>При нарушениях половой функции.</li><li>При трудностях с зачатием ребёнка.</li></ul><h2 id=\"h71\">К кому обращаться</h2><p>В зависимости от характера жалоб медицинскую помощь оказывают врач общей практики, уролог, андролог и другие профильные специалисты.</p>","toc":[{"id":"h69","label":"Профилактика заболеваний"},{"id":"h70","label":"Когда необходимо обратиться к специалисту"},{"id":"h71","label":"К кому обращаться"}]},{"id":"polovoe-sozrevanie-podrostkov","title":"Половое созревание подростков","meta":"","icon":"ri-user-heart-line","html":"<p class=\"lead\">Половое созревание — естественный этап взросления, во время которого организм ребёнка постепенно приобретает физические и физиологические особенности взрослого человека.</p><p class=\"lead\">В этот период происходят изменения внешности, гормонального фона, эмоционального состояния и репродуктивной системы. Скорость и последовательность изменений индивидуальны.</p><h2 id=\"h72\">Половое созревание у девочек</h2><p class=\"lbl\">В период взросления могут наблюдаться:</p><ul><li>Развитие молочных желёз.</li><li>Появление волос в подмышечных впадинах и в области лобка.</li><li>Изменение формы тела.</li><li>Начало менструаций.</li><li>Изменение эмоционального состояния.</li></ul><h2 id=\"h73\">Половое созревание у мальчиков</h2><p class=\"lbl\">В период взросления могут наблюдаться:</p><ul><li>Увеличение яичек и полового члена.</li><li>Появление волос в подмышечных впадинах и в области лобка.</li><li>Изменение тембра голоса.</li><li>Увеличение мышечной массы.</li><li>Появление растительности на лице.</li><li>Изменение эмоционального состояния.</li></ul><h2 id=\"h74\">Личная гигиена в период взросления</h2><ul><li>Соблюдайте ежедневную гигиену тела.</li><li>Используйте индивидуальные средства гигиены.</li><li>Меняйте нижнее бельё ежедневно.</li><li>Во время менструации соблюдайте правила интимной гигиены и своевременно меняйте средства менструальной гигиены.</li><li>Обращайте внимание на изменения кожи и повышенное потоотделение.</li><li>Не используйте лекарственные средства и гормональные препараты без назначения врача.</li></ul><h2 id=\"h75\">Психологические особенности подросткового возраста</h2><p class=\"lbl\">В этот период подросток может испытывать:</p><ul><li>Повышенную эмоциональность.</li><li>Изменение самооценки.</li><li>Потребность в самостоятельности.</li><li>Интерес к отношениям и вопросам взросления.</li><li>Тревогу из-за изменений внешности и физиологических особенностей.</li></ul><h2 id=\"h76\">Когда стоит обратиться к врачу</h2><ul><li>При отсутствии ожидаемых признаков полового созревания.</li><li>При слишком раннем появлении признаков полового созревания.</li><li>При выраженной боли или необычных симптомах.</li><li>При значительных нарушениях менструального цикла.</li><li>При сильном эмоциональном дискомфорте, тревоге или переживаниях.</li></ul><h2 id=\"h77\">Куда обратиться за помощью</h2><p>Подростки в возрасте от 10 до 18 лет могут получить консультативную, лечебно-диагностическую и психологическую помощь в молодёжных центрах здоровья, а также в организациях ПМСП.</p><p>В таких центрах предоставляется информация по вопросам полового созревания, репродуктивного здоровья, профилактики ИППП, контрацепции и предупреждения нежелательной беременности.</p>","toc":[{"id":"h72","label":"Половое созревание у девочек"},{"id":"h73","label":"Половое созревание у мальчиков"},{"id":"h74","label":"Личная гигиена в период взросления"},{"id":"h75","label":"Психологические особенности подросткового возраста"},{"id":"h76","label":"Когда стоит обратиться к врачу"},{"id":"h77","label":"Куда обратиться за помощью"}]},{"id":"planirovanie-semi","title":"Планирование семьи","meta":"","icon":"ri-parent-line","html":"<p class=\"lead\">Планирование семьи — это осознанный подход к вопросам рождения детей, позволяющий семье самостоятельно принимать решения о желаемом количестве детей, времени рождения и интервалах между беременностями с учётом состояния здоровья и жизненных обстоятельств.</p><p class=\"lead\">Планирование семьи помогает подготовиться к беременности, снизить риски для здоровья женщины и будущего ребёнка, а также предупредить нежелательную беременность.</p><p class=\"lbl\">Что включает планирование семьи:</p><ul><li>Определение желаемого времени наступления беременности.</li><li>Консультирование семейной пары по вопросам репродуктивного здоровья.</li><li>Оценку состояния здоровья будущих родителей.</li><li>Подбор подходящего метода контрацепции при необходимости.</li><li>Подготовку к беременности.</li><li>Обсуждение рекомендуемых интервалов между беременностями с медицинским специалистом.</li></ul><h2 id=\"h78\">Интервал между беременностями</h2><p>После родов организму женщины необходимо время для восстановления. Оптимальный интервал до следующей беременности зависит от состояния здоровья женщины, особенностей предыдущей беременности и родов, а также индивидуальных факторов риска.</p><p>Поэтому вопрос планирования следующей беременности рекомендуется обсудить с акушером-гинекологом.</p><h2 id=\"h79\">Консультирование семейной пары</h2><p class=\"lbl\">В рамках консультации медицинский специалист может:</p><ul><li>Собрать анамнез обоих партнёров.</li><li>Оценить состояние репродуктивного здоровья.</li><li>Выявить хронические заболевания и факторы риска.</li><li>Обсудить вопросы подготовки к беременности.</li><li>Предоставить информацию о контрацепции.</li><li>При наличии показаний направить на дополнительные обследования.</li></ul><h2 id=\"h80\">Когда обратиться к специалисту</h2><p>Рекомендуется обратиться за консультацией до планируемой беременности, а также при трудностях с зачатием, повторных потерях беременности или наличии заболеваний, которые могут повлиять на её течение.</p>","toc":[{"id":"h78","label":"Интервал между беременностями"},{"id":"h79","label":"Консультирование семейной пары"},{"id":"h80","label":"Когда обратиться к специалисту"}]},{"id":"kontracepciya","title":"Контрацепция","meta":"","icon":"ri-shield-check-line","html":"<p class=\"lead\">Контрацепция — это методы и средства предупреждения нежелательной беременности. Современные методы контрацепции позволяют планировать рождение детей, выбирать подходящее время для беременности и учитывать индивидуальные особенности здоровья.</p><p class=\"lead\">Выбор метода контрацепции зависит от возраста, состояния здоровья, репродуктивных планов, наличия противопоказаний и индивидуальных предпочтений.</p><h2 id=\"h81\">Основные методы контрацепции</h2><h2 id=\"h82\">1. Барьерные методы</h2><p>К ним относятся мужские и женские презервативы.</p><ul><li>Помогают предупредить нежелательную беременность.</li><li>Презервативы также снижают риск передачи многих инфекций, передаваемых половым путём.</li><li>Для обеспечения эффективности важно соблюдать правила использования.</li></ul><h2 id=\"h83\">2. Гормональные методы</h2><p>К ним относятся комбинированные гормональные контрацептивы и препараты, содержащие только прогестаген.</p><ul><li>Подбираются с учётом состояния здоровья и противопоказаний.</li><li>Могут применяться в форме таблеток, инъекций, имплантов и других предусмотренных лекарственных форм.</li><li>Назначение и выбор метода осуществляются с участием медицинского специалиста.</li></ul><h2 id=\"h84\">3. Внутриматочные методы</h2><p>Внутриматочные контрацептивы устанавливаются медицинским специалистом.</p><ul><li>Существуют медьсодержащие и гормональные внутриматочные системы.</li><li>Обеспечивают длительную контрацепцию.</li><li>Возможность применения определяется после консультации и оценки противопоказаний.</li></ul><h2 id=\"h85\">4. Естественные методы</h2><p>Основаны на определении периода фертильности и наблюдении за физиологическими признаками менструального цикла.</p><p>Их эффективность зависит от правильности применения и регулярности наблюдения за циклом.</p><h2 id=\"h86\">5. Экстренная контрацепция</h2><p>Применяется для предупреждения беременности после незащищённого полового контакта или возможной неудачи использованного метода контрацепции.</p><p>При необходимости следует как можно скорее обратиться к медицинскому специалисту для выбора подходящего способа.</p><h2 id=\"h87\">Как выбрать подходящий метод</h2><p>Перед выбором контрацепции рекомендуется проконсультироваться с акушером-гинекологом или другим медицинским специалистом. Врач учитывает:</p><ul><li>Возраст и общее состояние здоровья.</li><li>Наличие хронических заболеваний.</li><li>Противопоказания к отдельным методам.</li><li>Репродуктивные планы.</li><li>Особенности менструального цикла.</li><li>Переносимость ранее используемых средств.</li></ul><p>Важно знать!!!</p><ul><li>Не существует универсального метода, подходящего абсолютно всем.</li><li>Гормональные препараты нельзя самостоятельно назначать или отменять.</li><li>Большинство методов контрацепции не защищают от ИППП.</li><li>Презервативы обеспечивают дополнительную защиту от многих инфекций, передаваемых половым путём.</li><li>После родов и в период грудного вскармливания метод контрацепции подбирается с учётом состояния женщины и медицинских рекомендаций.</li></ul>","toc":[{"id":"h81","label":"Основные методы контрацепции"},{"id":"h82","label":"1. Барьерные методы"},{"id":"h83","label":"2. Гормональные методы"},{"id":"h84","label":"3. Внутриматочные методы"},{"id":"h85","label":"4. Естественные методы"},{"id":"h86","label":"5. Экстренная контрацепция"},{"id":"h87","label":"Как выбрать подходящий метод"}]},{"id":"pregravidarnaya-podgotovka","title":"Прегравидарная подготовка","meta":"","icon":"ri-calendar-check-line","html":"<p class=\"lead\">Прегравидарная подготовка — это комплекс профилактических мероприятий, направленных на оценку и улучшение состояния здоровья будущих родителей до наступления беременности.</p><p class=\"lead\">Её основная цель — выявить и по возможности скорректировать факторы риска, подготовить организм женщины к беременности и снизить вероятность осложнений для матери и будущего ребёнка.</p><p>Рекомендуется начинать подготовку заранее, до планируемого зачатия.</p><h2 id=\"h88\">Что включает прегравидарная подготовка</h2><h2 id=\"h89\">1. Консультация медицинского специалиста</h2><p class=\"lbl\">На первичной консультации врач:</p><ul><li>Собирает медицинский и семейный анамнез.</li><li>Уточняет сведения о предыдущих беременностях и родах.</li><li>Оценивает наличие хронических и наследственных заболеваний.</li><li>Учитывает принимаемые лекарственные препараты.</li><li>Оценивает факторы риска, связанные с образом жизни и условиями труда.</li><li>При необходимости направляет к профильным специалистам.</li></ul><h2 id=\"h90\">2. Медицинское обследование</h2><p class=\"lbl\">В зависимости от состояния здоровья и медицинских показаний могут назначаться:</p><ul><li>Общий анализ крови.</li><li>Общий анализ мочи.</li><li>Биохимические исследования крови.</li><li>Обследования на отдельные инфекции.</li><li>Определение группы крови и резус-фактора при необходимости.</li><li>ЭКГ.</li><li>УЗИ органов малого таза и другие инструментальные исследования по показаниям.</li><li>Консультации профильных специалистов.</li></ul><h2 id=\"h91\">3. Коррекция состояния здоровья</h2><p class=\"lbl\">До наступления беременности рекомендуется:</p><ul><li>Пройти лечение выявленных заболеваний.</li><li>Добиться контроля хронических заболеваний.</li><li>Обсудить с врачом безопасность принимаемых лекарственных препаратов.</li><li>Скорректировать питание и образ жизни.</li><li>Отказаться от курения, алкоголя и психоактивных веществ.</li><li>Обсудить необходимость приёма фолиевой кислоты и других препаратов.</li></ul><h2 id=\"h92\">4. Подготовка обоих партнёров</h2><p>Прегравидарная подготовка предполагает участие обоих будущих родителей. Состояние здоровья мужчины также может влиять на вероятность зачатия и течение репродуктивного процесса.</p><h2 id=\"h93\">Фолиевая кислота</h2><p>При планировании беременности необходимо обсудить с врачом профилактический приём фолиевой кислоты. В стандарте акушерско-гинекологической помощи предусмотрена рекомендация приёма 400 мкг (0,4 мг) в сутки за три месяца до планируемой беременности и в течение первых трёх месяцев беременности. Индивидуальную схему приёма определяет медицинский специалист.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Прегравидарная подготовка не означает, что каждый человек должен пройти одинаковый перечень обследований. Объём диагностики определяется врачом индивидуально, с учётом анамнеза, состояния здоровья и факторов риска.</p></div></div>","toc":[{"id":"h88","label":"Что включает прегравидарная подготовка"},{"id":"h89","label":"1. Консультация медицинского специалиста"},{"id":"h90","label":"2. Медицинское обследование"},{"id":"h91","label":"3. Коррекция состояния здоровья"},{"id":"h92","label":"4. Подготовка обоих партнёров"},{"id":"h93","label":"Фолиевая кислота"}]},{"id":"podgotovka-pri-nalichii-hronicheskih-zabolevaniy","title":"Подготовка при наличии хронических заболеваний","meta":"","icon":"ri-pulse-line","html":"<p class=\"lead\">Наличие хронического заболевания не всегда исключает возможность беременности. Однако некоторые заболевания могут влиять на её течение, состояние здоровья женщины и развитие будущего ребёнка.</p><p class=\"lead\">Поэтому при планировании беременности важно заранее проконсультироваться с лечащим врачом и оценить возможные риски.</p><h2 id=\"h94\">Почему необходима предварительная консультация</h2><p class=\"lbl\">До наступления беременности медицинский специалист должен оценить:</p><ul><li>Текущее состояние здоровья.</li><li>Степень компенсации хронического заболевания.</li><li>Наличие возможных осложнений.</li><li>Риски обострения заболевания во время беременности.</li><li>Безопасность принимаемых лекарственных препаратов.</li><li>Необходимость дополнительного обследования и консультаций.</li></ul><h2 id=\"h95\">Какие заболевания требуют особого внимания</h2><p class=\"lbl\">В частности, при планировании беременности необходимо учитывать:</p><ul><li>Сахарный диабет.</li><li>Артериальную гипертензию.</li><li>Заболевания сердечно-сосудистой системы.</li><li>Заболевания почек.</li><li>Заболевания щитовидной железы.</li><li>Аутоиммунные заболевания.</li><li>Эпилепсию и другие неврологические заболевания.</li><li>Заболевания органов дыхания.</li><li>Инфекционные заболевания, требующие наблюдения и лечения.</li></ul><h2 id=\"h96\">Что необходимо сделать до беременности</h2><ol><li>Посетить лечащего врача и сообщить о планируемой беременности.</li><li>Пройти оценку состояния основного заболевания.</li><li>Выполнить назначенные обследования.</li><li>Обсудить безопасность принимаемых лекарственных препаратов.</li><li>При необходимости скорректировать лечение под контролем врача.</li><li>Получить консультации профильных специалистов.</li><li>Согласовать индивидуальный план подготовки к беременности.</li></ol><h2 id=\"h97\">Особое внимание лекарственной терапии</h2><p>Некоторые лекарственные препараты могут быть противопоказаны или требовать изменения схемы применения во время беременности.</p><p>Не прекращайте приём назначенных препаратов самостоятельно. Решение об отмене, замене или изменении дозировки принимает только лечащий врач.</p><h2 id=\"h98\">К кому обратиться</h2><p class=\"lbl\">В зависимости от заболевания могут потребоваться консультации:</p><ul><li>Акушера-гинеколога.</li><li>Врача общей практики или терапевта.</li><li>Эндокринолога.</li><li>Кардиолога.</li><li>Невролога.</li><li>Нефролога.</li><li>Других профильных специалистов.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>При наличии хронического заболевания планирование беременности должно проходить совместно с акушером-гинекологом и лечащим врачом. При необходимости вопрос оценивается врачебно-консультативной комиссией.</p></div></div>","toc":[{"id":"h94","label":"Почему необходима предварительная консультация"},{"id":"h95","label":"Какие заболевания требуют особого внимания"},{"id":"h96","label":"Что необходимо сделать до беременности"},{"id":"h97","label":"Особое внимание лекарственной терапии"},{"id":"h98","label":"К кому обратиться"}]},{"id":"psihologicheskoe-blagopoluchie","title":"Психологическое благополучие","meta":"","icon":"ri-mental-health-line","html":"<p class=\"lead\">Психологическое благополучие является важной частью репродуктивного здоровья. Эмоциональное состояние, отношения с близкими и готовность к изменениям в жизни могут влиять на принятие решений о создании семьи, планировании беременности и родительстве.</p><p class=\"lead\">Забота о психологическом здоровье помогает лучше понимать собственные потребности, справляться со стрессом и формировать благоприятную семейную среду.</p><h2 id=\"h99\">Эмоциональная готовность к родительству</h2><p class=\"lbl\">Перед планированием беременности важно обсудить:</p><ul><li>Личную готовность к появлению ребёнка.</li><li>Ожидания от родительства.</li><li>Распределение семейных обязанностей.</li><li>Возможные изменения привычного образа жизни.</li><li>Эмоциональную и практическую поддержку со стороны партнёра и близких.</li></ul><h2 id=\"h100\">Психологическое здоровье в период беременности</h2><p class=\"lbl\">Во время беременности могут возникать:</p><ul><li>Повышенная эмоциональная чувствительность.</li><li>Тревога за здоровье будущего ребёнка.</li><li>Страхи, связанные с родами.</li><li>Изменения настроения.</li><li>Переживания, связанные с изменением привычного образа жизни.</li></ul><p>При выраженной тревоге или эмоциональном дискомфорте рекомендуется обратиться за консультацией к психологу или медицинскому специалисту.</p><h2 id=\"h101\">Психологическая поддержка после родов</h2><p>После рождения ребёнка женщина может сталкиваться с усталостью, нарушением сна, эмоциональным напряжением и изменением привычного уклада жизни.</p><p class=\"lbl\">Важно:</p><ul><li>Не оставаться один на один с переживаниями.</li><li>Обращаться за поддержкой к близким.</li><li>Обсуждать своё состояние с медицинским работником.</li><li>При необходимости обращаться к психологу или психиатру.</li><li>Не игнорировать длительное подавленное настроение, тревогу и потерю интереса к привычным занятиям.</li></ul><h2 id=\"h102\">Взаимоотношения и семейное благополучие</h2><p class=\"lbl\">Психологическое консультирование может помочь:</p><ul><li>Наладить взаимодействие между партнёрами.</li><li>Подготовиться к родительству.</li><li>Справляться с семейными конфликтами.</li><li>Преодолевать стрессовые ситуации.</li><li>Формировать благоприятную эмоциональную среду для ребёнка.</li></ul><h2 id=\"h103\">Куда обратиться за психологической помощью</h2><p class=\"lbl\">За консультацией можно обратиться:</p><ul><li>К психологу организации ПМСП.</li><li>В молодёжный центр здоровья — для подростков и молодёжи.</li><li>К медицинскому психологу или психиатру при наличии соответствующих показаний.</li><li>В специализированные службы психологической помощи.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Если возникают мысли о причинении вреда себе или другим, либо существует непосредственная угроза безопасности, необходимо незамедлительно обратиться за экстренной помощью по номеру 103.</p></div></div>","toc":[{"id":"h99","label":"Эмоциональная готовность к родительству"},{"id":"h100","label":"Психологическое здоровье в период беременности"},{"id":"h101","label":"Психологическая поддержка после родов"},{"id":"h102","label":"Взаимоотношения и семейное благополучие"},{"id":"h103","label":"Куда обратиться за психологической помощью"}]},{"id":"infekcii-peredavaemye-polovym-putem","title":"Инфекции, передаваемые половым путём","meta":"","icon":"ri-virus-line","html":"<div class=\"tbl\"><table><thead><tr><th>Инфекции, передаваемые половым путём (ИППП) -</th><th>это группа инфекционных заболеваний, которые преимущественно передаются при сексуальных контактах.</th></tr></thead><tbody></tbody></table></div><p>Некоторые инфекции могут длительное время протекать без выраженных симптомов. Поэтому своевременное обследование при наличии факторов риска, соблюдение мер профилактики и обращение к врачу имеют большое значение для сохранения репродуктивного здоровья.</p><h2 id=\"h104\">Какие инфекции относятся к ИППП</h2><p class=\"lbl\">К наиболее распространённым инфекциям относятся:</p><ul><li>Сифилис.</li><li>Гонорея.</li><li>Хламидийная инфекция.</li><li>Трихомониаз.</li><li>Генитальный герпес.</li><li>Вирус папилломы человека (ВПЧ).</li><li>ВИЧ-инфекция.</li><li>Гепатит B и некоторые другие инфекции, которые могут передаваться половым путём.</li></ul><h2 id=\"h105\">Возможные симптомы</h2><p class=\"lbl\">В зависимости от инфекции могут наблюдаться:</p><ul><li>Необычные выделения из половых путей.</li><li>Зуд, жжение или раздражение.</li><li>Боль или дискомфорт при мочеиспускании.</li><li>Боль внизу живота.</li><li>Высыпания, язвочки или другие изменения кожи и слизистых оболочек половых органов.</li><li>Увеличение лимфатических узлов.</li><li>Боль или дискомфорт во время полового контакта.</li></ul><p>Отсутствие симптомов не исключает наличие инфекции.</p><h2 id=\"h106\">Как предупредить заражение</h2><ul><li>Используйте презервативы при сексуальных контактах.</li><li>Избегайте случайных незащищённых половых контактов.</li><li>Проходите обследование при наличии факторов риска или рекомендации врача.</li><li>Не используйте антибиотики и другие лекарственные препараты без назначения.</li><li>При выявлении инфекции следуйте рекомендациям врача относительно лечения и обследования партнёра.</li><li>Обсуждайте с медицинским специалистом профилактику повторного заражения.</li></ul><h2 id=\"h107\">Когда необходимо пройти обследование</h2><p class=\"lbl\">Обратитесь к врачу для консультации и обследования, если:</p><ul><li>Появились симптомы, характерные для ИППП.</li><li>Был половой контакт без использования презерватива и существует риск заражения.</li><li>У партнёра выявлена инфекция.</li><li>Планируется беременность и требуется обследование по медицинским показаниям.</li><li>Врач рекомендовал пройти тестирование.</li></ul><h2 id=\"h108\">Как проходит диагностика</h2><p class=\"lbl\">В зависимости от предполагаемой инфекции медицинский специалист может назначить:</p><ul><li>Анализы крови.</li><li>Исследование мочи.</li><li>Мазки и молекулярно-биологические исследования.</li><li>Другие лабораторные исследования по показаниям.</li></ul><h2 id=\"h109\">Почему важно своевременное лечение</h2><p>Без своевременной диагностики и лечения некоторые ИППП могут приводить к воспалительным заболеваниям органов малого таза, нарушениям репродуктивной функции, осложнениям беременности и другим последствиям.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Не занимайтесь самолечением. При подозрении на ИППП обратитесь к врачу. Обследование и лечение должны проводиться с учётом конкретной инфекции и действующих клинических протоколов.</p></div></div>","toc":[{"id":"h104","label":"Какие инфекции относятся к ИППП"},{"id":"h105","label":"Возможные симптомы"},{"id":"h106","label":"Как предупредить заражение"},{"id":"h107","label":"Когда необходимо пройти обследование"},{"id":"h108","label":"Как проходит диагностика"},{"id":"h109","label":"Почему важно своевременное лечение"}]}]},{"id":"pregnancy","title":"Беременность, роды и послеродовой период","aud":"Беременность и после родов","art":"stroller","tone":"purple","desc":"Учёт, триместры, подготовка к родам и восстановление","subs":[{"id":"podtverzhdenie-beremennosti","title":"Подтверждение беременности","meta":"","icon":"ri-checkbox-circle-line","html":"<p class=\"lead\">Подтверждение беременности — первый этап, с которого начинается медицинское наблюдение за будущей матерью и развитие ребёнка.</p><p class=\"lead\">При задержке менструации или появлении признаков возможной беременности рекомендуется провести тест на беременность и обратиться в медицинскую организацию для подтверждения беременности и определения дальнейших действий.</p><p class=\"lbl\">Первые действия после подтверждения беременности:</p><ol><li>Обратитесь в организацию первичной медико-санитарной помощи (ПМСП), к которой вы прикреплены.</li><li>Запишитесь на приём к врачу акушеру-гинекологу или акушерке в соответствии с порядком, установленным медицинской организацией.</li><li>Сообщите специалисту о дате последней менструации, имеющихся заболеваниях, принимаемых лекарственных препаратах и предыдущих беременностях.</li><li>Пройдите первичный осмотр и необходимые обследования.</li><li>Получите рекомендации по дальнейшему наблюдению и постановке на учёт по беременности.</li></ol><p class=\"lbl\">Что важно сделать на раннем сроке:</p><ul><li>Не откладывать первое обращение к медицинскому специалисту.</li><li>Сообщить врачу о хронических заболеваниях и аллергических реакциях.</li><li>Обсудить безопасность лекарственных препаратов, которые вы принимаете.</li><li>Отказаться от курения, алкоголя и других психоактивных веществ.</li><li>Соблюдать рекомендации по питанию и образу жизни.</li></ul><h2 id=\"h110\">Когда необходимо обратиться за медицинской помощью незамедлительно</h2><p>При сильной боли внизу живота, кровянистых выделениях, обмороке или резком ухудшении самочувствия необходимо срочно обратиться за медицинской помощью, не дожидаясь планового приёма.</p>","toc":[{"id":"h110","label":"Когда необходимо обратиться за медицинской помощью незамедлительно"}]},{"id":"postanovka-na-uchet","title":"Постановка на учёт","meta":"","icon":"ri-file-user-line","html":"<p class=\"lead\">Постановка на учёт по беременности — это начало систематического медицинского наблюдения за состоянием женщины и развитием будущего ребёнка.</p><p class=\"lead\">Раннее обращение позволяет своевременно оценить состояние здоровья будущей матери, определить срок беременности, выявить возможные факторы риска и сформировать индивидуальный план медицинского наблюдения.</p><h2 id=\"h111\">Когда необходимо встать на учёт</h2><p>Согласно стандарту акушерско-гинекологической помощи, ранняя постановка беременной на учёт проводится до 12 недель беременности — в день обращения в медицинскую организацию и выявления беременности. Рекомендуется обращаться как можно раньше, не дожидаясь окончания этого срока.</p><h2 id=\"h112\">Куда обращаться</h2><p>Для постановки на учёт необходимо обратиться в организацию ПМСП по месту прикрепления или фактического проживания в соответствии с установленным порядком.</p><h2 id=\"h113\">Что происходит во время первичного приёма</h2><p class=\"lbl\">Медицинский специалист:</p><ul><li>Собирает анамнез и уточняет сведения о предыдущих беременностях и родах.</li><li>Устанавливает предполагаемый срок беременности.</li><li>Оценивает общее состояние здоровья.</li><li>Измеряет рост, массу тела и рассчитывает индекс массы тела.</li><li>Измеряет артериальное давление.</li>
