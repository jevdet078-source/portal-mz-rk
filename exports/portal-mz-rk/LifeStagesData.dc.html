<li>Проводит необходимый осмотр.</li><li>Выявляет хронические заболевания и возможные факторы риска.</li><li>Назначает первоначальный комплекс лабораторных исследований.</li><li>Формирует план дальнейшего наблюдения.</li></ul><h2 id=\"h114\">Какие документы и сведения подготовить</h2><p class=\"lbl\">Рекомендуется иметь при себе:</p><ul><li>Документ, удостоверяющий личность.</li><li>Сведения о медицинском прикреплении.</li><li>Результаты ранее проведённых обследований, если они имеются.</li><li>Информацию о принимаемых лекарственных препаратах.</li><li>Сведения о хронических заболеваниях, аллергиях и предыдущих беременностях.</li></ul><p>Окончательный перечень документов и порядок оформления необходимо уточнять в медицинской организации.</p><h2 id=\"h115\">Какие медицинские документы оформляются</h2><p>Сведения о беременности и результатах наблюдения вносятся в медицинскую информационную систему. Ведётся индивидуальная карта беременной и родильницы по форме № 077/у.</p><h2 id=\"h116\">Что получает женщина после постановки на учёт</h2><ul><li>Определённый срок беременности.</li><li>Назначенный план медицинского наблюдения.</li><li>Направления на необходимые обследования.</li><li>Рекомендации по образу жизни и питанию.</li><li>Информацию о последующих посещениях и подготовке к родам.</li></ul>","toc":[{"id":"h111","label":"Когда необходимо встать на учёт"},{"id":"h112","label":"Куда обращаться"},{"id":"h113","label":"Что происходит во время первичного приёма"},{"id":"h114","label":"Какие документы и сведения подготовить"},{"id":"h115","label":"Какие медицинские документы оформляются"},{"id":"h116","label":"Что получает женщина после постановки на учёт"}]},{"id":"pervyy-trimestr","title":"Первый триместр","meta":"1–13 недель","icon":"ri-number-1","html":"<p class=\"lead\">Первый триместр — начальный этап беременности, в течение которого происходит формирование основных органов и систем будущего ребёнка. В организме женщины происходят гормональные и физиологические изменения, связанные с развитием беременности.</p><p class=\"lead\">В этот период особенно важно своевременно встать на учёт, пройти первичное обследование и получить рекомендации врача.</p><h2 id=\"h117\">Что происходит с организмом женщины</h2><p class=\"lbl\">В первом триместре могут наблюдаться:</p><ul><li>Задержка менструации.</li><li>Тошнота и изменение аппетита.</li><li>Повышенная утомляемость и сонливость.</li><li>Чувствительность молочных желёз.</li><li>Изменение обоняния и вкусовых предпочтений.</li><li>Учащённое мочеиспускание.</li><li>Эмоциональные изменения.</li></ul><p>Выраженность этих проявлений индивидуальна. Их отсутствие не является признаком нарушения беременности.</p><h2 id=\"h118\">Развитие будущего ребёнка</h2><p class=\"lbl\">В этот период:</p><ul><li>Формируются основные структуры организма.</li><li>Начинают развиваться органы и системы.</li><li>Формируются конечности и черты лица.</li><li>Развивается нервная система.</li><li>Начинает функционировать сердечно-сосудистая система.</li></ul><h2 id=\"h119\">Медицинское наблюдение</h2><p class=\"lbl\">На этом этапе необходимо:</p><ul><li>Пройти первичный приём акушера-гинеколога.</li><li>Выполнить назначенные лабораторные исследования.</li><li>Определить факторы риска.</li><li>Получить рекомендации по питанию и образу жизни.</li><li>Обсудить принимаемые лекарственные препараты.</li><li>Пройти предусмотренные обследования в установленные сроки.</li></ul><h2 id=\"h120\">Что важно для будущей мамы</h2><ul><li>Соблюдайте рекомендации медицинского специалиста.</li><li>Обеспечьте полноценное питание и отдых.</li><li>Не употребляйте алкоголь и не курите.</li><li>Не принимайте лекарственные препараты без консультации врача.</li><li>Обсудите с врачом приём фолиевой кислоты.</li><li>При появлении тревожных симптомов своевременно обращайтесь за медицинской помощью.</li></ul><p>Важно: сроки и содержание пренатальных скрининговых исследований представлены в отдельном интерактивном разделе портала «Скрининговые исследования». Здесь повторять их подробный календарь не требуется.</p>","toc":[{"id":"h117","label":"Что происходит с организмом женщины"},{"id":"h118","label":"Развитие будущего ребёнка"},{"id":"h119","label":"Медицинское наблюдение"},{"id":"h120","label":"Что важно для будущей мамы"}]},{"id":"vtoroy-trimestr","title":"Второй триместр","meta":"14–27 недель","icon":"ri-number-2","html":"<p class=\"lead\">Второй триместр — период активного роста и развития будущего ребёнка. У многих женщин в это время уменьшаются проявления раннего токсикоза, улучшается общее самочувствие и становится заметнее увеличение живота.</p><p class=\"lead\">Продолжение регулярного медицинского наблюдения позволяет оценивать состояние женщины, контролировать развитие плода и своевременно выявлять возможные осложнения.</p><h2 id=\"h121\">Что происходит с организмом женщины</h2><p class=\"lbl\">В этот период могут наблюдаться:</p><ul><li>Увеличение живота и массы тела.</li><li>Изменение формы тела и распределения нагрузки на позвоночник.</li><li>Увеличение молочных желёз.</li><li>Изменения состояния кожи.</li><li>Появление первых ощутимых шевелений плода.</li><li>Изменение потребности в отдыхе и физической активности.</li></ul><h2 id=\"h122\">Развитие будущего ребёнка</h2><p class=\"lbl\">Во втором триместре:</p><ul><li>Продолжается рост и развитие органов.</li><li>Формируются и совершенствуются двигательные реакции.</li><li>Развиваются органы чувств.</li><li>Увеличивается масса и длина тела.</li><li>Постепенно формируются индивидуальные особенности движений плода.</li></ul><h2 id=\"h123\">Медицинское наблюдение</h2><p class=\"lbl\">Во время плановых посещений медицинский специалист:</p><ul><li>Оценивает общее состояние женщины.</li><li>Контролирует артериальное давление и динамику массы тела.</li><li>Оценивает течение беременности.</li><li>При необходимости назначает дополнительные исследования.</li><li>Контролирует результаты ранее проведённых обследований.</li><li>Даёт рекомендации по дальнейшему наблюдению.</li></ul><h2 id=\"h124\">Рекомендации будущей маме</h2><ul><li>Продолжайте регулярно посещать врача.</li><li>Соблюдайте сбалансированный рацион.</li><li>Поддерживайте умеренную физическую активность при отсутствии противопоказаний.</li><li>Обеспечивайте достаточный отдых.</li><li>Следите за изменениями самочувствия.</li><li>При появлении необычных симптомов обращайтесь к врачу.</li></ul><p>Важно: подробные сроки ультразвуковых и иных пренатальных скринингов размещаются в отдельном разделе «Скрининговые исследования».</p>","toc":[{"id":"h121","label":"Что происходит с организмом женщины"},{"id":"h122","label":"Развитие будущего ребёнка"},{"id":"h123","label":"Медицинское наблюдение"},{"id":"h124","label":"Рекомендации будущей маме"}]},{"id":"tretiy-trimestr","title":"Третий триместр","meta":"28 недель – роды","icon":"ri-number-3","html":"<p class=\"lead\">Третий триместр — заключительный этап беременности, во время которого будущий ребёнок активно растёт и готовится к рождению. Для женщины это период подготовки к родам, оценки состояния здоровья и определения дальнейшей тактики медицинского наблюдения.</p><h2 id=\"h125\">Что происходит с организмом женщины</h2><p class=\"lbl\">В третьем триместре могут наблюдаться:</p><ul><li>Увеличение массы тела и живота.</li><li>Повышенная нагрузка на позвоночник и ноги.</li><li>Более частые позывы к мочеиспусканию.</li><li>Изменение характера сна.</li><li>Утомляемость и потребность в отдыхе.</li><li>Тренировочные сокращения матки.</li></ul><h2 id=\"h126\">Развитие будущего ребёнка</h2><p class=\"lbl\">В этот период:</p><ul><li>Продолжается рост и увеличение массы тела.</li><li>Созревают органы и системы.</li><li>Развиваются дыхательная и нервная системы.</li><li>Формируются циклы сна и бодрствования.</li><li>Ребёнок занимает положение, которое оценивается медицинским специалистом перед родами.</li></ul><h2 id=\"h127\">Медицинское наблюдение</h2><p class=\"lbl\">На этом этапе важно:</p><ul><li>Продолжать посещения акушера-гинеколога.</li><li>Выполнять назначенные контрольные исследования.</li><li>Следить за артериальным давлением и общим самочувствием.</li><li>Обращать внимание на характер шевелений плода.</li><li>Обсудить с врачом план родоразрешения.</li><li>Уточнить медицинскую организацию, в которой планируется оказание помощи при родах.</li></ul><p>Согласно стандарту, для беременных с факторами риска на 36-й неделе проводится комиссионная оценка предполагаемого метода и уровня родоразрешения. На 38–40-й неделе при наличии таких факторов проводится повторная оценка плана ведения беременности и решения вопроса о родоразрешении и плановой госпитализации.</p><h2 id=\"h128\">Рекомендации будущей маме</h2><ul><li>Подготовьте документы и вещи для родильного дома.</li><li>Посетите занятия по подготовке к родам.</li><li>Обсудите с врачом возможные варианты обезболивания.</li><li>Узнайте о порядке госпитализации.</li><li>Подготовьте место и необходимые принадлежности для новорождённого.</li><li>Продолжайте следовать индивидуальным рекомендациям врача.</li></ul>","toc":[{"id":"h125","label":"Что происходит с организмом женщины"},{"id":"h126","label":"Развитие будущего ребёнка"},{"id":"h127","label":"Медицинское наблюдение"},{"id":"h128","label":"Рекомендации будущей маме"}]},{"id":"medicinskoe-nablyudenie","title":"Медицинское наблюдение","meta":"","icon":"ri-stethoscope-line","html":"<p class=\"lead\">Медицинское наблюдение во время беременности — это комплекс мероприятий, направленных на контроль состояния здоровья женщины, оценку развития плода, выявление факторов риска и своевременное оказание необходимой медицинской помощи.</p><p class=\"lead\">Наблюдение проводится медицинскими специалистами в соответствии со сроком беременности, состоянием здоровья женщины и индивидуальным планом ведения беременности.</p><h2 id=\"h129\">Кто участвует в наблюдении</h2><p class=\"lbl\">В зависимости от состояния здоровья и медицинских показаний могут привлекаться:</p><ul><li>Врач акушер-гинеколог.</li><li>Акушерка.</li><li>Врач общей практики или терапевт.</li><li>Патронажная медицинская сестра.</li><li>Эндокринолог.</li><li>Кардиолог.</li><li>Другие профильные специалисты.</li></ul><h2 id=\"h130\">Что контролируется во время посещений</h2><ul><li>Общее самочувствие женщины.</li><li>Артериальное давление.</li><li>Масса тела и её динамика.</li><li>Результаты лабораторных исследований.</li><li>Наличие жалоб и симптомов возможных осложнений.</li><li>Состояние молочных желёз и другие показатели по медицинским показаниям.</li><li>Динамика развития беременности.</li><li>Состояние плода в соответствии со сроком беременности и назначенными обследованиями.</li></ul><h2 id=\"h131\">Обследования во время беременности</h2><p>При постановке на учёт стандарт предусматривает первоначальный комплекс лабораторных исследований, в том числе:</p><ul><li>Общий анализ крови.</li><li>Общий анализ мочи.</li><li>Определение группы крови и резус-фактора.</li><li>Обследование на сифилис.</li><li>Обследование на ВИЧ с предварительным консультированием и информированным согласием.</li><li>Исследование маркеров гепатитов B и C.</li><li>Определение уровня глюкозы крови.</li><li>Бактериологическое исследование мочи.</li><li>Исследования отделяемого половых путей.</li><li>Другие исследования в соответствии с установленными требованиями и медицинскими показаниями.</li></ul><p>В дальнейшем врач назначает повторные исследования в предусмотренные сроки. Например, стандарт предусматривает повторный комплекс обследований около 30-й недели беременности.</p><h2 id=\"h132\">Патронажное наблюдение</h2><p>В рамках универсально-прогрессивной модели патронажа предусмотрены дородовые посещения беременной медицинским работником на дому:</p><ul><li>До 12 недель беременности.</li><li>На 32-й неделе беременности.</li></ul><p>При выявлении медицинских или социальных факторов риска может быть организовано дополнительное сопровождение.</p><h2 id=\"h133\">Что важно для будущей мамы</h2><ul><li>Не пропускайте назначенные посещения.</li><li>Своевременно сдавайте назначенные анализы.</li><li>Сообщайте врачу обо всех изменениях самочувствия.</li><li>Храните результаты обследований и медицинские заключения.</li><li>Соблюдайте индивидуальный план наблюдения.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>конкретный перечень обследований и частота посещений определяются действующим стандартом, клиническими протоколами и индивидуальным состоянием беременной. Не все исследования назначаются каждой женщине в одинаковом объёме.</p></div></div>","toc":[{"id":"h129","label":"Кто участвует в наблюдении"},{"id":"h130","label":"Что контролируется во время посещений"},{"id":"h131","label":"Обследования во время беременности"},{"id":"h132","label":"Патронажное наблюдение"},{"id":"h133","label":"Что важно для будущей мамы"}]},{"id":"pitanie-i-obraz-zhizni","title":"Питание и образ жизни","meta":"","icon":"ri-leaf-line","html":"<p class=\"lead\">Во время беременности организм женщины нуждается в полноценном питании, достаточном отдыхе и безопасной физической активности. Здоровый образ жизни помогает поддерживать самочувствие будущей мамы и создаёт благоприятные условия для развития ребёнка.</p><h2 id=\"h134\">Рациональное питание</h2><p class=\"lbl\">Рекомендуется:</p><ul><li>Включать в рацион овощи, фрукты, цельнозерновые продукты.</li><li>Употреблять продукты, содержащие белок: мясо, рыбу, яйца, бобовые и другие подходящие продукты.</li><li>Включать источники кальция и железа.</li><li>Соблюдать достаточный питьевой режим с учётом рекомендаций врача.</li><li>Тщательно мыть овощи и фрукты.</li><li>Соблюдать правила безопасного хранения и приготовления пищи.</li><li>Ограничивать продукты с высоким содержанием сахара, соли и насыщенных жиров.</li></ul><h2 id=\"h135\">Продукты и привычки, которых следует избегать</h2><ul><li>Алкоголь в любом количестве.</li><li>Курение и воздействие табачного дыма.</li><li>Наркотические и психоактивные вещества.</li><li>Самостоятельный приём лекарственных препаратов и биологически активных добавок.</li><li>Непастеризованные молочные продукты и продукты животного происхождения, не прошедшие достаточную термическую обработку.</li><li>Другие продукты, которые врач рекомендовал исключить с учётом состояния здоровья.</li></ul><h2 id=\"h136\">Физическая активность</h2><p class=\"lbl\">При отсутствии медицинских противопоказаний рекомендуется:</p><ul><li>Регулярно гулять на свежем воздухе.</li><li>Выполнять умеренные физические упражнения.</li><li>Использовать специальные занятия для беременных после согласования с врачом.</li><li>Избегать чрезмерных нагрузок и травмоопасных видов спорта.</li><li>Чередовать активность и отдых.</li></ul><h2 id=\"h137\">Сон и отдых</h2><ul><li>Соблюдайте регулярный режим сна.</li><li>Создайте комфортные условия для ночного отдыха.</li><li>При необходимости предусмотрите дополнительное время для отдыха в течение дня.</li><li>Обсудите с врачом способы уменьшения дискомфорта во время сна.</li></ul><h2 id=\"h138\">Витамины и лекарственные препараты</h2><p>Необходимость приёма фолиевой кислоты, железа, йода, витамина D и других препаратов определяется с учётом медицинских рекомендаций и состояния здоровья женщины. Не следует самостоятельно назначать себе витамины или изменять дозировку.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>при наличии хронических заболеваний, осложнённой беременности или других медицинских ограничений физическая активность и питание должны согласовываться с лечащим врачом.</p></div></div>","toc":[{"id":"h134","label":"Рациональное питание"},{"id":"h135","label":"Продукты и привычки, которых следует избегать"},{"id":"h136","label":"Физическая активность"},{"id":"h137","label":"Сон и отдых"},{"id":"h138","label":"Витамины и лекарственные препараты"}]},{"id":"podgotovka-k-rodam","title":"Подготовка к родам","meta":"","icon":"ri-book-open-line","html":"<p class=\"lead\">Подготовка к родам помогает будущей маме получить необходимые знания о процессе родоразрешения, научиться распознавать начало родовой деятельности, подготовиться к пребыванию в родильном доме и снизить тревожность перед предстоящими изменениями.</p><p class=\"lead\">Подготовка проводится в рамках медицинского наблюдения и занятий в школе подготовки к родам.</p><h2 id=\"h139\">Когда начинать подготовку</h2><p>Направление беременной на занятия в школу подготовки к родам начинается с момента постановки на учёт по беременности. Занятия проводят медицинские работники, прошедшие специальную подготовку.</p><h2 id=\"h140\">Что включает подготовка к родам</h2><ul><li>Особенности течения беременности и дородового ухода.</li><li>Потребности женщины в период беременности.</li><li>Основные этапы родовой деятельности.</li><li>Предвестники и признаки начала родов.</li><li>Тревожные симптомы, требующие обращения за медицинской помощью.</li><li>Техники дыхания и расслабления.</li><li>Возможные способы облегчения боли.</li><li>Выбор удобного положения во время схваток и родов.</li><li>Роль партнёра и способы поддержки женщины.</li><li>Подготовка к уходу за новорождённым.</li><li>Основы грудного вскармливания.</li><li>Послеродовое восстановление и контрацепция.</li></ul><h2 id=\"h141\">Как распознать начало родов</h2><p class=\"lbl\">К возможным признакам начала родовой деятельности относятся:</p><ul><li>Регулярные сокращения матки, которые постепенно становятся более частыми и интенсивными.</li><li>Отхождение околоплодных вод.</li><li>Отхождение слизистой пробки.</li><li>Изменение характера ощущений внизу живота и пояснице.</li></ul><p>Отхождение слизистой пробки само по себе не всегда означает, что роды начнутся немедленно.</p><h2 id=\"h142\">Когда необходимо обратиться в родильный дом</h2><ul><li>При регулярных схватках.</li><li>При подозрении на отхождение околоплодных вод.</li><li>При появлении кровянистых выделений.</li><li>При заметном уменьшении или отсутствии привычных шевелений плода.</li><li>При сильной боли или резком ухудшении самочувствия.</li></ul><p>При обильном кровотечении, сильной боли, потере сознания или других признаках неотложного состояния необходимо вызвать скорую помощь.</p><h2 id=\"h143\">Что подготовить к родам</h2><p class=\"lbl\">Рекомендуется заранее подготовить:</p><ul><li>Документ, удостоверяющий личность.</li><li>Медицинские документы и результаты обследований.</li><li>Обменную и другие медицинские документы, выданные медицинской организацией.</li><li>Одежду и средства личной гигиены для матери.</li><li>Одежду и необходимые принадлежности для новорождённого.</li><li>Другие вещи согласно требованиям выбранного родильного дома.</li></ul><h2 id=\"h144\">Партнёрские роды</h2><p>Вопрос участия партнёра следует заранее обсудить с медицинской организацией. Подготовка партнёра может включать информацию о поддержке женщины, помощи во время схваток и взаимодействии с медицинским персоналом.</p>","toc":[{"id":"h139","label":"Когда начинать подготовку"},{"id":"h140","label":"Что включает подготовка к родам"},{"id":"h141","label":"Как распознать начало родов"},{"id":"h142","label":"Когда необходимо обратиться в родильный дом"},{"id":"h143","label":"Что подготовить к родам"},{"id":"h144","label":"Партнёрские роды"}]},{"id":"rody","title":"Роды","meta":"","icon":"ri-hospital-line","html":"<p class=\"lead\">Роды — это физиологический процесс завершения беременности, в результате которого ребёнок появляется на свет. Родоразрешение проводится в медицинской организации с учётом состояния матери, ребёнка, срока беременности и возможных факторов риска.</p><p class=\"lead\">Способ и тактика родоразрешения определяются медицинскими специалистами на основании клинической ситуации.</p><h2 id=\"h145\">Основные периоды родов</h2><h2 id=\"h146\">Первый период — раскрытие шейки матки</h2><p>Начинается с регулярных схваток, приводящих к раскрытию шейки матки.</p><p class=\"lbl\">В этот период:</p><ul><li>Постепенно усиливаются и учащаются схватки.</li><li>Происходит раскрытие шейки матки.</li><li>Медицинский персонал наблюдает за состоянием женщины и ребёнка.</li><li>Женщине могут предлагаться различные положения тела, дыхательные техники и методы облегчения боли.</li></ul><h2 id=\"h147\">Второй период — рождение ребёнка</h2><p>Начинается после полного раскрытия шейки матки и завершается рождением ребёнка.</p><p class=\"lbl\">В этот период:</p><ul><li>Медицинский персонал контролирует состояние матери и плода.</li><li>Женщина выполняет рекомендации акушерской команды.</li><li>При отсутствии противопоказаний обеспечивается возможность выбора удобного положения для родов.</li><li>После рождения ребёнка оценивается его состояние.</li></ul><h2 id=\"h148\">Третий период — рождение последа</h2><p>Начинается после рождения ребёнка и завершается отделением и рождением плаценты и плодных оболочек.</p><p class=\"lbl\">Медицинские работники:</p><ul><li>Контролируют состояние женщины.</li><li>Оценивают кровопотерю.</li><li>Проверяют целостность последа.</li><li>Принимают необходимые меры для профилактики послеродового кровотечения.</li></ul><h2 id=\"h149\">Способы родоразрешения</h2><p class=\"lbl\">В зависимости от медицинских показаний возможны:</p><ul><li>Естественные роды — рождение ребёнка через естественные родовые пути.</li><li>Операция кесарева сечения — хирургический способ родоразрешения, который проводится при наличии медицинских показаний.</li><li>Инструментальное родоразрешение — применение специальных акушерских методов в определённых клинических ситуациях.</li></ul><p>Выбор способа родоразрешения осуществляется врачом с учётом состояния женщины и ребёнка.</p><h2 id=\"h150\">Обезболивание во время родов</h2><p class=\"lbl\">В зависимости от медицинской ситуации и пожеланий женщины могут применяться:</p><ul><li>Немедикаментозные способы облегчения боли.</li><li>Дыхательные техники и методы расслабления.</li><li>Изменение положения тела и движения.</li><li>Медикаментозное обезболивание, включая регионарные методы, при наличии показаний и доступности.</li></ul><p>Возможность и способ обезболивания необходимо заранее обсудить с медицинским специалистом.</p><h2 id=\"h151\">Первый контакт с ребёнком</h2><p>При отсутствии медицинских противопоказаний после рождения рекомендуется ранний контакт матери и ребёнка «кожа к коже», а также поддержка раннего начала грудного вскармливания.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Наличие плана родов не исключает изменения тактики при возникновении медицинских показаний. Главный приоритет — безопасность матери и ребёнка.</p></div></div>","toc":[{"id":"h145","label":"Основные периоды родов"},{"id":"h146","label":"Первый период — раскрытие шейки матки"},{"id":"h147","label":"Второй период — рождение ребёнка"},{"id":"h148","label":"Третий период — рождение последа"},{"id":"h149","label":"Способы родоразрешения"},{"id":"h150","label":"Обезболивание во время родов"},{"id":"h151","label":"Первый контакт с ребёнком"}]},{"id":"poslerodovoe-vosstanovlenie","title":"Послеродовое восстановление","meta":"","icon":"ri-heart-add-line","html":"<p class=\"lead\">Послеродовой период — время восстановления организма женщины после рождения ребёнка. В этот период происходят изменения, связанные с обратным развитием органов и систем, восстановлением гормонального фона, становлением лактации и адаптацией к новому режиму жизни.</p><p class=\"lead\">Восстановление происходит постепенно и индивидуально. Регулярное медицинское наблюдение помогает своевременно выявлять возможные осложнения и получать необходимую помощь.</p><h2 id=\"h152\">Физическое восстановление</h2><p class=\"lbl\">После родов важно:</p><ul><li>Соблюдать рекомендации медицинского персонала.</li><li>Следить за характером послеродовых выделений.</li><li>Соблюдать правила интимной гигиены.</li><li>Постепенно возвращаться к привычной физической активности.</li><li>Уделять внимание питанию и полноценному отдыху.</li><li>Соблюдать рекомендации по уходу за швами после разрывов или кесарева сечения.</li><li>Не поднимать тяжести и не выполнять интенсивные нагрузки без согласования с врачом.</li></ul><h2 id=\"h153\">Медицинское наблюдение после родов</h2><p class=\"lbl\">В соответствии со стандартом акушерско-гинекологической помощи:</p><ul><li>После неосложнённых родов патронажное посещение на дому проводится акушеркой или медицинской сестрой в первые трое суток после выписки из родильного стационара.</li><li>При осложнённом послеродовом периоде патронаж проводит врач акушер-гинеколог или врач общей практики.</li><li>Осмотры врача акушера-гинеколога предусмотрены на 10-е и 30-е сутки после родов.</li><li>При наличии факторов риска или осложнений организуется дополнительное медицинское наблюдение.</li></ul><h2 id=\"h154\">Психологическое восстановление</h2><p>После рождения ребёнка женщина может испытывать усталость, тревогу, эмоциональную чувствительность и трудности адаптации к новому образу жизни.</p><p class=\"lbl\">Рекомендуется:</p><ul><li>Не оставаться один на один с переживаниями.</li><li>Принимать помощь близких.</li><li>По возможности обеспечивать себе полноценный отдых.</li><li>Обсуждать своё эмоциональное состояние с медицинским специалистом.</li><li>При длительном подавленном настроении, сильной тревоге или потере интереса к повседневной жизни обращаться за профессиональной помощью.</li></ul><h2 id=\"h155\">Тревожные признаки после родов</h2><h2 id=\"h156\">Не откладывайте обращение за медицинской помощью</h2><ul><li>Обильное или усиливающееся кровотечение.</li><li>Повышение температуры тела и озноб.</li><li>Сильная или нарастающая боль внизу живота.</li><li>Выделения из половых путей с неприятным запахом.</li><li>Покраснение, болезненность и уплотнение молочной железы в сочетании с температурой.</li><li>Сильная головная боль, нарушение зрения или выраженное повышение артериального давления.</li><li>Одышка, боль в груди или внезапная выраженная слабость.</li><li>Выраженное ухудшение эмоционального состояния или мысли о причинении вреда себе либо ребёнку.</li></ul><p>При сильном кровотечении, одышке, боли в груди, потере сознания или других признаках неотложного состояния необходимо вызвать скорую медицинскую помощь.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>после осложнённых родов, критических состояний, оперативных вмешательств и других неблагоприятных исходов может потребоваться расширенное наблюдение и медицинская реабилитация.</p></div></div>","toc":[{"id":"h152","label":"Физическое восстановление"},{"id":"h153","label":"Медицинское наблюдение после родов"},{"id":"h154","label":"Психологическое восстановление"},{"id":"h155","label":"Тревожные признаки после родов"},{"id":"h156","label":"Не откладывайте обращение за медицинской помощью"}]},{"id":"grudnoe-vskarmlivanie","title":"Грудное вскармливание","meta":"","icon":"ri-hand-heart-line","html":"<p class=\"lead\">Грудное вскармливание — естественный способ питания ребёнка, который обеспечивает его необходимыми питательными веществами и способствует формированию иммунной защиты.</p><p class=\"lead\">Грудное молоко содержит компоненты, необходимые для роста и развития ребёнка, а сам процесс кормления способствует формированию эмоциональной связи между матерью и ребёнком.</p><p>Рекомендуется исключительно грудное вскармливание с рождения до достижения ребёнком 6 месяцев, а после введения прикорма — продолжение грудного вскармливания до двух лет и дольше при желании матери и ребёнка.</p><h2 id=\"h157\">Первые прикладывания к груди</h2><ul><li>При отсутствии медицинских противопоказаний обеспечьте ранний контакт «кожа к коже».</li><li>Начинайте грудное вскармливание как можно раньше после родов.</li><li>Прикладывайте ребёнка к груди по его потребности.</li><li>Обратитесь за помощью к медицинскому работнику, если ребёнку трудно захватить грудь.</li></ul><h2 id=\"h158\">Правильное прикладывание</h2><ul><li>Тело ребёнка должно быть обращено к матери.</li><li>Голова и туловище ребёнка должны находиться на одной линии.</li><li>Рот ребёнка широко открыт.</li><li>Подбородок касается груди.</li><li>Ребёнок захватывает не только сосок, но и значительную часть ареолы.</li><li>Во время кормления наблюдаются сосательные движения и глотание.</li></ul><h2 id=\"h159\">Как понять, что ребёнок получает достаточно молока</h2><p class=\"lbl\">Обращайте внимание на:</p><ul><li>Активность ребёнка во время кормления.</li><li>Наличие глотательных движений.</li><li>Количество мочеиспусканий.</li><li>Динамику массы тела.</li><li>Общее самочувствие и поведение ребёнка.</li></ul><p>Оценку достаточности питания следует проводить с учётом возраста ребёнка и рекомендаций медицинского специалиста.</p><h2 id=\"h160\">Распространённые трудности грудного вскармливания</h2><p class=\"lbl\">В первые недели могут возникать:</p><ul><li>Болезненность сосков.</li><li>Трудности с правильным прикладыванием.</li><li>Ощущение недостатка грудного молока.</li><li>Нагрубание молочных желёз.</li><li>Застой молока.</li><li>Трещины сосков.</li></ul><p>При появлении таких проблем рекомендуется обратиться к акушерке, патронажной медицинской сестре или специалисту по поддержке грудного вскармливания.</p><h2 id=\"h161\">Сцеживание грудного молока</h2><p class=\"lbl\">Сцеживание может потребоваться при определённых обстоятельствах, например:</p><ul><li>При необходимости временно разлучаться с ребёнком.</li><li>При выраженном нагрубании молочных желёз.</li><li>При необходимости поддержания лактации.</li><li>По медицинским показаниям.</li></ul><p>Медицинский работник может обучить правильной технике ручного сцеживания и правилам хранения грудного молока.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Не прекращайте грудное вскармливание самостоятельно при возникновении трудностей. Многие проблемы можно решить с помощью правильного прикладывания и своевременной консультации специалиста.</p></div></div>","toc":[{"id":"h157","label":"Первые прикладывания к груди"},{"id":"h158","label":"Правильное прикладывание"},{"id":"h159","label":"Как понять, что ребёнок получает достаточно молока"},{"id":"h160","label":"Распространённые трудности грудного вскармливания"},{"id":"h161","label":"Сцеживание грудного молока"}]},{"id":"poslerodovaya-kontracepciya","title":"Послеродовая контрацепция","meta":"","icon":"ri-shield-check-line","html":"<p class=\"lead\">Послеродовая контрацепция — это подбор методов предупреждения нежелательной беременности после рождения ребёнка.</p><p class=\"lead\">После родов восстановление репродуктивной функции происходит индивидуально. Наступление новой беременности возможно даже до восстановления менструального цикла, в том числе в период грудного вскармливания.</p><p>Поэтому вопрос контрацепции рекомендуется обсудить с медицинским специалистом ещё во время беременности или после родов.</p><h2 id=\"h162\">Какие методы могут применяться</h2><p>В зависимости от состояния здоровья, наличия грудного вскармливания и времени после родов могут рассматриваться:</p><ul><li>Барьерные методы: мужские и женские презервативы.</li><li>Прогестинсодержащие методы: отдельные гормональные препараты, импланты и другие формы.</li><li>Внутриматочная контрацепция: установка внутриматочного средства в допустимые сроки и при отсутствии противопоказаний.</li><li>Естественные методы: в том числе метод лактационной аменореи при соблюдении всех необходимых условий.</li></ul><h2 id=\"h163\">Метод лактационной аменореи</h2><p>Метод основан на временном подавлении овуляции при исключительно грудном вскармливании.</p><p class=\"lbl\">Он может использоваться как метод контрацепции только при одновременном соблюдении трёх условий:</p><ol><li>Ребёнку ещё не исполнилось 6 месяцев.</li><li>У женщины не восстановилась менструация.</li><li>Ребёнок находится на исключительно или практически исключительно грудном вскармливании с частыми кормлениями днём и ночью.</li></ol><p>Если хотя бы одно из условий перестаёт выполняться, необходимо обсудить с медицинским специалистом другой метод контрацепции.</p><h2 id=\"h164\">Как выбрать подходящий метод</h2><p class=\"lbl\">При выборе контрацепции учитываются:</p><ul><li>Срок после родов.</li><li>Наличие грудного вскармливания.</li><li>Состояние здоровья женщины.</li><li>Наличие хронических заболеваний и противопоказаний.</li><li>Предпочтения женщины и её репродуктивные планы.</li></ul><h2 id=\"h165\">Когда обратиться к специалисту</h2><ul><li>До выписки из родильного дома — для получения первичной информации.</li><li>Во время послеродового патронажа.</li><li>На плановом осмотре акушера-гинеколога.</li><li>При необходимости сменить или подобрать метод контрацепции.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>метод контрацепции подбирается индивидуально. Не следует самостоятельно начинать приём гормональных препаратов или устанавливать внутриматочные средства.</p></div></div>","toc":[{"id":"h162","label":"Какие методы могут применяться"},{"id":"h163","label":"Метод лактационной аменореи"},{"id":"h164","label":"Как выбрать подходящий метод"},{"id":"h165","label":"Когда обратиться к специалисту"}]}]},{"id":"chronic","title":"Хронические заболевания и ПУЗ","full":"Хронические заболевания и программа управления заболеваниями (ПУЗ)","aud":"Пациенты с хроническими заболеваниями","art":"tonometer","tone":"brand","desc":"Для пациентов с хроническими заболеваниями и факторами риска","subs":[{"id":"chto-takoe-dinamicheskoe-nablyudenie","title":"Что такое динамическое наблюдение","icon":"ri-calendar-schedule-line","plan":"Цели, порядок наблюдения, роль медицинской организации, периодичность посещений и обследований","html":"","toc":[]},{"id":"chto-takoe-puz","title":"Что такое ПУЗ","icon":"ri-stack-line","plan":"Описание программы, её задачи, принципы совместной работы пациента и медицинской команды","html":"","toc":[],"blocks":["О программе","Задачи программы","Совместная работа пациента и медицинской команды"]},{"id":"komu-dostupna-puz","title":"Кому доступна ПУЗ","icon":"ri-group-line","plan":"Перечень заболеваний и критерии включения в программу согласно действующим правилам","html":"","toc":[]},{"id":"arterialnaya-gipertenziya","title":"Артериальная гипертензия","icon":"ri-heart-pulse-line","plan":"Что такое повышенное артериальное давление, контроль АД, рекомендации по образу жизни и наблюдению","html":"","toc":[]},{"id":"saharnyy-diabet-2-go-tipa","title":"Сахарный диабет 2-го типа","icon":"ri-drop-line","plan":"Контроль гликемии, роль HbA1c, питание, физическая активность, соблюдение назначенной терапии","html":"","toc":[]},{"id":"hronicheskaya-serdechnaya-nedostatochnost","title":"Хроническая сердечная недостаточность","icon":"ri-heart-3-line","plan":"Основные симптомы, контроль самочувствия, массы тела и других показателей по индивидуальным рекомендациям врача","html":"","toc":[]},{"id":"samokontrol","title":"Самоконтроль","icon":"ri-todo-line","plan":"Ведение дневника показателей, фиксация изменений состояния, контроль выполнения рекомендаций","html":"","toc":[]},{"id":"segmentaciya-pacientov","title":"Сегментация пациентов","icon":"ri-pie-chart-2-line","plan":"Описание категорий риска и соответствующих мероприятий в рамках используемой медицинской организацией модели ПУЗ","html":"","toc":[]},{"id":"preduprezhdenie-oslozhneniy","title":"Предупреждение осложнений","icon":"ri-shield-cross-line","plan":"Информация о факторах риска, признаках ухудшения состояния и необходимости своевременного обращения к врачу","html":"","toc":[]}]},{"id":"longevity","title":"Здоровое долголетие","aud":"Взрослые и пожилые люди","art":"plant","tone":"green","desc":"Питание, активность, профилактика падений и когнитивное здоровье","subs":[{"id":"zdorovoe-starenie","title":"Здоровое старение","meta":"","icon":"ri-seedling-line","html":"<p class=\"lead\">Здоровое старение — это процесс сохранения физического, психологического и социального благополучия человека по мере взросления. Главная задача — как можно дольше поддерживать самостоятельность, активность и возможность участвовать в повседневной жизни.</p><p class=\"lead\">Возрастные изменения затрагивают работу различных органов и систем, однако их выраженность индивидуальна. Правильный образ жизни, профилактика заболеваний и регулярное медицинское наблюдение помогают поддерживать качество жизни в старшем возрасте.</p><p class=\"lbl\">Основные принципы здорового старения:</p><ul><li>Сохранение физической активности и двигательной самостоятельности.</li><li>Полноценное и сбалансированное питание.</li><li>Поддержание памяти, внимания и интеллектуальной активности.</li><li>Контроль хронических заболеваний.</li><li>Сохранение зрения и слуха.</li><li>Профилактика падений и травм.</li><li>Поддержание социальных контактов и эмоционального благополучия.</li><li>Своевременное обращение за медицинской помощью.</li></ul><h2 id=\"h166\">Какие изменения могут происходить с возрастом</h2><ul><li>Постепенное снижение мышечной силы и выносливости.</li><li>Изменение плотности костной ткани.</li><li>Снижение остроты зрения и слуха.</li><li>Изменение скорости реакции и обработки информации.</li><li>Повышение чувствительности к некоторым лекарственным препаратам.</li><li>Изменение качества сна и режима отдыха.</li></ul><p>Эти изменения не обязательно приводят к потере самостоятельности. Многие возрастные риски можно уменьшить благодаря профилактике и своевременной медицинской помощи.</p><h2 id=\"h167\">Как сохранить самостоятельность</h2><ul><li>Поддерживайте привычную физическую активность.</li><li>Выполняйте повседневные действия самостоятельно, если это безопасно.</li><li>Продолжайте заниматься любимыми делами.</li><li>Поддерживайте общение с семьёй и друзьями.</li><li>Регулярно проходите медицинские осмотры.</li><li>Следуйте рекомендациям врача по контролю хронических заболеваний.</li></ul><h2 id=\"h168\">Когда стоит обратиться к врачу</h2><p>Если появились частые падения, выраженная слабость, заметное снижение памяти, трудности с передвижением или резкое ухудшение способности выполнять привычные действия, рекомендуется обратиться к врачу.</p>","toc":[{"id":"h166","label":"Какие изменения могут происходить с возрастом"},{"id":"h167","label":"Как сохранить самостоятельность"},{"id":"h168","label":"Когда стоит обратиться к врачу"}]},{"id":"racionalnoe-pitanie","title":"Рациональное питание","meta":"","icon":"ri-restaurant-2-line","html":"<p class=\"lead\">С возрастом потребности организма в питательных веществах могут изменяться. Полноценное питание помогает поддерживать мышечную силу, здоровье костей, работу иммунной системы и общее самочувствие.</p><p class=\"lead\">Рацион пожилого человека должен быть разнообразным, сбалансированным и учитывать состояние здоровья, уровень физической активности, особенности пищеварения и наличие хронических заболеваний.</p><h2 id=\"h169\">Основные принципы питания</h2><ul><li>Включайте в рацион овощи, фрукты и продукты, содержащие пищевые волокна.</li><li>Употребляйте достаточное количество белковых продуктов: рыбу, мясо, яйца, молочные продукты и бобовые.</li><li>Выбирайте разнообразные источники сложных углеводов и цельнозерновые продукты.</li><li>Учитывайте потребность организма в кальции и витамине D.</li><li>Ограничивайте избыточное потребление соли, сахара и насыщенных жиров.</li><li>Поддерживайте достаточный питьевой режим, если врачом не установлены ограничения.</li></ul><h2 id=\"h170\">Почему важно достаточное потребление белка</h2><p>Белок необходим для поддержания мышечной массы, восстановления тканей и сохранения физической силы.</p><p>С возрастом при недостаточном питании может повышаться риск потери мышечной массы и развития саркопении — состояния, сопровождающегося снижением мышечной силы и физической работоспособности.</p><p class=\"lbl\">Для поддержания мышечной массы рекомендуется:</p><ul><li>Включать источники белка в основные приёмы пищи.</li><li>Избегать длительных ограничительных диет без медицинских показаний.</li><li>Сочетать полноценное питание с подходящей физической активностью.</li><li>При снижении аппетита или массы тела обращаться к врачу.</li></ul><h2 id=\"h171\">Особенности питания при хронических заболеваниях</h2><p>При сахарном диабете, заболеваниях почек, сердечно-сосудистой системы и других хронических состояниях рацион может требовать индивидуальной коррекции.</p><p class=\"lbl\">Например:</p><ul><li>При сахарном диабете важно контролировать количество и качество углеводов.</li><li>При некоторых заболеваниях почек может потребоваться корректировка потребления белка, соли, калия и жидкости.</li><li>При сердечно-сосудистых заболеваниях важно учитывать рекомендации по потреблению соли и насыщенных жиров.</li></ul><h2 id=\"h172\">Рекомендации</h2><ul><li>Соблюдайте регулярный режим питания.</li><li>Не пропускайте приёмы пищи при отсутствии медицинских рекомендаций.</li><li>Учитывайте изменения аппетита и вкусовых ощущений.</li><li>При проблемах с жеванием или глотанием обратитесь к врачу.</li><li>Не принимайте витаминные комплексы и пищевые добавки бесконтрольно.</li></ul><h2 id=\"h173\">Когда необходимо обратиться к врачу</h2><p>Если наблюдается непреднамеренное снижение массы тела, длительное отсутствие аппетита, трудности при жевании или глотании, выраженная слабость или признаки обезвоживания, рекомендуется обратиться к медицинскому специалисту.</p>","toc":[{"id":"h169","label":"Основные принципы питания"},{"id":"h170","label":"Почему важно достаточное потребление белка"},{"id":"h171","label":"Особенности питания при хронических заболеваниях"},{"id":"h172","label":"Рекомендации"},{"id":"h173","label":"Когда необходимо обратиться к врачу"}]},{"id":"fizicheskaya-aktivnost","title":"Физическая активность","meta":"","icon":"ri-run-line","html":"<p class=\"lead\">Регулярная физическая активность помогает поддерживать мышечную силу, подвижность суставов, равновесие и самостоятельность в повседневной жизни.</p><p class=\"lead\">Даже умеренная двигательная активность может положительно влиять на состояние сердечно-сосудистой системы, настроение, сон и общее самочувствие.</p><h2 id=\"h174\">Основные виды физической активности</h2><h2 id=\"h175\">Ходьба</h2><ul><li>Регулярные прогулки на свежем воздухе.</li><li>Выбор комфортного темпа с учётом физического состояния.</li><li>Постепенное увеличение продолжительности прогулок.</li><li>Использование устойчивой обуви и вспомогательных средств передвижения при необходимости.</li></ul><h2 id=\"h176\">Упражнения для поддержания силы</h2><ul><li>Упражнения с собственным весом.</li><li>Подъёмы со стула.</li><li>Упражнения для мышц рук и ног.</li><li>Лёгкие силовые упражнения с использованием доступного инвентаря.</li></ul><h2 id=\"h177\">Упражнения для гибкости</h2><ul><li>Мягкая суставная гимнастика.</li><li>Упражнения на подвижность плеч, рук и ног.</li><li>Аккуратное растяжение мышц без резких движений.</li></ul><h2 id=\"h178\">Упражнения для равновесия</h2><ul><li>Перенос веса тела с одной ноги на другую при наличии устойчивой опоры.</li><li>Упражнения на координацию.</li><li>Тренировка устойчивости в безопасных условиях.</li><li>Специальные занятия лечебной физкультурой по рекомендации специалиста.</li></ul><h2 id=\"h179\">Как правильно организовать физическую активность</h2><ul><li>Начинайте с небольших нагрузок.</li><li>Увеличивайте интенсивность постепенно.</li><li>Избегайте резких движений и чрезмерного перенапряжения.</li><li>Используйте устойчивую обувь.</li><li>При наличии хронических заболеваний согласуйте программу занятий с врачом.</li><li>При головокружении, боли в груди, выраженной одышке или слабости прекратите занятие и обратитесь за медицинской помощью.</li></ul><h2 id=\"h180\">Когда нужна консультация врача</h2><p>Перед началом новых физических нагрузок рекомендуется проконсультироваться с врачом, если имеются заболевания сердца, выраженные нарушения равновесия, заболевания суставов, частые падения или другие ограничения.</p>","toc":[{"id":"h174","label":"Основные виды физической активности"},{"id":"h175","label":"Ходьба"},{"id":"h176","label":"Упражнения для поддержания силы"},{"id":"h177","label":"Упражнения для гибкости"},{"id":"h178","label":"Упражнения для равновесия"},{"id":"h179","label":"Как правильно организовать физическую активность"},{"id":"h180","label":"Когда нужна консультация врача"}]},{"id":"profilaktika-padeniy","title":"Профилактика падений","meta":"","icon":"ri-walk-line","html":"<p class=\"lead\">Падения являются одной из распространённых причин травм и потери самостоятельности у людей старшего возраста. Снижение мышечной силы, нарушения равновесия, ухудшение зрения и некоторые хронические заболевания могут повышать риск падений.</p><p class=\"lead\">Профилактика падений направлена на создание безопасной домашней среды, поддержание физической активности и своевременное выявление факторов риска.</p><h2 id=\"h181\">Как сделать дом безопаснее</h2><ul><li>Уберите незакреплённые ковры и предметы, о которые можно споткнуться.</li><li>Обеспечьте хорошее освещение комнат, коридоров и лестниц.</li><li>Установите поручни в ванной комнате и возле лестниц при необходимости.</li><li>Используйте нескользящие покрытия.</li><li>Не оставляйте провода и другие препятствия на проходах.</li><li>Размещайте часто используемые предметы на доступной высоте.</li><li>Обеспечьте удобный и безопасный доступ к кровати и санузлу.</li></ul><h2 id=\"h182\">Правильная обувь и одежда</h2><ul><li>Используйте удобную обувь с нескользящей подошвой.</li><li>Избегайте обуви, которая плохо фиксируется на ноге.</li><li>Не носите слишком длинную одежду, о которую можно споткнуться.</li><li>При необходимости используйте трость, ходунки или другие рекомендованные средства опоры.</li></ul><h2 id=\"h183\">Поддержание равновесия и мышечной силы</h2><ul><li>Регулярно выполняйте упражнения для ног.</li><li>Поддерживайте физическую активность.</li><li>При необходимости проходите занятия лечебной физкультурой.</li><li>Обсудите с врачом частые головокружения и нарушения равновесия.</li></ul><h2 id=\"h184\">Лекарственные препараты и риск падений</h2><p>Некоторые препараты могут вызывать головокружение, сонливость, снижение артериального давления и нарушение координации.</p><p>Сообщите врачу обо всех принимаемых лекарственных средствах, особенно если падения повторяются.</p><h2 id=\"h185\">Что делать после падения</h2><ul><li>Оцените общее состояние пострадавшего.</li><li>Не пытайтесь самостоятельно поднимать человека, если есть подозрение на перелом или травму позвоночника.</li><li>При сильной боли, потере сознания, кровотечении или невозможности встать вызовите скорую помощь.</li><li>Даже при отсутствии видимых повреждений после повторных падений обратитесь к врачу для оценки причин.</li></ul>","toc":[{"id":"h181","label":"Как сделать дом безопаснее"},{"id":"h182","label":"Правильная обувь и одежда"},{"id":"h183","label":"Поддержание равновесия и мышечной силы"},{"id":"h184","label":"Лекарственные препараты и риск падений"},{"id":"h185","label":"Что делать после падения"}]},{"id":"kognitivnoe-zdorove","title":"Когнитивное здоровье","meta":"","icon":"ri-brain-line","html":"<p class=\"lead\">Когнитивное здоровье — это способность человека сохранять память, внимание, мышление, речь и навыки принятия решений.</p><p class=\"lead\">С возрастом скорость обработки информации и некоторые когнитивные функции могут изменяться. Однако выраженное ухудшение памяти, мышления или способности выполнять привычные действия не следует считать неизбежной частью старения.</p><p>Поддержание интеллектуальной и социальной активности помогает сохранять познавательные способности и качество жизни.</p><h2 id=\"h186\">Как поддерживать память и внимание</h2><ul><li>Читайте книги, газеты и другие материалы.</li><li>Решайте кроссворды, головоломки и логические задачи.</li><li>Изучайте новые навыки и осваивайте интересные занятия.</li><li>Поддерживайте регулярный режим дня.</li><li>Общайтесь с близкими и друзьями.</li><li>Занимайтесь физической активностью с учётом состояния здоровья.</li><li>Обеспечивайте полноценный сон.</li></ul><h2 id=\"h187\">Повседневные привычки для поддержания когнитивного здоровья</h2><ul><li>Планируйте дела и записывайте важную информацию.</li><li>Используйте календарь и напоминания.</li><li>Поддерживайте интерес к окружающему миру.</li><li>Чередуйте умственную активность и отдых.</li><li>Избегайте социальной изоляции.</li><li>Контролируйте хронические заболевания.</li></ul><h2 id=\"h188\">Когда необходимо обратиться к врачу</h2><p class=\"lbl\">Обратитесь за медицинской консультацией, если:</p><ul><li>Ухудшение памяти мешает повседневной жизни.</li><li>Человек часто забывает важные события и договорённости.</li><li>Возникают трудности с ориентацией во времени или пространстве.</li><li>Появляются проблемы с выполнением привычных действий.</li><li>Наблюдаются выраженные изменения поведения или личности.</li><li>Человек испытывает трудности с подбором слов и пониманием речи.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Внезапное появление спутанности сознания, нарушения речи, асимметрии лица или слабости в конечностях требует экстренной медицинской помощи. Такие симптомы могут указывать на острое заболевание, в том числе инсульт.</p></div></div>","toc":[{"id":"h186","label":"Как поддерживать память и внимание"},{"id":"h187","label":"Повседневные привычки для поддержания когнитивного здоровья"},{"id":"h188","label":"Когда необходимо обратиться к врачу"}]},{"id":"psihologicheskoe-blagopoluchie","title":"Психологическое благополучие","meta":"","icon":"ri-mental-health-line","html":"<p class=\"lead\">Психологическое благополучие — важная составляющая здорового старения. Эмоциональное состояние, поддержка близких, социальные контакты и возможность сохранять самостоятельность влияют на качество жизни человека в пожилом возрасте.</p><p class=\"lead\">С возрастом могут происходить изменения в привычном образе жизни, семейных отношениях, состоянии здоровья и социальной активности. Важно своевременно обращать внимание на эмоциональные трудности и при необходимости обращаться за помощью.</p><h2 id=\"h189\">Какие состояния могут возникать</h2><ul><li>Чувство одиночества и социальной изоляции.</li><li>Повышенная тревожность.</li><li>Длительное подавленное настроение.</li><li>Снижение интереса к привычным занятиям.</li><li>Переживания, связанные с ухудшением здоровья.</li><li>Трудности адаптации после выхода на пенсию или утраты близких.</li></ul><h2 id=\"h190\">Как поддерживать психологическое здоровье</h2><ul><li>Поддерживайте регулярное общение с родственниками и друзьями.</li><li>Сохраняйте интерес к любимым занятиям.</li><li>Участвуйте в общественной и культурной жизни.</li><li>Находите время для прогулок и отдыха.</li><li>Обсуждайте переживания с близкими.</li><li>Не стесняйтесь обращаться за психологической помощью.</li><li>Поддерживайте привычный распорядок дня.</li></ul><h2 id=\"h191\">Роль семьи и близких</h2><p class=\"lbl\">Родственники и лица, осуществляющие уход, могут помочь:</p><ul><li>Поддерживать общение и эмоциональный контакт.</li><li>Сохранять самостоятельность пожилого человека.</li><li>Помогать в организации повседневной жизни.</li><li>Обращать внимание на изменения настроения и поведения.</li><li>Своевременно организовывать обращение к специалистам.</li></ul><h2 id=\"h192\">Когда необходимо обратиться за помощью</h2><p class=\"lbl\">Рекомендуется обратиться к специалисту, если:</p><ul><li>Подавленное настроение сохраняется длительное время.</li><li>Человек теряет интерес к привычным занятиям.</li><li>Появляются выраженные нарушения сна и аппетита.</li><li>Возникает постоянное чувство тревоги.</li><li>Человек отказывается от общения и повседневной активности.</li><li>Наблюдаются резкие изменения поведения.</li></ul><h2 id=\"h193\">Куда обратиться</h2><p>За помощью можно обратиться к врачу ПМСП, психологу или психиатру. При необходимости медицинский специалист организует дальнейшее обследование и лечение.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Если человек высказывает намерение причинить вред себе или другим, необходимо незамедлительно обратиться за экстренной помощью по номеру 103.</p></div></div>","toc":[{"id":"h189","label":"Какие состояния могут возникать"},{"id":"h190","label":"Как поддерживать психологическое здоровье"},{"id":"h191","label":"Роль семьи и близких"},{"id":"h192","label":"Когда необходимо обратиться за помощью"},{"id":"h193","label":"Куда обратиться"}]},{"id":"zrenie-i-sluh","title":"Зрение и слух","meta":"","icon":"ri-eye-line","html":"<p class=\"lead\">С возрастом могут происходить изменения зрения и слуха, которые влияют на способность человека читать, передвигаться, общаться и самостоятельно выполнять повседневные действия.</p><p class=\"lead\">Своевременная диагностика нарушений и использование средств коррекции помогают поддерживать качество жизни и снижать риск травм и социальной изоляции.</p><h2 id=\"h194\">Здоровье зрения</h2><p class=\"lbl\">С возрастом могут наблюдаться:</p><ul><li>Снижение остроты зрения.</li><li>Трудности при чтении мелкого текста.</li><li>Ухудшение зрения в условиях недостаточного освещения.</li><li>Повышенная чувствительность к яркому свету.</li><li>Возрастные заболевания глаз, включая катаракту, глаукому и возрастную макулярную дегенерацию.</li></ul><h2 id=\"h195\">Рекомендации по сохранению зрения</h2><ul><li>Регулярно проходите осмотр офтальмолога.</li><li>Используйте очки или другие средства коррекции по назначению специалиста.</li><li>Обеспечьте хорошее освещение дома.</li><li>Не занимайтесь самолечением глазными препаратами.</li><li>Обращайтесь к врачу при изменении остроты зрения.</li></ul><h2 id=\"h196\">Здоровье слуха</h2><p class=\"lbl\">Возрастные изменения слуха могут проявляться:</p><ul><li>Трудностями при восприятии речи.</li><li>Необходимостью увеличивать громкость телевизора.</li><li>Частыми просьбами повторить сказанное.</li><li>Ощущением шума или звона в ушах.</li><li>Затруднениями при общении в шумной обстановке.</li></ul><h2 id=\"h197\">Рекомендации по сохранению слуха</h2><ul><li>Обращайтесь к оториноларингологу или сурдологу при снижении слуха.</li><li>Избегайте длительного воздействия громких звуков.</li><li>Не используйте посторонние предметы для глубокого очищения ушей.</li><li>При необходимости обсудите со специалистом использование слухового аппарата.</li><li>Регулярно проверяйте состояние слуха при наличии жалоб и факторов риска.</li></ul><h2 id=\"h198\">Когда необходимо обратиться к врачу</h2><ul><li>При внезапном снижении или потере зрения.</li><li>При внезапном ухудшении слуха.</li><li>При боли в глазах или ушах.</li><li>При появлении вспышек света, резкого увеличения количества плавающих помутнений или ощущения «занавеса» перед глазами.</li><li>При выраженном головокружении и нарушении равновесия.</li></ul><p>Внезапная потеря зрения или слуха требует срочной медицинской оценки.</p>","toc":[{"id":"h194","label":"Здоровье зрения"},{"id":"h195","label":"Рекомендации по сохранению зрения"},{"id":"h196","label":"Здоровье слуха"},{"id":"h197","label":"Рекомендации по сохранению слуха"},{"id":"h198","label":"Когда необходимо обратиться к врачу"}]},{"id":"lekarstvennaya-bezopasnost","title":"Лекарственная безопасность","meta":"","icon":"ri-capsule-line","html":"<p class=\"lead\">С возрастом организм может иначе реагировать на лекарственные препараты. Изменения функции почек и печени, наличие нескольких хронических заболеваний и одновременный приём разных лекарств повышают вероятность нежелательных реакций и лекарственных взаимодействий.</p><p class=\"lead\">Лекарственная безопасность предполагает правильное применение препаратов в соответствии с назначениями медицинского специалиста.</p><h2 id=\"h199\">Основные правила безопасного приёма лекарств</h2><ul><li>Принимайте препараты в назначенной дозировке и в установленное время.</li><li>Не отменяйте и не заменяйте лекарственные средства самостоятельно.</li><li>Не увеличивайте и не уменьшайте дозировку без согласования с врачом.</li><li>Сообщайте врачу обо всех принимаемых лекарствах, включая препараты без рецепта.</li><li>Информируйте специалиста о витаминах, биологически активных добавках и растительных средствах.</li><li>Не принимайте препараты, назначенные другим людям.</li><li>Проверяйте срок годности и условия хранения лекарственных средств.</li></ul><h2 id=\"h200\">Почему важно сообщать врачу обо всех препаратах</h2><p class=\"lbl\">Одновременное применение нескольких лекарственных средств может приводить к:</p><ul><li>Усилению или ослаблению действия отдельных препаратов.</li><li>Нежелательным лекарственным взаимодействиям.</li><li>Головокружению и снижению артериального давления.</li><li>Повышению риска падений.</li><li>Сонливости и нарушениям концентрации внимания.</li><li>Другим нежелательным реакциям.</li></ul><h2 id=\"h201\">Как организовать приём лекарств</h2><ul><li>Составьте актуальный список всех принимаемых препаратов.</li><li>Записывайте название, дозировку и время приёма.</li><li>Используйте органайзер для лекарств при необходимости.</li><li>Храните препараты в соответствии с инструкцией.</li><li>Берите список лекарств с собой на медицинские консультации.</li></ul><h2 id=\"h202\">Когда необходимо обратиться к врачу</h2><p>Обратитесь к специалисту, если после начала приёма препарата появились необычные симптомы, головокружение, выраженная слабость, сыпь, отёки или другие нежелательные реакции.</p><p>При затруднённом дыхании, отёке лица или языка, потере сознания и других признаках тяжёлой аллергической реакции необходимо немедленно вызвать скорую медицинскую помощь.</p><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Периодический пересмотр лекарственной терапии врачом помогает оценивать необходимость каждого препарата, его эффективность, безопасность и возможные взаимодействия.</p></div></div>","toc":[{"id":"h199","label":"Основные правила безопасного приёма лекарств"},{"id":"h200","label":"Почему важно сообщать врачу обо всех препаратах"},{"id":"h201","label":"Как организовать приём лекарств"},{"id":"h202","label":"Когда необходимо обратиться к врачу"}]},{"id":"profilaktika-oslozhneniy-hronicheskih-zabolevani","title":"Профилактика осложнений хронических заболеваний","meta":"","icon":"ri-pulse-line","html":"<p class=\"lead\">С возрастом вероятность наличия нескольких хронических заболеваний одновременно может увеличиваться. Регулярное медицинское наблюдение, контроль основных показателей здоровья и соблюдение назначенного лечения помогают снизить риск осложнений и сохранить самостоятельность.</p><p class=\"lbl\">К хроническим заболеваниям, требующим особого внимания, относятся:</p><ul><li>Артериальная гипертензия.</li><li>Ишемическая болезнь сердца.</li><li>Сахарный диабет.</li><li>Хронические заболевания органов дыхания.</li><li>Заболевания почек.</li><li>Остеопороз.</li><li>Заболевания суставов.</li><li>Неврологические заболевания.</li></ul><h2 id=\"h203\">Контроль состояния здоровья</h2><p class=\"lbl\">В зависимости от заболевания врач может рекомендовать контролировать:</p><ul><li>Артериальное давление.</li><li>Уровень глюкозы крови.</li><li>Массу тела.</li><li>Уровень холестерина.</li><li>Функцию почек.</li><li>Другие показатели в соответствии с диагнозом.</li></ul><h2 id=\"h204\">Как предупредить осложнения</h2><ul><li>Соблюдайте план динамического наблюдения.</li><li>Регулярно посещайте лечащего врача.</li><li>Принимайте назначенные препараты согласно рекомендациям.</li><li>Не изменяйте схему лечения самостоятельно.</li><li>Поддерживайте подходящий уровень физической активности.</li><li>Соблюдайте рекомендации по питанию.</li><li>Откажитесь от курения и ограничьте воздействие табачного дыма.</li><li>Своевременно сообщайте врачу об изменениях самочувствия.</li></ul><h2 id=\"h205\">Динамическое наблюдение</h2><p>При наличии хронического заболевания пациенту может быть организовано динамическое наблюдение в соответствии с установленными правилами. Оно предусматривает регулярную оценку состояния здоровья, контроль заболевания, выполнение назначенных исследований и корректировку лечения медицинским специалистом.</p><h2 id=\"h206\">Когда необходимо обратиться к врачу</h2><ul><li>При ухудшении контроля хронического заболевания.</li><li>При появлении новых или усиливающихся симптомов.</li><li>При изменении привычных показателей артериального давления или глюкозы.</li><li>При возникновении побочных реакций на препараты.</li><li>При частых обострениях заболевания.</li></ul><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>При внезапной боли в груди, выраженной одышке, нарушении речи, асимметрии лица или внезапной слабости в конечностях необходимо немедленно вызвать скорую медицинскую помощь по номеру 103.</p><a class=\"sos\" href=\"tel:103\"><i class=\"ri-phone-fill\" aria-hidden=\"true\"></i>Скорая помощь — 103</a></div></div>","toc":[{"id":"h203","label":"Контроль состояния здоровья"},{"id":"h204","label":"Как предупредить осложнения"},{"id":"h205","label":"Динамическое наблюдение"},{"id":"h206","label":"Когда необходимо обратиться к врачу"}]},{"id":"geriatricheskaya-pomosch","title":"Гериатрическая помощь","meta":"","icon":"ri-hand-heart-line","html":"<p class=\"lead\">Гериатрическая помощь — это специализированная медицинская помощь людям старших возрастных групп, учитывающая возрастные особенности организма, наличие хронических заболеваний, функциональные ограничения и потребность в сохранении самостоятельности.</p><p class=\"lead\">Её основная цель — поддержание качества жизни, профилактика возрастных осложнений, раннее выявление гериатрических синдромов и обеспечение комплексного медицинского сопровождения.</p><h2 id=\"h207\">Кому предназначена гериатрическая помощь</h2><p class=\"lbl\">Гериатрическая помощь предназначена для:</p><ul><li>Людей старших возрастных групп.</li><li>Пациентов с признаками преждевременного старения.</li><li>Людей с несколькими хроническими заболеваниями.</li><li>Пациентов с нарушениями памяти, равновесия и двигательной активности.</li><li>Людей с повышенным риском падений и переломов.</li><li>Пациентов, нуждающихся в комплексной оценке функционального состояния.</li></ul><p>При этом обращение за гериатрической помощью определяется не только возрастом, но и состоянием здоровья, функциональными возможностями и медицинскими показаниями.</p><h2 id=\"h208\">Что включает гериатрическая помощь</h2><ul><li>Оценку общего состояния здоровья.</li><li>Выявление возрастных изменений и гериатрических синдромов.</li><li>Оценку физической активности и способности к самообслуживанию.</li><li>Оценку когнитивного и эмоционального состояния.</li><li>Анализ принимаемых лекарственных препаратов.</li><li>Выявление риска падений и переломов.</li><li>Разработку рекомендаций по сохранению самостоятельности.</li><li>Направление к профильным специалистам при необходимости.</li></ul><h2 id=\"h209\">Кто оказывает гериатрическую помощь</h2><p class=\"lbl\">В зависимости от потребностей пациента в оказании помощи могут участвовать:</p><ul><li>Врач-гериатр.</li><li>Врач общей практики.</li><li>Терапевт.</li><li>Медицинская сестра.</li><li>Невролог.</li><li>Кардиолог.</li><li>Эндокринолог.</li><li>Реабилитолог.</li><li>Психолог.</li><li>Другие профильные специалисты.</li></ul><h2 id=\"h210\">Где можно получить помощь</h2><p class=\"lbl\">Гериатрическая помощь организуется:</p><ul><li>В организациях ПМСП.</li><li>В кабинете врача-гериатра.</li><li>В амбулаторных условиях.</li><li>В стационарозамещающих и стационарных условиях.</li><li>На дому в предусмотренных стандартом случаях.</li></ul><h2 id=\"h211\">Как обратиться</h2><ol><li>Обратитесь в организацию ПМСП по месту прикрепления.</li><li>Сообщите врачу о хронических заболеваниях, ограничениях подвижности, падениях или других проблемах.</li><li>Пройдите необходимую оценку состояния здоровья.</li><li>При наличии показаний получите направление к врачу-гериатру или другому профильному специалисту.</li></ol><div class=\"alert\" role=\"note\"><i class=\"ri-error-warning-fill\" aria-hidden=\"true\"></i><div><b>Важно</b><p>Гериатрическая помощь направлена не только на лечение заболеваний, но и на сохранение функциональных возможностей человека, его самостоятельности и качества жизни.</p></div></div>","toc":[{"id":"h207","label":"Кому предназначена гериатрическая помощь"},{"id":"h208","label":"Что включает гериатрическая помощь"},{"id":"h209","label":"Кто оказывает гериатрическую помощь"},{"id":"h210","label":"Где можно получить помощь"},{"id":"h211","label":"Как обратиться"}]},{"id":"socialnaya-aktivnost","title":"Социальная активность","meta":"","icon":"ri-team-line","html":"<p class=\"lead\">Социальная активность помогает сохранять эмоциональное благополучие, поддерживать когнитивные способности и чувствовать себя частью общества.</p><p class=\"lead\">Общение с близкими, участие в общественной жизни, занятия по интересам и возможность делиться опытом способствуют поддержанию самостоятельности и повышению качества жизни в пожилом возрасте.</p><h2 id=\"h212\">Почему важно сохранять социальную активность</h2><p class=\"lbl\">Регулярное общение и участие в общественной жизни помогают:</p><ul><li>Снижать риск социальной изоляции.</li><li>Поддерживать эмоциональное состояние.</li><li>Сохранять интерес к повседневной жизни.</li><li>Поддерживать память и внимание.</li><li>Формировать новые социальные связи.</li><li>Сохранять ощущение самостоятельности и востребованности.</li></ul><h2 id=\"h213\">Формы социальной активности</h2><ul><li>Общение с семьёй, друзьями и соседями.</li><li>Участие в культурных и общественных мероприятиях.</li><li>Посещение клубов по интересам.</li><li>Занятия творчеством и рукоделием.</li><li>Обучение новым навыкам.</li><li>Прогулки и совместные занятия физической активностью.</li><li>Участие в волонтёрских и общественных инициативах.</li><li>Использование цифровых сервисов для общения с близкими.</li></ul><h2 id=\"h214\">Поддержка со стороны семьи</h2><p class=\"lbl\">Близкие могут помочь пожилому человеку:</p><ul><li>Сохранять привычный распорядок дня.</li><li>Поддерживать общение и интересы.</li><li>Принимать самостоятельные решения.</li><li>Участвовать в семейных мероприятиях.</li><li>Осваивать современные цифровые сервисы.</li><li>Получать необходимую медицинскую и социальную помощь.</li></ul><h2 id=\"h215\">Социальная поддержка</h2><p>При наличии потребности человек может обратиться за консультацией в местные исполнительные органы, организации социальной защиты и центры оказания специальных социальных услуг.</p><p class=\"lbl\">В зависимости от жизненной ситуации могут быть доступны:</p><ul><li>Консультирование по вопросам социальных услуг.</li><li>Помощь на дому.</li><li>Социальное сопровождение.</li><li>Поддержка лиц, нуждающихся в постоянном уходе.</li><li>Реабилитационные и адаптационные мероприятия.</li></ul><h2 id=\"h216\">Когда стоит обратиться за помощью</h2><p>Если пожилой человек испытывает трудности с самообслуживанием, передвижением, приобретением продуктов, посещением медицинской организации или длительное время остаётся без общения и поддержки, рекомендуется обратиться за консультацией в организацию ПМСП и соответствующие социальные службы.</p>","toc":[{"id":"h212","label":"Почему важно сохранять социальную активность"},{"id":"h213","label":"Формы социальной активности"},{"id":"h214","label":"Поддержка со стороны семьи"},{"id":"h215","label":"Социальная поддержка"},{"id":"h216","label":"Когда стоит обратиться за помощью"}]}]}];
