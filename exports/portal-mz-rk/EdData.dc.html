  кладёт API в window.mpEd и рассылает событие 'mp-ed-ready'. Компоненты грузятся асинхронно,
  поэтому страницы показывают скелет, пока не придёт 'mp-ed-ready'.

  Источник: постановки UC01.13 (Confluence, выгрузка 04.10.2026) и BPMN 1.1–1.5 от 02.10.2026.

  Хранилище:
    localStorage['mp-ed-db']      { v, seq, apps:[…] } — заявки заявителя (черновики и поданные)
    localStorage['mp-ed-notifs']  [{ id, n, num, kind, code, ok, text, status, tone, email, at, read }] — push-уведомления

                                  шапка и «Центр уведомлений» читают их без EdData; email — куда ушло письмо (UC10.3)
    sessionStorage['mp-ed-session'] — несохранённая сессия мастера
    sessionStorage['mp-ed-fail']  '1' — сценарий «Техсбой» (панель «Прототип»)
  События window: 'mp-ed-change' — данные заявок изменились; 'mp-ed-notif-change' — уведомления.

  Сквозные правила (UC01.13 §4, UC01.13.2 §4):
    • этап и статус — разные поля; внутренние статусы ННЦРЗ заявителю не показываем (app.nn — только
      для панели «Прототип»);
    • новый шаг степпера всегда добавляется в конец, дата шага «Соответствие пункту 7» = подпись ЭЦП
      при подаче и больше не меняется;
    • таймеры считаются в рабочих днях РК (выходные и госпраздники — как в «Рабочем календаре»);
    • нумерация сквозная, 7 знаков с ведущими нулями, присваивается при создании (UC01.13.1.9);

  замечания», 10 рабочих дней на исправление, после ответа внутренний статус ННЦРЗ «Проверка доработки».

  EdArm.dc.html: решения ННЦРЗ — ED.mutate(num, (app, ACT, H) => …) после подписи и согласования,

  Отличия АЛО и расхождения постановок — docs/10-alo-plan.md.

      zero:{ title:'Наличие аналога в перечне АЛО', yes:'Аналог имеется в перечне АЛО', no:'Аналог не имеется в перечне АЛО', field:'Наличие аналога в перечне АЛО', sign:'Подписание решения о наличии аналога',
        tip:'Проверьте, есть ли в перечне АЛО аналогичное ЛС / МИ. «Аналог не имеется» — заявителю выставляется счёт на оплату 20%.', check:'проверит наличие аналога в перечне АЛО' } },
  };
  const SVC_LIST = ['ed', 'alo'];
  const svcOf = (x) => SVCS[(x && typeof x === 'object' ? (x.svc || (x.form && x.form.svc)) : x) || 'ed'] || SVCS.ed;
  const dossier = (cat, svc) => svcOf(svc).dossier.filter(d => !d.ls || cat === 'ls').map((d, i) => ({ ...d, n:i + 1 }));

  // Форматы файлов
  const EXT = {
    doc:['zip','rar','7z','docx','xlsx','pdf','jpg','png'],                      // доверенность, досье
    pay:['pdf','doc','docx','xls','xlsx','jpg','jpeg','png'],                    // платёжные поручения
    act:['jpeg','jpg','png','pdf','doc','xls'],                                  // АВР, мотивированный отказ
  };
  const LIMIT = { poa:2048, dossier:500, pay:300, act:300 };                     // МБ

  // ───────────────────────── статусы ─────────────────────────
  const TONE = {
    gray:  { bg:'#F6F8FA', fg:'#525866', bd:'#E2E4E9', dot:'#868C98' },
    blue:  { bg:'#EEF2FF', fg:'#312D86', bd:'#C6D0FF', dot:'#4D42E9' },
    teal:  { bg:'#EBFAFF', fg:'#164564', bd:'#C2EFFF', dot:'#35B9E9' },
    orange:{ bg:'#FEF3EB', fg:'#6E330C', bd:'#FFDAC2', dot:'#F17B2C' },
    purple:{ bg:'#EEEBFF', fg:'#2B1664', bd:'#CAC2FF', dot:'#6E3FF3' },
    green: { bg:'#EFFAF6', fg:'#176448', bd:'#CBF5E5', dot:'#38C793' },
    red:   { bg:'#FDEDF0', fg:'#710E21', bd:'#F8C9D2', dot:'#DF1C41' },
  };
  const ST = {
    'Черновик':{ tone:'gray' },
    'В работе':{ tone:'blue' },
    'Ожидает оплаты 20%':{ tone:'orange', action:true },
    'Подтверждение оплаты 20%':{ tone:'teal' },
    'Выставлены замечания':{ tone:'orange', action:true },
    'Ожидает оплаты 80%':{ tone:'orange', action:true },
    'Подтверждение оплаты 80%':{ tone:'teal' },
    'Направлен акт':{ tone:'orange', action:true },
    'Отказ от решения':{ tone:'blue' },
    'Формулярная комиссия':{ tone:'purple' },
    'Решение принято':{ tone:'green' },
    'Отказано':{ tone:'red' },
    'Рассмотрение заблокировано':{ tone:'red' },
    'Завершено':{ tone:'gray' },
    'Срок истёк':{ tone:'red' },
    'Оплата не произведена':{ tone:'red' },
    // АЛО: после ответа на замечания (UC01.14.2.3.3) и повторная неоплата (UC01.14.2.3.2 / 2.3.5, Alt 5)
    'Проверка доработки':{ tone:'teal' },
    'Оплата 20% не произведена':{ tone:'red' },
    'Оплата 80% не произведена':{ tone:'red' },
  };
  // Публичные статусы для фильтра реестра — в порядке UC01.13.2.1 §6
  // + «Выставлены замечания» и «Оплата не произведена» — статусы из постановок АРМ ННЦРЗ (UC01.13.3.4.x)
  // + статусы АЛО «Проверка доработки», «Оплата 20% / 80% не произведена» (UC01.14.2.3.x)
  const FILTER = ['Черновик','В работе','Ожидает оплаты 20%','Подтверждение оплаты 20%','Выставлены замечания','Проверка доработки','Ожидает оплаты 80%','Подтверждение оплаты 80%','Направлен акт','Отказ от решения','Формулярная комиссия','Решение принято','Отказано','Рассмотрение заблокировано','Оплата не произведена','Оплата 20% не произведена','Оплата 80% не произведена','Завершено'];
  const UNPAID = ['Оплата не произведена','Оплата 20% не произведена','Оплата 80% не произведена'];

  const toneOf = (label, app) => {
    if(label === 'Решение принято') return app && app.include === false ? 'red' : 'green';
    if(label === 'Завершено' && app && app.result === 'p7') return 'green';
    return (ST[label] || ST['Завершено']).tone;
  };
  const badge = (label, app, size) => {
    const t = TONE[toneOf(label, app)];
    const sm = size === 'sm';
    return {
      label,
      style:`display:inline-flex;align-items:center;gap:6px;height:${sm ? 22 : 24}px;padding:0 ${sm ? 8 : 10}px 0 ${sm ? 7 : 8}px;border-radius:999px;background:${t.bg};color:${t.fg};font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;`,
      dot:`width:6px;height:6px;border-radius:50%;background:${t.dot};flex:0 0 auto;`,
    };
  };

  // ───────────────────────── дата и время, рабочий календарь ─────────────────────────
  const HOL = { '1-1':1,'1-2':1,'3-8':1,'3-21':1,'3-22':1,'3-23':1,'5-1':1,'5-7':1,'5-9':1,'7-6':1,'8-30':1,'10-25':1,'12-16':1 };
  const pad = (n) => String(n).padStart(2, '0');
  const fmtD = (ts) => { if(ts == null) return ''; const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const fmtT = (ts) => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const fmtDT = (ts) => ts == null ? '' : fmtD(ts) + ' ' + fmtT(ts);
  const parseD = (s) => {
    const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(s || '').trim());
    if(!m) return null;
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    if(d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
    return d;
  };
  const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const isWork = (d) => { const w = d.getDay(); return w !== 0 && w !== 6 && !HOL[(d.getMonth() + 1) + '-' + d.getDate()]; };
  const addWD = (ts, n) => { const d = new Date(ts); let c = 0; while(c < n){ d.setDate(d.getDate() + 1); if(isWork(d)) c++; } return d.getTime(); };
  const fmtRemain = (ms) => {
    const t = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return d + 'д:' + pad(h) + 'ч:' + pad(m) + 'м:' + pad(s) + 'с';
  };
  const wdWord = (n) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'рабочий день' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'рабочих дня' : 'рабочих дней'; };
  const money = (n) => Math.round(n).toLocaleString('ru-RU') + ' ₸';
  const fileSize = (b) => b == null ? '' : b < 1024 ? b + ' Б' : b < 1048576 ? Math.round(b / 1024) + ' КБ' : (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' МБ';
  const ext = (name) => { const m = /\.([^.]+)$/.exec(name || ''); return m ? m[1].toLowerCase() : ''; };
  const checkFile = (f, kind) => {
    const list = EXT[kind === 'poa' || kind === 'dossier' ? 'doc' : kind];
    const e = ext(f.name);
    if(list.indexOf(e) === -1) return 'Недопустимый формат файла. Разрешены: ' + list.map(x => x.toUpperCase()).join(', ');
    const lim = LIMIT[kind];
    if(f.size > lim * 1048576) return 'Файл больше ' + (lim >= 1024 ? lim / 1024 + ' ГБ' : lim + ' МБ');
    return '';
  };

  // ───────────────────────── хранилище ─────────────────────────
  const emit = () => { try { window.dispatchEvent(new CustomEvent('mp-ed-change')); } catch(e){} };
  const emitN = () => { try { window.dispatchEvent(new CustomEvent('mp-ed-notif-change')); } catch(e){} };
  let cache = null;
  const read = () => {
    if(cache) return cache;
    try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if(v && v.v === V && Array.isArray(v.apps)) { cache = v; return v; } } catch(e){}
    cache = seed();
    write(cache, true);
    return cache;
  };
  const write = (db, silent) => {
    cache = db;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){}
    if(!silent) emit();
  };
  const invalidate = () => { cache = null; };
  const readN = () => { try { const v = JSON.parse(localStorage.getItem(NKEY) || 'null'); if(Array.isArray(v)) return v; } catch(e){} return []; };
  const writeN = (list) => { try { localStorage.setItem(NKEY, JSON.stringify(list)); } catch(e){} emitN(); };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  // list — заявки кабинета бизнеса (без app.org), listAll — все заявки для АРМ
  const byUpd = (a, b) => (b.updated || 0) - (a.updated || 0);
  const list = () => read().apps.filter(a => !a.org).sort(byUpd);
  const listAll = () => read().apps.slice().sort(byUpd).map(clone);
  const meta = () => read().sid || '';
  const get = (num) => { const a = read().apps.find(x => x.num === num); return a ? clone(a) : null; };
  const put = (app, keepTime) => {
    const db = read();
    if(!keepTime) app.updated = Date.now();
    const i = db.apps.findIndex(x => x.num === app.num);
    if(i === -1) db.apps.push(app); else db.apps[i] = app;
    write(db);
    return app;
  };
  const remove = (num) => { const db = read(); db.apps = db.apps.filter(x => x.num !== num); write(db); };
  const nextNum = () => { const db = read(); db.seq = (db.seq || 0) + 1; write(db, true); return String(db.seq).padStart(7, '0'); };

  // ───────────────────────── форма заявки ─────────────────────────
  let rid = 0;
  const newReg = () => ({ id:'r' + Date.now().toString(36) + (rid++), num:'', country:'', regDate:'', expDate:'', perpetual:false, dose:null, conc:null });
  const blankForm = (svc) => ({
    svc: svc === 'alo' ? 'alo' : 'ed',
    cat:'ls',
    a:{ position:'', phone:PROFILE.phone, fax:'', poaNum:'', poaIssued:'', poaValid:'', poaText:'', poaFiles:[] },
    s:{ ls:{}, mi:{} },
    regs:[ newReg() ],
    d:{},
  });
  const newApp = (svc) => {
    const now = Date.now(), id = svc === 'alo' ? 'alo' : 'ed';
    return { num: nextNum(), svc:id, status:'Черновик', created:now, updated:now, sentAt:null, form: blankForm(id), steps:[], docSeq:0, saved:false };
  };

  // ───────────────────────── валидация мастера ─────────────────────────
  const PHONE_RE = /^\+[\d\s\-()]+$/;
  const phoneOk = (v) => { if(!PHONE_RE.test(v)) return false; const n = v.replace(/\D/g, '').length; return n >= 7 && n <= 15; };
  const filled = (v) => v != null && String(v).trim() !== '';
  const inDict = (dict, v) => DICT[dict].indexOf(String(v || '').trim()) !== -1;

  // step: 0 — Данные услуги, 1 — Сведения о заявителе, 2 — Заявление, 3 — Досье.
  // Возвращает список ошибок по порядку полей: [{ key, label, msg }]
  const validate = (form, step) => {
    const E = [];
    const err = (key, label, msg) => E.push({ key, label, msg });
    const t0 = today0();
    if(step === 0){
      if(form.cat !== 'ls' && form.cat !== 'mi') err('cat', 'Категория', 'Выберите категорию');
    }
    if(step === 1){
      const a = form.a;
      if(!filled(a.position)) err('a.position', 'Должность', 'Обязательное поле');
      if(filled(a.phone) && !phoneOk(a.phone.trim())) err('a.phone', 'Телефон', 'Пример: +7 701 123 45 67');
      if(filled(a.fax) && !phoneOk(a.fax.trim())) err('a.fax', 'Факс', 'Пример: +7 701 123 45 67');
      const started = filled(a.poaNum) || filled(a.poaIssued) || filled(a.poaValid) || filled(a.poaText) || a.poaFiles.length > 0;
      if(started){
        if(!filled(a.poaNum)) err('a.poaNum', '№ доверенности', 'Если заполнен блок доверенности — номер обязателен');
        if(!filled(a.poaIssued)) err('a.poaIssued', 'Дата выдачи', 'Обязательное поле');
        else { const d = parseD(a.poaIssued); if(!d) err('a.poaIssued', 'Дата выдачи', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() >= t0) err('a.poaIssued', 'Дата выдачи', 'Дата должна быть меньше текущей'); }
        if(!filled(a.poaValid)) err('a.poaValid', 'Срок действия', 'Обязательное поле');
        else { const d = parseD(a.poaValid); if(!d) err('a.poaValid', 'Срок действия', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() <= t0) err('a.poaValid', 'Срок действия', 'Дата должна быть больше текущей'); }
        if(!filled(a.poaText) && !a.poaFiles.length) err('a.poaDoc', 'Доверенность', 'Укажите текст доверенности или загрузите файл');
      }
    }
    if(step === 2){
      const cat = form.cat, s = form.s[cat] || {};
      SCHEMA[cat].forEach(sec => {
        if(sec.regs){
          form.regs.forEach((r, i) => {
            const L = 'Рег. номер ' + (i + 1) + ': ';
            if(!filled(r.num)) err('r.' + r.id + '.num', L + 'Регистрационный номер', 'Обязательное поле');
            if(!filled(r.country)) err('r.' + r.id + '.country', L + 'Производитель / Страна', 'Выберите значение из списка');
            else if(!inDict('country', r.country)) err('r.' + r.id + '.country', L + 'Производитель / Страна', 'Выберите значение из списка');
            if(!filled(r.regDate)) err('r.' + r.id + '.regDate', L + 'Дата регистрации', 'Обязательное поле');
            else { const d = parseD(r.regDate); if(!d) err('r.' + r.id + '.regDate', L + 'Дата регистрации', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() >= t0) err('r.' + r.id + '.regDate', L + 'Дата регистрации', 'Дата должна быть меньше текущей'); }
            if(!r.perpetual){
              if(!filled(r.expDate)) err('r.' + r.id + '.expDate', L + 'Дата истечения', 'Должно быть заполнено или «Дата истечения», или «Бессрочно»');
              else { const d = parseD(r.expDate); if(!d) err('r.' + r.id + '.expDate', L + 'Дата истечения', 'Укажите дату в формате дд.мм.гггг'); else if(d.getTime() <= t0) err('r.' + r.id + '.expDate', L + 'Дата истечения', 'Дата должна быть больше текущей'); }
            }
            if(cat === 'ls'){
              if(r.dose != null && !filled(r.dose)) err('r.' + r.id + '.dose', L + 'Дозировка', 'Обязательное поле');
              if(r.conc){
                if(!filled(r.conc.val)) err('r.' + r.id + '.conc', L + 'Концентрация', 'Обязательное поле');
                if(!filled(r.conc.qty)) err('r.' + r.id + '.qty', L + 'Количество во вторичной упаковке', 'Обязательное поле');
              }
            }
          });
          return;
        }
        sec.fields.forEach(f => {
          const v = s[f.k];
          if(!filled(v)) err('s.' + f.k, f.label, f.type === 'combo' && !f.free ? 'Выберите значение из списка' : 'Обязательное поле');
          else if(f.type === 'combo' && !f.free && !inDict(f.dict, v)) err('s.' + f.k, f.label, 'Выберите значение из списка');
        });
      });
    }
    if(step === 3){
      dossier(form.cat, form.svc).forEach(d => {
        if(!d.req) return;
        const v = form.d[d.k] || {};
        if(!filled(v.text) && !v.file) err('d.' + d.k, 'Раздел ' + d.n, 'Укажите текст или загрузите файл');
      });
    }
    return E;
  };
  const stepDone = (form, step) => validate(form, step).length === 0;

  // ───────────────────────── документы ─────────────────────────
  const docId = (app, type) => { app.docSeq = (app.docSeq || 0) + 1; return svcOf(app).prefix + '-' + type + '-' + app.num + '-' + pad(app.docSeq); };
  const nnDoc = (app, type, title, kb) => { const id = docId(app, type); return { title, id, name:id + '.pdf', size:kb * 1024 }; };
  const invoice = (app, pct) => { const pr = svcOf(app).price; return { title:'Счёт на оплату ' + pct + '%', id:'', name:'Счёт на оплату ' + pct + '% № ' + app.num + '.pdf', size:(pct === 20 ? 96 : 98) * 1024, amount: pr ? pr * pct / 100 : null }; };

  // ───────────────────────── шаги и таймеры ─────────────────────────
  let sid = 0;
  const step = (o) => ({ id:'s' + (++sid) + Date.now().toString(36), at:null, timer:null, docs:[], ...o });
  // Срок: отсчёт со следующего рабочего дня 00:01, конец — 23:59 N-го рабочего дня (UC01.13.3 §5).
  // «Тестовый контур» (панель «Прототип»): любой срок — 2 минуты, как в постановках для тестового стенда.
  const endWD = (ts, n) => { const d = new Date(addWD(ts, n)); d.setHours(23, 59, 0, 0); return d.getTime(); };
  const FAST_MS = 2 * 60000;
  let seeding = false;
  const fastNow = () => { if(seeding) return false; try { return localStorage.getItem('mp-ed-fast') === '1'; } catch(e){ return false; } };
  const setFast = (on) => { try { if(on) localStorage.setItem('mp-ed-fast', '1'); else localStorage.removeItem('mp-ed-fast'); } catch(e){} emit(); };
  const timer = (owner, wd, start, deadline) => ({ owner, wd, start, deadline: deadline != null ? deadline : fastNow() ? start + FAST_MS : endWD(start, wd), fast: deadline == null && fastNow(), frozen:null, stopped:null });
  // Внутренний этап / статус ННЦРЗ: остальные поля app.nn (назначение, решения, маршрут) ведёт EdArm
  const nn = (app, stage, status) => { app.nn = Object.assign(app.nn || {}, { stage, status }); };
  const last = (app) => app.steps[app.steps.length - 1];
  const lastOf = (app, kind) => { for(let i = app.steps.length - 1; i >= 0; i--) if(app.steps[i].kind === kind) return app.steps[i]; return null; };
  const remainOf = (t, now) => t.frozen != null ? t.frozen : (t.stopped != null ? Math.max(0, t.deadline - t.stopped) : t.deadline - now);
  // «Осталось дней» — в рабочем времени: выходные и праздники не считаются, отсчёт — со следующего рабочего
  // дня после старта (подписи решения), конец 23:59 — как полный день. Свежий срок N рабочих дней = «Nд:00ч:00м:00с»
  // в карточке и в реестре одинаково. Сжатые сроки тестового контура (меньше суток) — как есть.
  const workMs = (from, to) => {
    let sum = 0;
    const d = new Date(from); d.setHours(0, 0, 0, 0);
    while(d.getTime() < to){
      const ds = d.getTime(); d.setDate(d.getDate() + 1);
      if(isWork(new Date(ds))) sum += Math.max(0, Math.min(d.getTime(), to) - Math.max(ds, from));
    }
    return sum;
  };
  const workLeft = (t, now) => {
    const from = t.stopped != null ? t.stopped : now;
    const raw = Math.max(0, t.deadline - from);
    if(t.fast || t.start == null || t.deadline - t.start < DAY) return raw;
    const s0 = new Date(t.start); s0.setHours(0, 0, 0, 0); s0.setDate(s0.getDate() + 1);
    return raw ? workMs(Math.max(from, s0.getTime()), t.deadline + 60000) : 0;
  };
  const stopT = (st, at) => { if(st && st.timer && st.timer.stopped == null && st.timer.frozen == null) st.timer.stopped = at; };
  const freezeT = (st, at) => { if(st && st.timer){ st.timer.frozen = Math.max(0, st.timer.deadline - at); st.timer.stopped = at; } };

  // Активный таймер заявки: последний шаг с идущим или замороженным таймером
  const activeTimer = (app, now) => {
    now = now || Date.now();
    if(!app || !app.steps.length) return null;
    const final = ['Решение принято','Рассмотрение заблокировано','Отказано','Завершено','Формулярная комиссия'].concat(UNPAID);
    if(final.indexOf(app.status) !== -1) return null;
    const s = last(app);
    let t = s.timer, src = s;
    // заявка у ННЦРЗ после несогласия заявителя — остаток таймера акта заморожен
    if(!t && s.kind === 'wait' && s.frozenFrom){ const f = app.steps.find(x => x.id === s.frozenFrom); if(f && f.timer) { t = f.timer; src = f; } }
    if(!t) return null;
    const remaining = remainOf(t, now);
    return { step:src, owner:t.owner, wd:t.wd, deadline:t.deadline, remaining, frozen: t.frozen != null, overdue: remaining <= 0 && t.frozen == null, text: fmtRemain(remaining > 0 ? workLeft(t, now) : 0) };
  };

  // Макроэтап для шкалы в карточке: 0 нулевая · 1 первичная · 2 профессиональная · 3 ФК
  const stage = (app) => {
    let st = 0;
    app.steps.forEach(s => {
      if(s.kind === 'pay80' || s.kind === 'avr' || (s.kind === 'wait' && (s.phase === 'prof' || s.phase === 'dispute2'))) st = Math.max(st, 2);
      // первичная начинается с подтверждения оплаты 20 % (у шага ожидания появляется срок ННЦРЗ); пока оплату
      // проверяют или заявитель платит повторно — это ещё нулевая экспертиза (UC01.13.3.4.1 / UC01.14.3.4.1)
      else if((s.kind === 'wait' && (s.timer || s.phase !== 'primary')) || s.kind === 'refuse' || s.kind === 'remarks') st = Math.max(st, 1);
      if(s.kind === 'fk') st = 3;
    });
    // оплата 80% — переход между первичной и профессиональной: этап «первичная» завершён
    const l = last(app);
    if(l && l.kind === 'pay80') st = 1;
    if(l && l.kind === 'wait' && l.phase === 'prof' && l.st === 'Подтверждение оплаты 80%') st = 1;
    return st;
  };

  // ───────────────────────── уведомления ─────────────────────────
  // Шаблоны UC01.13.2.2, табл. 1: push — в колокольчик и «Центр уведомлений», email — на почту из профиля (UC10.3).
  // Строки 5–6 (REWORK_ED_*) — после подписи ПП и статуса «Выставлены замечания», срок исправления — 10 рабочих дней.
  const NOTIF = {
    ok:{ push:'COMPLETED_ED_PUSH', mail:'COMPLETED_ED_EMAIL', status:'Положительное решение', tone:'green',
      text:(num) => 'Уважаемый пользователь! По Вашей заявке №' + num + ' принято положительное решение о включении в ЕД. Просим перейти в Личный кабинет для ознакомления.' },
    no:{ push:'REJECTED_ED_PUSH', mail:'REJECTED_ED_EMAIL', status:'Мотивированный отказ', tone:'red',
      text:(num) => 'Уважаемый пользователь! По Вашей заявке №' + num + ' принято решение об отказе. Просим перейти в Личный кабинет для ознакомления.' },
    rework:{ push:'REWORK_ED_PUSH', mail:'REWORK_ED_EMAIL', status:'Выставлены замечания', tone:'orange',
      text:(num) => 'Уважаемый пользователь! По Вашей заявке №' + num + ' по результатам первичной экспертизы выставлены замечания. Просим исправить их и повторно направить заявку через Личный кабинет в течение 10 рабочих дней.' },
  };
  // АЛО (UC01.14.2.2, табл. 1): в постановке шаблоны скопированы из ЕД («о включении в ЕД», коды *_ED_*) —
  // здесь тексты о перечне АЛО и коды *_ALO_* (расхождение — docs/10-alo-plan.md)
  const NOTIF_ALO = {
    ok:{ push:'COMPLETED_ALO_PUSH', mail:'COMPLETED_ALO_EMAIL', status:'Положительное решение', tone:'green',
      text:(num) => 'Уважаемый пользователь! По Вашей заявке №' + num + ' принято положительное решение о включении в перечень АЛО. Просим перейти в Личный кабинет для ознакомления.' },
    no:NOTIF.no && { ...NOTIF.no, push:'REJECTED_ALO_PUSH', mail:'REJECTED_ALO_EMAIL' },
    rework:{ ...NOTIF.rework, push:'REWORK_ALO_PUSH', mail:'REWORK_ALO_EMAIL' },
  };
  const notifOf = (svc) => svc === 'alo' ? NOTIF_ALO : NOTIF;
  const notifRec = (num, kind, at, n, read, svc) => { const T = notifOf(svc)[kind]; return { id:'ed-' + num + '-' + at, n, num, kind, svc: svc === 'alo' ? 'alo' : 'ed', service: svcOf(svc).name, code:T.push, ok: kind === 'ok',
    text:T.text(num), status:T.status, tone:T.tone, email:PROFILE.email, mail:T.mail, at, read:!!read }; };
  // уведомления получает только заявитель заявки: заявки других организаций (app.org) в кабинет не попадают
  const notify = (app, kind, at) => {
    if(seeding || app.org) return;
    const n = readN();
    if(n.some(x => x.num === app.num && x.kind === kind && x.at === at)) return;
    const max = n.reduce((m, x) => Math.max(m, +x.n || 0), 99);
    n.unshift(notifRec(app.num, kind, at, String(max + 1), false, app.svc));
    writeN(n);
  };
  const mailOf = (num, kind) => readN().find(x => x.num === num && x.kind === kind) || null;
  const markRead = (num) => { const n = readN(); let ch = false; n.forEach(x => { if(x.num === num && !x.read){ x.read = true; ch = true; } }); if(ch) writeN(n); };

  // ───────────────────────── хронология и события для АРМ ─────────────────────────
  // app.log — «Хронология заявки» (UC01.13.3.5): строки только добавляются, никогда не меняются и не удаляются.
  // app.outbox — действия заявителя и системы, которые АРМ ННЦРЗ (EdArm) разбирает в push-уведомления
  // сотрудникам (UC01.13.3.2, табл. 2). Без EdArm на странице события копятся и разбираются позже.
  const orgOf = (app) => app.org || PROFILE;
  const logPush = (app, e) => {
    app.log = app.log || [];
    app.log.push({ n: app.log.length + 1, role:e.role, fio:e.fio || '', start: e.start != null ? e.start : e.end, end:e.end, status:e.status || '', comment:e.comment || '' });
  };
  const outPush = (app, ev, at, p) => { app.outbox = app.outbox || []; app.outbox.push({ ev, at, p: p || {} }); };
  const APPLICANT_EV = { submit:1, pay20:1, pay80:1, remarksReply:1, actReply:1 };

  // ───────────────────────── машина состояний ─────────────────────────
  // Действия заявителя и решения ННЦРЗ / ФК. Каждое — чистая мутация app на момент at.
  // Решения ННЦРЗ вызывает АРМ ННЦРЗ (EdArm) после подписи и маршрута согласования; документы,
  // которые загрузил эксперт, приходят в p.docs и показываются заявителю как есть.
  const finish = (app, at, variant, extra) => { app.steps.push(step({ kind:'done', title:'Экспертиза завершена', st: UNPAID.indexOf(app.status) !== -1 ? app.status : 'Завершено', at, variant, ...(extra || {}) })); };

  // Поле заявки по ключу замечания ('a.position', 's.trade', 'r.<id>.num', 'd.<раздел>', 'd.<раздел>.file') —
  // те же ключи, что у замечаний к полям в АРМ ННЦРЗ. Нужны для исправления замечаний в полях (АЛО, UC01.14.2.3.3).
  const getField = (form, key) => {
    const p = String(key).split('.'), cat = form.cat;
    if(p[0] === 'a') return form.a[p[1]];
    if(p[0] === 's') return (form.s[cat] || {})[p[1]];
    if(p[0] === 'd') { const v = form.d[p[1]] || {}; return p[2] === 'file' ? v.file || null : v.text || ''; }
    if(p[0] === 'r'){
      const r = form.regs.find(x => x.id === p[1]); if(!r) return '';
      if(p[2] === 'conc') return r.conc ? r.conc.val : '';
      if(p[2] === 'qty') return r.conc ? r.conc.qty : '';
      if(p[2] === 'expDate') return r.perpetual ? 'Бессрочно' : r.expDate;
      return r[p[2]];
    }
    return '';
  };
  const setField = (form, key, val) => {
    const p = String(key).split('.'), cat = form.cat;
    if(p[0] === 'a') form.a[p[1]] = val;
    else if(p[0] === 's') form.s[cat] = { ...(form.s[cat] || {}), [p[1]]:val };
    else if(p[0] === 'd') form.d[p[1]] = { ...(form.d[p[1]] || { text:'', file:null }), [p[2] === 'file' ? 'file' : 'text']:val };
    else if(p[0] === 'r'){
      const r = form.regs.find(x => x.id === p[1]); if(!r) return;
      if(p[2] === 'conc') r.conc = { ...(r.conc || { qty:'' }), val };
      else if(p[2] === 'qty') r.conc = { ...(r.conc || { val:'' }), qty:val };
      else if(p[2] === 'expDate'){ if(val === 'Бессрочно'){ r.perpetual = true; r.expDate = ''; } else { r.perpetual = false; r.expDate = val; } }
      else r[p[2]] = val;
    }
  };
  const block = (app, at, cause) => {
    app.status = 'Рассмотрение заблокировано';
    nn(app, app.nn ? app.nn.stage : '', 'Рассмотрение заблокировано');
    app.steps.push(step({ kind:'blocked', title: svcOf(app).id === 'alo' ? 'Экспертиза завершена' : 'Рассмотрение заблокировано', st:'Рассмотрение заблокировано', at, cause }));
  };
  const docsOr = (p, fallback) => p && Array.isArray(p.docs) && p.docs.length ? p.docs : fallback;
  const toPay80 = (app, at, docs) => {
    app.steps.push(step({ kind:'pay80', title:'Платежное поручение 80%', st:'Ожидает оплаты 80%', issued:at, timer: timer('applicant', 5, at), docs: docs && docs.length ? docs : [ invoice(app, 80) ] }));
    app.status = 'Ожидает оплаты 80%';
    nn(app, 'Первичная экспертиза', 'Ожидает оплаты 80%');
  };
  const toFk = (app, at, note) => {
    app.steps.push(step({ kind:'fk', title:'Формулярная комиссия', st:'Формулярная комиссия', at, sessions:[], note: note || '' }));
    app.status = 'Формулярная комиссия';
    nn(app, 'Рассмотрение формулярной комиссией', 'Формулярная комиссия');
  };
  const unpaid = (app, at, pct, extra) => {
    const st = svcOf(app).splitUnpaid ? 'Оплата ' + pct + '% не произведена' : 'Оплата не произведена';
    app.status = st; app.result = 'unpaid';
    nn(app, pct === 20 ? 'Нулевая экспертиза' : 'Первичная экспертиза', st);
    finish(app, at, 'unpaid' + pct, extra);
  };

  const ACT = {
    // ── заявитель ──
    submit(app, at, p){
      app.status = 'В работе'; app.sentAt = at; app.signer = p && p.signer || null;
      app.steps = [ step({ kind:'p7', title:svcOf(app).zero.title, st:'В работе', at }) ];
      nn(app, 'Нулевая экспертиза', 'Новая');
    },
    pay20(app, at, p){
      const s = lastOf(app, 'pay20'); s.st = 'Завершено'; s.at = at; s.file = p.file; stopT(s, at);
      app.steps.push(step({ kind:'wait', phase:'primary', title:'Ожидание проверки', st:'Подтверждение оплаты 20%', at }));
      app.status = 'Подтверждение оплаты 20%'; nn(app, 'Нулевая экспертиза', 'Подтверждение оплаты 20%');
    },
    pay80(app, at, p){
      const s = lastOf(app, 'pay80'); s.st = 'Завершено'; s.at = at; s.file = p.file; stopT(s, at);
      app.steps.push(step({ kind:'wait', phase:'prof', title:'Ожидание проверки', st:'Подтверждение оплаты 80%', at }));
      app.status = 'Подтверждение оплаты 80%'; nn(app, 'Первичная экспертиза', 'Подтверждение оплаты 80%');
    },
    remarksReply(app, at, p){
      const s = lastOf(app, 'remarks'); s.st = 'Завершено'; s.at = at; s.reply = { text:p.text || '', files:p.files || [] }; stopT(s, at);
      // АЛО: исправления — прямо в полях заявки (UC01.14.2.3.3); в шаге остаются «было → стало»
      if(p.changes){
        const ch = [];
        Object.keys(p.changes).forEach(k => { const before = getField(app.form, k); setField(app.form, k, p.changes[k]); ch.push({ key:k, before, after:p.changes[k] }); });
        s.reply.changes = ch;
      }
      const prev = app.steps.find(x => x.id === s.resumeFrom);
      const left = prev && prev.timer && prev.timer.frozen != null ? prev.timer.frozen : null;
      // BPMN 2.2: после исправления замечаний — «Проверка доработки» у заявителя и в ННЦРЗ, маршрут у ЕД и АЛО один
      const pub = 'Проверка доработки';
      app.steps.push(step({ kind:'wait', phase:'primary', title:'Ожидание проверки', st:pub, at, timer: timer('nncrz', 5, at, left != null ? at + left : null) }));
      app.status = pub; nn(app, 'Первичная экспертиза', 'Проверка доработки');
    },
    // Акт по отказу в рассмотрении (первичная) и АВР проф. экспертизы: круг 1 — решение + файл, круг 2 — только файл
    actReply(app, at, p){
      const s = last(app);
      s.st = 'Завершено'; s.at = at; s.reply = { agree: s.round === 1 ? !!p.agree : null, file:p.file };
      const isProf = s.kind === 'avr';
      if(s.round === 2 || p.agree){
        stopT(s, at);
        if(isProf){ toFk(app, at); }
        else { app.status = 'Отказано'; nn(app, 'Первичная экспертиза', 'Отказано'); finish(app, at, 'refused', { st:'Отказано' }); notify(app, 'no', at); }
        return;
      }
      // не согласен — остаток таймера замораживается, заявка возвращается эксперту
      freezeT(s, at);
      app.steps.push(step({ kind:'wait', phase: isProf ? 'dispute2' : 'dispute1', title:'Ожидание проверки', st:'Отказ от решения', at, frozenFrom:s.id }));
      app.status = 'Отказ от решения'; nn(app, isProf ? 'Профессиональная экспертиза' : 'Первичная экспертиза', 'Отказ от решения');
    },

    // ── ННЦРЗ ──
    p7Yes(app, at){
      const s = lastOf(app, 'p7'); s.st = 'Завершено';
      app.status = 'Завершено'; app.result = 'p7'; nn(app, 'Нулевая экспертиза', 'Завершено');
      finish(app, at, 'p7'); notify(app, 'ok', at);
    },
    p7No(app, at, p){
      const s = lastOf(app, 'p7'); s.st = 'Завершено';
      app.steps.push(step({ kind:'pay20', title:'Платежное поручение 20%', st:'Ожидает оплаты 20%', issued:at, timer: timer('applicant', 5, at), docs: docsOr(p, [ invoice(app, 20) ]) }));
      app.status = 'Ожидает оплаты 20%'; nn(app, 'Нулевая экспертиза', 'Ожидает оплаты 20%');
    },
    confirm20(app, at){
      const s = last(app); s.st = 'В работе'; s.timer = timer('nncrz', 5, at);
      app.status = 'В работе'; nn(app, 'Первичная экспертиза', 'В работе');
    },
    // Оплата не подтверждена (UC01.13.3.4.1 Alt 7–8, UC01.13.3.4.2.1 Alt 5–6). Первый раз — заявителю
    // возвращается шаг оплаты со сроком «остаток + 1 рабочий день»; второй раз — «Оплата не произведена».
    payNo(app, at, p){
      const pct = p && p.pct === 80 ? 80 : 20, kind = 'pay' + pct;
      const w = last(app); if(w && w.kind === 'wait') w.st = 'Завершено';
      const prev = lastOf(app, kind);
      const reject = { comment:(p && p.comment) || '', file:(p && p.file) || null, at };
      if(prev && prev.round === 2){ unpaid(app, at, pct, { reject }); return; }
      const left = prev && prev.timer ? Math.max(0, prev.timer.deadline - (prev.timer.stopped != null ? prev.timer.stopped : at)) : 0;
      const t = timer('applicant', 1, at, fastNow() ? at + left + FAST_MS : endWD(at + left, 1));
      t.note = 'остаток срока + 1 рабочий день';
      // АЛО: повторный шаг называется «Платеж N% не подтвержден» (UC01.14.2.3.2 / 2.3.5, Alt 4)
      const title = svcOf(app).splitUnpaid ? 'Платеж ' + pct + '% не подтвержден' : 'Платежное поручение ' + pct + '%';
      app.steps.push(step({ kind, round:2, title, st:'Ожидает оплаты ' + pct + '%', issued:at, timer:t, docs: prev ? prev.docs : [ invoice(app, pct) ], reject }));
      app.status = 'Ожидает оплаты ' + pct + '%'; nn(app, pct === 20 ? 'Нулевая экспертиза' : 'Первичная экспертиза', 'Ожидает оплаты ' + pct + '%');
    },
    remarks(app, at, p){
      const s = last(app); s.st = 'Завершено'; freezeT(s, at);
      const items = p && Array.isArray(p.items) && p.items.length ? p.items : [
        'Раздел досье 3: приведите перечень зарегистрированных аналогов с указанием лекарственной формы и дозировки по состоянию на дату подачи заявления.',
        'Раздел досье 5: приложите полный текст фармакоэкономического исследования, на которое дана ссылка, с переводом на русский язык.',
      ];
      // fields — замечания к полям заявки (ключ → { label, text }), concl — № / дата / текст заключения (АЛО, UC01.14.2.3.3 табл. 1)
      const S = svcOf(app);
      app.steps.push(step({ kind:'remarks', title: S.fieldFix ? 'Выставлены замечания' : 'Замечания ННЦРЗ', st:'Выставлены замечания', issued:at, resumeFrom:s.id, timer: timer('applicant', S.remWD, at),
        docs: docsOr(p, S.fieldFix ? [ { title:'Сопроводительное письмо', id:'', name:'Сопроводительное письмо № ' + app.num + '.pdf', size:86 * 1024 }, nnDoc(app, 12, 'Заключение по первичной экспертизе (замечания)', 184) ] : [ nnDoc(app, 12, 'Заключение по первичной экспертизе (замечания)', 184) ]),
        items, fields:(p && p.fields) || null, concl:(p && p.concl) || null }));
      app.status = 'Выставлены замечания'; nn(app, 'Первичная экспертиза', 'Выставлены замечания');
      notify(app, 'rework', at);
    },
    recommend(app, at, p){ const s = last(app); s.st = 'Завершено'; stopT(s, at); toPay80(app, at, p && p.docs); },
    refuse(app, at, p){
      const s = last(app); s.st = 'Завершено'; stopT(s, at);
      app.steps.push(step({ kind:'refuse', round:1, title:'Отказ в рассмотрении', st:'Направлен акт', issued:at, timer: timer('applicant', 5, at), comment:(p && p.comment) || '',
        docs: docsOr(p, [ nnDoc(app, 17, 'Сопроводительное письмо', 96), nnDoc(app, 18, 'Акт мотивированного отказа', 142) ]) }));
      app.status = 'Направлен акт'; nn(app, 'Первичная экспертиза', 'Направлен акт');
    },
    // После подтверждения 80 % — этап «Профессиональная экспертиза», статус «Новая» до назначения эксперта
    // (UC01.13.3.3.4); срок проф. экспертизы — 30 рабочих дней у ЕД, 40 — у АЛО (UC01.14 §2.2), настраивается в SVCS.
    confirm80(app, at){
      const s = last(app); s.st = 'В работе'; s.timer = timer('nncrz', svcOf(app).profWD, at);
      app.status = 'В работе'; nn(app, 'Профессиональная экспертиза', 'Новая');
    },
    // Эксперт отметил экспертизу «Завершено» — новый срок 5 рабочих дней на документы (UC01.13.3.4.3 п. 3–5)
    profFinish(app, at){
      const s = last(app); if(!s || s.kind !== 'wait') return;
      stopT(s, at); s.timer30 = s.timer; s.timer = timer('nncrz', 5, at);
      nn(app, 'Профессиональная экспертиза', 'Подготовка документов');
    },
    profDone(app, at, p){
      const s = last(app); s.st = 'Завершено'; stopT(s, at);
      app.steps.push(step({ kind:'avr', round:1, title:'АВР проф. экспертизы', st:'Направлен акт', issued:at, timer: timer('applicant', 5, at),
        docs: docsOr(p, [ nnDoc(app, 14, 'Заключение профессиональной экспертизы', 1240), { title:'Сопроводительное письмо', id:'', name:'Сопроводительное письмо № ' + app.num + '.pdf', size:88 * 1024 }, nnDoc(app, 18, 'Акт выполненных работ', 142) ]) }));
      app.status = 'Направлен акт'; nn(app, 'Профессиональная экспертиза', 'Направлен акт');
    },
    disputeAccept(app, at, p){
      const s = last(app); s.st = 'Завершено';
      if(s.phase === 'dispute1'){ toPay80(app, at, p && p.docs); return; }
      toFk(app, at, 'ННЦРЗ принял ваш мотивированный отказ и изменил заключение профессиональной экспертизы.');
      const fk = last(app); fk.docs = docsOr(p, [ nnDoc(app, 14, 'Заключение профессиональной экспертизы (изменённое)', 1260) ]);
    },
    disputeReject(app, at, p){
