<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  Поиск новой главной: подсказки по услугам и разделам прямо при вводе + «Спросить AI-помощника».
  Данные — window.mpHome.search(q, role) (HomeData). Enter без выбранной подсказки отправляет вопрос
  AI-помощнику (событие 'mp-ai-open'). Стрелки ↑/↓ — выбор подсказки, Esc — закрыть.
  Пропсы:
    look  = light | glass (поле на тёмном баннере, подписи и чипсы — белые)
    size  = lg (64 px, по умолчанию) | md (56 px)
    chips = "0" — без строки «Часто ищут»
    center = "1" — чипсы по центру
-->
<x-dc>
<helmet>
<style>
  .sb{ position:relative; font-family:'Inter',system-ui,sans-serif; }
  .sb *{ box-sizing:border-box; }
  .sb-field{ position:relative; z-index:2; display:flex; align-items:center; gap:12px; height:64px; padding:0 8px 0 20px; background:#fff; border-radius:18px; box-shadow:0 0 0 1px var(--n200), 0 12px 32px -18px rgba(10,13,20,.28); transition:box-shadow .18s; }
  .sb-md .sb-field{ height:56px; border-radius:16px; }
  .sb-field:focus-within{ box-shadow:0 0 0 2px var(--b500), 0 0 0 6px color-mix(in srgb, var(--b500) 18%, transparent), 0 12px 32px -18px rgba(10,13,20,.28); }
  .sb-glass .sb-field{ box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 24px 48px -20px rgba(0,0,0,.45); }
  .sb-spark{ font-size:22px; color:var(--b600); flex:0 0 auto; }
  .sb-input{ flex:1; min-width:0; height:100%; border:none; outline:none; background:none; font:400 16.5px/1.2 'Inter',sans-serif; color:var(--n900); }
  .sb-input::placeholder{ color:var(--n400); }
  .sb-clear{ width:36px; height:36px; border:none; border-radius:10px; background:none; color:var(--n400); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; }
  .sb-clear:hover{ background:var(--n100); color:var(--n700); }
  .sb-go{ height:48px; padding:0 22px; border:none; border-radius:12px; background:var(--b600); color:#fff; font:600 15px/1 'Inter',sans-serif; cursor:pointer; display:flex; align-items:center; gap:8px; flex:0 0 auto; transition:background .15s; }
  .sb-md .sb-go{ height:42px; padding:0 18px; }
  .sb-go:hover{ background:var(--b700); }
  .sb-go i{ font-size:19px; }

  .sb-drop{ position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:60; background:#fff; border-radius:18px; box-shadow:0 0 0 1px rgba(10,13,20,.06), 0 28px 56px -20px rgba(10,13,20,.35); padding:8px; max-height:min(460px, 70vh); overflow-y:auto; animation:sb-in .16s ease; text-align:left; }
  @keyframes sb-in{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }
  .sb-cap{ padding:10px 12px 6px; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--n400); }
  .sb-item{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; text-decoration:none; color:var(--n900); cursor:pointer; border:none; background:none; width:100%; font-family:inherit; text-align:left; }
  .sb-item[aria-selected="true"], .sb-item:hover{ background:var(--b50); }
  .sb-ico{ width:38px; height:38px; flex:0 0 auto; border-radius:10px; background:var(--n100); color:var(--b600); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .sb-item[aria-selected="true"] .sb-ico{ background:#fff; }
  .sb-txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .sb-txt b{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .sb-txt b mark{ background:color-mix(in srgb, var(--bacc) 30%, transparent); color:inherit; border-radius:3px; padding:0 1px; }
  .sb-txt span{ font-size:12.5px; color:var(--n400); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-kind{ font-size:11.5px; font-weight:600; color:var(--n500); background:var(--n100); border-radius:999px; padding:4px 9px; flex:0 0 auto; }
  .sb-ai{ margin-top:4px; border-top:1px solid var(--n200); padding-top:8px; }
  .sb-ai .sb-ico{ background:linear-gradient(135deg,var(--b500),var(--b700)); color:#fff; }
  .sb-empty{ padding:14px 12px; font-size:14px; color:var(--n500); }

  .sb-chips{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .sb-center .sb-chips{ justify-content:center; }
  .sb-chips > span{ font-size:14px; font-weight:500; color:var(--n500); margin-right:2px; }
  .sb-chip{ height:36px; padding:0 14px; border:none; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 1px var(--n200); color:var(--n700); font:500 14px/1 'Inter',sans-serif; cursor:pointer; transition:.15s; white-space:nowrap; }
  .sb-chip:hover{ box-shadow:inset 0 0 0 1px var(--b300); background:var(--b50); color:var(--b800); }
  .sb-glass .sb-chips > span{ color:rgba(255,255,255,.75); }
  .sb-glass .sb-chip{ background:rgba(255,255,255,.12); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); color:#fff; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .sb-glass .sb-chip:hover{ background:rgba(255,255,255,.22); }
  @media (max-width:640px){ .sb-chips{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-top:12px; } .sb-chips::-webkit-scrollbar{ display:none; } .sb-chip{ flex:0 0 auto; } .sb-go .sb-t{ display:none; } .sb-go{ padding:0 14px; } .sb-field{ height:56px; padding-left:14px; } .sb-input{ font-size:16px; } }
</style>
</helmet>
<div class="{{ cls }}">
  <form class="sb-field" role="search" onSubmit="{{ onSubmit }}">
    <i class="ri-sparkling-2-fill sb-spark" aria-hidden="true"></i>
    <input class="sb-input" ref="{{ inputRef }}" value="{{ q }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onKeyDown="{{ onKey }}" placeholder="{{ placeholder }}" aria-label="Поиск по порталу и вопрос AI-помощнику" aria-expanded="{{ openStr }}" aria-controls="sb-list" aria-autocomplete="list" autocomplete="off">
    <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="sb-clear" onClick="{{ clear }}" title="Очистить" aria-label="Очистить"><i class="ri-close-line"></i></button>
    </sc-if>
    <button type="submit" class="sb-go"><i class="ri-search-line"></i><span class="sb-t">Найти</span></button>
  </form>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:55;"></div>
    <div class="sb-drop" id="sb-list" role="listbox">
      <div class="sb-cap">{{ cap }}</div>
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <a class="sb-item" role="option" href="{{ it.href }}" target="{{ it.target }}" rel="noopener" aria-selected="{{ it.sel }}" onMouseEnter="{{ it.hover }}">
          <span class="sb-ico"><i class="{{ it.icon }}"></i></span>
          <span class="sb-txt"><b>{{ it.labelNode }}</b><span>{{ it.sub }}</span></span>
          <span class="sb-kind">{{ it.kind }}</span>
        </a>
      </sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div class="sb-empty">Ничего не нашлось — спросите AI-помощника</div>
      </sc-if>
      <div class="sb-ai">
        <button type="button" class="sb-item" role="option" aria-selected="{{ aiSel }}" onClick="{{ askAi }}" onMouseEnter="{{ aiHover }}">
          <span class="sb-ico"><i class="ri-sparkling-2-fill"></i></span>
          <span class="sb-txt"><b>{{ aiLabel }}</b></span>
          <i class="ri-corner-down-left-line" style="font-size:18px;color:var(--n400);"></i>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
    <div class="sb-chips">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <button type="button" class="sb-chip" onClick="{{ c.onClick }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:140}}">
const lsGet = (k) => { try { return localStorage.getItem(k); } catch(e){ return null; } };
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.inputRef = React.createRef();
    this.state = { q:'', open:false, sel:-1, role: lsGet('mp-role') || 'citizens', ready: !!window.mpHome };
  }
  componentDidMount(){
    // роль из ссылки (?role=…) HomeData кладёт в хранилище при загрузке — перечитываем, когда он готов
    this._ready = () => this.setState({ ready:true, role: window.mpHome ? window.mpHome.getRole() : this.state.role });
    window.addEventListener('mp-home-ready', this._ready);
    this._onRole = (e) => { if(e && e.detail) this.setState({ role:e.detail }); };
    window.addEventListener('mp-role-change', this._onRole);
    // «/» — фокус в поиск (как на крупных порталах)
    this._key = (e) => {
      if(e.key === '/' && !/input|textarea/i.test((document.activeElement || {}).tagName || '') && this.inputRef.current && this.props.hotkey === '1'){ e.preventDefault(); this.inputRef.current.focus(); }
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount(){ window.removeEventListener('mp-home-ready', this._ready); window.removeEventListener('mp-role-change', this._onRole); window.removeEventListener('keydown', this._key); }
  results(){
    const H = window.mpHome; if(!H) return [];
    const q = this.state.q.trim();
    if(!q){
      const gov = H.GOV[this.state.role] || [];
      return gov.slice(0, 4).map(g => ({ kind:'Госуслуга', label:g.short, sub: g.portal ? 'На портале' : (/elicense/.test(g.href) ? '«Е‑лицензирование»' : 'eGov.kz'), icon:g.icon, href:g.href }));
    }
    return H.search(q, this.state.role);
  }
  ask(q){
    const H = window.mpHome; if(!H) return;
    this.setState({ open:false, sel:-1 });
    if(this.inputRef.current) this.inputRef.current.blur();
    H.ask(q);
  }
  go(it){ if(!it) return; if(/^https?:/.test(it.href)) window.open(it.href, '_blank', 'noopener'); else location.href = it.href; }
  renderVals(){
    const s = this.state, H = window.mpHome;
    const res = this.results();
    const q = s.q.trim();
    const hl = (label) => {
      if(!q) return label;
      const w = q.split(/\s+/).filter(x => x.length > 1).map(x => x.slice(0, Math.max(3, x.length - 2)).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if(!w.length) return label;
      const re = new RegExp('(' + w.join('|') + ')', 'ig');
      return label.split(re).map((part, i) => i % 2 ? React.createElement('mark', { key:i }, part) : part);
    };
    const items = res.map((it, i) => ({ ...it, labelNode: hl(it.label), sel: s.sel === i ? 'true' : 'false', target: /^https?:/.test(it.href) ? '_blank' : '_self',
      sub: it.sub + (/^https?:/.test(it.href) ? ' ↗' : ''), hover:() => this.setState({ sel:i }) }));
    const role = s.role;
    const chips = (H ? H.CHIPS[role] : []).map(label => ({ label, onClick:() => this.ask(label) }));
    const look = this.props.look || 'light';
    return {
      cls: 'sb' + (look === 'glass' ? ' sb-glass' : '') + (this.props.size === 'md' ? ' sb-md' : '') + (this.props.center === '1' ? ' sb-center' : ''),
      inputRef: this.inputRef,
      placeholder: this.props.placeholder || (role === 'business' ? 'Услуга или вопрос, например: лицензия на аптеку' : role === 'medical' ? 'Протокол, форма или вопрос AI-помощнику' : 'Услуга или вопрос, например: справка 075/у'),
      q: s.q, hasQ: !!s.q,
      onInput: (e) => this.setState({ q:e.target.value, open:true, sel: -1 }),
      onFocus: () => this.setState({ open:true }),
      onKey: (e) => {
        const n = res.length;
        if(e.key === 'ArrowDown'){ e.preventDefault(); this.setState({ open:true, sel: s.sel + 1 > n ? 0 : s.sel + 1 }); }
        else if(e.key === 'ArrowUp'){ e.preventDefault(); this.setState({ sel: s.sel - 1 < 0 ? n : s.sel - 1 }); }
        else if(e.key === 'Escape'){ this.setState({ open:false, sel:-1 }); }
      },
      onSubmit: (e) => { e.preventDefault(); if(s.sel >= 0 && s.sel < res.length) this.go(res[s.sel]); else if(q) this.ask(q); else if(this.inputRef.current) this.inputRef.current.focus(); },
      clear: () => { this.setState({ q:'', sel:-1 }); if(this.inputRef.current) this.inputRef.current.focus(); },
      open: s.open && !!H, openStr: s.open ? 'true' : 'false', close: () => this.setState({ open:false, sel:-1 }),
      cap: q ? (res.length ? 'Найдено на портале' : 'Результаты') : 'Популярное',
      items, empty: !!q && !res.length,
      aiSel: s.sel === res.length ? 'true' : 'false', aiHover: () => this.setState({ sel: res.length }),
      aiLabel: q ? 'Спросить AI-помощника: «' + q + '»' : 'Задать вопрос AI-помощнику',
      askAi: () => this.ask(q),
      showChips: this.props.chips !== '0' && chips.length > 0, chips,
    };
  }
}
</script>
</body>
</html>
