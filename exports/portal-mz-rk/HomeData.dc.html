<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  Новая главная портала — общий «бэкенд» вариантов A–E («Главная A - Ясный» … «Главная E - AI-помощник»).
  Невизуальный компонент: подключается через <dc-import name="HomeData" hint-size="0px,0px">,
  кладёт API в window.mpHome и рассылает событие 'mp-home-ready'.

  Что внутри:
    • 10 брендовых палитр (PALETTES) и applyTheme(): CSS-переменные --b50 … --b950, --bacc на <html>.
      Выбор хранится в localStorage['mp-theme'], смена — событие 'mp-theme-change'.
      Нейтральные цвета — AlignUI (n0 … n900), их не трогаем.
    • Контент главной по ролям — тот же, что на текущей главной («Портал Минздрава - Главная»):
      разделы и ссылки, «Часто ищут», «Новое на портале», «Полезные ссылки», FAQ, новости, ответы AI.
      Плюс популярные госуслуги с кодами eGov — из «Государственные услуги.dc.html».
    • search(q, role) — подсказки поиска по услугам и разделам; botReply(q, role) — ответы AI.
    • Доступность: localStorage['mp-a11y'] = { size:'md'|'lg'|'xl', contrast:bool } → атрибуты на <html>.
  Общие стили новых страниц (.hm-*) — в helmet этого компонента.
-->
<x-dc>
<helmet>
<style>
  /* Палитра по умолчанию — «Небесная лазурь»; HomeData перезаписывает переменные выбранной палитрой */
  :root{
    --b50:#EEF8FC; --b100:#D6EEF7; --b200:#ACDCEE; --b300:#7CC8E4; --b400:#3FB0D9; --b500:#1AA3CF; --b600:#0B7AA6; --b700:#086286; --b800:#0A4F6C; --b900:#0B3A50; --b950:#06222F; --bacc:#E3A92B;
    /* нейтральные — AlignUI один в один */
    --n0:#FFFFFF; --n50:#FBFCFD; --n100:#F6F8FA; --n200:#E2E4E9; --n300:#CDD0D5; --n400:#868C98; --n500:#525866; --n600:#31353F; --n700:#20232D; --n900:#0A0D14;
    --red:#DF1C41; --red-l:#FDEDF0; --red-d:#710E21; --green:#38C793; --green-l:#EFFAF6; --green-d:#176448; --orange:#F17B2C; --orange-l:#FEF3EB;
    --hm-sh1:0 1px 2px rgba(10,13,20,.04);
    --hm-sh2:0 1px 2px rgba(10,13,20,.04),0 6px 16px -6px rgba(10,13,20,.08);
    --hm-sh3:0 24px 48px -20px rgba(10,13,20,.22);
    --gut:clamp(16px,3.4vw,72px);
    --wrap:1760px;
    --hm-ease:cubic-bezier(.2,.7,.2,1);
  }
  html[data-contrast="hi"]{ --n400:#525866; --n500:#31353F; --n300:#868C98; --n200:#B9BEC7; }
  html[data-a11y="lg"]{ zoom:1.125; }
  html[data-a11y="xl"]{ zoom:1.25; }

  /* Страница проявляется, когда заставка ушла (или её нет) — без «прыжков» подгружаемых блоков */
  .hm-root{ opacity:0; }
  html.mp-ready .hm-root{ opacity:1; transition:opacity .45s ease; }

  .hm-root{ font-family:'Inter',system-ui,sans-serif; color:var(--n900); -webkit-font-smoothing:antialiased; font-feature-settings:'cv11','ss01'; }
  .hm-root *, .hm-root *::before, .hm-root *::after{ box-sizing:border-box; }
  .hm-wrap{ width:min(100% - 2*var(--gut), var(--wrap)); margin-inline:auto; }
  .hm-root :focus-visible{ outline:2px solid var(--b500); outline-offset:2px; border-radius:10px; }
  .hm-root input:focus-visible{ outline:none; }
  .hm-search{ position:relative; z-index:20; }

  .hm-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; line-height:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--b700); }
  .hm-eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--bacc); }
  .hm-h2{ font-size:clamp(24px,1.1vw + 14px,34px); line-height:1.18; font-weight:600; letter-spacing:-.022em; margin:0; color:var(--n900); }
  .hm-lead{ font-size:16px; line-height:1.6; color:var(--n500); margin:0; }
  .hm-sec{ padding-block:clamp(40px,4.4vw,80px); }
  .hm-sec-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:clamp(20px,2vw,32px); }
  .hm-sec-head > div:first-child{ display:flex; flex-direction:column; gap:10px; }

  .hm-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 22px; border:none; border-radius:12px; background:var(--b600); color:#fff; font:600 15px/1 'Inter',sans-serif; text-decoration:none; cursor:pointer; transition:background .15s, transform .15s, box-shadow .15s; white-space:nowrap; }
  .hm-btn:hover{ background:var(--b700); }
  .hm-btn i{ font-size:19px; }
  .hm-btn-line{ background:var(--n0); color:var(--n700); box-shadow:inset 0 0 0 1px var(--n200); }
  .hm-btn-line:hover{ background:var(--n100); }
  .hm-btn-soft{ background:var(--b50); color:var(--b700); }
  .hm-btn-soft:hover{ background:var(--b100); }
  .hm-btn-sm{ height:40px; padding:0 16px; font-size:14px; border-radius:10px; }

  .hm-link{ display:inline-flex; align-items:center; gap:6px; font-size:15px; font-weight:600; color:var(--b700) !important; text-decoration:none; }
  .hm-link i{ font-size:18px; transition:transform .15s; }
  .hm-link:hover i{ transform:translateX(3px); }

  .hm-card{ background:var(--n0); border:1px solid var(--n200); border-radius:20px; box-shadow:var(--hm-sh1); }
  .hm-ico{ width:48px; height:48px; flex:0 0 auto; border-radius:14px; display:flex; align-items:center; justify-content:center; background:var(--b50); color:var(--b600); font-size:24px; }
  .hm-ico.sm{ width:40px; height:40px; border-radius:11px; font-size:20px; }
  .hm-ico.red{ background:var(--red-l); color:var(--red); }

  .hm-chip{ display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border:none; border-radius:999px; background:var(--n0); box-shadow:inset 0 0 0 1px var(--n200); color:var(--n600); font:500 14px/1 'Inter',sans-serif; cursor:pointer; transition:.15s; white-space:nowrap; text-decoration:none; }
  .hm-chip:hover{ box-shadow:inset 0 0 0 1px var(--b300); color:var(--b700); background:var(--b50); }

  .hm-seg{ display:inline-flex; gap:4px; padding:4px; border-radius:14px; background:var(--n100); box-shadow:inset 0 0 0 1px var(--n200); flex-wrap:wrap; }
  .hm-seg button{ height:40px; padding:0 16px; border:none; border-radius:10px; background:transparent; color:var(--n500); font:500 14px/1 'Inter',sans-serif; cursor:pointer; transition:.15s; white-space:nowrap; display:inline-flex; align-items:center; gap:8px; }
  .hm-seg button:hover{ color:var(--n900); }
  .hm-seg button[aria-pressed="true"]{ background:var(--n0); color:var(--b700); font-weight:600; box-shadow:0 1px 3px rgba(10,13,20,.1); }

  /* Орнамент «қошқар мүйіз»: маска + цвет бренда; svg собирается в HomeData (--hm-orn) */
  .hm-orn{ position:absolute; inset:0; pointer-events:none; background:var(--b500); -webkit-mask-image:var(--hm-orn); mask-image:var(--hm-orn); -webkit-mask-size:132px; mask-size:132px; opacity:.07; }

  .hm-root image-slot{ display:block !important; width:100% !important; height:100% !important; }
  .hm-scroll{ scrollbar-width:none; }
  .hm-scroll::-webkit-scrollbar{ display:none; }
  .hm-sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @keyframes hm-up{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  @keyframes hm-fade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes hm-drop{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
  html.mp-ready .hm-in{ animation:hm-up .7s var(--hm-ease) both; }
  html.mp-ready .hm-in.d1{ animation-delay:.06s; } html.mp-ready .hm-in.d2{ animation-delay:.12s; } html.mp-ready .hm-in.d3{ animation-delay:.18s; } html.mp-ready .hm-in.d4{ animation-delay:.24s; }
  @media (prefers-reduced-motion:reduce){ .hm-root *, .hm-root *::before, .hm-root *::after{ animation:none !important; transition:none !important; } }
  .hm-band-soft{ background:linear-gradient(180deg, #fff, var(--n50)); }

  /* ================================================================
     ОФОРМЛЕНИЕ: <html data-fill="deep | flat | pastel">  (localStorage['mp-fill'])
     deep   — глубокие градиенты бренда (исходные стили страниц, переопределений нет)
     flat   — «без градиентов»: только сплошные цвета бренда, декоративные свечения скрыты
     pastel — пастельные градиенты: тёмные баннеры становятся светлыми, текст — тёмный.
              Цвета — пресет --pa, --pb, --pc, --pd (localStorage['mp-pastel']; пресеты — PASTELS ниже).
              На пастели только n900 / n600 / b900: контраст ≥ 6:1 на любой точке градиента.
     ================================================================ */
  :root{ --pa:#BAE6FD; --pb:#C7D2FE; --pc:#E0F2FE; --pd:#F5F8FF;
    --pg-mesh: radial-gradient(70% 90% at 6% 0%, var(--pa), transparent 72%), radial-gradient(60% 85% at 96% 6%, var(--pb), transparent 72%), radial-gradient(70% 80% at 55% 105%, var(--pc), transparent 74%), var(--pd);
    --pg-lin: linear-gradient(135deg, var(--pa) 0%, var(--pc) 50%, var(--pb) 100%); }

  /* ——— без градиентов ——— */
  html[data-fill="flat"] .hm-band-soft{ background:var(--n50); }
  html[data-fill="flat"] .va-hero{ background:var(--b50); }
  html[data-fill="flat"] .va-glow,
  html[data-fill="flat"] .va-gov::after,
  html[data-fill="flat"] .vb-blob, html[data-fill="flat"] .vb-sky .fade,
  html[data-fill="flat"] .vb-feat::after,
  html[data-fill="flat"] .vb-glassband::before, html[data-fill="flat"] .vb-glassband::after,
  html[data-fill="flat"] .vc-sit::after,
  html[data-fill="flat"] .vd-deco::after,
  html[data-fill="flat"] .pf::after,
  html[data-fill="flat"] .hv-hero::after{ display:none; }
  html[data-fill="flat"] .va-gov, html[data-fill="flat"] .vb-feat, html[data-fill="flat"] .vb-pcta{ background:var(--b700); }
  html[data-fill="flat"] .vb-sky::before{ background:var(--b900); }
  html[data-fill="flat"] .vb-h1{ background:none; color:#fff; }
  html[data-fill="flat"] .vb-tile{ background:rgba(255,255,255,.1); }
  html[data-fill="flat"] .vb-tile:hover{ background:rgba(255,255,255,.18); }
  html[data-fill="flat"] .vb-tile[aria-expanded="true"]{ background:#fff; }
  html[data-fill="flat"] .vb-tile.gov{ background:var(--b600); }
  html[data-fill="flat"] .vb-glassband{ background:var(--b50); }
  html[data-fill="flat"] .vb-fresh a{ background:#fff; box-shadow:inset 0 0 0 1px var(--n200); }
  html[data-fill="flat"] .vc-hero{ background:var(--b50); }
  html[data-fill="flat"] .vc-role[aria-checked="true"]{ background:var(--b50); }
  html[data-fill="flat"] .vd-hero{ background:var(--b900); }
  html[data-fill="flat"] .vd-hero::before{ background:var(--bacc); }
  html[data-fill="flat"] .vd-cover{ background:var(--b600); }
  html[data-fill="flat"] .vd-stats{ background:var(--b50); }
  html[data-fill="flat"] .ve-hero::before{ background:var(--b50); }
  html[data-fill="flat"] .ve-orb, html[data-fill="flat"] .ai-hello .big{ background:var(--b600); }
  html[data-fill="flat"] .ve-h1 span{ background:none; color:var(--b700); }
  html[data-fill="flat"] .ve-field{ background:var(--b300); }
  html[data-fill="flat"] .sb-ai .sb-ico, html[data-fill="flat"] .ai-logo, html[data-fill="flat"] .fq-more .ic{ background:var(--b600); }
  html[data-fill="flat"] .ai-fab{ background:var(--b600); }
  html[data-fill="flat"] .fq-more{ background:var(--b50); }
  html[data-fill="flat"] .nw-cover{ background:var(--b600); }
  html[data-fill="flat"] .sp-line{ background:var(--bacc); }
  html[data-fill="flat"] .sp-emblem{ background:#fff; }
  html[data-fill="flat"] .sp-ornament{ background:var(--b900); }
  html[data-fill="flat"] .sp-leaf{ background:var(--b800); }
  html[data-fill="flat"] .hv-hero{ background:var(--b900); }
  html[data-fill="flat"] .vf-hcard{ background:var(--b900); }
  html[data-fill="flat"] .vf-hcard .deco::after{ display:none; }
  html[data-fill="flat"] .mk-f .hc{ background:var(--b900) !important; }
  html[data-fill="flat"] .mk-a, html[data-fill="flat"] .mk-c, html[data-fill="flat"] .mk-e{ background:var(--b50); }
  html[data-fill="flat"] .mk-b{ background:var(--b900); }
  html[data-fill="flat"] .mk-d{ background:var(--b900); }

  /* ——— пастельные градиенты ——— */
  html[data-fill="pastel"] .va-hero, html[data-fill="pastel"] .vc-hero{ background:var(--pg-mesh); }
  html[data-fill="pastel"] .va-glow{ display:none; }
  html[data-fill="pastel"] .ve-hero::before{ background:var(--pg-mesh); }
  html[data-fill="pastel"] .hm-band-soft, html[data-fill="pastel"] .vb-glassband, html[data-fill="pastel"] .vd-stats{ background:linear-gradient(180deg, var(--pd), #fff); }
  html[data-fill="pastel"] .vb-glassband::before{ background:radial-gradient(closest-side, var(--pa), transparent); }
  html[data-fill="pastel"] .vb-glassband::after{ background:radial-gradient(closest-side, var(--pb), transparent); }
  html[data-fill="pastel"] .vc-role[aria-checked="true"]{ background:linear-gradient(120deg, var(--pc), #fff); }
  html[data-fill="pastel"] .ve-field{ background:linear-gradient(120deg, var(--pa), var(--pb), var(--pc)); }
  html[data-fill="pastel"] .ve-orb, html[data-fill="pastel"] .ai-hello .big{ background:radial-gradient(120% 120% at 25% 15%, var(--pa), var(--b500) 55%, var(--b700)); }
  html[data-fill="pastel"] .fq-more{ background:var(--pg-lin); }
  html[data-fill="pastel"] .nw-cover{ background:var(--pg-lin); }
  html[data-fill="pastel"] .nw-cover::before{ background:var(--b700); opacity:.08; }
  html[data-fill="pastel"] .nw-cover i{ color:var(--b800); }
  /* карточки-акценты: пастель + тёмный текст */
  html[data-fill="pastel"] .va-gov, html[data-fill="pastel"] .vb-feat, html[data-fill="pastel"] .vb-pcta{ background:var(--pg-lin); color:var(--n900); box-shadow:inset 0 0 0 1px rgba(255,255,255,.7); }
  html[data-fill="pastel"] .va-gov::before, html[data-fill="pastel"] .vb-feat::before, html[data-fill="pastel"] .vb-pcta::before{ background:var(--b700); opacity:.06; }
  html[data-fill="pastel"] .va-gov::after, html[data-fill="pastel"] .vb-feat::after{ background:radial-gradient(closest-side, rgba(255,255,255,.7), transparent); }
  html[data-fill="pastel"] .va-gov p, html[data-fill="pastel"] .vb-feat p, html[data-fill="pastel"] .vb-pcta span{ color:var(--n600); }
  html[data-fill="pastel"] .va-gov .hm-ico, html[data-fill="pastel"] .vb-feat .ic{ background:rgba(255,255,255,.75); color:var(--b700); box-shadow:none; }
  html[data-fill="pastel"] .va-gov .count, html[data-fill="pastel"] .vb-feat .cnt{ background:rgba(255,255,255,.7); color:var(--b900); }
  html[data-fill="pastel"] .va-gov-links a{ background:rgba(255,255,255,.62); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9); color:var(--n900); }
  html[data-fill="pastel"] .va-gov-links a:hover{ background:#fff; }
  html[data-fill="pastel"] .va-gov-all, html[data-fill="pastel"] .vb-feat .go, html[data-fill="pastel"] .vb-pcta a{ background:var(--b600); color:#fff; }
  /* B — светлое сияние вместо тёмного */
  html[data-fill="pastel"] .vb-hero{ background:var(--pd); color:var(--n900); }
  html[data-fill="pastel"] .vb-sky::before{ background:var(--pg-mesh); }
  html[data-fill="pastel"] .vb-blob{ opacity:1; filter:blur(20px); }
  html[data-fill="pastel"] .vb-blob.b1{ background:radial-gradient(closest-side, var(--pa), transparent); }
  html[data-fill="pastel"] .vb-blob.b2{ background:radial-gradient(closest-side, var(--pb), transparent); }
  html[data-fill="pastel"] .vb-blob.b3{ background:radial-gradient(closest-side, var(--pc), transparent); }
  html[data-fill="pastel"] .vb-sky .grain{ background:var(--b700); opacity:.05; }
  html[data-fill="pastel"] .vb-sky .fade{ background:linear-gradient(180deg, transparent, rgba(255,255,255,.6)); }
  html[data-fill="pastel"] .vb-h1{ background:none; color:var(--n900); }
  html[data-fill="pastel"] .vb-lead{ color:var(--n600); }
  html[data-fill="pastel"] .vb-badge{ background:rgba(255,255,255,.6); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9); color:var(--n600); }
  html[data-fill="pastel"] .vb-badge span{ background:#fff; color:var(--b900); }
  html[data-fill="pastel"] .vb-tile{ background:rgba(255,255,255,.55); color:var(--n900); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), 0 10px 30px -18px rgba(10,13,20,.25); }
  html[data-fill="pastel"] .vb-tile:hover{ background:rgba(255,255,255,.8); }
  html[data-fill="pastel"] .vb-tile[aria-expanded="true"]{ background:#fff; }
  html[data-fill="pastel"] .vb-tile .ic{ background:#fff; color:var(--b700); box-shadow:none; }
  html[data-fill="pastel"] .vb-tile.gov{ background:var(--b600); color:#fff; }
  html[data-fill="pastel"] .vb-tile.gov .ic{ background:rgba(255,255,255,.16); color:#fff; }
  html[data-fill="pastel"] .vb-tile.red .ic{ background:var(--red-l); color:var(--red); }
  html[data-fill="pastel"] .vb-panel{ box-shadow:0 30px 60px -28px rgba(10,13,20,.3); }
  /* D — светлый официальный баннер */
  html[data-fill="pastel"] .vd-hero{ background:var(--pg-mesh); color:var(--n900); }
  html[data-fill="pastel"] .vd-deco::before{ background:var(--b700); opacity:.04; }
  html[data-fill="pastel"] .vd-deco::after{ display:none; }
  html[data-fill="pastel"] .vd-eye{ color:var(--b900); }
  html[data-fill="pastel"] .vd-lead{ color:var(--n600); }
  html[data-fill="pastel"] .vd-show{ background:rgba(255,255,255,.45); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9); }
  html[data-fill="pastel"] .vd-cover{ background:var(--pg-lin); }
  html[data-fill="pastel"] .vd-cover::before{ background:var(--b700); opacity:.07; }
  html[data-fill="pastel"] .vd-cover i{ color:var(--b800); }
  html[data-fill="pastel"] .vd-cover .lbl{ background:rgba(255,255,255,.75); color:var(--b900); }
  /* поиск и шапка поверх светлого баннера */
  html[data-fill="pastel"] .sb-glass .sb-chips > span{ color:var(--n600); }
  html[data-fill="pastel"] .sb-glass .sb-chip{ background:rgba(255,255,255,.6); box-shadow:inset 0 0 0 1px rgba(255,255,255,.95); color:var(--n700); }
  html[data-fill="pastel"] .sb-glass .sb-chip:hover{ background:#fff; color:var(--b800); }
  html[data-fill="pastel"] .sb-glass .sb-field{ box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 24px 48px -24px rgba(10,13,20,.25); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid){ background:rgba(255,255,255,.35); border-bottom-color:rgba(255,255,255,.7); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-name b{ color:var(--n900); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-name span{ color:var(--n600); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-role{ color:var(--n600); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-role:hover, html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-role[aria-current="true"]{ color:var(--b900); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-role[aria-current="true"]::after{ background:var(--b600); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-ibtn{ background:rgba(255,255,255,.7); box-shadow:inset 0 0 0 1px rgba(255,255,255,.95); color:var(--n700); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-ibtn i{ color:var(--n500); }
  html[data-fill="pastel"] .ph-glass:not(.ph-solid) .ph-login{ background:var(--b600); color:#fff; }
  /* заставки и витрина */
  html[data-fill="pastel"] .sp-emblem{ background:var(--pg-mesh); }
  html[data-fill="pastel"] .sp-ornament{ background:var(--pg-mesh); }
  html[data-fill="pastel"] .sp-ornament::before{ background:var(--b700); }

    if(/цен/.test(t) && /((^|\s)ми(\s|$)|издели|(^|\s)имн(\s|$))/.test(t)) return { text:'Регистрация цены производителя медицинского изделия подаётся онлайн в кабинете заявителя «Единое окно». Понадобятся ЭЦП организации, договор с НЦЭЛС и заявка на платёж. Срок — 10 рабочих дней.', cta:{ label:'Паспорт услуги', href:'Паспорт услуги.dc.html#price-mi', icon:'ri-stethoscope-line' } };
    if(/(регистрац.*цен|цен.*регистрац)/.test(t)) return { text:'Уточните, для чего нужна регистрация цены:', chips:['Регистрация цены ЛС','Регистрация цены МИ'] };
    if(role === 'medical' && /(сертификац|аккредитац|категори)/.test(t)) return { text:'Сертификация специалистов, аккредитация и присвоение квалификационной категории — в разделе «Профессиональная деятельность».', cta:{ label:'Сертификация специалистов', href:'Паспорт услуги.dc.html#cert-clinical', icon:'ri-medal-line' } };
    if(/(протокол|стандарт)/.test(t)) return { text:'Актуальные клинические протоколы и стандарты медицинской помощи — в справочнике с фильтрацией по профилю и коду МКБ-10.', cta:{ label:'Клинические протоколы', href:P.proto + '#protocols', icon:'ri-file-list-3-line' } };
    if(/(форм|отчёт|отчет|расписан)/.test(t) && role === 'medical') return { text:'Электронные медицинские формы, расписание приёма и отчётность доступны в кабинете медработника после подтверждения места работы.', cta:{ label:'Электронные формы', href:P.cat, icon:'ri-file-edit-line' } };
    if(/(госуслуг|государственн\S* услуг|egov|егов)/.test(t)) return role === 'medical'
      ? { text:'Государственные услуги в сфере здравоохранения доступны в разделах «Гражданам» и «Бизнесу» и оформляются на портале eGov.kz. Для медицинских работников здесь — профессиональная деятельность, клинические протоколы, документация и отчётность.' }
      : { text: role === 'business' ? 'Государственные услуги для бизнеса собраны в отдельном разделе: фармацевтика, лицензирование и аккредитация.' : 'Государственные услуги в сфере медицинской помощи собраны в отдельном разделе: справки, запись к врачу, прикрепление к поликлинике и другие. Выбранная услуга откроется на портале eGov.kz.', cta:{ label:'Государственные услуги', href:govPage(role), icon:'ri-government-line' } };
    if(/(лицензи|аккредитац|фарм)/.test(t)) return { text:'Лицензии и аккредитация оформляются как государственные услуги: раздел «Государственные услуги» для бизнеса, категория «Лицензирование и аккредитация». Выбранная услуга откроется на портале eGov.kz или «Е‑лицензирование».', cta:{ label:'Лицензирование и аккредитация', href:govPage('business', 'lic'), icon:'ri-award-line' } };
    return { text:'Я могу подсказать по записи к врачу, государственным услугам, вакцинации, поиску медорганизаций и лекарств. Опишите запрос подробнее — например, симптом или название услуги.' };
  };

  // ——— Поиск: подсказки по услугам и разделам ———
  const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[«»"()№.,]/g, ' ');
  const INDEX = [];
  ROLES.forEach(r => {
    (GOV[r.id] || []).forEach(g => INDEX.push({ kind:'Госуслуга', role:r.id, label:g.short, sub: g.portal ? 'На портале' : (/elicense/.test(g.href) ? '«Е‑лицензирование»' : 'eGov.kz'), icon:g.icon, href:g.href, text:norm(g.short + ' ' + g.name + ' ' + (g.kw || '')) }));
    (SECTIONS[r.id] || []).forEach(s => {
      INDEX.push({ kind:'Раздел', role:r.id, label:s.label, sub:s.desc, icon:s.icon, href:s.href, text:norm(s.label + ' ' + s.desc) });
      s.links.forEach(l => INDEX.push({ kind:'Раздел', role:r.id, label:l.label, sub:s.label, icon:s.icon, href:l.href, text:norm(l.label + ' ' + s.label) }));
    });
  });
  LIBRARY.forEach(l => INDEX.push({ kind:'Справочник', role:'*', label:l.label, sub:'Справочник', icon:l.icon, href:l.href, text:norm(l.label) }));
  const search = (q, role) => {
    const words = norm(q).split(/\s+/).filter(w => w.length > 1);
    if(!words.length) return [];
    const seen = new Set();
    return INDEX.map(it => {
      const hit = words.every(w => it.text.includes(w.slice(0, Math.max(3, w.length - 2))));
      if(!hit) return null;
      const score = (it.role === role || it.role === '*' ? 0 : 10) + (it.kind === 'Госуслуга' ? 0 : 1) + (norm(it.label).startsWith(words[0].slice(0, 3)) ? 0 : 2);
      return { ...it, score };
    }).filter(Boolean).sort((a, b) => a.score - b.score).filter(it => { const k = it.label + it.href; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6);
  };

  // Открыть AI-помощника (AiPanel) с вопросом — из поиска, чипсов и подсказок
  const ask = (q) => { try { window.dispatchEvent(new CustomEvent('mp-ai-open', { detail:{ q: q || '' } })); } catch(e){} };

  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many); };

  const VARIANTS = [
    { id:'cur', key:'', label:'Текущая', name:'Текущая главная', file:HOME },
    { id:'a', key:'A', label:'Ясный', name:'Ясный — сервис прежде всего', file:'Главная A - Ясный.dc.html' },
    { id:'b', key:'B', label:'Стекло', name:'Стекло — сияние и глубина', file:'Главная B - Стекло.dc.html' },
    { id:'c', key:'C', label:'Ситуации', name:'Жизненные ситуации', file:'Главная C - Жизненные ситуации.dc.html' },
    { id:'d', key:'D', label:'Официальный', name:'Официальный — визитная карточка', file:'Главная D - Официальный.dc.html' },
    { id:'e', key:'E', label:'AI-помощник', name:'AI-помощник в центре', file:'Главная E - AI-помощник.dc.html' },
    { id:'f', key:'F', label:'Портал услуг', name:'Портал услуг — меню и каталог', file:'Главная F - Портал услуг.dc.html' },
  ];

  return { PALETTES, palette, themeId, applyTheme, setTheme, FILLS, PASTELS, fillId, pastelId, pastelStops, applyFill, setFill, setPastel, ORN_URL, a11y, setA11y, applyA11y,
    ROLES, getRole, setRole, HOME, hasGov, govPage, bizEntry, COMPOSITE, EGOV, P, GOV, GOV_COUNT, SECTIONS, govCard, LIBRARY,
    HERO, CHIPS, FRESH, USEFUL, SITUATIONS, FAQ_AUD, FAQ, faqAudOf, NEWS_TABS, NEWS, AI_SUGGEST, botReply, search, ask, plural, VARIANTS };
})();
window.mpHome = H;

class Component extends DCLogic {
  constructor(props){ super(props); window.mpHome = H; }
  componentDidMount(){
    window.mpHome = H;
    try { window.dispatchEvent(new CustomEvent('mp-home-ready')); } catch(e){}
    // другая вкладка сменила палитру / доступность
    this._st = (e) => { if(e.key === 'mp-theme') H.applyTheme(); if(e.key === 'mp-fill' || e.key === 'mp-pastel') H.applyFill(); if(e.key === 'mp-a11y') H.applyA11y(); };
    window.addEventListener('storage', this._st);
  }
  componentWillUnmount(){ window.removeEventListener('storage', this._st); }
  renderVals(){ return {}; }
}
</script>
