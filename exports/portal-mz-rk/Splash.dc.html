<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  Заставка при открытии портала. Стиль — localStorage['mp-splash']:
    emblem   «Герб»      — белый фон, герб в обводке, название министерства, золотая линия (по умолчанию)
    ornament «Орнамент»  — тёмный фон бренда, вокруг герба прорисовывается «қошқар мүйіз»
    pulse    «Пульс»     — линия кардиограммы приводит к гербу
    curtain  «Шторка»    — герб и название на цвете бренда, затем створки расходятся
    off      — без заставки
  Показывается один раз за сессию (sessionStorage['mp-splash-seen']), длится ≈ 2 с, пропускается
  кликом, Esc или кнопкой «Пропустить». С prefers-reduced-motion — короткое проявление без движения.
  Повтор — событие window 'mp-splash-replay' { detail: стиль }. Проп auto="0" — только по событию (витрина вариантов). Уходя, ставит <html class="mp-ready">.
-->
<x-dc>
<helmet>
<style>
  .sp-root{ position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; cursor:pointer; overflow:hidden; }
  .sp-root *{ box-sizing:border-box; }
  .sp-out{ animation:sp-leave .55s cubic-bezier(.6,0,.3,1) forwards; }
  @keyframes sp-leave{ to{ opacity:0; transform:scale(1.03); visibility:hidden; } }
  .sp-stage{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .sp-emb{ position:relative; width:132px; height:132px; display:flex; align-items:center; justify-content:center; }
  .sp-disc{ width:112px; height:112px; border-radius:50%; background:#fff; overflow:hidden; display:flex; align-items:center; justify-content:center; animation:sp-pop .9s cubic-bezier(.2,.8,.2,1) both; }
  .sp-disc img{ width:112px; height:112px; object-fit:contain; }
  @keyframes sp-pop{ from{ opacity:0; transform:scale(.82); } to{ opacity:1; transform:none; } }
  .sp-ring{ position:absolute; inset:0; }
  .sp-ring circle{ fill:none; stroke-width:1.6; stroke-linecap:round; stroke-dasharray:420; stroke-dashoffset:420; animation:sp-draw 1.1s .15s cubic-bezier(.6,0,.2,1) forwards; transform:rotate(-90deg); transform-origin:66px 66px; }
  @keyframes sp-draw{ to{ stroke-dashoffset:0; } }
  .sp-name{ margin-top:28px; overflow:hidden; }
  .sp-name b{ display:block; font-size:clamp(20px,1.6vw,26px); font-weight:600; letter-spacing:-.02em; animation:sp-rise .7s .45s cubic-bezier(.2,.8,.2,1) both; }
  .sp-name span{ display:block; margin-top:6px; font-size:clamp(13px,1vw,15px); font-weight:500; letter-spacing:.14em; text-transform:uppercase; animation:sp-rise .7s .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sp-rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  .sp-line{ width:180px; height:2px; margin-top:22px; border-radius:2px; background:linear-gradient(90deg, transparent, var(--bacc), transparent); transform:scaleX(0); animation:sp-grow .9s .8s cubic-bezier(.6,0,.2,1) forwards; }
  @keyframes sp-grow{ to{ transform:scaleX(1); } }
  .sp-cap{ margin-top:16px; font-size:13px; animation:sp-rise .6s 1s both; }
  .sp-skip{ position:absolute; right:24px; bottom:24px; height:38px; padding:0 14px; border:none; border-radius:10px; font:500 13px/1 'Inter',sans-serif; cursor:pointer; display:flex; align-items:center; gap:6px; animation:sp-rise .4s .5s both; }

  /* Герб — светлый */
  .sp-emblem{ background:radial-gradient(60% 60% at 50% 45%, var(--b50), #fff 70%); }
  .sp-emblem .sp-name b{ color:var(--n900); } .sp-emblem .sp-name span{ color:var(--b700); }
  .sp-emblem .sp-ring circle{ stroke:var(--b500); }
  .sp-emblem .sp-disc{ box-shadow:0 18px 40px -18px color-mix(in srgb, var(--b700) 60%, transparent); }
  .sp-emblem .sp-cap{ color:var(--n400); }
  .sp-emblem .sp-skip{ background:var(--n100); color:var(--n500); }

  /* Орнамент — тёмный */
  .sp-ornament{ background:radial-gradient(70% 70% at 50% 40%, var(--b800), var(--b950) 70%); }
  .sp-ornament::before{ content:''; position:absolute; inset:0; background:#fff; -webkit-mask-image:var(--hm-orn); mask-image:var(--hm-orn); -webkit-mask-size:120px; mask-size:120px; opacity:0; animation:sp-tex 1.6s .3s ease forwards; }
  @keyframes sp-tex{ to{ opacity:.05; } }
  .sp-ornament .sp-name b{ color:#fff; } .sp-ornament .sp-name span{ color:var(--bacc); }
  .sp-ornament .sp-cap{ color:rgba(255,255,255,.5); }
  .sp-ornament .sp-skip{ background:rgba(255,255,255,.1); color:rgba(255,255,255,.75); }
  .sp-orn{ position:absolute; width:340px; height:340px; left:50%; top:50%; margin:-170px 0 0 -170px; }
  .sp-orn path{ fill:none; stroke:var(--bacc); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:600; stroke-dashoffset:600; animation:sp-draw 1.5s .1s cubic-bezier(.5,0,.2,1) forwards; }
  .sp-orn .soft path{ stroke:rgba(255,255,255,.35); animation-delay:.35s; }
  .sp-ornament .sp-disc{ box-shadow:0 0 0 6px rgba(255,255,255,.08), 0 0 60px color-mix(in srgb, var(--bacc) 35%, transparent); }

  /* Пульс */
  .sp-pulse{ background:#fff; }
  .sp-pulse .sp-name b{ color:var(--n900); } .sp-pulse .sp-name span{ color:var(--b700); }
  .sp-pulse .sp-cap{ color:var(--n400); }
  .sp-pulse .sp-skip{ background:var(--n100); color:var(--n500); }
  .sp-ecg{ position:absolute; left:0; right:0; top:50%; height:120px; margin-top:-126px; width:100%; }
  .sp-ecg path{ fill:none; stroke:var(--b500); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:2400; stroke-dashoffset:2400; animation:sp-draw 1.3s cubic-bezier(.5,0,.3,1) forwards, sp-fadeline .5s 1.25s forwards; }
  @keyframes sp-fadeline{ to{ opacity:.18; } }
  .sp-pulse .sp-disc{ animation-delay:.7s; box-shadow:0 0 0 0 color-mix(in srgb, var(--b500) 50%, transparent); }
  .sp-pulse .sp-beat{ position:absolute; inset:10px; border-radius:50%; border:2px solid var(--b400); opacity:0; animation:sp-beat 1.2s .9s ease-out 2; }
  @keyframes sp-beat{ 0%{ opacity:.8; transform:scale(.9); } 100%{ opacity:0; transform:scale(1.5); } }
  .sp-pulse .sp-name b{ animation-delay:.9s; } .sp-pulse .sp-name span{ animation-delay:1.02s; } .sp-pulse .sp-cap{ animation-delay:1.2s; }

  /* Шторка */
  .sp-curtain{ background:transparent; }
  .sp-leaf{ position:absolute; top:0; bottom:0; width:50.5%; background:linear-gradient(160deg, var(--b700), var(--b900)); }
  .sp-leaf::before{ content:''; position:absolute; inset:0; background:#fff; -webkit-mask-image:var(--hm-orn); mask-image:var(--hm-orn); -webkit-mask-size:120px; mask-size:120px; opacity:.05; }
  .sp-leaf.l{ left:0; box-shadow:inset -1px 0 0 color-mix(in srgb, var(--bacc) 60%, transparent); } .sp-leaf.r{ right:0; box-shadow:inset 1px 0 0 color-mix(in srgb, var(--bacc) 60%, transparent); }
  .sp-curtain .sp-stage{ z-index:2; }
  .sp-curtain .sp-name b{ color:#fff; } .sp-curtain .sp-name span{ color:var(--bacc); }
  .sp-curtain .sp-cap{ color:rgba(255,255,255,.55); }
  .sp-curtain .sp-skip{ z-index:3; background:rgba(255,255,255,.12); color:#fff; }
  .sp-curtain .sp-ring circle{ stroke:rgba(255,255,255,.55); }
  .sp-curtain.sp-out{ animation:none; }
  .sp-curtain.sp-out .sp-leaf.l{ animation:sp-l .8s cubic-bezier(.7,0,.2,1) forwards; }
  .sp-curtain.sp-out .sp-leaf.r{ animation:sp-r .8s cubic-bezier(.7,0,.2,1) forwards; }
  .sp-curtain.sp-out .sp-stage{ animation:sp-leave .35s ease forwards; }
  .sp-curtain.sp-out .sp-skip{ display:none; }
  @keyframes sp-l{ to{ transform:translateX(-101%); } }
  @keyframes sp-r{ to{ transform:translateX(101%); } }

  @media (prefers-reduced-motion:reduce){
    .sp-root *, .sp-root::before{ animation-duration:.01s !important; animation-delay:0s !important; }
  }
</style>
</helmet>
<sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
  <div class="{{ cls }}" onClick="{{ skip }}" role="presentation">
    <sc-if value="{{ isCurtain }}" hint-placeholder-val="{{ false }}"><div class="sp-leaf l"></div><div class="sp-leaf r"></div></sc-if>
    <sc-if value="{{ isPulse }}" hint-placeholder-val="{{ false }}">
      <svg class="sp-ecg" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60 H470 L492 60 L506 30 L522 92 L540 8 L560 112 L576 60 L600 60 L618 46 L632 60 H1200"></path></svg>
    </sc-if>
    <div class="sp-stage">
      <div class="sp-emb">
        <sc-if value="{{ isOrn }}" hint-placeholder-val="{{ false }}">
          <svg class="sp-orn" viewBox="0 0 340 340" aria-hidden="true">
            <g>
              <path d="M170 74C170 46 188 30 210 30c18 0 28 15 22 30-5 10-18 12-25 4-5-6 0-15 8-13"></path>
              <path d="M170 74C170 46 152 30 130 30c-18 0-28 15-22 30 5 10 18 12 25 4 5-6 0-15-8-13"></path>
              <path d="M170 266C170 294 188 310 210 310c18 0 28-15 22-30-5-10-18-12-25-4-5 6 0 15 8 13"></path>
              <path d="M170 266C170 294 152 310 130 310c-18 0-28-15-22-30 5-10 18-12 25-4 5 6 0 15-8 13"></path>
              <path d="M74 170C46 170 30 152 30 130c0-18 15-28 30-22 10 5 12 18 4 25-6 5-15 0-13-8"></path>
              <path d="M74 170C46 170 30 188 30 210c0 18 15 28 30 22 10-5 12-18 4-25-6-5-15 0-13 8"></path>
              <path d="M266 170C294 170 310 152 310 130c0-18-15-28-30-22-10 5-12 18-4 25 6 5 15 0 13-8"></path>
              <path d="M266 170C294 170 310 188 310 210c0 18-15 28-30 22-10-5-12-18-4-25 6-5 15 0 13 8"></path>
            </g>
            <g class="soft">
              <path d="M170 14l12 12-12 12-12-12z"></path><path d="M170 302l12 12-12 12-12-12z"></path>
              <path d="M14 170l12-12 12 12-12 12z"></path><path d="M302 170l12-12 12 12-12 12z"></path>
              <path d="M104 104l-22-22M236 104l22-22M104 236l-22 22M236 236l22 22"></path>
            </g>
          </svg>
        </sc-if>
        <sc-if value="{{ hasRing }}" hint-placeholder-val="{{ true }}">
          <svg class="sp-ring" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="64"></circle></svg>
        </sc-if>
        <sc-if value="{{ isPulse }}" hint-placeholder-val="{{ false }}"><span class="sp-beat"></span></sc-if>
        <div class="sp-disc"><img src="uploads/images.jpg" alt="Государственный герб Республики Казахстан"></div>
      </div>
      <div class="sp-name"><b>Министерство здравоохранения</b><span>Республики Казахстан</span></div>
      <div class="sp-line"></div>
      <div class="sp-cap">Единый портал здравоохранения</div>
    </div>
    <button class="sp-skip" onClick="{{ skip }}">Пропустить<i class="ri-arrow-right-s-line"></i></button>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760}}">
const STYLES = ['emblem', 'ornament', 'pulse', 'curtain'];
const DUR = { emblem:2100, ornament:2300, pulse:2300, curtain:1900 };
const ready = () => { try { document.documentElement.classList.add('mp-ready'); } catch(e){} };
class Component extends DCLogic {
  constructor(props){
    super(props);
    let st = 'emblem', seen = false;
    try { st = localStorage.getItem('mp-splash') || 'emblem'; } catch(e){}
    try { seen = sessionStorage.getItem('mp-splash-seen') === '1'; } catch(e){}
    const force = (() => { try { return new URLSearchParams(location.search).get('splash'); } catch(e){ return null; } })();
    if(force) st = force;
    const on = props.auto !== '0' && STYLES.includes(st) && (!seen || !!force);
    this.state = { st: STYLES.includes(st) ? st : 'emblem', phase: on ? 'in' : 'done' };
  }
  componentDidMount(){
    if(this.state.phase === 'in') this.run(); else ready();
    this._replay = (e) => {
      const st = (e && e.detail) || this.state.st;
      if(!STYLES.includes(st)) return;
      document.documentElement.classList.remove('mp-ready');
      clearTimeout(this._t1); clearTimeout(this._t2);
      this.setState({ st, phase:'done' });
      setTimeout(() => { this.setState({ phase:'in' }); this.run(); }, 30);
    };
    window.addEventListener('mp-splash-replay', this._replay);
    this._esc = (e) => { if(e.key === 'Escape' && this.state.phase === 'in') this.leave(); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount(){ clearTimeout(this._t1); clearTimeout(this._t2); window.removeEventListener('mp-splash-replay', this._replay); window.removeEventListener('keydown', this._esc); }
  run(){
    try { sessionStorage.setItem('mp-splash-seen', '1'); } catch(e){}
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this._t1 = setTimeout(() => this.leave(), reduce ? 700 : DUR[this.state.st]);
  }
  leave(){
    if(this.state.phase !== 'in') return;
    clearTimeout(this._t1);
    this.setState({ phase:'out' });
    ready();
    this._t2 = setTimeout(() => this.setState({ phase:'done' }), this.state.st === 'curtain' ? 820 : 560);
  }
  renderVals(){
    const s = this.state;
    return {
      show: s.phase !== 'done',
      cls: 'sp-root sp-' + s.st + (s.phase === 'out' ? ' sp-out' : ''),
      isCurtain: s.st === 'curtain', isPulse: s.st === 'pulse', isOrn: s.st === 'ornament',
      hasRing: s.st === 'emblem' || s.st === 'curtain',
      skip: (e) => { if(e && e.stopPropagation) e.stopPropagation(); this.leave(); },
    };
  }
}
</script>
</body>
</html>
