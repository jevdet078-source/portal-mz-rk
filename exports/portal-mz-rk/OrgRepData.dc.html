<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  Данные отчётности медорганизации — невидимый компонент для раздела первого руководителя
  («Администрирование отчётности», «Журнал отчётных форм»).
    <dc-import name="OrgRepData" hint-size="0px,0px"></dc-import>
  Регистрирует window.mpOrgRep, рассылает `mp-orgrep-ready`; изменения — `mp-orgrep-change`.

  Хранилище — localStorage `mp-orgrep-db`: { v, forms:[id], assigns:[{ id, emp, role, forms:[id], at }] }
    forms   — формы, которые заполняет организация (шаг 1);
    assigns — назначения: одна запись на «сотрудник + роль». Одну форму можно назначить нескольким сотрудникам,
              блокируется только повторное назначение той же формы тому же сотруднику в той же роли.
  Руководитель — localStorage `mp-org-head` (пишет «Вход» по данным авторизации), без него — демо-руководитель ЦРБ.
  Сценарий прототипа — sessionStorage `mp-orgrep-scn`: ok | loading | error | noEmp | saveErr.

  Каталог форм — перечень аналитика «Список форм» (№ приложения, индекс, наименование), 28 форм.
  Журнал отчётных форм на текущем этапе — заглушка: экземпляры отчётов и статусы опишет отдельная ПЗ.
-->
<x-dc><div></div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:10,&quot;height&quot;:10}}">
const KEY = 'mp-orgrep-db', SCN = 'mp-orgrep-scn', V = 2;

const ORG = { name:'ГКП на ПХВ «Центральная районная больница Аккольского района»', short:'ЦРБ Аккольского района', bin:'000140003818' };
const HEAD_DEMO = { iin:'720304450218', fio:'Жакупова Гульмира Сапаровна', post:'Главный врач', bin:ORG.bin, org:ORG.name };

// Справочник отчётных форм: [№ приложения, индекс, наименование]
const FORMS = [
  ['1', '1-ОИПЗ', 'Отчет об отдельных инфекционных и паразитарных заболеваниях'],
  ['2', '2-ВИЧ', 'Отчет о результатах лабораторного исследования крови методом иммуноферментного анализа на вирус иммунодефицита человека (ВИЧ – инфекцию)'],
  ['3', '3-Вакцины', 'Отчет о движении вакцин и других иммунобиологических препаратов'],
  ['4', '4-ОПП', 'Отчет об охвате профилактическими прививками'],
  ['5', '5-ТВК', 'Отчет о количестве проведенных телемедицинских консультаций и сеансов видеоконференцсвязи'],
  ['6', '6-КФ', 'Об использовании коечного фонда медицинских организаций, оказывающих стационарную и стационарозамещающую помощь'],
  ['7', '7-ЧЗЗВЖУД', 'Отчет о числе заболеваний, зарегистрированных впервые в жизни установленным диагнозом'],
  ['8', '8-МФК', 'Отчет о движении медицинских и фармацевтических кадров'],
  ['9', '9-ОИПЗ', 'Отчет об отдельных инфекционных и паразитарных заболеваниях'],
  ['10', '10-Новообразования', 'Отчет о больных и заболеваниях злокачественными новообразованиями'],
  ['11', '11-ТБ', 'Отчет о больных туберкулезом'],
  ['12', '12-ИППП', 'Отчет об инфекциях, передающихся преимущественно половым путем и кожных заболеваниях'],
  ['13', '13-ППР', 'Отчет о заболеваниях и контингентах больных психическими и поведенческими расстройствами'],
  ['14', '14-Психоактив', 'Отчет о заболеваниях и контингентах больных психическими и поведенческими расстройствами, вызванными употреблением психоактивных веществ'],
  ['15', '15-Заболевания', 'Отчет о числе заболеваний, зарегистрированных у больных, проживающих в районе обслуживания медицинской организации и контингентах больных, состоящих под диспансерным наблюдением'],
  ['16', '16-Стационар', 'Отчет о контингентах больных, выбывших из стационара'],
  ['17', '17-Кадры', 'Отчет о медицинских и фармацевтических кадрах'],
  ['18', '18-СЭС', 'Отчет о деятельности санитарно-эпидемиологической службы Республики Казахстан'],
  ['19', '19-ОМО', 'Отчет организации здравоохранения'],
  ['20', '20-МПД', 'Отчет о медицинской помощи детям'],
  ['21', '21-БРР', 'Отчет о медицинской помощи беременным, роженицам и родильницам'],
  ['22', '22-СМП', 'Отчет организации скорой медицинской помощи'],
  ['23', '23-Фельдшер', 'Отчет фельдшерско-акушерского, медицинского пункта и медицинского работника без содержания отдельного помещения'],
  ['24', '24-Санатории', 'Отчет специализированного санатория'],
  ['25', '25-ЗОЖ', 'Отчет о штатных должностях центра формирования здорового образа жизни, дезинфекционной станции, республиканского центра развития здравоохранения и их территориальных филиалов'],
  ['26', '26-Сеть', 'О сети и деятельности организаций здравоохранения'],
  ['27', '27-ДИ', 'Отчет по детской инвалидности'],
  ['28', '28-Травмы', 'Отчет о травмах, отравлениях и некоторых других последствиях воздействия внешних причин'],
].map(([app, idx, name]) => ({ id:'f' + app, app, idx, name }));
const FORM = {}; FORMS.forEach(f => { FORM[f.id] = f; });
const ORDER = FORMS.map(f => f.id);
const sortForms = ids => [...new Set(ids)].filter(id => FORM[id]).sort((x, y) => ORDER.indexOf(x) - ORDER.indexOf(y));

// Сотрудники организации, уже авторизовавшиеся на портале (в системе — пользователи с БИН организации)
const EMPLOYEES = [
  { id:'e1',  fio:'Сарсенбаева Айжан Муратовна', post:'Медицинский статистик' },
  { id:'e2',  fio:'Кравченко Ольга Петровна', post:'Медицинский статистик' },
  { id:'e3',  fio:'Ким Виктория Олеговна', post:'Заведующая организационно-методическим отделом' },
  { id:'e4',  fio:'Абдрахманов Нурлан Сейтказыевич', post:'Заместитель главного врача по лечебной работе' },
  { id:'e5',  fio:'Тлеубаева Динара Ерболовна', post:'Главная медицинская сестра' },
  { id:'e6',  fio:'Исмаилов Руслан Маратович', post:'Заведующий поликлиникой' },
  { id:'e7',  fio:'Оспанова Мадина Кайратовна', post:'Врач-эпидемиолог' },
  { id:'e8',  fio:'Жунусов Ерлан Аскарович', post:'Заведующий хирургическим отделением' },
  { id:'e9',  fio:'Нургалиева Асель Тимуровна', post:'Врач-фтизиатр' },
  { id:'e10', fio:'Байжанова Гаухар Сериковна', post:'Экономист' },
];
const EMP = {}; EMPLOYEES.forEach(e => { EMP[e.id] = e; });

// Роли, доступные для назначения в организации; права первого руководителя — автоматически
const ROLES = [
  { id:'exec', name:'Исполнитель', icon:'ri-edit-2-line', tip:'Создание отчёта, скачивание шаблона, загрузка заполненного файла, просмотр результатов проверок, подписание и отправка на согласование' },
  { id:'swod', name:'Специалист по своду отчётности', icon:'ri-stack-line', tip:'Приём поступивших отчётов, возврат на доработку, формирование свода' },
];
const ROLE = {}; ROLES.forEach(r => { ROLE[r.id] = r; });
const HEAD_ROLE = { name:'Первый руководитель', tip:'Настройка форм и назначений, просмотр отчётов, согласование либо возврат на доработку с обязательной причиной. Редактирование показателей недоступно' };

const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2]; };
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const blank = () => ({ v:V, forms:[], assigns:[], seq:0 });

// Пример настроенной организации — «Показ прототипа» → «Пример настроенной организации»
const SAMPLE = {
  forms:['f1','f3','f4','f5','f6','f7','f9','f15','f16','f17','f19','f20','f21','f22'],
  assigns:[
    { emp:'e1', role:'exec', forms:['f7','f15','f19'] },
    { emp:'e2', role:'exec', forms:['f6','f7','f16','f17','f20','f21'] },
    { emp:'e7', role:'exec', forms:['f1','f3','f4','f9'] },
    { emp:'e6', role:'exec', forms:['f5','f20','f22'] },
    { emp:'e3', role:'swod', forms:['f6','f7','f15','f16','f19','f20','f21'] },
  ],
};

const R = {
  ORG, FORMS, FORM, EMPLOYEES, EMP, ROLES, ROLE, HEAD_ROLE, plural,
  head: () => { try { const h = JSON.parse(lsGet('mp-org-head') || 'null'); if(h && h.fio) return { ...HEAD_DEMO, ...h }; } catch(e){} return HEAD_DEMO; },
  isHead: () => !!lsGet('mp-org-head'),
  initials: fio => fio.split(' ').slice(0, 2).map(x => x[0] || '').join(''),
  short: fio => { const p = fio.split(' '); return p[0] + (p[1] ? ' ' + p[1][0] + '.' : '') + (p[2] ? ' ' + p[2][0] + '.' : ''); },

  // ——— хранилище ———
  db: () => {
    try { const d = JSON.parse(lsGet(KEY) || 'null'); if(d && d.v === V && Array.isArray(d.forms) && Array.isArray(d.assigns)) return { seq:0, ...d }; } catch(e){}
    return blank();
  },
  save: d => {
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-orgrep-change')); } catch(e){}
  },
  configured: () => R.db().forms.length > 0,

  // ——— шаг 1: формы организации ———
  forms: () => R.db().forms.filter(id => FORM[id]),
  // назначения, которые потеряют формы, если снять их на шаге 1
  lost: ids => {
    const keep = new Set(ids);
    return R.assigns().map(a => ({ a, gone:a.forms.filter(f => !keep.has(f)) })).filter(x => x.gone.length);
  },
  setForms: ids => {
    const d = R.db(), keep = new Set(ids);
    d.forms = sortForms(ids);
    d.assigns = d.assigns.map(a => ({ ...a, forms:a.forms.filter(f => keep.has(f)) })).filter(a => a.forms.length);
    R.save(d);
  },

  // ——— шаг 2: назначения ———
  assigns: () => R.db().assigns.filter(a => EMP[a.emp] && ROLE[a.role]),
  assign: id => R.assigns().find(a => a.id === id) || null,
  find: (emp, role) => R.assigns().find(a => a.emp === emp && a.role === role) || null,
  assigned: (emp, role) => { const a = R.find(emp, role); return a ? a.forms : []; },
  // новое сочетание «сотрудник + роль» — новая запись; существующее — дописываем только новые формы
  addAssign: (emp, role, forms) => {
    const d = R.db();
    let a = d.assigns.find(x => x.emp === emp && x.role === role);
    if(a){ a.forms = sortForms(a.forms.concat(forms)); a.at = Date.now(); }
    else { d.seq = (d.seq || 0) + 1; a = { id:'a' + Date.now().toString(36) + d.seq, emp, role, forms:sortForms(forms), at:Date.now() }; d.assigns.push(a); }
    R.save(d); return a.id;
  },
  // редактирование: новый перечень форм назначения; снятые формы — только назначение на них, отчёты сохраняются.
  // Пустой перечень — назначение удаляется. Возвращает true, если назначение осталось
  setAssignForms: (id, forms) => {
    const d = R.db(), a = d.assigns.find(x => x.id === id);
    if(!a) return false;
    const keep = new Set(d.forms), list = sortForms(forms).filter(f => keep.has(f));
    if(!list.length){ d.assigns = d.assigns.filter(x => x.id !== id); R.save(d); return false; }
    a.forms = list; a.at = Date.now(); R.save(d); return true;
  },
  removeAssign: id => { const d = R.db(); d.assigns = d.assigns.filter(a => a.id !== id); R.save(d); },

  // ——— сценарий прототипа ———
  scn: () => { try { return sessionStorage.getItem(SCN) || 'ok'; } catch(e){ return 'ok'; } },
  setScn: v => { try { sessionStorage.setItem(SCN, v); } catch(e){} },
  clear: () => { R.save(blank()); },
  demo: () => {
    const d = blank(); d.forms = [...SAMPLE.forms];
    d.assigns = SAMPLE.assigns.map((a, i) => ({ id:'s' + i, ...a, forms:[...a.forms], at:Date.now() - (5 - i) * 864e5 }));
    R.save(d);
  },
};

class Component extends DCLogic {
  constructor(props){ super(props); window.mpOrgRep = R; }
  componentDidMount(){
    window.mpOrgRep = R;
    try { window.dispatchEvent(new CustomEvent('mp-orgrep-ready')); } catch(e){}
  }
  renderVals(){ return {}; }
}
window.mpOrgRep = R;
</script>
</body>
</html>
