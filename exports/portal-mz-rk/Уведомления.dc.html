<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  Кабинет бизнеса → Центр уведомлений (часть заявителя, демо).
  Источник: Figma e-Health (cMe8P7iJNaTBgG04okquEG), секция «Раздел уведомлений» 6203:227749:
    Центр уведомлений — 6203:227750 · Технический сбой — 6203:228011
    Выпадающий список из колокольчика — 6406:104361 (реализован в Header.dc.html)
  Содержимое таблицы перенесено как в Figma. Прочитанность хранится в localStorage
  ['mp-notif-read'] (JSON-массив номеров), шапка слушает событие 'mp-notif-change'.
-->
<x-dc>
<helmet>
<style>
  :root{
    --primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;
    --n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n900:#0A0D14;
    --green:#38C793;--green-dark:#2D9F75;--green-light:#CBF5E5;--red:#DF1C41;--red-l:#FDEDF0;
    --stroke:#E2E4E9;--sh-xs:0 1px 2px rgba(10,13,20,.03);--sh-lg:0 16px 32px -12px rgba(10,13,20,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--n50);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes mp-fade{from{opacity:0}to{opacity:1}}
  .tnum{font-variant-numeric:tabular-nums;}
  .nt-tab{transition:color .15s;}
  .nt-tab:hover{color:#0A0D14 !important;}
  .nt-tab:focus-visible{outline:none;box-shadow:0 0 0 2px var(--primary-light);border-radius:4px;}
  /* запись центра уведомлений: строка сведений + текст в подложке; записи разделены линией и воздухом */
  .nt-row{display:block;padding:12px 0;border-bottom:1px solid var(--stroke);text-decoration:none;color:inherit;background:#fff;transition:background .15s;}
  .nt-row:last-child{border-bottom:none;}
  .nt-row:hover{background:var(--n50);}
  .nt-id{color:var(--primary);border-radius:4px;}
  .nt-row:hover .nt-id{color:var(--primary-dark);text-decoration:underline;text-underline-offset:3px;}
  .nt-msg{margin:8px 10px 0 84px;padding:8px 14px 8px 12px;border-radius:10px;font-size:14px;line-height:20px;text-wrap:pretty;transition:background .15s,box-shadow .15s;}
  .nt-msg-t{max-width:1220px;}
  @media (min-width:1600px){ .nt-msg-t{text-wrap:balance;} }
  .nt-msg-new{background:var(--primary-lighter);box-shadow:inset 3px 0 0 var(--primary);color:var(--n900);}
  .nt-msg-read{background:var(--n50);box-shadow:inset 0 0 0 1px var(--stroke);color:var(--n600);}
  .nt-row:hover .nt-msg-read{background:var(--n100);box-shadow:inset 0 0 0 1px var(--n300);}
  .nt-row:hover .nt-msg-new{box-shadow:inset 3px 0 0 var(--primary),inset 0 0 0 1px var(--primary-light);}
  .nt-row:focus-visible,.nt-b:focus-visible,.nt-x:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--primary-light);}
  .nt-b{transition:background .15s,border-color .15s,color .15s;}
  .nt-b:hover{background:var(--n50) !important;border-color:var(--n300) !important;color:var(--n900) !important;}
  .nt-q{width:320px;height:40px;border:1px solid var(--stroke);border-radius:10px;padding:0 36px 0 40px;font-family:inherit;font-size:14px;line-height:20px;color:var(--n900);background:#fff;box-shadow:var(--sh-xs);outline:none;transition:border-color .15s,box-shadow .15s;}
  .nt-q::placeholder{color:var(--n400);}
  .nt-q::-webkit-search-cancel-button{display:none;}
  .nt-q:hover{border-color:var(--n300);}
  .nt-q:focus{border-color:var(--primary);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .nt-x{width:28px;height:28px;border:none;border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--n400);}
  .nt-x:hover{color:var(--n600);background:var(--n100);}
  @media (max-width:720px){ .nt-acts{width:100%;} .nt-qw{flex:1;min-width:0;} .nt-q{width:100%;} }
</style>
</helmet>

<div style="min-height:100vh;background:var(--n50);">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="app" org="ТОО «Астана Групп»" bin="БИН 180540024521" hint-size="100%,73px"></dc-import></div>

  <div style="display:flex;align-items:flex-start;">
    <div style="position:sticky;top:73px;height:calc(100vh - 73px);flex:0 0 auto;z-index:30;">
      <dc-import name="BusinessNav" style="height:100%;" active="notifications" hint-size="272px,827px"></dc-import>
    </div>

    <main style="flex:1;min-width:0;padding:24px 32px 72px;">
      <div style="display:flex;flex-direction:column;gap:20px;">

        <!-- Заголовок раздела -->
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
            <div style="font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;">Центр уведомлений</div>
          </div>
          <div class="nt-acts" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <!-- поиск по тексту уведомления и ID заявки: найти старое уведомление -->
            <div class="nt-qw" role="search" style="position:relative;">
              <i class="ri-search-2-line" style="position:absolute;left:12px;top:10px;font-size:20px;color:var(--n400);pointer-events:none;"></i>
              <input class="nt-q tnum" type="search" value="{{ q }}" onChange="{{ onQ }}" onKeyDown="{{ onQKey }}" placeholder="Поиск по тексту или ID заявки" aria-label="Поиск по тексту уведомления или ID заявки" autoComplete="off" spellCheck="false" enterKeyHint="search" />
              <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">
                <button type="button" class="nt-x" onClick="{{ clearQ }}" aria-label="Очистить поиск" title="Очистить" style="position:absolute;right:6px;top:6px;"><i class="ri-close-circle-fill" style="font-size:18px;"></i></button>
              </sc-if>
            </div>
            <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}">
              <button class="nt-b" onClick="{{ readAll }}" style="height:40px;padding:10px 14px;border:1px solid var(--stroke);border-radius:10px;background:#fff;color:var(--n600);font-family:inherit;font-size:14px;line-height:20px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--sh-xs);white-space:nowrap;">
                <i class="ri-check-double-line" style="font-size:18px;color:var(--n400);"></i>Отметить все прочитанными
              </button>
            </sc-if>
          </div>
        </div>

        <!-- Вкладки -->
        <div style="display:flex;gap:20px;border-bottom:1px solid var(--stroke);">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button class="nt-tab" onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}<span style="{{ t.badgeStyle }}">{{ t.count }}</span><span style="{{ t.underline }}"></span></button>
          </sc-for>
        </div>

        <!-- Таблица -->
        <div style="background:#fff;border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-xs);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0;">
          <div style="overflow-x:auto;">
            <div style="min-width:920px;">
              <div style="display:flex;background:var(--n100);border-radius:8px;">
                <sc-for list="{{ cols }}" as="c" hint-placeholder-count="6">
                  <div style="{{ c.style }}">{{ c.label }}<i class="{{ c.icon }}" style="{{ c.iconStyle }}"></i></div>
                </sc-for>
              </div>

              <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
                <div>
                  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
                    <!-- запись: сведения строкой по столбцам, под ней — текст уведомления в подложке.
                         Непрочитанное — сиреневая подложка с полосой слева, прочитанное — серая; текст — от столбца «ID заявки» -->
                    <a class="nt-row" href="{{ r.href }}" onClick="{{ r.onOpen }}" aria-label="{{ r.aria }}">
                      <div style="display:flex;align-items:center;min-height:24px;">
                        <div style="{{ r.numStyle }}">
                          <span title="{{ r.dotTip }}" style="{{ r.dotStyle }}"></span>
                          <span style="{{ r.numTextStyle }}">{{ r.n }}</span>
                        </div>
                        <div class="tnum" style="width:110px;flex:0 0 auto;padding:0 10px;font-size:14px;line-height:20px;font-weight:500;"><span class="nt-id"><sc-for list="{{ r.idParts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></span></div>
                        <div title="{{ r.name }}" style="{{ r.nameStyle }}">{{ r.name }}</div>
                        <div class="tnum" style="width:232px;flex:0 0 auto;padding:0 10px;font-size:14px;line-height:20px;color:var(--n900);white-space:nowrap;">{{ r.date }}</div>
                        <div style="width:184px;flex:0 0 auto;padding:0 10px;display:flex;"><span style="{{ r.statusStyle }}">{{ r.status }}</span></div>
                        <div style="width:160px;flex:0 0 auto;padding:0 10px;font-size:14px;line-height:20px;color:var(--n600);">{{ r.expert }}</div>
                      </div>
                      <div class="{{ r.msgClass }}"><div class="nt-msg-t"><sc-for list="{{ r.parts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></div></div>
                    </a>
                  </sc-for>
                </div>
              </sc-if>

              <!-- Пусто / технический сбой -->
              <sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 16px;animation:mp-fade .2s ease;">
                  <div style="width:96px;height:96px;border-radius:50%;background:var(--n100);display:flex;align-items:center;justify-content:center;">
                    <i class="{{ emptyIcon }}" style="font-size:40px;color:var(--n300);"></i>
                  </div>
                  <div style="text-align:center;font-size:14px;line-height:20px;color:var(--n500);max-width:320px;">{{ emptyText }}</div>
                  <sc-if value="{{ isNotFound }}" hint-placeholder-val="{{ false }}">
                    <button class="nt-b" onClick="{{ clearQ }}" style="height:36px;padding:0 14px;border:1px solid var(--stroke);border-radius:10px;background:#fff;color:var(--n600);font-family:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--sh-xs);"><i class="ri-close-line" style="font-size:18px;"></i>Сбросить поиск</button>
                  </sc-if>
                  <sc-if value="{{ isFail }}" hint-placeholder-val="{{ false }}">
                    <a class="nt-b" href="Кабинет бизнеса.dc.html" style="height:36px;padding:0 14px;border:1px solid var(--stroke);border-radius:10px;background:#fff;color:var(--n600);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px;text-decoration:none;box-shadow:var(--sh-xs);"><i class="ri-arrow-left-s-line" style="font-size:18px;"></i>Вернуться назад</a>
                  </sc-if>
                </div>
              </sc-if>
            </div>
          </div>

          <!-- Пагинация -->
          <sc-if value="{{ hasPager }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
              <div style="font-size:14px;line-height:20px;color:var(--n500);">Страница 1 из 9</div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="width:32px;height:32px;border:1px solid var(--stroke);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--n400);"><i class="ri-arrow-left-s-line" style="font-size:18px;"></i></span>
                <sc-for list="{{ pages }}" as="p" hint-placeholder-count="7"><span style="{{ p.style }}">{{ p.label }}</span></sc-for>
                <span style="width:32px;height:32px;border:1px solid var(--stroke);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--n400);"><i class="ri-arrow-right-s-line" style="font-size:18px;"></i></span>
              </div>
              <div style="display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border:1px solid var(--stroke);border-radius:8px;font-size:14px;line-height:20px;color:var(--n500);">6 строк<i class="ri-arrow-down-s-line" style="font-size:18px;color:var(--n400);"></i></div>
            </div>
          </sc-if>
        </div>
      </div>
    </main>
  </div>

  <!-- Тост -->
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:89px;right:24px;z-index:80;width:320px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);animation:mp-slidein .2s ease;">
      <i class="ri-check-double-line" style="font-size:20px;color:var(--green-dark);flex:0 0 auto;"></i>
      <div style="font-size:14px;line-height:20px;font-weight:500;">{{ toast }}</div>
    </div>
  </sc-if>

  <!-- Панель прототипа -->
  <div style="position:fixed;right:20px;bottom:20px;z-index:50;background:#fff;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--sh-lg);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;">
    <span style="font-size:11px;line-height:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);">Прототип · состояние</span>
    <div style="display:flex;background:var(--n100);border-radius:8px;padding:2px;gap:2px;">
      <sc-for list="{{ demo }}" as="d" hint-placeholder-count="2"><button onClick="{{ d.onClick }}" style="{{ d.style }}">{{ d.label }}</button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { tab:'all', read:['97','96','95','94'], fail:false, toast:'', ed:[], q:'' };
  }
  componentDidMount(){
    let read = null;
    try { const v = localStorage.getItem('mp-notif-read'); if(v) read = JSON.parse(v); } catch(e){}
    if(Array.isArray(read)) this.setState({ read });
    // уведомления услуги ЕД (UC01.13.2.2): localStorage['mp-ed-notifs'], флаг read — в самих записях
    this._readEd = () => { try { const v = JSON.parse(localStorage.getItem('mp-ed-notifs') || '[]'); this.setState({ ed: Array.isArray(v) ? v : [] }); } catch(e){} };
    this._readEd();
    window.addEventListener('mp-ed-notif-change', this._readEd);
    window.scrollTo(0, 0);
  }
  componentWillUnmount(){ clearTimeout(this._t); window.removeEventListener('mp-ed-notif-change', this._readEd); }
  saveEd(ed){
    this.setState({ ed });
    try { localStorage.setItem('mp-ed-notifs', JSON.stringify(ed)); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-ed-notif-change')); } catch(e){}
  }

  save(read){
    this.setState({ read });
    try { localStorage.setItem('mp-notif-read', JSON.stringify(read)); } catch(e){}
    try { window.dispatchEvent(new CustomEvent('mp-notif-change', { detail:read })); } catch(e){}
  }
  toast(text){
    clearTimeout(this._t);
    this.setState({ toast:text });
    this._t = setTimeout(() => this.setState({ toast:'' }), 3000);
  }

  // содержимое таблицы — как в Figma (6203:227750); текст уведомления — демо по образцу шаблонов ЕД
  // (UC01.13.2.2, табл. 1), тот же, что в колокольчике шапки (Header.dc.html)
  data(){
    const PRICE = 'Регистрация цены производителя лекарственного средства';
    const CHANGE = 'Внесение изменений в зарегистрированную цену производителя лекарственного средства';
    const T = (ok, change) => 'Уважаемый пользователь! По Вашей заявке №01234567 '
      + (ok ? 'принято положительное решение о ' : 'принято решение об отказе ' + (change ? 'во ' : 'в '))
      + (change ? 'внесении изменений в зарегистрированную цену' : 'регистрации цены')
      + ' производителя лекарственного средства. Просим перейти в Личный кабинет для ознакомления.';
    return [
      { n:'99', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:true,  expert:'Иванов А.А.', text:T(true, false) },
      { n:'98', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:false, expert:'Иванов А.А.', text:T(false, false) },
      { n:'97', appId:'01234567', name:CHANGE, date:'01.01.2025, 10:00', ok:true,  expert:'Иванов А.А.', text:T(true, true) },
      { n:'96', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:false, expert:'Иванов А.А.', text:T(false, false) },
      { n:'95', appId:'01234567', name:CHANGE, date:'01.01.2025, 10:00', ok:true,  expert:'Иванов А.А.', text:T(true, true) },
      { n:'94', appId:'01234567', name:PRICE,  date:'01.01.2025, 10:00', ok:false, expert:'Иванов А.А.', text:T(false, false) },
    ];
  }

  renderVals(){
    const s = this.state;
    const pad = (x) => String(x).padStart(2, '0');
    const fdt = (ts) => { const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
    const ED_NAME = 'Проведение профессиональной экспертизы на лекарственные средства или медицинские изделия для включения в перечень лекарственных средств и медицинских изделий, закупаемых у единого дистрибьютора';
    // ЕД: статус и текст push — из записи (UC01.13.2.2, табл. 1–2); текст — в подсказке строки
    // АЛО (UC01.14.2.2) — те же записи, наименование услуги — из записи (x.service)
    const edRows = (s.ed || []).map(x => ({ n:x.n, appId:x.num, name:x.service || ED_NAME, date:fdt(x.at), ok:x.ok, expert:'АРМ ННЦРЗ', ed:true, edRead:!!x.read,
      edStatus: x.status || (x.ok ? 'Положительное решение' : 'Мотивированный отказ'), tone: x.tone || (x.ok ? 'green' : 'red'),
      text: x.text || (x.ok ? 'Положительное решение о включении в ЕД по заявке № ' + x.num : 'Решение об отказе по заявке № ' + x.num) }));
    const all = edRows.concat(this.data());
    const isRead = (n) => { const e = edRows.find(r => r.n === n); return e ? e.edRead : s.read.indexOf(n) !== -1; };
    const unreadCount = all.filter(r => !isRead(r.n)).length;

    const tabData = [ ['all','Все', all.length], ['read','Прочитанные', all.length - unreadCount], ['unread','Непрочитанные', unreadCount] ];
    const tabs = tabData.map(([id, label, count]) => { const on = s.tab === id; return { label, count,
      onClick: () => this.setState({ tab:id }),
      style:`position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 2px 10px;border:none;background:none;font-family:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;color:${on ? '#0A0D14' : '#525866'};`,
      badgeStyle:`display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;background:${on ? '#EEF2FF' : '#F6F8FA'};color:${on ? '#362DA6' : '#525866'};`,
      underline:`position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:${on ? '#4D42E9' : 'transparent'};` }; });

    const hc = 'display:flex;align-items:center;gap:4px;padding:10px;font-size:12px;line-height:16px;color:#525866;min-height:48px;';
    const cols = [
      { label:'№', sort:true, style: hc + 'width:86px;flex:0 0 auto;' },
      { label:'ID заявки', sort:true, style: hc + 'width:110px;flex:0 0 auto;' },
      { label:'Наименование услуги', sort:true, style: hc + 'flex:1;min-width:0;' },
      { label:'Дата вынесения решения, и время', sort:true, style: hc + 'width:232px;flex:0 0 auto;white-space:nowrap;' },
      { label:'Статус', sort:true, style: hc + 'width:184px;flex:0 0 auto;' },
      { label:'Эксперт / система', sort:true, style: hc + 'width:160px;flex:0 0 auto;' },
    ].map(c => ({ ...c, icon: c.sort ? 'ri-expand-up-down-line' : '', iconStyle:'font-size:14px;color:#868C98;flex:0 0 auto;' }));

    // поиск: по тексту уведомления и ID заявки, без учёта регистра; найденное подсвечивается
    const q = (s.q || '').trim().toLowerCase();
    const inTab = all.filter(r => s.tab === 'all' || (s.tab === 'read' ? isRead(r.n) : !isRead(r.n)));
    const list = q ? inTab.filter(r => (r.text || '').toLowerCase().indexOf(q) !== -1 || String(r.appId).toLowerCase().indexOf(q) !== -1) : inTab;
    const HL = 'background:#FBDFB1;border-radius:2px;box-shadow:0 0 0 1px #FBDFB1;';
    const parts = (str) => {
      str = String(str || '');
      if(!q) return [{ t:str, style:'' }];
      const low = str.toLowerCase(), out = [];
      let i = 0;
      for(;;){
        const j = low.indexOf(q, i);
        if(j === -1){ if(i < str.length) out.push({ t:str.slice(i), style:'' }); break; }
        if(j > i) out.push({ t:str.slice(i, j), style:'' });
        out.push({ t:str.slice(j, j + q.length), style:HL });
        i = j + q.length;
      }
      return out;
    };
    // открытие уведомления отмечает его прочитанным и ведёт к заявке
    const open = (n) => () => {
      if(isRead(n)) return;
      const e = edRows.find(r => r.n === n);
      if(e) this.saveEd(s.ed.map(x => x.n === n ? { ...x, read:true } : x)); else this.save(s.read.concat([n]));
    };
    const rows = list.map((r) => {
      const unread = !isRead(r.n);
      return { ...r,
        unread,
        status: r.ed ? r.edStatus : 'Завершена',
        href: r.ed ? 'Карточка заявки ЕД.dc.html?n=' + r.appId : 'Мои заявки.dc.html',
        onOpen: open(r.n),
        idParts: parts(r.appId), parts: parts(r.text),
        aria: (unread ? 'Непрочитанное. ' : '') + 'Заявка ' + r.appId + ', ' + r.date + '. ' + r.text,
        numStyle:'width:86px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;',
        dotTip: unread ? 'Непрочитанное' : '',
        dotStyle:`width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:${unread ? '#4D42E9' : 'transparent'};`,
        numTextStyle:`font-size:14px;line-height:20px;color:#0A0D14;font-weight:${unread ? '600' : '400'};`,
        // наименование услуги — одной строкой (полностью — в подсказке): главное в записи — текст
        nameStyle:`flex:1;min-width:0;margin:0 10px;font-size:14px;line-height:20px;color:#525866;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;`,
        // текст уведомления — целиком, в подложке: сиреневая с полосой — непрочитанное, серая — прочитанное
        msgClass: 'nt-msg ' + (unread ? 'nt-msg-new' : 'nt-msg-read'),
        statusStyle:`display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;${{ green:'background:#CBF5E5;color:#176448;', red:'background:#FDEDF0;color:#710E21;', orange:'background:#FEF3EB;color:#6E330C;' }[r.ed ? r.tone : r.ok ? 'green' : 'red']}`,
      };
    });

    const pages = ['1','2','3','4','5','...','9'].map((label, i) => ({ label,
      style:`min-width:32px;height:32px;padding:6px;border:1px solid #E2E4E9;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;font-weight:500;box-sizing:border-box;${i === 0 ? 'background:#F6F8FA;color:#0A0D14;' : 'background:#fff;color:#525866;'}` }));

    const seg = (on) => `height:28px;padding:0 10px;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;${on ? 'background:#fff;color:#4D42E9;box-shadow:0 1px 2px rgba(10,13,20,.08);' : 'background:transparent;color:#525866;'}`;
    const hasRows = !s.fail && rows.length > 0;

    const notFound = !s.fail && !!q && rows.length === 0;
    const clearQ = () => this.setState({ q:'' });

    return {
      tabs, cols, rows, pages,
      hasRows, showEmpty: !hasRows, hasPager: hasRows && !q,
      isFail: s.fail, isNotFound: notFound,
      q: s.q, hasQ: !!s.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      onQKey: (e) => { if(e.key === 'Escape' && s.q){ e.preventDefault(); clearQ(); } },
      clearQ,
      emptyIcon: s.fail ? 'ri-wifi-off-line' : notFound ? 'ri-search-line' : 'ri-notification-off-line',
      emptyText: s.fail ? 'Система недоступна, обратитесь в службу поддержки.'
                        : notFound ? 'По запросу «' + s.q.trim() + '» уведомлений не найдено.'
                        : (s.tab === 'unread' ? 'Все уведомления прочитаны.' : 'Прочитанных уведомлений пока нет.'),
      hasUnread: unreadCount > 0 && !s.fail,
      readAll: () => { this.save(this.data().map(r => r.n)); this.saveEd(s.ed.map(x => ({ ...x, read:true }))); this.toast('Все уведомления отмечены прочитанными'); },
      hasToast: !!s.toast, toast: s.toast,
      demo: [ ['data','Уведомления'], ['fail','Технический сбой'] ].map(([id, label]) => ({ label,
        style: seg(s.fail === (id === 'fail')), onClick: () => this.setState({ fail: id === 'fail' }) })),
    };
  }
}
</script>
</body>
</html>
