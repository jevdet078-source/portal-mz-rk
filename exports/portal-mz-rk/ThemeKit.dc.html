<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<!--
  Панель показа для руководства (только в прототипе): переключает вариант главной, цвет бренда
  (10 палитр HomeData) и заставку при входе. Кнопка — слева внизу, не пересекается с AI-помощником.
  Проп current — id текущего варианта (a … e). Выбор палитры и заставки сохраняется
  (localStorage['mp-theme'], ['mp-splash']) и действует на всех вариантах.
-->
<x-dc>
<helmet>
<style>
  .tk *{ box-sizing:border-box; }
  .tk{ font-family:'Inter',system-ui,sans-serif; }
  .tk-btn{ position:fixed; left:clamp(16px,2vw,32px); bottom:clamp(16px,2vw,32px); z-index:49; height:48px; padding:0 6px; display:flex; align-items:center; gap:10px; border:none; border-radius:999px; background:rgba(10,13,20,.86); color:#fff; font:600 14px/1 'Inter',sans-serif; cursor:pointer; box-shadow:0 14px 30px -12px rgba(10,13,20,.5); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .tk-btn .sw{ width:36px; height:36px; border-radius:50%; background:conic-gradient(from 210deg, var(--b300), var(--b600), var(--b900), var(--bacc), var(--b300)); box-shadow:inset 0 0 0 2px rgba(255,255,255,.3); }
  .tk-btn .tk-t{ max-width:0; overflow:hidden; white-space:nowrap; transition:max-width .25s ease, margin .25s; }
  .tk-btn:hover .tk-t, .tk-btn[aria-expanded="true"] .tk-t{ max-width:220px; margin-right:10px; }
  .tk-btn small{ display:block; font-size:11px; font-weight:500; color:rgba(255,255,255,.6); margin-top:3px; }
  .tk-panel{ position:fixed; left:clamp(16px,2vw,32px); bottom:calc(clamp(16px,2vw,32px) + 60px); z-index:95; width:min(392px, calc(100vw - 32px)); max-height:calc(100vh - 120px); overflow-y:auto; background:#fff; border-radius:22px; box-shadow:0 0 0 1px rgba(10,13,20,.06), 0 36px 72px -24px rgba(10,13,20,.45); padding:18px; animation:tk-in .2s ease; scrollbar-width:thin; }
  @keyframes tk-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .tk-hd{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .tk-hd b{ font-size:16px; font-weight:600; color:var(--n900); }
  .tk-hd span{ display:block; font-size:12.5px; color:var(--n400); margin-top:2px; }
  .tk-x{ width:34px; height:34px; border:none; border-radius:10px; background:var(--n100); color:var(--n500); cursor:pointer; font-size:19px; display:flex; align-items:center; justify-content:center; }
  .tk-cap{ font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--n400); margin:16px 0 8px; }
  .tk-vars{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tk-var{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; text-decoration:none; color:var(--n700); box-shadow:inset 0 0 0 1px var(--n200); font-size:13.5px; font-weight:500; line-height:1.2; }
  .tk-var:hover{ background:var(--n50); }
  .tk-var em{ font-style:normal; width:26px; height:26px; flex:0 0 auto; border-radius:8px; background:var(--n100); color:var(--n600); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; }
  .tk-var[aria-current="page"]{ box-shadow:inset 0 0 0 2px var(--b500); background:var(--b50); color:var(--b800); font-weight:600; }
  .tk-var[aria-current="page"] em{ background:var(--b600); color:#fff; }
  .tk-pals{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .tk-pal{ position:relative; aspect-ratio:1; border:none; border-radius:14px; cursor:pointer; padding:0; box-shadow:inset 0 0 0 1px rgba(10,13,20,.08); transition:transform .15s; }
  .tk-pal:hover{ transform:translateY(-2px); }
  .tk-pal[aria-pressed="true"]{ box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--n900); }
  .tk-pal .dot{ position:absolute; right:6px; bottom:6px; width:10px; height:10px; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.85); }
  .tk-pal .star{ position:absolute; left:5px; top:4px; font-size:13px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.3); }
  .tk-pinfo{ margin-top:10px; padding:12px 14px; border-radius:14px; background:var(--n50); box-shadow:inset 0 0 0 1px var(--n200); }
  .tk-pinfo b{ display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:600; color:var(--n900); }
  .tk-pinfo b em{ font-style:normal; font-size:11px; font-weight:600; color:var(--b800); background:var(--b100); border-radius:999px; padding:3px 8px; }
  .tk-pinfo span{ display:block; font-size:13px; line-height:1.45; color:var(--n500); margin-top:4px; }
  .tk-ramp{ display:flex; height:12px; border-radius:6px; overflow:hidden; margin-top:10px; }
  .tk-ramp i{ flex:1; }
  .tk-fill{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tk-fill button{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:10px; border:none; border-radius:12px; background:#fff; box-shadow:inset 0 0 0 1px var(--n200); font:500 12.5px/1.25 'Inter',sans-serif; color:var(--n700); cursor:pointer; text-align:left; }
  .tk-fill button[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--b500); background:var(--b50); color:var(--b900); font-weight:600; }
  .tk-fill .fs{ width:100%; height:26px; border-radius:8px; }
  .tk-fill .fs.flat{ background:var(--b600); }
  .tk-fill .fs.deep{ background:linear-gradient(135deg, var(--b400), var(--b700) 55%, var(--b950)); }
  .tk-fill .fs.pastel{ background:var(--pg-mesh); box-shadow:inset 0 0 0 1px rgba(10,13,20,.06); }
  .tk-fhint{ margin-top:8px; font-size:12.5px; line-height:1.45; color:var(--n500); }
  .tk-sp{ display:flex; flex-wrap:wrap; gap:6px; }
  .tk-sp button{ height:36px; padding:0 12px; border:none; border-radius:10px; background:var(--n100); color:var(--n600); font:500 13.5px/1 'Inter',sans-serif; cursor:pointer; box-shadow:inset 0 0 0 1px var(--n200); }
  .tk-sp button[aria-pressed="true"]{ background:var(--b50); color:var(--b800); font-weight:600; box-shadow:inset 0 0 0 2px var(--b500); }
  .tk-play{ margin-top:10px; width:100%; height:42px; border:none; border-radius:12px; background:var(--n900); color:#fff; font:600 14px/1 'Inter',sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .tk-play i{ font-size:18px; }
  @media (max-width:640px){ .tk-btn .tk-t{ display:none; } .tk-btn{ padding:0 6px; } }
</style>
</helmet>
<div class="tk">
  <button class="tk-btn" onClick="{{ toggle }}" aria-expanded="{{ openStr }}" title="Варианты главной, цвет бренда и заставка"><span class="sw"></span><span class="tk-t">Варианты дизайна<small>{{ btnSub }}</small></span></button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:94;"></div>
    <div class="tk-panel" role="dialog" aria-label="Варианты дизайна главной">
      <div class="tk-hd"><div><b>Варианты дизайна</b><span>Прототип для обсуждения · выбор сохраняется</span></div><button class="tk-x" onClick="{{ close }}" aria-label="Закрыть"><i class="ri-close-line"></i></button></div>

      <div class="tk-cap">Вариант главной</div>
      <div class="tk-vars">
        <sc-for list="{{ variants }}" as="v" hint-placeholder-count="6">
          <a class="tk-var" href="{{ v.file }}" aria-current="{{ v.cur }}"><em>{{ v.key }}</em>{{ v.label }}</a>
        </sc-for>
      </div>

      <div class="tk-cap">Оформление</div>
      <div class="tk-fill" role="group" aria-label="Оформление">
        <sc-for list="{{ fills }}" as="f" hint-placeholder-count="3">
          <button aria-pressed="{{ f.on }}" onClick="{{ f.onClick }}" title="{{ f.hint }}"><span class="{{ f.swCls }}"></span>{{ f.short }}</button>
        </sc-for>
      </div>
      <div class="tk-fhint">{{ fillHint }}</div>

      <sc-if value="{{ isPastel }}" hint-placeholder-val="{{ false }}">
        <div class="tk-cap">Пастельный градиент · {{ pastelCount }}</div>
        <div class="tk-pals">
          <sc-for list="{{ pastels }}" as="p" hint-placeholder-count="10">
            <button class="tk-pal" style="{{ p.style }}" aria-pressed="{{ p.on }}" onClick="{{ p.onClick }}" title="{{ p.name }}" aria-label="{{ p.name }}">
              <sc-if value="{{ p.star }}" hint-placeholder-val="{{ false }}"><i class="ri-star-fill star" style="color:#8A5A0B;text-shadow:none;"></i></sc-if>
              <sc-if value="{{ p.brand }}" hint-placeholder-val="{{ false }}"><i class="ri-palette-line star" style="color:var(--n700);text-shadow:none;"></i></sc-if>
            </button>
          </sc-for>
        </div>
        <div class="tk-pinfo"><b>{{ psName }}</b><span>{{ psHint }}</span></div>
      </sc-if>

      <div class="tk-cap">Цвет бренда · 10 палитр</div>
      <div class="tk-pals">
        <sc-for list="{{ pals }}" as="p" hint-placeholder-count="10">
          <button class="tk-pal" style="{{ p.style }}" aria-pressed="{{ p.on }}" onClick="{{ p.onClick }}" title="{{ p.name }}" aria-label="{{ p.name }}">
            <sc-if value="{{ p.star }}" hint-placeholder-val="{{ false }}"><i class="ri-star-fill star"></i></sc-if>
            <span class="dot" style="{{ p.dot }}"></span>
          </button>
        </sc-for>
      </div>
      <div class="tk-pinfo">
        <b>{{ pName }}<sc-if value="{{ pStar }}" hint-placeholder-val="{{ false }}"><em>Рекомендуем</em></sc-if></b>
        <span>{{ pHint }}</span>
        <div class="tk-ramp"><sc-for list="{{ ramp }}" as="r" hint-placeholder-count="10"><i style="{{ r }}"></i></sc-for></div>
      </div>

      <div class="tk-cap">Заставка при входе</div>
      <div class="tk-sp">
        <sc-for list="{{ splashes }}" as="x" hint-placeholder-count="5">
          <button aria-pressed="{{ x.on }}" onClick="{{ x.onClick }}">{{ x.label }}</button>
        </sc-for>
      </div>
      <button class="tk-play" onClick="{{ play }}"><i class="ri-play-circle-line"></i>Показать заставку</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:760}}">
const SPLASH = [ { id:'emblem', label:'Герб' }, { id:'ornament', label:'Орнамент' }, { id:'pulse', label:'Пульс' }, { id:'curtain', label:'Шторка' }, { id:'off', label:'Без заставки' } ];
class Component extends DCLogic {
  constructor(props){
    super(props);
    let sp = 'emblem', open = false;
    try { sp = localStorage.getItem('mp-splash') || 'emblem'; } catch(e){}
    try { open = sessionStorage.getItem('mp-tk-open') === '1'; } catch(e){}
    this.state = { open, sp, theme:null, ready: !!window.mpHome };
  }
  componentDidMount(){
    this._ready = () => this.setState({ ready:true });
    window.addEventListener('mp-home-ready', this._ready);
    this._theme = (e) => this.setState({ theme: e && e.detail });
    window.addEventListener('mp-theme-change', this._theme);
    this._fill = () => this.setState({ fillTick: Date.now() });
    window.addEventListener('mp-fill-change', this._fill);
  }
  componentWillUnmount(){ window.removeEventListener('mp-home-ready', this._ready); window.removeEventListener('mp-theme-change', this._theme); window.removeEventListener('mp-fill-change', this._fill); }
  setOpen(v){ this.setState({ open:v }); try { sessionStorage.setItem('mp-tk-open', v ? '1' : '0'); } catch(e){} }
  renderVals(){
    const H = window.mpHome, s = this.state;
    if(!H) return { fills:[], fillHint:'', isPastel:false, pastels:[], pastelCount:'', psName:'', psHint:'', open:false, openStr:'false', toggle:()=>{}, close:()=>{}, btnSub:'', variants:[], pals:[], ramp:[], splashes:[], pName:'', pHint:'', pStar:false, play:()=>{} };
    const tid = s.theme || H.themeId();
    const cur = H.palette(tid);
    const keys = ['b50','b100','b200','b300','b400','b500','b600','b700','b800','b900'];
    const fill = H.fillId(), pid = H.pastelId();
    const SHORT = { flat:'Без градиентов', deep:'Глубокие', pastel:'Пастель' };
    const mesh = (st) => `background:radial-gradient(70% 90% at 0% 0%, ${st[0]}, transparent 70%), radial-gradient(70% 90% at 100% 0%, ${st[1]}, transparent 70%), radial-gradient(80% 80% at 60% 100%, ${st[2]}, transparent 72%), ${st[3]};`;
    const ps = H.PASTELS.find(x => x.id === pid);
    return {
      fills: H.FILLS.map(f => ({ ...f, short:SHORT[f.id], swCls:'fs ' + f.id, on: f.id === fill ? 'true' : 'false', onClick:() => { H.setFill(f.id); this.setState({ fillTick:Date.now() }); } })),
      fillHint: H.FILLS.find(f => f.id === fill).hint,
      isPastel: fill === 'pastel', pastelCount: H.PASTELS.length + ' вариантов',
      pastels: H.PASTELS.map(p => ({ name:p.name, star:!!p.star, brand:!p.p, on: p.id === pid ? 'true' : 'false', style: mesh(H.pastelStops(p.id)) + 'box-shadow:inset 0 0 0 1px rgba(10,13,20,.08);',
        onClick:() => { H.setPastel(p.id); this.setState({ fillTick:Date.now() }); } })),
      psName: ps.name, psHint: ps.hint,
      open: s.open, openStr: s.open ? 'true' : 'false',
      toggle: () => this.setOpen(!s.open), close: () => this.setOpen(false),
      btnSub: cur.name + ' · ' + SHORT[fill].toLowerCase(),
      variants: H.VARIANTS.map(v => ({ ...v, key: v.key || '—', cur: v.id === this.props.current ? 'page' : 'false' })),
      pals: H.PALETTES.map(p => ({ name:p.name, star:!!p.star, on: p.id === tid ? 'true' : 'false',
        style: fill === 'deep' ? `background:linear-gradient(145deg, ${p.c.b400} 0%, ${p.c.b600} 48%, ${p.c.b900} 100%);` : `background:${p.c.b600};`,
        dot: `background:${p.c.bacc};`,
        onClick: () => { H.setTheme(p.id); this.setState({ theme:p.id }); } })),
      pName: cur.name, pHint: cur.hint, pStar: !!cur.star,
      ramp: keys.map(k => `background:${cur.c[k]};`),
      splashes: SPLASH.map(x => ({ ...x, on: s.sp === x.id ? 'true' : 'false', onClick: () => { this.setState({ sp:x.id }); try { localStorage.setItem('mp-splash', x.id); } catch(e){} } })),
      play: () => { const st = s.sp === 'off' ? 'emblem' : s.sp; this.setOpen(false); try { window.dispatchEvent(new CustomEvent('mp-splash-replay', { detail:st })); } catch(e){} },
    };
  }
}
</script>
</body>
</html>
