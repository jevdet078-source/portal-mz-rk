<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="runtime/inter.css">
<link rel="stylesheet" href="runtime/remixicon.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/files.js"></script>
<script src="runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--primary:#4D42E9;--primary-darker:#312D86;--primary-lighter:#EEF2FF;--n0:#fff;--n100:#F6F8FA;--n400:#868C98;--n500:#525866;--n600:#31353F;--n700:#20232D;--n900:#0A0D14;--green:#38C793;--green-l:#EFFAF6;--purple:#6E3FF3;--purple-l:#EEEBFF;--stroke:#E2E4E9;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:#F6F8FA;-webkit-font-smoothing:antialiased;}
  @keyframes mp-pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" hint-size="100%,70px"></dc-import></div>
  <main style="flex:1;">
    <div style="max-width:1440px;margin:0 auto;padding:24px 40px 80px;">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--n400);margin-bottom:24px;">
        <a href="Портал Минздрава - Главная.dc.html" style="color:var(--n400);text-decoration:none;">Главная</a>
        <i class="ri-arrow-right-s-line"></i><span style="color:var(--n700);font-weight:500;">Медицинские организации</span>
      </div>

      <div style="display:flex;align-items:center;gap:14px;margin-bottom:8px;">
        <div style="width:48px;height:48px;border-radius:13px;background:var(--purple-l);display:flex;align-items:center;justify-content:center;"><i class="ri-hospital-line" style="font-size:26px;color:var(--purple);"></i></div>
        <h1 style="font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0;">Медицинские организации</h1>
      </div>
      <p style="font-size:15px;color:var(--n500);margin:0 0 24px;">Поиск медицинских организаций Республики Казахстан по типу и региону.</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
        <div style="flex:1;min-width:280px;position:relative;">
          <i class="ri-search-line" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--n400);font-size:18px;"></i>
          <input placeholder="Название организации" style="width:100%;height:48px;border:1px solid var(--stroke);border-radius:12px;padding:0 14px 0 44px;font-size:14px;font-family:inherit;background:var(--n0);outline:none;" />
        </div>
        <button style="height:48px;padding:0 16px;border:1px solid var(--stroke);border-radius:12px;background:var(--n0);color:var(--n600);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;">Тип организации<i class="ri-arrow-down-s-line" style="font-size:18px;color:var(--n400);"></i></button>
        <button style="height:48px;padding:0 16px;border:1px solid var(--stroke);border-radius:12px;background:var(--n0);color:var(--n600);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;">Регион<i class="ri-arrow-down-s-line" style="font-size:18px;color:var(--n400);"></i></button>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="7">
          <button onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</button>
        </sc-for>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
        <!-- LIST -->
        <div style="display:flex;flex-direction:column;gap:14px;">
          <sc-for list="{{ orgs }}" as="o" hint-placeholder-count="4">
            <div onClick="{{ o.onClick }}" style="{{ o.cardStyle }}">
              <div style="display:flex;align-items:flex-start;gap:14px;">
                <div style="width:44px;height:44px;border-radius:11px;background:var(--purple-l);display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><i class="{{ o.icon }}" style="color:var(--purple);font-size:22px;"></i></div>
                <div style="flex:1;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="font-size:16px;font-weight:600;">{{ o.name }}</span></div>
                  <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--n400);background:var(--n100);padding:3px 9px;border-radius:999px;">{{ o.type }}</span>
                  <div style="display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:13px;color:var(--n500);">
                    <span><i class="ri-map-pin-line" style="margin-right:6px;color:var(--n400);"></i>{{ o.address }}</span>
                    <span><i class="ri-phone-line" style="margin-right:6px;color:var(--n400);"></i>{{ o.phone }} · {{ o.hours }}</span>
                  </div>
                </div>
              </div>
              <button style="margin-top:14px;width:100%;height:40px;border:1px solid var(--stroke);border-radius:10px;background:var(--n0);color:var(--primary);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">Подробнее</button>
            </div>
          </sc-for>
        </div>

        <!-- MAP -->
        <div style="position:sticky;top:90px;border:1px solid var(--stroke);border-radius:18px;overflow:hidden;height:620px;background:linear-gradient(135deg,#EEF2FF,#EBFAFF);">
          <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(77,66,233,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(77,66,233,.06) 1px,transparent 1px);background-size:40px 40px;"></div>
          <div style="position:absolute;top:14px;left:14px;background:#fff;border:1px solid var(--stroke);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;color:var(--n600);box-shadow:0 2px 4px rgba(10,13,20,.06);display:flex;align-items:center;gap:8px;"><i class="ri-road-map-line" style="color:var(--primary);"></i>Астана · карта организаций</div>
          <sc-for list="{{ pins }}" as="p" hint-placeholder-count="4">
            <button onClick="{{ p.onClick }}" style="{{ p.style }}"><i class="ri-map-pin-2-fill" style="font-size:32px;filter:drop-shadow(0 3px 4px rgba(10,13,20,.25));"></i></button>
          </sc-for>
          <sc-if value="{{ hasSelected }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:88%;background:#fff;border:1px solid var(--stroke);border-radius:14px;padding:16px;box-shadow:0 12px 24px -8px rgba(10,13,20,.2);animation:mp-pop .2s ease;">
              <div style="font-size:15px;font-weight:600;margin-bottom:4px;">{{ selectedName }}</div>
              <div style="font-size:13px;color:var(--n500);margin-bottom:12px;"><i class="ri-map-pin-line" style="margin-right:5px;"></i>{{ selectedAddress }}</div>
              <button style="width:100%;height:40px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;">Перейти к карточке</button>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </main>
  <div style="margin-top:32px;"><dc-import name="Footer" hint-size="100%,360px"></dc-import></div>
  <dc-import name="Assistant" hint-size="1px,1px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab:'all', selected:0 };
  renderVals(){
    const s = this.state;
    const tabs = [
      { id:'all', label:'Поиск организаций' },
      { id:'clinic', label:'Поликлиники' },
      { id:'hospital', label:'Стационары' },
      { id:'lab', label:'Лаборатории' },
      { id:'pharm', label:'Аптеки' },
      { id:'blood', label:'Центры крови' },
      { id:'rehab', label:'Реабилитационные центры' },
    ].map(t => ({ ...t, onClick:()=>this.setState({tab:t.id}),
      style:`padding:9px 16px;border:1px solid ${s.tab===t.id?'#4D42E9':'#E2E4E9'};border-radius:999px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;${s.tab===t.id?'background:#EEF2FF;color:#4D42E9;':'background:#fff;color:#525866;'}` }));

    const orgList = [
      { name:'Городская поликлиника №5', type:'Поликлиника', icon:'ri-hospital-line', address:'г. Астана, ул. Сарыарка, 15', phone:'+7 (7172) 70-11-22', hours:'08:00–20:00', x:32, y:38 },
      { name:'Многопрофильная больница №2', type:'Стационар', icon:'ri-government-line', address:'г. Астана, пр. Туран, 34/1', phone:'+7 (7172) 51-20-30', hours:'круглосуточно', x:64, y:28 },
      { name:'Лаборатория «Invivo»', type:'Лаборатория', icon:'ri-flask-line', address:'г. Астана, ул. Кенесары, 40', phone:'+7 (7172) 33-22-11', hours:'07:30–18:00', x:48, y:60 },
      { name:'Реабилитационный центр «Сұңқар»', type:'Реабилитация', icon:'ri-walk-line', address:'г. Астана, ул. Кабанбай батыра, 58', phone:'+7 (7172) 64-88-90', hours:'09:00–19:00', x:74, y:66 },
    ];
    const orgs = orgList.map((o,i) => ({ ...o,
      onClick:()=>this.setState({selected:i}),
      cardStyle:`background:#fff;border:1px solid ${s.selected===i?'#C6D0FF':'#E2E4E9'};border-radius:16px;padding:20px;cursor:pointer;transition:.15s;box-shadow:${s.selected===i?'0 8px 16px rgba(10,13,20,.06)':'0 1px 2px rgba(10,13,20,.03)'};` }));

    const pins = orgList.map((o,i) => ({
      onClick:()=>this.setState({selected:i}),
      style:`position:absolute;left:${o.x}%;top:${o.y}%;transform:translate(-50%,-100%);background:none;border:none;cursor:pointer;padding:0;color:${s.selected===i?'#DF1C41':'#4D42E9'};transition:.15s;z-index:${s.selected===i?5:2};`,
    }));

    const sel = orgList[s.selected];
    return {
      tabs, orgs, pins,
      hasSelected:true, selectedName:sel.name, selectedAddress:sel.address,
    };
  }
}
</script>
<template id="__bundler_thumbnail" data-bg-color="#4D42E9"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#4D42E9"/><g transform="translate(480 280)"><rect width="240" height="240" rx="48" fill="#fff"/><path d="M50 120 h28 l18 -44 24 88 18 -44 h32" fill="none" stroke="#4D42E9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g></svg></template>
</body>
</html>
