<!--
  Кабинет бизнеса → Услуги → «Фармацевтика» | «Лицензирование и аккредитация».
  Замечания аналитика 29–30.10.2026:
    • подраздел выбирается в меню (BusinessNav: «Услуги» раскрываются на два подраздела),
      справа — только услуги выбранного подраздела; «Все услуги» и блок категорий на странице не выводим;
    • заголовок страницы — название подраздела с числом услуг;
    • «Фармацевтика» (2 услуги) — без поиска; «Лицензирование и аккредитация» (10) — поиск по наименованию,
      совпадения подсвечены, пусто — «Услуги не найдены» и «Сбросить поиск»;
    • композитная услуга «Единого окна» открывает окно «Выберите вид услуги» (компонент ServiceKinds:
      segmented control ЛС / МИ и виды услуги), «Далее» → паспорт услуги, из паспорта — заявка;
    • внешние услуги (eGov.kz, «Е-лицензирование») — адрес сайта и ↗, новая вкладка.
  Раскладка — по ширине области контента (container queries), а не окна: меню бывает 272 или 80 px.
    ноутбук — перечень в один столбец; мониторы 24–27″ (перечень шире 1100 px) — в два столбца и крупнее,
    чтобы по краям не оставалось пустоты; узко — «куда ведёт» под наименованием.

  Адрес: Услуги.dc.html?cat=<pharma|lic>&q=<запрос> (q — только у «Лицензирования»); без cat — «Фармацевтика».
  Подраздел меняется без перезагрузки: событие window 'mp-biz-svc-cat' из меню, «Назад» браузера — popstate.
  Входящие ссылки ?svc=<safety|reg|price|knf|alo|ed>&type=<ls|mi> (старые ссылки портала):
    price / alo / ed — сразу паспорт услуги, knf — заявление КНФ (паспорта КНФ пока нет),
    safety / reg — окно выбора с отмеченным видом.
-->

<helmet>
<style>
  :root{--primary:#4D42E9;--primary-dark:#362DA6;--primary-darker:#312D86;--primary-light:#C6D0FF;--primary-lighter:#EEF2FF;--n0:#fff;--n50:#FBFCFD;--n100:#F6F8FA;--n200:#E2E4E9;--n300:#CDD0D5;--n400:#868C98;--n500:#525866;--n600:#31353F;--n700:#20232D;--n900:#0A0D14;--stroke:#E2E4E9;--sh-xs:0 1px 2px rgba(10,13,20,.03);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--n900);background:var(--n50);-webkit-font-smoothing:antialiased;}
  @keyframes mp-slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes us-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .us-main{flex:1;min-width:0;padding:8px 32px 64px;}
  .us-top{display:flex;align-items:center;gap:10px;padding:16px 0 20px;}
  .us-h1{margin:0;font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.015em;}
  .us-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 8px;border-radius:999px;background:var(--n100);color:var(--n500);font-size:12px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .us-sec{min-width:0;background:#fff;border:1px solid var(--stroke);border-radius:16px;box-shadow:var(--sh-xs);container-type:inline-size;container-name:list;animation:mp-slidein .2s ease;}

  /* поиск — «прилипает» под шапку портала */
  .us-head{position:sticky;top:73px;z-index:5;padding:16px 16px 8px;background:#fff;border-radius:16px 16px 0 0;transition:box-shadow .15s,border-radius .15s;}
  .us-head[data-stuck="true"]{border-radius:0;box-shadow:0 1px 0 var(--stroke),0 8px 16px -12px rgba(10,13,20,.14);}
  .us-search{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 14px;border:1px solid var(--stroke);border-radius:12px;background:#fff;transition:border-color .12s,box-shadow .12s;}
  .us-search:hover{border-color:var(--n300);}
  .us-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-lighter);}
  .us-search input{flex:1;min-width:0;height:100%;border:none;outline:none;background:none;font-family:inherit;font-size:14px;color:var(--n900);}
  .us-search input::placeholder{color:var(--n400);}
  .us-search input::-webkit-search-cancel-button{display:none;}
  .us-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;margin-right:6px;border:1px solid var(--stroke);border-radius:6px;background:var(--n50);color:var(--n400);font-size:12px;font-weight:600;flex:0 0 auto;}
  .us-search:focus-within .us-kbd{display:none;}
  .us-list{padding:8px 12px 12px;animation:us-in .16s ease;}
  .us-ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px 12px;}

  /* карточка услуги: № · наименование · куда ведёт — своя обводка цвета рамки блока */
  .us-row{width:100%;height:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:start;column-gap:12px;padding:14px 16px 14px 12px;border:1px solid var(--stroke);border-radius:12px;background:#fff;font-family:inherit;text-align:left;text-decoration:none;color:var(--n900);cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;}
  .us-row:hover{background:var(--n100);border-color:var(--n300);box-shadow:var(--sh-xs);}
  .us-num{font-size:13px;line-height:20px;font-weight:500;color:var(--n400);font-variant-numeric:tabular-nums;text-align:right;}
  .us-name{font-size:14px;line-height:20px;font-weight:500;overflow-wrap:anywhere;hyphens:auto;transition:color .12s;}
  .us-row:hover .us-name{color:var(--primary-darker);}
  .us-side{display:inline-flex;align-items:center;gap:4px;height:20px;white-space:nowrap;}
  .us-site{color:var(--n400);font-size:13px;line-height:20px;font-weight:500;transition:color .12s;}
  .us-site i{font-size:16px;line-height:20px;transition:transform .12s;}
  .us-row:hover .us-site{color:var(--primary);}
  .us-row:hover .us-site i{transform:translate(1px,-1px);}
  /* композитная услуга — открывает окно выбора вида */
  .us-go{width:28px;height:28px;margin-top:-4px;border-radius:999px;background:var(--primary-lighter);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s,transform .12s;}
  .us-go i{font-size:18px;}
  .us-row:hover .us-go{background:var(--primary);color:#fff;transform:translateX(2px);}

  .us-btn{transition:background .12s,color .12s;}
  .us-btn:hover{background:var(--n100) !important;color:var(--n600) !important;}
  .us-link{transition:background .12s,border-color .12s;}
  .us-link:hover{background:var(--primary-lighter) !important;border-color:var(--primary-light) !important;}
  .us-row:focus-visible,.us-btn:focus-visible,.us-link:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary-light);}
  .us-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* широкий перечень (мониторы 24–27″): два столбца, крупнее строки */
  @container list (min-width:1100px){
    .us-ul{grid-template-columns:repeat(2,minmax(0,1fr));}
    .us-name{font-size:15px;line-height:22px;}
    .us-num{line-height:22px;}
    .us-side{height:22px;}
    .us-head{padding:20px 20px 8px;}
    .us-list{padding:8px 16px 16px;}
  }
  /* узкий перечень — «куда ведёт» под наименованием */
  @container list (max-width:560px){
    .us-row{grid-template-columns:22px minmax(0,1fr);row-gap:6px;padding:12px 12px 12px 10px;column-gap:10px;}
    .us-side{grid-column:2;justify-self:start;}
    .us-go{margin-top:0;}
    .us-list{padding:6px 6px 10px;}
  }
  @media (min-width:1600px){ .us-h1{font-size:20px;line-height:28px;} }
  @media (max-width:1023px){ .us-main{padding:8px 24px 64px;} }
  @media (hover:none){ .us-kbd{display:none;} }
  @media (prefers-reduced-motion:reduce){ .us-list,.us-sec{animation:none;} }
</style>
</helmet>

<div style="min-height:100vh;background:var(--n50);">
  <div style="position:sticky;top:0;z-index:40;"><dc-import name="Header" variant="account" layout="app" org="ТОО «Астана Групп»" bin="БИН 180540024521" hint-size="100%,73px"></dc-import></div>

  <div style="display:flex;align-items:flex-start;">
    <div style="position:sticky;top:73px;height:calc(100vh - 73px);flex:0 0 auto;z-index:30;">

    <main class="us-main">
      <!-- заголовок — выбранный в меню подраздел -->

      <section class="us-sec" aria-label="{{ title }}">

        <sc-if value="{{ hasSearch }}" hint-placeholder-val="{{ false }}">

          <div class="us-head" ref="{{ headRef }}">
            <label class="us-search">
              <i class="ri-search-line" style="font-size:20px;color:var(--n400);flex:0 0 auto;"></i>
              <input ref="{{ inputRef }}" type="search" value="{{ q }}" onChange="{{ onQ }}" onKeyDown="{{ onInputKey }}" placeholder="Поиск по наименованию услуги" aria-label="{{ searchAria }}" aria-describedby="us-live" autoComplete="off" spellCheck="false" enterKeyHint="search">
              <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const EGOV = 'https://egov.kz/ru/services/presale/';
const ELICENSE = 'https://elicense.kz/';
const HDR = 73;

// Наименования и ссылки — как в «Государственных услугах» для бизнеса (постановка «Анализ ГУ МЗ»).
// search — показывать ли поиск (замечание 30.10.2026: только у «Лицензирования и аккредитации»)
const CATS = [
  { id:'pharma', label:'Фармацевтика', search:false, items:[
    ['Композитная государственная услуга по регистрации лекарственных средств и медицинских изделий с подачей пакета документов по принципу «Единого окна»', 'portal'],
    ['Информация о предоставленных лекарственных средствах, спецпродуктах, изделиях медицинского назначения', 'P709'],
  ] },
  { id:'lic', label:'Лицензирование и аккредитация', search:true, items:[
    ['Выдача сертификата специалиста для допуска к клинической практике', ELICENSE],
    ['Аккредитация организации по оценке знаний в области здравоохранения', 'approval_documents_pass153-5_mz'],
    ['Аккредитация субъектов здравоохранения, осуществляющих независимую экспертизу', 'accreditation_passEL4-R22_mz'],
    ['Выдача сертификата менеджера в области здравоохранения', 'approval_documents_pass163_mz'],
    ['Аккредитация медицинских организаций (стандарты аккредитации)', 'approval_documents_477pass_mz'],
    ['Выдача лицензии на дезинфекцию, дезинсекцию, дератизацию в здравоохранении', 'licensing_pass603012_mz'],
    ['Выдача лицензии на ввоз/вывоз органов, тканей, крови человека (не члены ЕАЭС)', 'licensing_2F151_mzsr_6'],
    ['Выдача лицензии на оборот наркотических средств в здравоохранении', 'licensing_2F490pass_mz'],
    ['Выдача лицензии на фармацевтическую деятельность', 'licensing_489pass_mz'],
    ['Выдача лицензии на медицинскую деятельность', 'med_accreditatio_2F487pass_mz'],
  ] },
].map(c => ({ ...c, items: c.items.map(([name, ref]) => {
  if(ref === 'portal') return { name, portal: true, norm: norm(name) };
  const ext = /^https?:/.test(ref);
  return { name, href: ext ? ref : EGOV + ref, site: ext ? 'Е‑лицензирование' : 'eGov.kz', norm: norm(name) };
}) }));
const catOf = (id) => CATS.find(c => c.id === id) || CATS[0];
// старые ссылки портала на виды композитной услуги: паспорт там, где он есть
const SVC_HREF = { price:(t) => 'Паспорт регистрации цены.dc.html#' + t, alo:(t) => 'Паспорт услуги АЛО.dc.html?cat=' + t, ed:(t) => 'Паспорт услуги ЕД.dc.html?cat=' + t, knf:() => 'Заявление КНФ.dc.html' };

function norm(s){ return String(s).toLowerCase().replace(/ё/g, 'е'); }
function tokensOf(q){ return norm(q).trim().split(/\s+/).filter(Boolean); }
function matchAll(it, tokens){ return tokens.every(tk => it.norm.includes(tk)); }
// наименование частями с подсветкой всех вхождений слов запроса
function highlight(name, tokens){
  if(!tokens.length) return [{ t:name, style:'' }];
  const low = norm(name), mark = new Array(name.length).fill(false);
  tokens.forEach(tk => { let i = low.indexOf(tk); while(i !== -1){ for(let k = i; k < i + tk.length; k++) mark[k] = true; i = low.indexOf(tk, i + tk.length); } });
  const parts = []; let cur = '', on = mark[0];
  for(let i = 0; i < name.length; i++){
    if(mark[i] !== on){ parts.push({ t:cur, on }); cur = ''; on = mark[i]; }
    cur += name[i];
  }
  parts.push({ t:cur, on });
  return parts.filter(p => p.t).map(p => ({ t:p.t, style: p.on ? 'background:#EEF2FF;color:#312D86;border-radius:3px;box-shadow:0 0 0 1px #EEF2FF;' : '' }));
}
function plural(n){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return 'услуга';
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'услуги';
  return 'услуг';
}
const readUrl = () => { try { const p = new URLSearchParams(location.search); return { cat: catOf(p.get('cat')).id, q: p.get('q') || '' }; } catch(e){ return { cat:'pharma', q:'' }; } };

class Component extends DCLogic {
  headRef = React.createRef();
  sentinelRef = React.createRef();
  inputRef = React.createRef();
  listRef = React.createRef();

  constructor(props){
    super(props);
    let pre = null;
    try {
      const p = new URLSearchParams(location.search);
      const svc = p.get('svc'), type = p.get('type') === 'mi' ? 'mi' : 'ls';
      if(svc && SVC_HREF[svc] && !(svc === 'knf' && type === 'mi')) location.replace(SVC_HREF[svc](type));
      else if(svc === 'safety' || svc === 'reg') pre = { seg:type, kind:svc };
    } catch(e){}
    this._pre = pre;
    const u = readUrl();
    this.state = { cat:u.cat, q: catOf(u.cat).search ? u.q : '' };
  }

  componentDidMount(){
    // подраздел из меню — без перезагрузки; «Назад» / «Вперёд» браузера
    this._onCat = (e) => { const id = catOf(e && e.detail).id; if(id !== this.state.cat){ this.setState({ cat:id, q:'' }); window.scrollTo({ top:0 }); } };
    window.addEventListener('mp-biz-svc-cat', this._onCat);
    this._onPop = () => { const u = readUrl(); this.setState({ cat:u.cat, q: catOf(u.cat).search ? u.q : '' }); };
    window.addEventListener('popstate', this._onPop);
    // «/» — к поиску, если он есть, фокус не в поле ввода и окно закрыто
    this._onKey = (e) => {
      if(e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || !catOf(this.state.cat).search || document.body.hasAttribute('data-mp-modal')) return;
      const t = e.target, tag = t && t.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      e.preventDefault(); this.focusSearch(true);
    };
    window.addEventListener('keydown', this._onKey);
    // тень у «прилипшего» поиска (атрибут напрямую — без перерисовки на каждый кадр)
    this._onScroll = () => {
      const head = this.headRef.current, sent = this.sentinelRef.current;
      if(!head || !sent) return;
      const stuck = sent.getBoundingClientRect().top < HDR - 1 ? 'true' : 'false';
      if(head.getAttribute('data-stuck') !== stuck) head.setAttribute('data-stuck', stuck);
    };
    window.addEventListener('scroll', this._onScroll, { passive:true });
    this._onScroll();
    // ?svc=safety|reg — окно с отмеченным видом (компонент окна грузится асинхронно)
    if(this._pre){
      const pre = this._pre; this._pre = null; let n = 0;
      const tryOpen = () => {
        if(document.querySelector('.skd-dlg')) return;
        window.dispatchEvent(new CustomEvent('mp-svc-kinds-open', { detail: pre }));
        if(++n < 20) this._tp = setTimeout(tryOpen, 150);
      };
      this._tp = setTimeout(tryOpen, 300);
    }
    this.syncUrl();
  }
  componentWillUnmount(){
    window.removeEventListener('mp-biz-svc-cat', this._onCat);
    window.removeEventListener('popstate', this._onPop);
    window.removeEventListener('keydown', this._onKey);
    window.removeEventListener('scroll', this._onScroll);
    clearTimeout(this._tp);
  }
  componentDidUpdate(){ this.syncUrl(); this._onScroll(); }

  // подраздел и запрос — в адресе (replaceState: история не засоряется на каждую букву)
  syncUrl(){
    const key = this.state.cat + ':' + this.state.q.trim();
    if(key === this._urlKey) return;
    this._urlKey = key;
    try {
      const p = new URLSearchParams();
      p.set('cat', this.state.cat);
      if(this.state.q.trim()) p.set('q', this.state.q.trim());
      history.replaceState(history.state, '', location.pathname + '?' + p.toString());
    } catch(e){}
  }
  focusSearch(select){
    const i = this.inputRef.current; if(!i) return;
    const r = i.getBoundingClientRect();
    i.focus({ preventScroll: r.top > HDR && r.bottom < window.innerHeight });
    if(select && i.value) i.select();
  }
  rows(){ const l = this.listRef.current; return l ? [...l.querySelectorAll('.us-row')] : []; }
  openDlg(e){
    const opener = (e && e.currentTarget && e.currentTarget.focus ? e.currentTarget : null) || document.activeElement;
    window.dispatchEvent(new CustomEvent('mp-svc-kinds-open', { detail:{ opener } }));
  }
  // из поиска ↓ — к первой услуге; Esc очищает запрос
  onInputKey(e){
    if(e.key === 'Escape' && this.state.q){ e.preventDefault(); this.setState({ q:'' }); return; }
    if(e.key === 'ArrowDown'){ const r = this.rows(); if(r.length){ e.preventDefault(); r[0].focus(); } }
  }
  // по перечню — стрелками; ↑ с первой строки возвращает в поиск
  onListKey(e){
    if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const r = this.rows(), i = r.indexOf(document.activeElement);
    if(i === -1) return;
    e.preventDefault();
    if(e.key === 'ArrowDown' && i < r.length - 1) r[i + 1].focus();
    else if(e.key === 'ArrowUp'){ if(i > 0) r[i - 1].focus(); else if(this.inputRef.current) this.inputRef.current.focus(); }
  }

  renderVals(){
    const s = this.state;
    const cur = catOf(s.cat);
    const tokens = cur.search ? tokensOf(s.q) : [];
    const searching = tokens.length > 0;
    const found = searching ? cur.items.filter(it => matchAll(it, tokens)) : cur.items;
    const items = found.map((it, i) => {
      const parts = highlight(it.name, tokens);
      if(it.portal) return { num:i + 1, parts, isPortal:true, isExt:false, href:'', site:'', onOpen: (e) => this.openDlg(e), aria: it.name + '. Выбор вида услуги' };
      return { num:i + 1, parts, isPortal:false, isExt:true, href:it.href, site:it.site, onOpen:null,
        hint:'Откроется на ' + it.site + ' в новой вкладке', aria: it.name + ' — откроется на ' + it.site + ' в новой вкладке' };
    });
    const n = found.length;

    return {
      headRef:this.headRef, sentinelRef:this.sentinelRef, inputRef:this.inputRef, listRef:this.listRef,
      title: cur.label, count: n,
      countLabel: searching ? `Найдено: ${n} ${plural(n)}` : `${n} ${plural(n)}`,
      hasSearch: cur.search,
      searchAria: `Поиск по наименованию услуги в подразделе «${cur.label}»`,
      q: s.q, hasQ: !!s.q, showKbd: !s.q,
      onQ: (e) => this.setState({ q:e.target.value }),
      onInputKey: (e) => this.onInputKey(e),
      onListKey: (e) => this.onListKey(e),
      clearQ: () => { this.setState({ q:'' }); this.focusSearch(false); },
      items, hasItems: n > 0,
      empty: searching && n === 0,
      liveText: searching ? (n ? `Найдено: ${n} ${plural(n)}` : 'Услуги не найдены') : '',
    };
  }
}
</script>
</body>
</html>
